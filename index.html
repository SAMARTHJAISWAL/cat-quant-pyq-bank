<style>
/* Layout: a sticky filter rail over one reading column of question cards, grouped topic-wise; graph-paper tint marks the exam-notebook world. */
:root {
  --bg: #f6f7f8;
  --paper: #ffffff;
  --ink: #17212b;
  --muted: #5d6874;
  --line: #dde2e7;
  --grid: rgba(23, 92, 120, 0.06);
  --accent: #175c78;
  --accent-soft: #e3eff4;
  --easy: #1f7a4a; --easy-bg: #e3f3ea;
  --med: #8a5a00; --med-bg: #fbf0d9;
  --hard: #b0302c; --hard-bg: #fbe5e3;
  --answer-bg: #eef6f0;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --paper: #1a2128; --ink: #e6ebef; --muted: #9aa6b1; --line: #2c3640;
    --grid: rgba(120, 190, 220, 0.05); --accent: #7cc3dd; --accent-soft: #1d3440;
    --easy: #6fcf97; --easy-bg: #17321f; --med: #e9b85c; --med-bg: #362a12; --hard: #f08a84; --hard-bg: #3a1c1b;
    --answer-bg: #172a20; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --paper: #1a2128; --ink: #e6ebef; --muted: #9aa6b1; --line: #2c3640;
  --grid: rgba(120, 190, 220, 0.05); --accent: #7cc3dd; --accent-soft: #1d3440;
  --easy: #6fcf97; --easy-bg: #17321f; --med: #e9b85c; --med-bg: #362a12; --hard: #f08a84; --hard-bg: #3a1c1b;
  --answer-bg: #172a20; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 920px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 28px 20px; display: grid; gap: 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.filters .wrap { padding-block: 10px; display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { font: 500 13px var(--font-ui); border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.chip:focus-visible, select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type="search"] { font: 14px var(--font-ui); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; min-width: 0; }
input[type="search"] { flex: 1 1 180px; }
.lbl { font-size: 12px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }

main .wrap { padding-block: 20px 60px; display: grid; gap: 28px; }
.group { display: grid; gap: 12px; }
.group h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; text-wrap: balance; }
.group h2 .area { font: 500 12px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.group h2 .n { font: 400 13px var(--font-ui); color: var(--muted); }
.mix { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }

.q { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.q.done { opacity: .62; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.meta .paper { font: 500 12.5px var(--font-mono); color: var(--ink); }
.pill { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; letter-spacing: .02em; }
.pill.Easy { color: var(--easy); background: var(--easy-bg); }
.pill.Medium { color: var(--med); background: var(--med-bg); }
.pill.Hard { color: var(--hard); background: var(--hard-bg); }
.pill.type { color: var(--muted); background: var(--bg); border: 1px solid var(--line); font-weight: 500; }
.basis { font-size: 11.5px; }
.sub { font-size: 12.5px; color: var(--accent); }
.qtext { font-family: var(--font-display); font-size: 17px; line-height: 1.55; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
ol.opts { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
ol.opts li { display: flex; gap: 8px; font-size: 15px; overflow-wrap: anywhere; }
ol.opts li .k { font: 500 13px var(--font-mono); color: var(--muted); min-width: 1.4em; padding-top: 1px; }
ol.opts li.right .k, ol.opts li.right .t { color: var(--easy); font-weight: 600; }
details.sol { border-top: 1px dashed var(--line); padding-top: 8px; }
details.sol summary { cursor: pointer; font-weight: 500; font-size: 14px; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.sol summary::-webkit-details-marker { display: none; }
details.sol summary::before { content: "▸"; font-size: 12px; transition: transform .15s; }
details.sol[open] summary::before { transform: rotate(90deg); }
.solbody { display: grid; gap: 10px; margin-top: 10px; }
.ans { background: var(--answer-bg); border-radius: 6px; padding: 8px 12px; font-size: 14.5px; }
.ans b { color: var(--easy); }
.note { font-size: 13px; color: var(--med); }
.block h4 { margin: 0 0 4px; font: 600 11.5px var(--font-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.block p { margin: 0; overflow-wrap: anywhere; }
.forms { display: flex; flex-wrap: wrap; gap: 6px; }
.forms code { font: 13px var(--font-mono); background: var(--accent-soft); color: var(--ink); padding: 3px 8px; border-radius: 5px; overflow-wrap: anywhere; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
ol.steps li { overflow-wrap: anywhere; }
.shortcut { font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 12.5px; }
.foot a { color: var(--accent); }
.mark { font: 500 12.5px var(--font-ui); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.mark[aria-pressed="true"] { color: var(--easy); border-color: var(--easy); }
.more { justify-self: center; font: 500 14px var(--font-ui); padding: 8px 18px; border-radius: 999px; border: 1px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.cov { font-size: 12.5px; color: var(--muted); }
.cov summary { cursor: pointer; }
.cov table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.cov td, .cov th { padding: 2px 10px 2px 0; text-align: left; }
@media (max-width: 520px) { .q { padding: 14px; } .qtext { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { details.sol summary::before { transition: none; } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="eyebrow">Quantitative Aptitude · previous-year questions</div>
    <h1>CAT Quant PYQ Bank, 2014–2025</h1>
    <p class="lede">Every Quant question we could source from CAT 2014 to 2025, grouped by topic, each tagged with its year, slot and difficulty and solved the CAT way: the concept, the formula, then the steps.</p>

    </div>
    <div class="row">
      <input type="search" id="fSearch" placeholder="Search questions, e.g. remainder, circle, CI" aria-label="Search">
      <label class="toggle"><input type="checkbox" id="fOpen"> Show all solutions</label>
      <label class="toggle"><input type="checkbox" id="fHideDone"> Hide done</label>
      <span class="count" id="count"></span>

</section>

 −162 is false.", "3. Option 2: nⁿ = 27 while aₙⁿa₁ = (−216)(−6) = 1296; 27 ≥ 1296 is false.", "4. Option 3: a₁ⁿ = −216 while nⁿaₙ = −162; false again.", "5. One counterexample kills each statement, so none must hold."], "shortcut": "Signs of the coefficients alternate when all roots are positive, so odd powers of aₙ, a₁ are negative – check with roots 1, 2, 3.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q04", "year": 2014, "slot": 0, "q_no": 4, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log of factorials – binomial coefficient", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let X = Σᵢ₌₁ⁿ log₁₀ i − Σⱼ₌₁ᵖ log₁₀ j − Σₖ₌₁ⁿ⁻ᵖ log₁₀ k, where p ≤ n. For n = 8, what is the largest possible value of X?", "options": ["1 + log₁₀ 24", "log₁₀ 56", "1 + log₁₀ 7", "1 + log₁₀ 48"], "answer": "1 + log₁₀ 7", "answer_note": "", "concept": "Sums of logs of 1..m are logs of factorials, so X is the log of a binomial coefficient.", "formulas": ["Σ log i (i = 1..m) = log m!", "X = log[n!/(p!(n − p)!)] = log ⁿCₚ", "ⁿCₚ is largest at p = n/2"], "solution": ["1. Combine: X = log₁₀(8!) − log₁₀(p!) − log₁₀((8 − p)!) = log₁₀ ⁸Cₚ.", "2. ⁸Cₚ is maximised at p = 4: ⁸C₄ = 70.", "3. So X_max = log₁₀ 70 = log₁₀ 10 + log₁₀ 7 = 1 + log₁₀ 7."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q05", "year": 2014, "slot": 0, "q_no": 5, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – reflection in x-axis", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A ray of light travelling along the line √3x + y = √3 strikes the x-axis and is reflected. Along which line does the reflected ray travel?", "options": ["y = x + √3", "√3y = x − 1", "y = √3x − √3", "√3y = x − √3"], "answer": "y = √3x − √3", "answer_note": "Memory-based source text lost the √ symbols; the line and options are reconstructed consistently with the source's key and working (replace y by −y).", "concept": "Reflection in the x-axis keeps the point of incidence on the axis and reverses the sign of the slope; equivalently replace y by −y.", "formulas": ["Reflection in x-axis: (x, y) → (x, −y)"], "solution": ["1. The incident line meets the x-axis at y = 0 ⇒ x = 1, so the reflected ray also passes through (1, 0).", "2. Replace y by −y in √3x + y = √3 to get √3x − y = √3.", "3. Hence the reflected ray lies on y = √3x − √3 (slope √3, through (1, 0))."], "shortcut": "Only one option passes through (1, 0) with slope √3.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q06", "year": 2014, "slot": 0, "q_no": 6, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Alligation – integer minimisation", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Rice varieties A, B, C, D cost ₹40, ₹55, ₹50 and ₹65 per kg. a kg of A and b kg of B are mixed to form (a + b) kg of variety E costing ₹50/kg. c kg of C and d kg of D are mixed to form (c + d) kg of variety F costing ₹60/kg. Then x kg of E and y kg of F are mixed to give (x + y) kg costing ₹53/kg. If a, b, c, d, x, y are all integers, find the minimum possible value of a + b + c + d + x + y.", "options": ["28", "22", "16", "26"], "answer": "22", "answer_note": "", "concept": "Use alligation for each mix, then choose the smallest integer batch sizes that also allow the final mix to be drawn from them.", "formulas": ["Alligation: q₁ : q₂ = (p₂ − p̄) : (p̄ − p₁)"], "solution": ["1. E: a : b = (55 − 50) : (50 − 40) = 1 : 2, so a + b is a multiple of 3.", "2. F: c : d = (65 − 60) : (60 − 50) = 1 : 2, so c + d is a multiple of 3.", "3. Final: x : y = (60 − 53) : (53 − 50) = 7 : 3, so x ≥ 7, y ≥ 3 at the smallest.", "4. Need a + b ≥ x = 7 ⇒ a + b = 9; need c + d ≥ y = 3 ⇒ c + d = 3.", "5. Minimum total = 9 + 3 + 7 + 3 = 22."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q07", "year": 2014, "slot": 0, "q_no": 7, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Sum of fourth powers – odd terms", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Define f(n) = 1⁴ + 2⁴ + 3⁴ + … + n⁴. Which expression equals 1⁴ + 3⁴ + 5⁴ + … + (2n − 1)⁴?", "options": ["f(2n − 1) − 16f(n)", "f(2n − 1) − 8f(n)", "f(2n) − 16f(n)", "f(2n) − 8f(n)"], "answer": "f(2n) − 16f(n)", "answer_note": "", "concept": "Odd terms = all terms up to 2n minus the even terms; even terms factor out 2⁴.", "formulas": ["2⁴ + 4⁴ + … + (2n)⁴ = 16(1⁴ + … + n⁴) = 16f(n)"], "solution": ["1. Sum of all fourth powers up to 2n is f(2n).", "2. Even part: (2k)⁴ = 16k⁴, so the even terms sum to 16f(n).", "3. Odd part = f(2n) − 16f(n).", "4. Check n = 1: f(2) − 16f(1) = 17 − 16 = 1 = 1⁴ ✓."], "shortcut": "Plug n = 1: only option 3 gives 1.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q12", "year": 2014, "slot": 0, "q_no": 12, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Circular arrangement – minimum covering", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "There are 60 chairs around a circular table. Some people are already seated such that whoever arrives next is forced to sit beside someone already seated. What is the minimum number of people seated?", "options": ["10", "20", "30", "40"], "answer": "20", "answer_note": "", "concept": "Each seated person 'blocks' their own chair and the two neighbours; the empty chairs must all be adjacent to someone.", "formulas": ["One person covers at most 3 consecutive chairs", "Minimum = ⌈60/3⌉"], "solution": ["1. A newcomer can avoid neighbours only if some empty chair has both neighbours empty.", "2. So every chair must be occupied or adjacent to an occupied chair; each person covers at most 3 chairs.", "3. Hence at least 60/3 = 20 people are needed.", "4. Seating people at chairs 2, 5, 8, …, 59 (every third chair) achieves it with 20."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q13", "year": 2014, "slot": 0, "q_no": 13, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting arithmetic progressions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many arithmetic progressions consisting of 5 distinct terms can be formed using the first 50 natural numbers? (Count increasing progressions.)", "options": ["325", "300", "375", "288"], "answer": "288", "answer_note": "", "concept": "Fix the common difference d and count valid starting terms.", "formulas": ["Need a + 4d ≤ 50 with a ≥ 1, d ≥ 1", "Count for each d = 50 − 4d"], "solution": ["1. For common difference d, the first term a can be 1, 2, …, 50 − 4d.", "2. d ranges from 1 to 12 (since 4d ≤ 49).", "3. Total = Σ (50 − 4d) for d = 1..12 = 12 × 50 − 4 × 78 = 600 − 312 = 288."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q14", "year": 2014, "slot": 0, "q_no": 14, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Minimum of t + 1/t with constraint", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A (possibly biased) coin shows heads with probability p and tails with probability q = 1 − p. If X = pq + 1/(pq), what is the minimum value of X?", "options": ["4.25", "2√5", "2", "None of these"], "answer": "4.25", "answer_note": "Expression for X is garbled in the memory-based source; reconstructed as pq + 1/(pq), which matches the source's working (0.25 + 4).", "concept": "t + 1/t is decreasing for 0 < t < 1, so minimise X by making pq as large as possible.", "formulas": ["pq ≤ ((p + q)/2)² = 1/4 (AM–GM)", "t + 1/t decreasing on (0, 1)"], "solution": ["1. Let t = pq. Since p + q = 1, t ≤ 1/4 (equality at p = q = 1/2).", "2. On 0 < t ≤ 1/4, t + 1/t decreases as t increases, so the minimum is at t = 1/4.", "3. X_min = 1/4 + 4 = 4.25."], "shortcut": "Do not use t + 1/t ≥ 2 – that needs t = 1, which is impossible here.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q15", "year": 2014, "slot": 0, "q_no": 15, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Marked price and discount", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A trader normally sells at the marked price and earns a 5% profit. One day he triples the marked price and then gives a 30% discount on it. What is his profit percentage that day?", "options": ["120.5%", "100%", "94.5%", "None of these"], "answer": "120.5%", "answer_note": "", "concept": "Express everything in terms of cost price.", "formulas": ["SP = MP × (1 − discount)", "Profit% = (SP − CP)/CP × 100"], "solution": ["1. Let CP = 100, so MP = 105.", "2. New MP = 315; after 30% off, SP = 315 × 0.7 = 220.5.", "3. Profit = 120.5 on 100, i.e. 120.5%."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q16", "year": 2014, "slot": 0, "q_no": 16, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus inequality", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find all real x satisfying 1/(|x| − 2) < 0.5.", "options": ["x < −4", "x > 4 or x < −4", "x < −4 or −2 < x < 2 or x > 4", "−2 < x < 2"], "answer": "x < −4 or −2 < x < 2 or x > 4", "answer_note": "Inequality reconstructed from a garbled memory-based source; consistent with the source's key and working.", "concept": "Split on the sign of |x| − 2: a negative denominator makes the fraction automatically less than 0.5.", "formulas": ["1/t < 1/2 ⇔ t < 0 or t > 2"], "solution": ["1. Let t = |x| − 2 (t ≠ 0). Then 1/t < 1/2 holds when t < 0 or t > 2.", "2. t < 0 ⇒ |x| < 2 ⇒ −2 < x < 2.", "3. t > 2 ⇒ |x| > 4 ⇒ x < −4 or x > 4.", "4. Combine: x < −4 or −2 < x < 2 or x > 4."], "shortcut": "x = 0 works (−1/2 < 0.5), which leaves only options 3 and 4; x = 5 works too, so option 3.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q17", "year": 2014, "slot": 0, "q_no": 17, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of coefficients", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "What is the sum of all the coefficients in the expansion of (x − 1)⁹(x − 2)⁴(x − 4)?", "options": ["0", "16", "−20", "None of these"], "answer": "0", "answer_note": "", "concept": "The sum of the coefficients of a polynomial P(x) is P(1).", "formulas": ["Sum of coefficients = P(1)"], "solution": ["1. Substitute x = 1: (1 − 1)⁹ × (1 − 2)⁴ × (1 − 4).", "2. The first factor is 0, so the sum of coefficients is 0."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q18", "year": 2014, "slot": 0, "q_no": 18, "area": "Number System", "topic": "Number System", "subtopic": "HCF/LCM from sum and ratio", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two numbers whose sum is 600 are in the ratio 7 : 8. What is their LCM?", "options": ["1120", "560", "2240", "1152"], "answer": "2240", "answer_note": "Source text drops the word ‘sum’; the worked solution in the source treats 600 as the sum.", "concept": "Find the numbers from the ratio, then LCM = HCF × product of the co-prime ratio terms.", "formulas": ["Numbers = 7k, 8k", "LCM(7k, 8k) = 56k"], "solution": ["1. 7k + 8k = 600 ⇒ k = 40.", "2. Numbers are 280 and 320.", "3. LCM = 56 × 40 = 2240."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q23", "year": 2014, "slot": 0, "q_no": 23, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Pythagorean triples", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A right-angled triangle has a hypotenuse of 240 units and integer sides, and its perimeter is a perfect square greater than 550. Which of the following could be the length of one of its sides?", "options": ["192 units", "168 units", "144 units", "Both 192 units and 144 units"], "answer": "Both 192 units and 144 units", "answer_note": "", "concept": "Find integer legs with a² + b² = 240² and test the perimeter condition.", "formulas": ["a² + b² = c²", "3-4-5 scaled by 48 gives 144-192-240"], "solution": ["1. Perimeter is a perfect square > 550 and < 240 + 240 + 240, so try 576 = 24² (next, 625, needs a + b = 385 > 240√2 ≈ 339).", "2. Then a + b = 336 and a² + b² = 57600.", "3. 2ab = 336² − 57600 = 55296 ⇒ ab = 27648.", "4. a, b are roots of t² − 336t + 27648 = 0 ⇒ t = 144 or 192.", "5. So both 144 and 192 can be sides."], "shortcut": "240 = 48 × 5 ⇒ the 3-4-5 triple gives 144, 192; perimeter 576 = 24² ✓.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q24", "year": 2014, "slot": 0, "q_no": 24, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Roots of a cubic – forming quadratics", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Consider every quadratic equation whose two roots are both taken from the roots of (x − a)(x − b)(x − c) = 0 (a root may be repeated). What is the total of the sums of roots of all such quadratics?", "options": ["3(a + b + c)", "2(a + b + c)", "(a + b + c)", "4(a + b + c)"], "answer": "4(a + b + c)", "answer_note": "", "concept": "List all multisets of two roots chosen from {a, b, c} and add their sums.", "formulas": ["Sum of roots of a quadratic with roots r, s = r + s"], "solution": ["1. Distinct pairs: {a, b}, {b, c}, {c, a} – total 2(a + b + c).", "2. Repeated pairs: {a, a}, {b, b}, {c, c} – total 2(a + b + c).", "3. Grand total = 4(a + b + c)."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q25", "year": 2014, "slot": 0, "q_no": 25, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equation – constant function", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A real function satisfies f(x + y) = f(xy) for all real x and y. If f(−7) = 7, find f(−49) + f(49).", "options": ["7", "14", "0", "49"], "answer": "14", "answer_note": "", "concept": "Choosing y = 0 shows the function is constant.", "formulas": ["Put y = 0: f(x) = f(0) for every x"], "solution": ["1. With y = 0: f(x) = f(0) for all x, so f is constant.", "2. f(−7) = 7 ⇒ f ≡ 7.", "3. f(−49) + f(49) = 7 + 7 = 14."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q26", "year": 2014, "slot": 0, "q_no": 26, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rectangle split into trapeziums", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "ABCD is a rectangle; E is a point on AB and F is a point on CD such that the quadrilaterals AEFD and CBEF have equal areas. Which statement is necessarily false?", "options": ["AE is always equal to CF.", "If BC = 4, the smallest integer value of EF is 5.", "AE equals DF.", "∠AEF = ∠EFC."], "answer": "If BC = 4, the smallest integer value of EF is 5.", "answer_note": "", "concept": "Both pieces are trapeziums of equal height; equal areas force equal sums of parallel sides.", "formulas": ["Area of trapezium = ½ × (sum of parallel sides) × height"], "solution": ["1. Let AB = L, AE = p, DF = q. Equal areas ⇒ p + q = (L − p) + (L − q) ⇒ p + q = L.", "2. Then CF = L − q = p = AE, so statement 1 is always true; alternate angles give statement 4 always true.", "3. Statement 3 (AE = DF) holds when p = q = L/2 – possible, so not necessarily false.", "4. EF² = BC² + (p − q)² ≥ 16, and EF = 4 occurs when p = q; so the smallest integer EF is 4, not 5 – statement 2 is always false."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q27", "year": 2014, "slot": 0, "q_no": 27, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logs in AP", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "log₃2, log₃(2ˣ − 5) and log₃(2ˣ − 7/2) are in arithmetic progression. Find x.", "options": ["2", "3", "2 or 4", "2 or 3"], "answer": "3", "answer_note": "Third term is garbled in the memory-based source; reconstructed as log₃(2ˣ − 7/2), which reproduces the source's quadratic t² − 12t + 32 = 0.", "concept": "Three logs in AP means their arguments are in GP.", "formulas": ["log p, log q, log r in AP ⇔ q² = pr"], "solution": ["1. (2ˣ − 5)² = 2(2ˣ − 7/2) = 2·2ˣ − 7.", "2. Let t = 2ˣ: t² − 10t + 25 = 2t − 7 ⇒ t² − 12t + 32 = 0 ⇒ t = 4 or 8.", "3. t = 4 (x = 2) makes 2ˣ − 5 negative, so the log is undefined; reject.", "4. t = 8 ⇒ x = 3."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q28", "year": 2014, "slot": 0, "q_no": 28, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Weights – fraction filled", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "An empty metal container (without its handle) weighs 15% of the weight of the same container when completely full. Attaching the handle increases the weight of the full container by 5%. A partly filled container with its handle attached weighs one-third of the completely filled container with its handle. What fraction of the container is filled?", "options": ["4/17", "3/17", "6/19", "3/19"], "answer": "3/17", "answer_note": "Fraction in the memory-based source is garbled; reconstructed as one-third, which matches the source's working (15x/85x).", "concept": "Fix the full weight as 100 and split it into container, contents and handle.", "formulas": ["Fraction filled = weight of contents present / weight of full contents"], "solution": ["1. Full container (no handle) = 100: container 15, contents 85.", "2. Handle = 5% of 100 = 5, so full with handle = 105.", "3. Partly filled with handle = 105/3 = 35 ⇒ contents = 35 − 15 − 5 = 15.", "4. Fraction filled = 15/85 = 3/17."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q29", "year": 2014, "slot": 0, "q_no": 29, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Telescoping factorial series", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find P = 1/(1! + 2!) + 1/(2! + 3!) + 1/(3! + 4!) + … + 1/(9! + 10!).", "options": ["1/2! − 1/11!", "1/2! − 1/10!", "1/1! − 1/10!", "1/1! − 1/11!"], "answer": "1/2! − 1/11!", "answer_note": "", "concept": "Write each term as a difference of reciprocals of consecutive factorials so the sum telescopes.", "formulas": ["n! + (n + 1)! = n!(n + 2)", "1/(n!(n + 2)) = (n + 1)/(n + 2)! = 1/(n + 1)! − 1/(n + 2)!"], "solution": ["1. n! + (n + 1)! = n!(n + 2), so the general term is (n + 1)/(n + 2)!.", "2. (n + 1)/(n + 2)! = [(n + 2) − 1]/(n + 2)! = 1/(n + 1)! − 1/(n + 2)!.", "3. Summing n = 1 to 9 telescopes to 1/2! − 1/11!."], "shortcut": "First term alone is 1/3 ≈ 0.333; options 3, 4 are ≈ 1, too large.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q30", "year": 2014, "slot": 0, "q_no": 30, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Overtaking – relative speeds", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "P and Q start walking from the same point in the same direction at 1 PM; R starts from that point at 3 PM. R overtakes P at 5 PM, then immediately doubles his speed and overtakes Q one hour later. What is the ratio of the speeds of P and Q?", "options": ["8 : 5", "3 : 4", "4 : 3", "5 : 8"], "answer": "5 : 8", "answer_note": "", "concept": "At each overtaking moment the distances from the start are equal.", "formulas": ["Distance = speed × time"], "solution": ["1. Let R's initial speed be r. At 5 PM: P has walked 4 h, R 2 h ⇒ 4p = 2r ⇒ p = r/2.", "2. From 5 PM to 6 PM R moves at 2r, so by 6 PM R has covered 2r + 2r = 4r.", "3. Q has walked 5 h by 6 PM: 5q = 4r ⇒ q = 4r/5.", "4. p : q = (1/2) : (4/5) = 5 : 8."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q34", "year": 2014, "slot": 0, "q_no": 34, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Periodic recursive sequence", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "P₁ = 211, P₂ = 375, P₃ = 420, P₄ = 523 and Pₙ = Pₙ₋₁ − Pₙ₋₂ + Pₙ₋₃ − Pₙ₋₄ for n ≥ 5. Find P₅₃₁ + P₇₅₃ + P₉₇₅.", "options": ["898", "631", "364", "544"], "answer": "898", "answer_note": "", "concept": "Generate a few terms – the sequence repeats, so reduce indices by the period.", "formulas": ["Pₙ₊₅ = −Pₙ, hence Pₙ₊₁₀ = Pₙ"], "solution": ["1. P₅ = 523 − 420 + 375 − 211 = 267.", "2. Continuing: P₆ = −211, P₇ = −375, P₈ = −420, P₉ = −523, P₁₀ = −267, P₁₁ = 211 – period 10.", "3. 531 ≡ 1, 753 ≡ 3, 975 ≡ 5 (mod 10).", "4. Sum = P₁ + P₃ + P₅ = 211 + 420 + 267 = 898."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q35", "year": 2014, "slot": 0, "q_no": 35, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Frustum with conical cavity", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A solid frustum of a cone has top radius 3 cm, bottom radius 6 cm and height 8 cm. A conical cavity of base radius 6 cm and height 3 cm is hollowed out from its base. What volume of material remains?", "options": ["132π cm³", "168π cm³", "159π cm³", "Data insufficient"], "answer": "132π cm³", "answer_note": "", "concept": "Volume of frustum minus volume of the removed cone.", "formulas": ["Frustum: V = (πh/3)(R² + Rr + r²)", "Cone: V = (1/3)πr²h"], "solution": ["1. Frustum = (π × 8/3)(36 + 18 + 9) = (8π/3)(63) = 168π.", "2. Cavity = (1/3)π × 36 × 3 = 36π.", "3. Remaining = 168π − 36π = 132π cm³."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q36", "year": 2014, "slot": 0, "q_no": 36, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Parallel lines – similar triangles", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In an acute triangle PQR, S lies on PQ. The line through P parallel to SR meets QR (extended) at T, and the line through Q parallel to SR meets PR (extended) at U. If PT = a and QU = b, find SR.", "options": ["(a + b)/(ab)", "(a − b)/(ab)", "ab/(a + b)", "ab/(a − b)"], "answer": "ab/(a + b)", "answer_note": "", "concept": "Two pairs of similar triangles give SR/a and SR/b as complementary fractions of PQ.", "formulas": ["SR/PT = QS/QP", "SR/QU = PS/PQ", "1/SR = 1/a + 1/b"], "solution": ["1. △QSR ~ △QPT (SR ∥ PT): SR/a = QS/QP.", "2. △PSR ~ △PQU (SR ∥ QU): SR/b = PS/PQ.", "3. Add: SR/a + SR/b = (QS + PS)/PQ = 1.", "4. So SR = ab/(a + b)."], "shortcut": "Dimension check: SR is a length, so options 1, 2 (1/length) are out; with a = b, SR = a/2 rules out option 4.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q37", "year": 2014, "slot": 0, "q_no": 37, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Integer solutions – scoring runs", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A batsman scores exactly 100 runs using only 2s, 4s and 6s, hitting at least one of each. In how many ways (counting only the numbers of 2s, 4s and 6s) can this be done?", "options": ["184", "185", "192", "208"], "answer": "184", "answer_note": "", "concept": "Count positive integer solutions of a linear equation by fixing one variable.", "formulas": ["2x + 4y + 6z = 100 ⇔ x + 2y + 3z = 50, with x, y, z ≥ 1"], "solution": ["1. Substitute x = X + 1 etc.: X + 2Y + 3Z = 44 with X, Y, Z ≥ 0.", "2. For each Z = 0..14, count Y from 0 to ⌊(44 − 3Z)/2⌋: that gives ⌊(44 − 3Z)/2⌋ + 1 choices.", "3. Values: 23, 21, 20, 18, 17, 15, 14, 12, 11, 9, 8, 6, 5, 3, 2.", "4. Sum = 184."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q38", "year": 2014, "slot": 0, "q_no": 38, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Arrangements – no two together (gap method)", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Nine students, among them Amar, Akbar and Antony, stand in a row for a photograph. In how many arrangements are no two of Amar, Akbar and Antony next to each other?", "options": ["151200", "120960", "181440", "241920"], "answer": "151200", "answer_note": "", "concept": "Arrange the others first, then place the three in separate gaps.", "formulas": ["Gap method: (n − k)! × ⁿ⁻ᵏ⁺¹Pₖ"], "solution": ["1. Arrange the other 6 students: 6! = 720.", "2. They create 7 gaps; choose and fill 3 of them with the three in order: ⁷P₃ = 210.", "3. Total = 720 × 210 = 151200."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q39", "year": 2014, "slot": 0, "q_no": 39, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Angle bisector meeting circumcircle", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In triangle ABC the bisector of ∠BAC meets BC at D and the circumcircle again at E. If DE = 3 cm, AC = 4 cm and AD = 5 cm, find AB.", "options": ["7 cm", "8 cm", "9 cm", "10 cm"], "answer": "10 cm", "answer_note": "", "concept": "Triangles ABE and ADC are similar (equal halves of ∠A and equal inscribed angles on arc AC).", "formulas": ["△ABE ~ △ADC ⇒ AB/AE = AD/AC", "AB × AC = AD × AE"], "solution": ["1. ∠BAE = ∠DAC (bisector) and ∠AEB = ∠ACB (same arc AB).", "2. So △ABE ~ △ADC ⇒ AB × AC = AD × AE.", "3. AE = AD + DE = 8, so AB × 4 = 5 × 8 ⇒ AB = 10 cm."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q40", "year": 2014, "slot": 0, "q_no": 40, "area": "Number System", "topic": "Number System", "subtopic": "Sequence excluding squares and cubes", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "From the natural numbers, all perfect squares and all perfect cubes are removed, and the remaining numbers are written in increasing order to form the sequence P. What is the 476th number of P?", "options": ["500", "501", "502", "503"], "answer": "503", "answer_note": "Source text omits the range; its working counts through the natural numbers beyond 500, so the question is stated over all natural numbers.", "concept": "Count the removed numbers up to a guess using inclusion–exclusion, then adjust.", "formulas": ["Removed up to N = ⌊√N⌋ + ⌊∛N⌋ − ⌊N^(1/6)⌋"], "solution": ["1. Up to 500: squares 22, cubes 7, sixth powers (both) 2 ⇒ removed 27; remaining 473.", "2. Need 3 more: 501, 502, 503 – none is a square or cube.", "3. So the 476th term is 503."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q41", "year": 2014, "slot": 0, "q_no": 41, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponents – common base", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If 7ᵃ = 26 and 343ᵇ = 676, how are a and b related?", "options": ["a = b", "a = 2b", "2a = 3b", "3a = 2b"], "answer": "2a = 3b", "answer_note": "", "concept": "Write 343 and 676 as powers of 7 and 26.", "formulas": ["343 = 7³, 676 = 26²"], "solution": ["1. 343ᵇ = 7³ᵇ = 676 = 26² = (7ᵃ)² = 7²ᵃ.", "2. Equate exponents: 3b = 2a."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q42", "year": 2014, "slot": 0, "q_no": 42, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Algebraic identities – x + 1/x", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If x(x − 3) = −1, find the value of x³(x³ − 18).", "options": ["1", "0", "−1", "2"], "answer": "−1", "answer_note": "", "concept": "Convert the quadratic into x + 1/x and cube it.", "formulas": ["x + 1/x = k ⇒ x³ + 1/x³ = k³ − 3k"], "solution": ["1. x² − 3x + 1 = 0 ⇒ x + 1/x = 3.", "2. x³ + 1/x³ = 27 − 9 = 18 ⇒ x⁶ + 1 = 18x³.", "3. x³(x³ − 18) = x⁶ − 18x³ = −1."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q43", "year": 2014, "slot": 0, "q_no": 43, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures with GP concentrations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The milk concentrations of solutions A, B and C are in geometric progression in that order. Mixing A, B, C in the ratio 2 : 3 : 4 gives 32% milk; mixing them in the ratio 3 : 2 : 1 gives 22% milk. What is the milk percentage in A?", "options": ["6%", "12%", "18%", "24%"], "answer": "12%", "answer_note": "", "concept": "Write the concentrations as a, ar, ar² and form two weighted-average equations.", "formulas": ["Weighted average = Σ wᵢcᵢ / Σ wᵢ"], "solution": ["1. 2a + 3ar + 4ar² = 9 × 32 = 288.", "2. 3a + 2ar + ar² = 6 × 22 = 132.", "3. Divide: (2 + 3r + 4r²)/(3 + 2r + r²) = 288/132 = 24/11 ⇒ 44r² + 33r + 22 = 24r² + 48r + 72 ⇒ 20r² − 15r − 50 = 0 ⇒ 4r² − 3r − 10 = 0 ⇒ r = 2.", "4. Then a(3 + 4 + 4) = 132 ⇒ a = 12%."], "shortcut": "Test options: a = 12 with r = 2 gives 12, 24, 48 – check (24 + 72 + 192)/9 = 32 ✓.", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q47", "year": 2014, "slot": 0, "q_no": 47, "area": "Number System", "topic": "Number System", "subtopic": "Highest power of 2 in a product", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "P is the product of ten consecutive two-digit natural numbers. If 2ᵃ divides P, what is the largest value a can take?", "options": ["11", "12", "13", "14"], "answer": "13", "answer_note": "Source prints ‘2a’; the intended reading (2ᵃ divides P) follows from its options and working.", "concept": "Among ten consecutive numbers there are exactly 5 even ones; maximise the powers of 2 by including a high power of 2.", "formulas": ["Exponent of 2 in a product = sum of exponents in each factor"], "solution": ["1. Ten consecutive numbers contain 5 evens, contributing at least 5 twos; multiples of 4 and 8 add more.", "2. Include 64 = 2⁶: e.g. 56 to 65 contains 56 (2³), 58 (2¹), 60 (2²), 62 (2¹), 64 (2⁶).", "3. Total exponent = 3 + 1 + 2 + 1 + 6 = 13.", "4. No block can do better (checking all blocks from 10–19 to 90–99 gives a maximum of 13)."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q48", "year": 2014, "slot": 0, "q_no": 48, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – integer constraint", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In factory A the number of men is 50% more than the number of women. In factory B the number of women is 40% less than the number of men. The number of women in B exceeds the number of men in A by 60. Which of the following cannot be the total number of men in the two factories together?", "options": ["204", "180", "320", "300"], "answer": "320", "answer_note": "", "concept": "Express both factories with one integer parameter and look at the form of the total.", "formulas": ["Men_A = 1.5 × Women_A", "Women_B = 0.6 × Men_B"], "solution": ["1. Let women in A = 2k, so men in A = 3k.", "2. Women in B = 3k + 60, so men in B = (3k + 60)/0.6 = 5k + 100.", "3. Total men = 8k + 100, so (total − 100) must be a multiple of 8.", "4. 204 → 104 ✓, 180 → 80 ✓, 300 → 200 ✓, 320 → 220 ✗ (not a multiple of 8)."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q49", "year": 2014, "slot": 0, "q_no": 49, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Domain of a log function", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the domain of f(x) = log₁₀(x³ − x) / (9 − x²).", "options": ["(−1, 0) ∪ (1, 3)", "(−1, 0) ∪ (1, 3) ∪ (3, ∞)", "(−3, 0) ∪ (3, ∞)", "(−∞, −3) ∪ (−3, 3) ∪ (3, ∞)"], "answer": "(−1, 0) ∪ (1, 3) ∪ (3, ∞)", "answer_note": "Function is garbled in the memory-based source; reconstructed as log₁₀(x³ − x)/(9 − x²), which matches the source's key and working.", "concept": "The log needs a positive argument and the denominator must be non-zero.", "formulas": ["log₁₀ u defined ⇔ u > 0", "Denominator ≠ 0"], "solution": ["1. x³ − x = x(x − 1)(x + 1) > 0 ⇒ −1 < x < 0 or x > 1.", "2. 9 − x² ≠ 0 ⇒ x ≠ ±3.", "3. Remove x = 3 from x > 1: domain = (−1, 0) ∪ (1, 3) ∪ (3, ∞)."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2014-S0-Q50", "year": 2014, "slot": 0, "q_no": 50, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – symmetric terms", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Eleven friends P₁, P₂, …, P₁₁ hold numbers of balls that form an arithmetic progression in that order. P₁, P₃, P₅, P₇, P₉ and P₁₁ together hold 72 balls. How many balls do P₁, P₆ and P₁₁ hold together?", "options": ["24", "48", "36", "Cannot be determined"], "answer": "36", "answer_note": "", "concept": "Terms equidistant from the middle term of an AP average to the middle term.", "formulas": ["Tₖ + T₁₂₋ₖ = 2T₆ for an 11-term AP"], "solution": ["1. Pairs (P₁, P₁₁), (P₃, P₉), (P₅, P₇) each sum to 2P₆, so 6P₆ = 72 ⇒ P₆ = 12.", "2. P₁ + P₆ + P₁₁ = 2P₆ + P₆ = 3P₆ = 36."], "shortcut": "", "source_url": "https://images-na.ssl-images-amazon.com/images/G/31/img16/Books/ExamCentral/Aug/CAT_2014_CL.pdf"}, {"id": "2016-S2-Q01", "year": 2016, "slot": 2, "q_no": 1, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – extreme value of one term", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "Seven numbers, none of which is greater than 100, have an arithmetic mean of 85. The arithmetic mean of the first four of them is 80. What is the least value the fifth number can take?", "options": ["70", "75", "80", "85"], "answer": "75", "answer_note": "No official key exists. The source post prints the first-four mean as '8', which is impossible with a total of 595 and four-number cap; it is read as 80 (consistent with every option). 75 was the poll majority (82 of 119 votes) and the answer in a Slot 2 answer list posted on 6 Dec 2016.", "concept": "To minimise one term of a fixed total, push every other free term to its upper limit.", "formulas": ["Sum = mean × count"], "solution": ["1. Total of all seven = 7 × 85 = 595.", "2. Total of the first four = 4 × 80 = 320, so the last three add up to 595 − 320 = 275.", "3. The fifth number is smallest when the sixth and seventh are as large as allowed, i.e. 100 each.", "4. Fifth = 275 − 200 = 75."], "shortcut": "Last three average 91.67; two of them can be 8.33 above that at most (100), so the fifth is 275 − 200 = 75.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q02", "year": 2016, "slot": 2, "q_no": 2, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – growth factor scaling", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "Under a scheme that compounds interest annually, Rs. 36 lakh becomes Rs. 3.24 crore in 12 years. At the same rate, what principal would become Rs. 16.2 crore in 18 years?", "options": ["Rs. 60 lakh", "Rs. 90 lakh", "Rs. 54 lakh"], "answer": "Rs. 60 lakh", "answer_note": "No official key exists. Only three distinct options survive in the source (its fourth option is a duplicate '90L'). 60 lakh was the poll majority (84 of 107 votes) and appears in a Slot 2 answer list posted on 6 Dec 2016.", "concept": "Under compound interest the growth factor over a period depends only on its length, so factors for different durations are powers of one another.", "formulas": ["A = P(1 + r)^n", "Factor over kn years = (factor over n years)^k"], "solution": ["1. Growth factor in 12 years = 324 lakh ÷ 36 lakh = 9 = 3².", "2. So the factor for 6 years is 3.", "3. The factor for 18 years = 3³ = 27.", "4. Required principal = 1620 lakh ÷ 27 = 60 lakh."], "shortcut": "9 in 12 years means ×3 every 6 years; 18 years is ×27, and 16.2 crore ÷ 27 = 60 lakh.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q03", "year": 2016, "slot": 2, "q_no": 3, "area": "Number System", "topic": "Number System", "subtopic": "Linear Diophantine equation – min of x − y", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "X and Y are positive integers with 3(X + 1) = 5(Y − 2). What is the smallest possible value of X − Y?", "options": ["0", "−1", "−2", "1"], "answer": "−1", "answer_note": "No official key exists. −1 was the poll majority (89 of 112 votes) and appears in a Slot 2 answer list posted on 6 Dec 2016. The question is named as Slot 2 in a separate post on 4 Dec 2016.", "concept": "Find the general integer solution of a linear equation, then see how X − Y changes along it.", "formulas": ["3X − 5Y = −13", "General solution: Y = 5 + 3t, X = 4 + 5t (t ≥ 0)"], "solution": ["1. Expand: 3X + 3 = 5Y − 10, so 3X = 5Y − 13.", "2. 5Y − 13 must be a positive multiple of 3, so Y ≡ 2 (mod 3); Y = 2 gives X = −1 (rejected), and Y = 5 gives X = 4.", "3. All solutions: (X, Y) = (4 + 5t, 5 + 3t) for t = 0, 1, 2, …", "4. X − Y = −1 + 2t, which increases with t, so its minimum is −1 at (4, 5)."], "shortcut": "X − Y = (2Y − 13)/3 rises with Y; plug the smallest valid Y = 5 to get −1.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q04", "year": 2016, "slot": 2, "q_no": 4, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – difference of totals", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "Over three tests, Sita's average score is 6 more than Gita's. In the first test Gita scored 10 more than Sita, and in the second test Gita scored 5 less than Sita. By how much do their third-test scores differ?", "options": ["23", "21", "13", "25"], "answer": "23", "answer_note": "No official key exists. 23 follows from the question as recalled and was the poll majority (87 of 113 votes). One Slot 2 answer list posted on 6 Dec 2016 gives 13; that would need the first two gaps to be recalled the other way round.", "concept": "A difference in averages over n items equals a difference in totals of n × (gap); subtract the known item-wise gaps to get the remaining one.", "formulas": ["Difference in totals = n × difference in averages"], "solution": ["1. Difference in totals (Sita − Gita) = 3 × 6 = 18.", "2. Test 1: Sita − Gita = −10.", "3. Test 2: Sita − Gita = +5.", "4. Test 3: Sita − Gita = 18 − (−10) − 5 = 23."], "shortcut": "18 + 10 − 5 = 23.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q05", "year": 2016, "slot": 2, "q_no": 5, "area": "Number System", "topic": "Number System", "subtopic": "Squares – sum of three consecutive squares", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "Which of these numbers can be written as the sum of the squares of three consecutive integers: 4805, 10804, 2004, 67502?", "options": ["4805", "10804", "2004", "67502"], "answer": "67502", "answer_note": "No official key exists. 67502 was the poll majority (60 of 97 votes) and is the only option that works (150² × 3 + 2). A separate post on 9 Dec 2016 names this question as Slot 2.", "concept": "(k − 1)² + k² + (k + 1)² = 3k² + 2, so the number must leave remainder 2 on division by 3, and (N − 2)/3 must be a perfect square.", "formulas": ["(k − 1)² + k² + (k + 1)² = 3k² + 2"], "solution": ["1. Sum of squares of k − 1, k, k + 1 is 3k² + 2.", "2. So N − 2 must be divisible by 3: 4805 − 2 = 4803 (÷3 = 1601), 10804 − 2 = 10802 (not divisible), 2004 − 2 = 2002 (not divisible), 67502 − 2 = 67500 (÷3 = 22500).", "3. 1601 is not a perfect square; 22500 = 150².", "4. So 67502 = 149² + 150² + 151²."], "shortcut": "Digit sum check: N ≡ 2 (mod 3) leaves only 4805 and 67502; 67500/3 = 22500 = 150² is the clean square.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q06", "year": 2016, "slot": 2, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Factors – divisors with divisibility conditions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "How many divisors of 10800 are divisible by 12 but not by 36?", "options": ["9", "16", "18", "6"], "answer": "9", "answer_note": "No official key exists. 9 was the poll majority (63 of 106 votes) and appears as '9 (10800 one)' in a Slot 2 answer list posted on 6 Dec 2016. One Slot 2 post recalls the number as 5400, which would give 6 (also an option); 10800 is used because two posts give it.", "concept": "Write the number in prime-factor form and count exponent choices that meet the divisibility conditions.", "formulas": ["10800 = 2⁴ × 3³ × 5²", "Divisor 2^a × 3^b × 5^c with 0 ≤ a ≤ 4, 0 ≤ b ≤ 3, 0 ≤ c ≤ 2"], "solution": ["1. 10800 = 2⁴ × 3³ × 5².", "2. Divisible by 12 = 2² × 3 means a ≥ 2 and b ≥ 1.", "3. Not divisible by 36 = 2² × 3² means, given a ≥ 2, that b must be exactly 1.", "4. Choices: a ∈ {2, 3, 4} (3 ways), b = 1 (1 way), c ∈ {0, 1, 2} (3 ways).", "5. Total = 3 × 1 × 3 = 9."], "shortcut": "Divisors of 12k with k | 900 and 3 ∤ k: k | 2² × 5², which has 3 × 3 = 9 divisors.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q07", "year": 2016, "slot": 2, "q_no": 7, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – sharing a bill", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "Deepika, Kareena and Priyanka split a restaurant bill. Deepika pays two-thirds as much as Kareena, and Kareena pays half as much as Priyanka. What fraction of the bill does Kareena pay?", "options": [], "answer": "3/11", "answer_note": "No official key exists. The source gives no options, so it is stored with an empty option list; the original may have been an MCQ. 3/11 appears in a Slot 2 answer list posted on 6 Dec 2016.", "concept": "Express every share in terms of one person's share and take that share's fraction of the sum.", "formulas": ["Fraction = own share ÷ total"], "solution": ["1. Let Kareena pay 3 units, which keeps the numbers whole.", "2. Deepika pays (2/3) × 3 = 2 units; Priyanka pays 2 × 3 = 6 units.", "3. Total = 2 + 3 + 6 = 11 units.", "4. Kareena's fraction = 3/11."], "shortcut": "D : K : P = 2 : 3 : 6, so K = 3/11.", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2016-S2-Q08", "year": 2016, "slot": 2, "q_no": 8, "area": "Number System", "topic": "Number System", "subtopic": "Integers – counting under power constraints", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed (no % correct data exists for 2016)", "question": "How many odd integers x satisfy both x³ > −10 and x² < 70?", "options": [], "answer": "5", "answer_note": "No official key exists. The source gives no options, so it is stored with an empty option list. 5 appears in a Slot 2 answer list posted on 6 Dec 2016; another post on 4 Dec 2016 suggested 1, but direct counting gives −1, 1, 3, 5, 7.", "concept": "Turn each power condition into a range for x, intersect the ranges, and count odd integers, minding negative values.", "formulas": ["x³ > −10 ⇔ x > −∛10 ≈ −2.15", "x² < 70 ⇔ |x| < √70 ≈ 8.37"], "solution": ["1. x³ > −10 gives x ≥ −2 for integers (since (−3)³ = −27 < −10 and (−2)³ = −8 > −10).", "2. x² < 70 gives −8 ≤ x ≤ 8 (8² = 64 < 70, 9² = 81).", "3. Combined range for integers: −2 ≤ x ≤ 8.", "4. Odd integers in it: −1, 1, 3, 5, 7, so 5 values."], "shortcut": "", "source_url": "https://www.pagalguy.com/t/cat-quantitative-aptitude-questions-2022-pagalguy/3032460?page=254"}, {"id": "2017-S1-Q01", "year": 2017, "slot": 1, "q_no": 1, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – ages", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "At present Arun is 40% as old as Barun. After some years, Arun's age will be exactly half of Barun's age. By what percentage does Barun's age increase over this period?", "options": [], "answer": "20", "answer_note": "", "concept": "Age differences stay constant, so a ratio change in ages pins down the elapsed time relative to current age.", "formulas": ["Both ages grow by the same t years", "Percentage increase = t / original × 100"], "solution": ["1. Let Barun's age be B, so Arun is 0.4B.", "2. After t years: 0.4B + t = (B + t)/2.", "3. Simplify: 0.8B + 2t = B + t, so t = 0.2B.", "4. Barun's age rises from B to 1.2B, an increase of 20%."], "shortcut": "Take B = 100: Arun = 40; need 40 + t = (100 + t)/2, giving t = 20, i.e. 20%.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-1.shtml"}, {"id": "2017-S1-Q02", "year": 2017, "slot": 1, "q_no": 2, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – workers joining daily", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "One worker alone can finish a job in 120 days. He works by himself on day 1. On day 2 a second worker of the same efficiency joins him, on day 3 a third joins, and so on, with one more equally efficient worker added each day. In how many days will the job be completed?", "options": [], "answer": "15", "answer_note": "", "concept": "Total work in worker-days accumulates as a sum of consecutive natural numbers.", "formulas": ["Total work = 120 worker-days", "1 + 2 + … + n = n(n + 1)/2"], "solution": ["1. Treat the job as 120 units, with each worker doing 1 unit per day.", "2. Work done by the end of day n is 1 + 2 + … + n = n(n + 1)/2.", "3. Solve n(n + 1)/2 ≥ 120, i.e. n(n + 1) ≥ 240.", "4. 15 × 16 = 240 exactly, so the job is finished on day 15."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-2.shtml"}, {"id": "2017-S1-Q03", "year": 2017, "slot": 1, "q_no": 3, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – maximising count under a limit", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A lift can carry at most 630 kg. A group of people is in it; the heaviest person weighs 57 kg and the lightest weighs 53 kg. What is the largest possible number of people in the group?", "options": [], "answer": "11", "answer_note": "", "concept": "To maximise the headcount under a weight cap, make everyone other than the heaviest as light as allowed.", "formulas": ["Total = 57 + 53(k − 1) ≤ 630"], "solution": ["1. One person weighs 57 kg and at least one weighs 53 kg; everyone else weighs at least 53 kg.", "2. With k people the minimum total is 57 + 53(k − 1).", "3. Require 57 + 53(k − 1) ≤ 630, so 53(k − 1) ≤ 573, giving k − 1 ≤ 10.81.", "4. So k − 1 = 10 and k = 11 (total 587 kg, within the limit)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-3.shtml"}, {"id": "2017-S1-Q04", "year": 2017, "slot": 1, "q_no": 4, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed–time – late/early arrival", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A man walks from his home to the railway station. Walking at 12 km/h he reaches 10 minutes after his train has left; walking at 15 km/h he reaches 10 minutes before it leaves. What is the distance (in km) from his home to the station?", "options": [], "answer": "20", "answer_note": "", "concept": "The gap between the two arrival times equals the difference in travel times at the two speeds.", "formulas": ["d/s₁ − d/s₂ = time difference", "d = s₁s₂ × Δt / (s₂ − s₁)"], "solution": ["1. The two arrivals differ by 10 + 10 = 20 minutes = 1/3 hour.", "2. So d/12 − d/15 = 1/3.", "3. d(5 − 4)/60 = 1/3, giving d = 20 km."], "shortcut": "d = (12 × 15 / 3) × (1/3) = 60 × 1/3 = 20.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-4.shtml"}, {"id": "2017-S1-Q05", "year": 2017, "slot": 1, "q_no": 5, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – allocation of savings", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Ravi puts 50% of his monthly savings into fixed deposits. Of the remaining savings, 30% goes into stocks and the rest is placed in his savings bank account. If the combined amount he deposits in the bank (fixed deposits plus savings account) is Rs 59500, what are his total monthly savings in rupees?", "options": [], "answer": "70000", "answer_note": "", "concept": "Express each portion as a fraction of total savings and match the bank portion to the given amount.", "formulas": ["Savings account share = 0.7 × 0.5 = 0.35 of S"], "solution": ["1. Let total savings be S. Fixed deposits = 0.5S.", "2. Remainder 0.5S: stocks get 0.3 × 0.5S = 0.15S, savings account gets 0.35S.", "3. Bank total = 0.5S + 0.35S = 0.85S = 59500.", "4. S = 59500 / 0.85 = 70000."], "shortcut": "Only the stock portion (15%) is outside the bank, so 59500 is 85% of savings.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-5.shtml"}, {"id": "2017-S1-Q06", "year": 2017, "slot": 1, "q_no": 6, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Discount and profit on marked price", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A seller who gives a 15% discount on the retail price still earns a 2% profit. Which of the following will give her a 20% profit?", "options": ["Give a discount of 5% on retail price", "Give a discount of 2% on retail price", "Increase the retail price by 2%", "Sell at retail price"], "answer": "Sell at retail price", "answer_note": "", "concept": "Link the cost price and retail price through the given discount–profit pair, then check which selling price gives 20% profit.", "formulas": ["SP = R(1 − discount) = CP(1 + profit)"], "solution": ["1. Let cost price = 100. Then 0.85R = 102, so R = 120.", "2. A 20% profit needs SP = 120.", "3. That is exactly the retail price, so no discount should be given."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-6.shtml"}, {"id": "2017-S1-Q07", "year": 2017, "slot": 1, "q_no": 7, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Boats and streams – round trip", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A man goes by motor boat downstream from his home to his office and then comes back upstream. If the river's speed stays the same but he doubles the speed of the boat, his total travel time falls by 75%. What is the ratio of the boat's original speed to the river's speed?", "options": ["√6 : √2", "√7 : 2", "2√5 : 3", "3 : 2"], "answer": "√7 : 2", "answer_note": "", "concept": "Round-trip time in a current is d/(b + s) + d/(b − s); a 75% cut means the new time is one quarter of the old.", "formulas": ["Round-trip time = 2bd/(b² − s²)"], "solution": ["1. Let boat speed be b, river speed s, one-way distance d. Original time T = 2bd/(b² − s²).", "2. With boat speed 2b: T' = 4bd/(4b² − s²).", "3. T' = T/4 gives 4b/(4b² − s²) = b/[2(b² − s²)].", "4. Cross-multiply: 8(b² − s²) = 4b² − s², so 4b² = 7s².", "5. b/s = √7/2, i.e. √7 : 2."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-7.shtml"}, {"id": "2017-S1-Q08", "year": 2017, "slot": 1, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratios – combining linked ratios", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "C1, C2, C3, C4 and C5 are five companies. Profits of C1, C2 and C3 are in the ratio 9 : 10 : 8, and profits of C2, C4 and C5 are in the ratio 18 : 19 : 20. If C5 earned Rs 19 crore more than C1, what is the combined profit of all five companies?", "options": ["438 crore", "435 crore", "348 crore", "345 crore"], "answer": "438 crore", "answer_note": "", "concept": "Make the common term (C2) equal in both ratios to merge them into one chain.", "formulas": ["Scale ratios so the common term matches (LCM of 10 and 18 = 90)"], "solution": ["1. Make C2 = 180 in both: C1 : C2 : C3 = 162 : 180 : 144 and C2 : C4 : C5 = 180 : 190 : 200.", "2. C5 − C1 = 200 − 162 = 38 parts = 19 crore, so 1 part = 0.5 crore.", "3. Total parts = 162 + 180 + 144 + 190 + 200 = 876.", "4. Total profit = 876 × 0.5 = 438 crore."], "shortcut": "Total = 876k with 38k = 19, so total = 876/2 = 438.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-8.shtml"}, {"id": "2017-S1-Q09", "year": 2017, "slot": 1, "q_no": 9, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – weighted admission rate", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Twice as many girls as boys take an admission test. 30% of the girls and 45% of the boys are admitted. What percentage of all candidates are NOT admitted?", "options": ["35", "50", "60", "65"], "answer": "65", "answer_note": "", "concept": "The overall admission rate is a weighted average of the two rates, weighted by group sizes.", "formulas": ["Weighted average = Σ(weight × rate) / Σ weights"], "solution": ["1. Let there be 100 boys and 200 girls (300 candidates).", "2. Admitted: 30% of 200 = 60 girls and 45% of 100 = 45 boys, total 105.", "3. Not admitted = 300 − 105 = 195.", "4. Percentage = 195/300 = 65%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-9.shtml"}, {"id": "2017-S1-Q10", "year": 2017, "slot": 1, "q_no": 10, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratios – equal totals", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A stall stocks popcorn and chips in three packet sizes: large, super and jumbo. For popcorn the counts of large, super and jumbo packets are in the ratio 7 : 17 : 16; for chips the ratio is 6 : 15 : 14. If the stall has equal total numbers of popcorn packets and chips packets, what is the ratio of jumbo popcorn packets to jumbo chips packets?", "options": ["1 : 1", "8 : 7", "4 : 3", "6 : 5"], "answer": "1 : 1", "answer_note": "", "concept": "Scale both ratios so their totals are equal, then compare the required parts.", "formulas": ["Popcorn total 40k, chips total 35m; set 40k = 35m"], "solution": ["1. Popcorn: 7k, 17k, 16k with total 40k. Chips: 6m, 15m, 14m with total 35m.", "2. Equal totals: 40k = 35m, so m = 8k/7.", "3. Jumbo popcorn = 16k; jumbo chips = 14m = 14 × 8k/7 = 16k.", "4. Ratio = 16k : 16k = 1 : 1."], "shortcut": "Jumbo is 16/40 = 2/5 of popcorn and 14/35 = 2/5 of chips, so with equal totals they are equal.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-10.shtml"}, {"id": "2017-S1-Q11", "year": 2017, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit on a mixed purchase", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a market, medium-quality mangoes cost half as much as good mangoes. A shopkeeper buys 80 kg of good mangoes and 40 kg of medium ones, and sells all 120 kg at a single price that is 10% below the price he paid for the good mangoes. What is his overall profit percentage?", "options": ["6%", "8%", "10%", "12%"], "answer": "8%", "answer_note": "", "concept": "Compute total cost and total revenue on a convenient price base.", "formulas": ["Profit % = (SP − CP)/CP × 100"], "solution": ["1. Let good mangoes cost Rs 10/kg, so medium cost Rs 5/kg.", "2. Cost = 80 × 10 + 40 × 5 = 1000.", "3. Selling price = 0.9 × 10 = Rs 9/kg; revenue = 120 × 9 = 1080.", "4. Profit = 80 on 1000, i.e. 8%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-11.shtml"}, {"id": "2017-S1-Q12", "year": 2017, "slot": 1, "q_no": 12, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Discount – same profit on fewer items", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Selling 60 identical toys at a 40% discount on the printed price would give Fatima a 20% profit. Then 10 of the toys are lost in a fire. What discount on the printed price must she offer on the remaining toys to earn the same profit (in rupees) on the whole lot?", "options": ["30%", "25%", "24%", "28%"], "answer": "28%", "answer_note": "", "concept": "The same total profit on the same total cost needs the same total revenue, now earned from fewer toys.", "formulas": ["Total revenue must stay unchanged", "Discount % = 1 − SP/MP"], "solution": ["1. Let printed price = 1. Planned revenue = 60 × 0.6 = 36.", "2. The cost of all 60 toys is already spent, so the same profit needs the same revenue of 36.", "3. 50 toys must bring in 36, so each sells at 36/50 = 0.72.", "4. Discount = 1 − 0.72 = 28%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-12.shtml"}, {"id": "2017-S1-Q13", "year": 2017, "slot": 1, "q_no": 13, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Equations from ratios of squares", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "a and b are integers with opposite signs such that (a + 3)² : b² = 9 : 1 and (a − 1)² : (b − 1)² = 4 : 1. Find a² : b².", "options": ["9 : 4", "81 : 4", "1 : 4", "25 : 4"], "answer": "25 : 4", "answer_note": "", "concept": "Take square roots of each ratio with both signs and use integrality and the opposite-sign condition to choose the case.", "formulas": ["p² = k²q² ⇒ p = ±kq"], "solution": ["1. From the first ratio, a + 3 = ±3b; from the second, a − 1 = ±2(b − 1).", "2. Try a + 3 = −3b with a − 1 = 2(b − 1): a = −3b − 3 and a = 2b − 1, so −5b = 2, which is not an integer.", "3. Try a + 3 = −3b with a − 1 = −2(b − 1): −3b − 3 = −2b + 3, so b = −6 and a = 15 (opposite signs).", "4. The remaining cases (a + 3 = 3b) give either b = −1, a = −6 (same sign) or non-integers.", "5. So a = 15, b = −6 and a² : b² = 225 : 36 = 25 : 4."], "shortcut": "Check: (18)² : 36 = 9 : 1 and 14² : (−7)² = 4 : 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-13.shtml"}, {"id": "2017-S1-Q14", "year": 2017, "slot": 1, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – change in group averages", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A class has 20 boys and 30 girls. In the mid-semester exam the girls' average score was 5 more than the boys' average. In the final exam the girls' average went down by 3 points while the average of the whole class went up by 2 points. By how much did the boys' average go up?", "options": ["9.5", "10", "4.5", "6"], "answer": "9.5", "answer_note": "", "concept": "The change in the class total equals the sum of the changes in the two group totals.", "formulas": ["Change in total = n₁ × change₁ + n₂ × change₂"], "solution": ["1. Let the boys' average rise by y.", "2. Change in class total = 50 × 2 = 100.", "3. Change from girls = 30 × (−3) = −90; change from boys = 20y.", "4. 20y − 90 = 100, so y = 9.5."], "shortcut": "The 5-point gap between girls and boys is irrelevant to the answer.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-14.shtml"}, {"id": "2017-S1-Q15", "year": 2017, "slot": 1, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – area of |x| + |y| = k", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "What is the area of the closed region bounded by |x| + |y| = 2 in the xy-plane?", "options": ["4π", "4", "8", "2π"], "answer": "8", "answer_note": "", "concept": "|x| + |y| = k is a square (rhombus) with vertices on the axes at distance k from the origin.", "formulas": ["Area of |x| + |y| = k is 2k²", "Area of a rhombus = d₁d₂/2"], "solution": ["1. The curve meets the axes at (±2, 0) and (0, ±2), joined by straight segments.", "2. This is a square with both diagonals of length 4.", "3. Area = 4 × 4 / 2 = 8."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-15.shtml"}, {"id": "2017-S1-Q16", "year": 2017, "slot": 1, "q_no": 16, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – centroid and Heron's formula", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Triangle ABC has sides 40 ft, 25 ft and 35 ft. The triangle GBC, where G is the centroid of ABC, is removed. What is the area (in sq ft) of the part of ABC that remains?", "options": ["225√3", "500/√3", "275/√3", "250/√3"], "answer": "500/√3", "answer_note": "", "concept": "The centroid splits a triangle into three triangles of equal area, so removing one leaves two-thirds.", "formulas": ["Heron: Area = √[s(s − a)(s − b)(s − c)]", "Area(GBC) = Area(GCA) = Area(GAB) = Area(ABC)/3"], "solution": ["1. s = (40 + 25 + 35)/2 = 50.", "2. Area = √(50 × 10 × 25 × 15) = √187500 = 250√3.", "3. Area of GBC = 250√3/3, so the remaining part is (2/3) × 250√3 = 500√3/3.", "4. 500√3/3 = 500/√3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-16.shtml"}, {"id": "2017-S1-Q17", "year": 2017, "slot": 1, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – area between two arcs", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "ABC is an isosceles right triangle with hypotenuse BC and AB = 6 cm. A semicircle BQC is drawn on BC as diameter, on the side away from A. An arc BPC of a circle centred at A (radius AB) runs between BC and the semicircle. Find the area, in sq cm, of the region between arc BPC and arc BQC.", "options": ["9π − 18", "18", "9π", "9"], "answer": "18", "answer_note": "", "concept": "Region = semicircle minus the circular segment cut off by chord BC from the circle centred at A.", "formulas": ["Segment = sector − triangle", "Semicircle area = πr²/2"], "solution": ["1. BC = 6√2, so the semicircle has radius 3√2 and area π(18)/2 = 9π.", "2. The arc BPC belongs to a circle of radius 6 with central angle 90° at A; sector area = π(36)/4 = 9π.", "3. Segment between chord BC and arc BPC = 9π − area(ABC) = 9π − 18.", "4. Required area = 9π − (9π − 18) = 18."], "shortcut": "This is the 'lune of Hippocrates': the lune's area equals the triangle's area, 6 × 6/2 = 18.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-17.shtml"}, {"id": "2017-S1-Q18", "year": 2017, "slot": 1, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – recasting cubes", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A solid metal cube is melted down and recast into five solid cubes whose volumes are in the ratio 1 : 1 : 8 : 27 : 27. By roughly what percentage does the combined surface area of the five cubes exceed the surface area of the original cube?", "options": ["10", "50", "60", "20"], "answer": "50", "answer_note": "", "concept": "Volume is conserved on melting; side lengths follow from cube roots of the volume ratio.", "formulas": ["Volume = a³", "Surface area = 6a²"], "solution": ["1. Small cube sides are in ratio 1 : 1 : 2 : 3 : 3.", "2. Total volume = 1 + 1 + 8 + 27 + 27 = 64, so the original side is 4.", "3. Original surface area ∝ 4² = 16; new total ∝ 1 + 1 + 4 + 9 + 9 = 24.", "4. Increase = (24 − 16)/16 = 50%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-18.shtml"}, {"id": "2017-S1-Q19", "year": 2017, "slot": 1, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – sphere resting on a cylinder", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A ball of diameter 4 cm sits on the open top of a hollow cylinder standing upright. The cylinder is 3 cm tall and its volume is 9π cm³. What is the vertical distance, in cm, from the base of the cylinder to the highest point of the ball?", "options": [], "answer": "6", "answer_note": "", "concept": "The ball rests on the circular rim; the rim radius and ball radius fix how far the ball's centre sits above the rim.", "formulas": ["Cylinder volume = πr²h", "Pythagoras: R² = r² + h²"], "solution": ["1. πr² × 3 = 9π gives r² = 3, so the rim radius is √3 cm.", "2. The ball's radius is 2 cm and it touches the rim, which is a circle of radius √3.", "3. Height of the ball's centre above the rim = √(2² − 3) = 1 cm.", "4. Top of ball = 3 (cylinder) + 1 (centre above rim) + 2 (radius) = 6 cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-19.shtml"}, {"id": "2017-S1-Q20", "year": 2017, "slot": 1, "q_no": 20, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Right triangle – altitude to hypotenuse", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In right triangle ABC, BC is the hypotenuse, AB = 15 km and AC = 20 km. Moving at 30 km/h, what is the least time, in minutes, needed to get from A to the hypotenuse?", "options": [], "answer": "24", "answer_note": "", "concept": "The shortest path from a vertex to the opposite side is the perpendicular (altitude).", "formulas": ["Altitude to hypotenuse = (product of legs)/hypotenuse"], "solution": ["1. BC = √(15² + 20²) = 25 km.", "2. Altitude from A = 15 × 20 / 25 = 12 km.", "3. Time = 12/30 h = 0.4 h = 24 minutes."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-20.shtml"}, {"id": "2017-S1-Q21", "year": 2017, "slot": 1, "q_no": 21, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – geometric mean", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "x and y are positive numbers with log₃x = log₁₂y = a. If G is the geometric mean of x and y, what is log₆G?", "options": ["√a", "2a", "a/2", "a"], "answer": "a", "answer_note": "", "concept": "Convert logs to powers, then take the geometric mean.", "formulas": ["logₐx = k ⇔ x = aᵏ", "G = √(xy)"], "solution": ["1. x = 3ᵃ and y = 12ᵃ.", "2. xy = 36ᵃ = 6²ᵃ.", "3. G = √(xy) = 6ᵃ.", "4. log₆G = a."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Pa
