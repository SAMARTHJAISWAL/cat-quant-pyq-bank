nil invests Rs 22000 for 6 years in a scheme paying 4% per annum compounded half-yearly. Sunil invests some amount in the same scheme for 5 years, and then reinvests the whole maturity amount for 1 year at 10% per annum simple interest. If both receive the same amount at the end of 6 years, what was Sunil's initial investment (in Rs)?", "options": ["20480", "20808", "20640", "20860"], "answer": "20808", "answer_note": "", "concept": "Half-yearly compounding at 4% p.a. means 2% per half-year; equate the two final amounts and cancel the common factor.", "formulas": ["A = P(1 + r/2)^(2t) for half-yearly compounding", "SI for 1 year at 10%: multiply by 1.1"], "solution": ["1. Anil's amount = 22000 × (1.02)¹².", "2. Sunil's amount = x × (1.02)¹⁰ × 1.1.", "3. Equate: x = 22000 × (1.02)² / 1.1 = 20000 × 1.0404.", "4. x = Rs 20808."], "shortcut": "22000/1.1 = 20000, and 1.02² = 1.0404 ⇒ 20808.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-15.shtml"}, {"id": "2024-S2-Q16", "year": 2024, "slot": 2, "q_no": 16, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Symmetric functions of roots", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 27.52% correct", "question": "α and β are the roots of 3x² + λx − 1 = 0, and 1/α² + 1/β² = 15. Find (α³ + β³)².", "options": ["9", "16", "4", "1"], "answer": "4", "answer_note": "", "concept": "Express 1/α² + 1/β² and α³ + β³ through the sum and product of roots (Vieta), solve for λ, then evaluate.", "formulas": ["α + β = −b/a, αβ = c/a", "1/α² + 1/β² = ((α + β)² − 2αβ)/(αβ)²", "α³ + β³ = (α + β)³ − 3αβ(α + β)"], "solution": ["1. α + β = −λ/3, αβ = −1/3.", "2. 1/α² + 1/β² = (λ²/9 + 2/3)/(1/9) = λ² + 6 = 15 ⇒ λ² = 9.", "3. α³ + β³ = (α + β)³ − 3αβ(α + β) = (α + β)[(α + β)² + 1] = (−λ/3)(λ²/9 + 1).", "4. With λ² = 9: α³ + β³ = (−λ/3)(2) = ∓2.", "5. (α³ + β³)² = 4."], "shortcut": "The squared value is independent of the sign of λ, so take λ = 3: roots of 3x² + 3x − 1, s = −1, p = −1/3 ⇒ s³ − 3ps = −1 − 1 = −2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-16.shtml"}, {"id": "2024-S2-Q17", "year": 2024, "slot": 2, "q_no": 17, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed – scheduled time", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.15% correct", "question": "A bus leaves at 9 am every day on a fixed route. One day it runs at a constant 60 km/h for the whole route and reaches 3.5 hours after its scheduled arrival time. Another day it covers two-thirds of the route in one-third of the scheduled travel time, and then covers the remaining one-third at 40 km/h, arriving exactly on schedule. What is the scheduled arrival time?", "options": ["10:30 pm", "7:00 pm", "7:30 pm", "9:00 pm"], "answer": "7:30 pm", "answer_note": "", "concept": "The second day pins down the route length in terms of the scheduled time T; the first day then gives an equation in T.", "formulas": ["Distance = speed × time"], "solution": ["1. Let the scheduled journey time be T hours and route length D km.", "2. Day 2: the last D/3 is covered at 40 km/h in the remaining 2T/3 hours, so D/3 = 40 × 2T/3 ⇒ D = 80T.", "3. Day 1: D/60 = T + 3.5 ⇒ 80T/60 = T + 3.5 ⇒ T/3 = 3.5 ⇒ T = 10.5 hours.", "4. Scheduled arrival = 9 am + 10.5 h = 7:30 pm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-17.shtml"}, {"id": "2024-S2-Q18", "year": 2024, "slot": 2, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – tangent circles", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 2.33% correct", "question": "Three circles of equal radius touch each other externally. Two other circles X and Y, with X larger than Y, each touch all three of these circles (X enclosing them, Y lying in the gap between them). What is the ratio of the radius of X to the radius of Y?", "options": ["2 + √3 : 1", "4 + √3 : 1", "7 + 4√3 : 1", "4 + 2√3 : 1"], "answer": "7 + 4√3 : 1", "answer_note": "", "concept": "Both X and Y are centred at the centroid of the equilateral triangle formed by the three centres; their radii are the circumradius ± r.", "formulas": ["Circumradius of equilateral triangle of side a = a/√3", "(2 + √3)(2 − √3) = 1"], "solution": ["1. Let each equal circle have radius r; their centres form an equilateral triangle of side 2r.", "2. Distance from the triangle's centre O to each centre = 2r/√3.", "3. Inner circle Y touches externally: radius y = 2r/√3 − r.", "4. Outer circle X touches internally: radius x = 2r/√3 + r.", "5. x/y = (2 + √3)/(2 − √3) = (2 + √3)² = 7 + 4√3.", "6. Ratio = 7 + 4√3 : 1."], "shortcut": "x/y ≈ 2.155/0.155 ≈ 13.9; only 7 + 4√3 ≈ 13.93 fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-18.shtml"}, {"id": "2024-S2-Q19", "year": 2024, "slot": 2, "q_no": 19, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – adding components", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 43.08% correct", "question": "A vessel holds a mixture of acid and water. When 2 litres of water are added, acid makes up 50% of the mixture. When 15 litres of acid are then added, acid makes up 80% of the mixture. Find the ratio of water to acid in the original mixture.", "options": ["5 : 3", "4 : 5", "5 : 4", "3 : 5"], "answer": "3 : 5", "answer_note": "", "concept": "Track the absolute quantities of acid and water through each addition.", "formulas": ["Concentration = component / total"], "solution": ["1. After adding 2 L water, acid = water; call each a litres.", "2. After adding 15 L acid: (a + 15)/(2a + 15) = 0.8 ⇒ a + 15 = 1.6a + 12 ⇒ a = 5.", "3. Original acid = 5 L, original water = 5 − 2 = 3 L.", "4. Water : acid = 3 : 5."], "shortcut": "Water must be less than acid originally (adding water brought them level), so only 4 : 5 or 3 : 5; check 3 : 5 works.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-19.shtml"}, {"id": "2024-S2-Q20", "year": 2024, "slot": 2, "q_no": 20, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Rational inequalities – wavy curve", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 41.31% correct", "question": "Find the set of all real x satisfying 1/(x + 5) ≤ 1/(2x − 3).", "options": ["x < −5 or x > 3/2", "x < −5 or 3/2 < x ≤ 8", "−5 < x < 3/2 or 3/2 < x ≤ 8", "−5 < x < 3/2 or x > 3/2"], "answer": "x < −5 or 3/2 < x ≤ 8", "answer_note": "", "concept": "Bring everything to one side over a common denominator and use sign analysis; never cross-multiply when the sign of the denominators is unknown.", "formulas": ["1/(x + 5) − 1/(2x − 3) = (x − 8)/((x + 5)(2x − 3))"], "solution": ["1. 1/(x + 5) − 1/(2x − 3) ≤ 0 ⇒ (2x − 3 − x − 5)/((x + 5)(2x − 3)) ≤ 0 ⇒ (x − 8)/((x + 5)(2x − 3)) ≤ 0.", "2. Critical points: −5, 3/2 (excluded), 8 (included).", "3. For x > 8 the expression is positive; for 3/2 < x < 8 negative; for −5 < x < 3/2 positive; for x < −5 negative.", "4. Solution: x < −5 or 3/2 < x ≤ 8."], "shortcut": "Test x = 0: 1/5 ≤ −1/3 is false, eliminating options 3 and 4; test x = 10: 1/15 ≤ 1/17 is false, eliminating option 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-20.shtml"}, {"id": "2024-S2-Q21", "year": 2024, "slot": 2, "q_no": 21, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of squares equals zero", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.53% correct", "question": "Real numbers x and y satisfy 4x² + 4y² − 4xy − 6y + 3 = 0. Find 4x + 5y.", "options": [], "answer": "7", "answer_note": "", "concept": "For real numbers, a sum of squares is zero only when each square is zero; complete the squares.", "formulas": ["a² + b² = 0 with a, b real ⇒ a = b = 0"], "solution": ["1. Rewrite: (4x² − 4xy + y²) + (3y² − 6y + 3) = 0.", "2. That is (2x − y)² + 3(y − 1)² = 0.", "3. Hence y = 1 and 2x = y ⇒ x = 1/2.", "4. 4x + 5y = 2 + 5 = 7."], "shortcut": "Treat it as a quadratic in x: discriminant 16y² − 16(4y² − 6y + 3) = −48(y − 1)² ≥ 0 forces y = 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-21.shtml"}, {"id": "2024-S2-Q22", "year": 2024, "slot": 2, "q_no": 22, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Ages – ratio problems", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 29.9% correct", "question": "At the time when Rajesh's age equalled Garima's present age, the ratio of Rajesh's age to Garima's age was 3 : 2. When Garima's age becomes equal to Rajesh's present age, what will be the ratio of Rajesh's age to Garima's age?", "options": ["4 : 3", "2 : 1", "3 : 2", "5 : 4"], "answer": "5 : 4", "answer_note": "", "concept": "The age difference stays constant; express everything using Garima's present age and the difference.", "formulas": ["Age difference is constant over time"], "solution": ["1. Let Garima's present age be G and the age difference be d, so Rajesh is G + d now.", "2. d years ago Rajesh was G and Garima was G − d: G/(G − d) = 3/2 ⇒ G = 3d.", "3. Now Garima = 3d and Rajesh = 4d.", "4. In d years Garima will be 4d and Rajesh 5d.", "5. Ratio = 5 : 4."], "shortcut": "Ratios 3:2 → 4:3 → 5:4 form the chain (d = 1 unit): next ratio is 5 : 4.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-22.shtml"}, {"id": "2024-S3-Q01", "year": 2024, "slot": 3, "q_no": 1, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus – lattice points", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 6% correct", "question": "How many ordered pairs of integers (x, y) satisfy |x + y| + |x − y| = 2?", "options": [], "answer": "8", "answer_note": "", "concept": "|x + y| + |x − y| simplifies to twice the larger of |x| and |y|, so the equation describes the boundary of a square. We count the integer points on that boundary.", "formulas": ["|x + y| + |x − y| = 2·max(|x|, |y|)"], "solution": ["1. Use the identity: |x + y| + |x − y| = 2·max(|x|, |y|).", "2. So the equation becomes max(|x|, |y|) = 1, which is the boundary of the square with corners (±1, ±1).", "3. The integer points with max(|x|, |y|) ≤ 1 make a 3 × 3 grid of 9 points.", "4. Remove the one interior point (0, 0), where the max is 0.", "5. That leaves 9 − 1 = 8 solutions."], "shortcut": "Integer points with max(|x|,|y|) = k number 8k, so k = 1 gives 8.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-1.shtml"}, {"id": "2024-S3-Q02", "year": 2024, "slot": 3, "q_no": 2, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "System of linear equations – consistency", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 25% correct", "question": "p, k and a are real constants. The system px − 4y = 2 and 3x + ky = a, in the unknowns x and y, has no solution. Which of the following must then be true?", "options": ["2a + k ≠ 0", "ap − 6 = 0", "ap + 6 = 0", "kp + 12 ≠ 0"], "answer": "2a + k ≠ 0", "answer_note": "", "concept": "Two linear equations have no common solution exactly when the lines are parallel but not the same line: the coefficient ratios match but the constant ratio does not.", "formulas": ["a₁x + b₁y = c₁ and a₂x + b₂y = c₂ have no solution ⇔ a₁/a₂ = b₁/b₂ ≠ c₁/c₂"], "solution": ["1. No solution requires p/3 = −4/k ≠ 2/a.", "2. From p/3 = −4/k we get pk = −12, so kp + 12 = 0, which rules out option 4.", "3. The inconsistency condition −4/k ≠ 2/a means −4a ≠ 2k, i.e. k ≠ −2a, i.e. 2a + k ≠ 0.", "4. Options 2 and 3 tie a to p, but a can be almost any value as long as k ≠ −2a. For example, p = 3, k = −4, a = 1 gives no solution while ap − 6 = −3 and ap + 6 = 9, so neither has to hold.", "5. So the condition that must hold is 2a + k ≠ 0."], "shortcut": "kp + 12 must equal 0, so option 4 is out at once. Of the rest, only option 1 is the 'not the same line' condition.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-2.shtml"}, {"id": "2024-S3-Q03", "year": 2024, "slot": 3, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Square of a surd", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 47% correct", "question": "a and b are natural numbers with (a + b√3)² = 52 + 30√3. What is a + b?", "options": ["7", "10", "8", "9"], "answer": "8", "answer_note": "", "concept": "Expand the square and compare the rational parts and the √3 parts separately.", "formulas": ["(a + b√3)² = a² + 3b² + 2ab√3"], "solution": ["1. Expanding gives a² + 3b² + 2ab√3 = 52 + 30√3.", "2. Comparing parts: a² + 3b² = 52 and ab = 15.", "3. With natural numbers, ab = 15 allows (1,15), (3,5), (5,3) and (15,1).", "4. Only a = 5, b = 3 works: 25 + 27 = 52.", "5. So a + b = 8."], "shortcut": "Try the factor pairs of 15 in a² + 3b² = 52; (5, 3) works right away.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-3.shtml"}, {"id": "2024-S3-Q04", "year": 2024, "slot": 3, "q_no": 4, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – segment area", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 24% correct", "question": "A chord of length 10√3 m divides a circular plot into two parts. The chord subtends 120° at the centre. What is the area, in sq m, of the smaller part?", "options": ["25(4π/3 + √3)", "20(4π/3 − √3)", "25(4π/3 − √3)", "20(4π/3 + √3)"], "answer": "25(4π/3 − √3)", "answer_note": "", "concept": "The smaller region is a minor segment, whose area is the sector area minus the area of the triangle formed by the chord and the centre.", "formulas": ["Chord = 2r·sin(θ/2)", "Segment area = (θ/360)·πr² − (1/2)r²·sin θ"], "solution": ["1. Chord = 2r·sin 60° = r√3 = 10√3, so r = 10 m.", "2. Area of the 120° sector = (1/3)·π·100 = 100π/3.", "3. Triangle with two radii and the chord: (1/2)·10·10·sin 120° = 25√3.", "4. Segment = 100π/3 − 25√3 = 25(4π/3 − √3)."], "shortcut": "The smaller region has to be sector minus triangle, so the answer has a minus sign. Factoring out 25 (because r² = 100) picks option 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-4.shtml"}, {"id": "2024-S3-Q05", "year": 2024, "slot": 3, "q_no": 5, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Two-set overlap with variable group sizes", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 11% correct", "question": "A group has 250 students, and girls make up at least 44% and at most 60% of it. The rest are boys. Every student chooses swimming, running or both. 50% of the boys and 80% of the girls choose swimming. 70% of the boys and 60% of the girls choose running. What are the minimum and maximum possible numbers of students who choose both?", "options": ["72 and 80, respectively", "75 and 90, respectively", "72 and 88, respectively", "75 and 96, respectively"], "answer": "72 and 80, respectively", "answer_note": "", "concept": "Each student picks at least one activity, so the number choosing both equals swimmers + runners − total. Write this as a function of the number of girls, then use the allowed range and the requirement that all counts are whole numbers.", "formulas": ["n(S ∩ R) = n(S) + n(R) − n(S ∪ R)", "n(S ∪ R) = total (everyone picks at least one)"], "solution": ["1. Let g be the number of girls and b = 250 − g the number of boys. Here 110 ≤ g ≤ 150.", "2. Swimmers = 0.5b + 0.8g and runners = 0.7b + 0.6g.", "3. Both = 1.2b + 1.4g − 250 = 1.2(250 − g) + 1.4g − 250 = 50 + 0.2g.", "4. For whole-number counts, g must be a multiple of 5 and b a multiple of 10. Both g = 110 and g = 150 qualify.", "5. Minimum = 50 + 22 = 72 (g = 110). Maximum = 50 + 30 = 80 (g = 150)."], "shortcut": "Both = 50 + 0.2g increases with g, so just plug in g = 110 and g = 150.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-5.shtml"}, {"id": "2024-S3-Q06", "year": 2024, "slot": 3, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Remainders – Fermat / cyclicity", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 42% correct", "question": "What is the remainder when 10⁶⁸ is divided by 13?", "options": ["8", "9", "4", "5"], "answer": "9", "answer_note": "", "concept": "Find a small power of 10 that leaves remainder ±1 when divided by 13, then reduce the exponent.", "formulas": ["10³ = 1000 ≡ −1 (mod 13)", "10⁶ ≡ 1 (mod 13)"], "solution": ["1. 1001 = 7 × 11 × 13, so 1000 ≡ −1 (mod 13), i.e. 10³ ≡ −1.", "2. So 10⁶ ≡ 1 (mod 13).", "3. 68 = 6 × 11 + 2, so 10⁶⁸ ≡ 10² = 100 (mod 13).", "4. 100 = 7 × 13 + 9, so the remainder is 9."], "shortcut": "1001 is divisible by 13, so powers of 10 repeat every 6 steps mod 13.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-6.shtml"}, {"id": "2024-S3-Q07", "year": 2024, "slot": 3, "q_no": 7, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – medians and midpoint triangle", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 18% correct", "question": "In triangle ABC, M, N and P are the midpoints of AB, BC and CA respectively. The median from A meets MP at X, the median from B meets MN at Y, and the median from C meets NP at Z. If the area of triangle ABC is 1440 sq cm, what is the area of triangle XYZ in sq cm?", "options": [], "answer": "90", "answer_note": "", "concept": "Each median cuts the midline it crosses at that midline's midpoint. So XYZ is the medial triangle of the medial triangle MNP.", "formulas": ["Area of medial triangle = (1/4) × area of original triangle", "Midline is parallel to the third side, and the median bisects it"], "solution": ["1. MP is parallel to BC, and the median AN bisects BC, so AN also bisects MP. So X is the midpoint of MP.", "2. In the same way, Y is the midpoint of MN and Z is the midpoint of NP.", "3. So MNP is the medial triangle of ABC, and XYZ is the medial triangle of MNP.", "4. Area(MNP) = 1440/4 = 360.", "5. Area(XYZ) = 360/4 = 90 sq cm."], "shortcut": "Two medial steps, so 1440 ÷ 16 = 90.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-7.shtml"}, {"id": "2024-S3-Q08", "year": 2024, "slot": 3, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Successive percentage change", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 59% correct", "question": "Gopal's salary went up by two successive percentage increments, and afterwards it was 187.5% of what it was at the start. The second increment, in percent, was twice the first. What was the first increment in percent?", "options": ["27.5", "30", "25", "20"], "answer": "25", "answer_note": "", "concept": "Successive percentage increases multiply. Set up the product of the two growth factors and solve.", "formulas": ["Final = Initial × (1 + r₁)(1 + r₂)"], "solution": ["1. Let the first increment be r, so the second is 2r.", "2. (1 + r)(1 + 2r) = 1.875 = 15/8.", "3. Expanding: 2r² + 3r + 1 = 15/8, so 16r² + 24r − 7 = 0.", "4. This factors as (4r − 1)(4r + 7) = 0, giving r = 1/4.", "5. The first increment is 25%."], "shortcut": "Test the options: 25% then 50% gives 1.25 × 1.5 = 1.875.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-8.shtml"}, {"id": "2024-S3-Q09", "year": 2024, "slot": 3, "q_no": 9, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work – rotating pairs", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 55% correct", "question": "Sam can finish a job alone in 20 days. Mohit works twice as fast as Sam and three times as fast as Ayna. They work in a repeating 3-day cycle: Sam with Mohit on day 1, Sam with Ayna on day 2, and Mohit with Ayna on day 3. The cycle continues until the job is done. What fraction of the total work does Sam do?", "options": ["3/20", "3/10", "1/20", "1/5"], "answer": "3/10", "answer_note": "", "concept": "Turn the speeds into units of work per day and find how much one 3-day cycle completes. If the job ends exactly at the end of a cycle, each person's share is their share of one cycle.", "formulas": ["Work = rate × time", "Use total work = LCM of individual times"], "solution": ["1. Mohit takes 10 days and Ayna takes 30 days. Take total work = 60 units: Sam 3, Mohit 6, Ayna 2 units/day.", "2. Day 1: 3 + 6 = 9 units. Day 2: 3 + 2 = 5 units. Day 3: 6 + 2 = 8 units. One cycle = 22 units.", "3. That doesn't divide 60 evenly. After 2 cycles (6 days), 44 units are done. Day 7 (S+M) brings it to 53, day 8 (S+A) to 58, and day 9 (M+A) needs only 2 of its 8 units.", "4. Sam works on days 1, 2, 4, 5, 7, 8, which is 6 full days: 6 × 3 = 18 units.", "5. Sam's share = 18/60 = 3/10."], "shortcut": "Sam works 2 of every 3 days. The job takes just over 8 days and the last partial day is not Sam's, so Sam works 6 days: 6/20 = 3/10.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-9.shtml"}, {"id": "2024-S3-Q10", "year": 2024, "slot": 3, "q_no": 10, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – removal and replacement", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 9% correct", "question": "A 300-litre container is partly filled with water and then topped up with milk. Then an amount of the mixture equal to twice the volume of water first poured in is taken out, and the container is refilled to the brim with water. Milk is now 72% of the mixture. How many litres of water were poured in at first?", "options": [], "answer": "30", "answer_note": "", "concept": "Taking out part of a uniform mixture removes milk in proportion. Track the milk left and set it equal to 72% of 300 litres.", "formulas": ["Milk left = initial milk × (1 − removed/total)"], "solution": ["1. Let the initial water be w litres, so milk = 300 − w.", "2. 2w litres of mixture are removed, so the milk left is (300 − w)(1 − 2w/300).", "3. After refilling, milk = 0.72 × 300 = 216 litres.", "4. (300 − w)(300 − 2w) = 64800, which gives w² − 450w + 12600 = 0, so (w − 30)(w − 420) = 0.", "5. w = 420 is more than 300, so it is impossible. So w = 30 litres."], "shortcut": "Check w = 30: milk 270, remove 60 L (1/5 of the mixture), milk left 216 = 72%.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-10.shtml"}, {"id": "2024-S3-Q11", "year": 2024, "slot": 3, "q_no": 11, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – ratio of amounts", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 34% correct", "question": "Aman invests Rs 4000 at an annual rate compounded yearly. The ratio of the amount after 3 years to the amount after 5 years is 25 : 36. What is the least number of whole years after which the amount is more than Rs 20000?", "options": [], "answer": "9", "answer_note": "", "concept": "The ratio of amounts two years apart gives the square of the yearly growth factor, which gives the rate. Then find the smallest exponent that pushes the amount past 5 times the principal.", "formulas": ["A = P(1 + r)ⁿ", "A₃/A₅ = 1/(1 + r)²"], "solution": ["1. (1 + r)² = 36/25, so 1 + r = 6/5 (a 20% rate).", "2. We need 4000 × 1.2ⁿ > 20000, i.e. 1.2ⁿ > 5.", "3. 1.2² = 1.44, 1.2⁴ = 2.0736, 1.2⁸ ≈ 4.30, 1.2⁹ ≈ 5.16.", "4. So the least n is 9."], "shortcut": "1.2⁴ ≈ 2.07 means 1.2⁸ ≈ 4.3 < 5, so one more year is needed: 9.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-11.shtml"}, {"id": "2024-S3-Q12", "year": 2024, "slot": 3, "q_no": 12, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Marked price, discount and profit", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 59% correct", "question": "Gopi sets the marked price of an item so that he would make a 20% profit. Ravi gets a 10% discount on this marked price and saves Rs 15 as a result. How much profit, in Rs, does Gopi make on the sale to Ravi?", "options": ["25", "10", "15", "20"], "answer": "10", "answer_note": "", "concept": "The discount gives the marked price, the 20% markup gives the cost price, and profit is the selling price minus the cost.", "formulas": ["Discount = d% × MP", "MP = 1.2 × CP (20% profit at MP)", "Profit = SP − CP"], "solution": ["1. 10% of MP = 15, so MP = Rs 150.", "2. Selling at MP gives a 20% profit, so CP = 150/1.2 = Rs 125.", "3. Ravi pays SP = 150 − 15 = Rs 135.", "4. Profit = 135 − 125 = Rs 10."], "shortcut": "SP/CP = 1.2 × 0.9 = 1.08, so profit = 8% of 125 = 10.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-12.shtml"}, {"id": "2024-S3-Q13", "year": 2024, "slot": 3, "q_no": 13, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – adjusting extremes", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 17% correct", "question": "Three different real numbers have an average of 28. The smallest is increased by 7 and the largest is decreased by 10, and the order of the three numbers does not change. The new average is 2 more than the middle number, and the new difference between the largest and smallest is 64. What was the largest of the original numbers?", "options": [], "answer": "70", "answer_note": "", "concept": "Write three linear equations, one for the sum, one for the new mean versus the middle number, and one for the new range, and solve them together.", "formulas": ["Sum = average × count"], "solution": ["1. Let the numbers be a < b < c with a + b + c = 84.", "2. The new numbers are a + 7, b, c − 10, with sum 84 − 3 = 81, so the new mean is 27.", "3. New mean = b + 2, so b = 25 and a + c = 59.", "4. New range: (c − 10) − (a + 7) = 64, so c − a = 81.", "5. Solving: c = 70 and a = −11. Check: −4 < 25 < 60, so the order holds. The largest original number is 70."], "shortcut": "The new mean is 27 right away, so b = 25, a + c = 59 and c − a = 81, which gives c = 70.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-13.shtml"}, {"id": "2024-S3-Q14", "year": 2024, "slot": 3, "q_no": 14, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting numbers with distinct digits", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 11% correct", "question": "How many positive integers from 1 to 500 have no digit repeated?", "options": [], "answer": "378", "answer_note": "", "concept": "Count by number of digits. For 3-digit numbers, limit the hundreds digit to 1–4 (500 itself repeats 0).", "formulas": ["Arrangements of distinct digits = product of available choices per place"], "solution": ["1. 1-digit numbers: 9.", "2. 2-digit numbers: 9 choices for the tens digit (1–9) × 9 for the units digit (any digit except the tens digit) = 81.", "3. 3-digit numbers from 100 to 499: 4 choices for the hundreds digit × 9 for tens × 8 for units = 288.", "4. 500 has repeated zeros, so it is not counted.", "5. Total = 9 + 81 + 288 = 378."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-14.shtml"}, {"id": "2024-S3-Q15", "year": 2024, "slot": 3, "q_no": 15, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed changes and time saved", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 44% correct", "question": "A train covers a fixed distance at a constant speed. If it went 6 km/h faster, the trip would take 4 hours less. If it went 6 km/h slower, the trip would take 6 hours more. What is the distance in km?", "options": ["780", "720", "640", "800"], "answer": "720", "answer_note": "", "concept": "Write the change in time for each change in speed as a function of distance and speed, then divide the two equations to remove the distance.", "formulas": ["Time = Distance/Speed", "D/v − D/(v + x) = Dx/(v(v + x))"], "solution": ["1. Let the distance be D and the speed v.", "2. D/v − D/(v + 6) = 4 gives 6D = 4v(v + 6).", "3. D/(v − 6) − D/v = 6 gives 6D = 6v(v − 6).", "4. Equating: 4(v + 6) = 6(v − 6), so v = 30 km/h.", "5. D = 4 × 30 × 36/6 = 720 km."], "shortcut": "Check option 2: 720/30 = 24 h, 720/36 = 20 h (4 less), 720/24 = 30 h (6 more).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-15.shtml"}, {"id": "2024-S3-Q16", "year": 2024, "slot": 3, "q_no": 16, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Chain of logarithms", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 36% correct", "question": "3ᵃ = 4, 4ᵇ = 5, 5ᶜ = 6, 6ᵈ = 7, 7ᵉ = 8 and 8ᶠ = 9. Find the value of abcdef.", "options": [], "answer": "2", "answer_note": "", "concept": "Each exponent is a logarithm. Their product telescopes by the chain rule for logarithms.", "formulas": ["a = log₃4 etc.", "log_p q × log_q r = log_p r"], "solution": ["1. a = log₃4, b = log₄5, c = log₅6, d = log₆7, e = log₇8, f = log₈9.", "2. Write each one as a ratio of natural logs: a = ln4/ln3, b = ln5/ln4, and so on.", "3. In the product everything cancels except ln9/ln3.", "4. abcdef = log₃9 = 2."], "shortcut": "Directly: 3^(abcdef) = ((3ᵃ)ᵇ…)ᶠ = 9, so abcdef = 2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-16.shtml"}, {"id": "2024-S3-Q17", "year": 2024, "slot": 3, "q_no": 17, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recursive sequence – sum of reciprocals", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8% correct", "question": "A sequence has t₁ = 1, t₂ = −1, and tₙ = ((n − 3)/(n − 1))·tₙ₋₂ for n ≥ 3. Find 1/t₂ + 1/t₄ + 1/t₆ + … + 1/t₂₀₂₂ + 1/t₂₀₂₄.", "options": ["−1023132", "−1022121", "−1024144", "−1026169"], "answer": "−1024144", "answer_note": "", "concept": "The even-indexed terms follow a telescoping product, which gives a simple closed form. The reciprocals then form an arithmetic progression of odd numbers.", "formulas": ["Telescoping product", "1 + 3 + 5 + … + (2m − 1) = m²"], "solution": ["1. For even n = 2m: t₂ₘ = ((2m − 3)/(2m − 1))·t₂ₘ₋₂.", "2. Multiplying from m = 2 to m gives t₂ₘ = t₂ × (1/3)(3/5)…((2m − 3)/(2m − 1)) = −1/(2m − 1).", "3. So 1/t₂ₘ = −(2m − 1), which is −1, −3, −5, …", "4. t₂₀₂₄ corresponds to m = 1012, so the sum is −(1 + 3 + … + 2023) = −1012².", "5. 1012² = 1024144, so the sum is −1024144."], "shortcut": "The answer has to be minus a perfect square of the number of terms (1012); only −1024144 = −1012² fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-17.shtml"}, {"id": "2024-S3-Q18", "year": 2024, "slot": 3, "q_no": 18, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus with max/min", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 14% correct", "question": "How many different real values of x satisfy max{x, 2} − min{x, 2} = |x + 2| − |x − 2|?", "options": [], "answer": "2", "answer_note": "", "concept": "max{x, 2} − min{x, 2} is just |x − 2|. Solve the resulting modulus equation by splitting x into ranges.", "formulas": ["max{p, q} − min{p, q} = |p − q|"], "solution": ["1. The left side equals |x − 2|, so the equation is 2|x − 2| = |x + 2|.", "2. x ≥ 2: 2(x − 2) = x + 2 gives x = 6, which is valid.", "3. −2 ≤ x < 2: 2(2 − x) = x + 2 gives x = 2/3, which is valid.", "4. x < −2: 2(2 − x) = −(x + 2) gives x = 6, which is not in this range, so it is rejected.", "5. There are 2 solutions: x = 6 and x = 2/3."], "shortcut": "Square both sides: 4(x − 2)² = (x + 2)², i.e. 3x² − 20x + 12 = 0. This has two real roots, 6 and 2/3, and squaring here adds no false roots.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-18.shtml"}, {"id": "2024-S3-Q19", "year": 2024, "slot": 3, "q_no": 19, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – combining parts", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 51% correct", "question": "Rajesh has 20 hectares and Vimal has 30 hectares of farmland, all planted with either wheat or mustard. On Vimal's land, wheat : mustard = 5 : 3. On the two farms combined, wheat : mustard = 11 : 9. What is wheat : mustard on Rajesh's land?", "options": ["1 : 1", "7 : 9", "4 : 3", "3 : 7"], "answer": "7 : 9", "answer_note": "", "concept": "Turn each ratio into actual areas and subtract Vimal's part from the combined total.", "formulas": ["Part = (ratio share) × total"], "solution": ["1. Combined 50 ha in 11 : 9 gives wheat 27.5 ha and mustard 22.5 ha.", "2. Vimal's 30 ha in 5 : 3 gives wheat 18.75 ha and mustard 11.25 ha.", "3. Rajesh: wheat = 27.5 − 18.75 = 8.75 ha, mustard = 22.5 − 11.25 = 11.25 ha.", "4. Ratio = 8.75 : 11.25 = 7 : 9."], "shortcut": "Combined wheat is 55% and Vimal's is 62.5%, so Rajesh's wheat share must be below 55%. Of the options, 7 : 9 (43.75%) or 3 : 7 (30%) could fit. Checking 7 : 9: (20 × 7/16 + 30 × 5/8)/50 = 0.55, which is correct.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-19.shtml"}, {"id": "2024-S3-Q20", "year": 2024, "slot": 3, "q_no": 20, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equations with f(1/x)", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 9% correct", "question": "For every non-zero real x, f(x) + 2f(1/x) = 3x. What is the sum of all values of x for which f(x) = 3?", "options": ["2", "−3", "−2", "3"], "answer": "−3", "answer_note": "", "concept": "Replace x by 1/x to get a second equation, solve the pair for f(x), then set f(x) = 3 and use the sum of roots.", "formulas": ["Substitute x → 1/x", "Sum of roots of ax² + bx + c = 0 is −b/a"], "solution": ["1. The given equation is f(x) + 2f(1/x) = 3x. Replacing x with 1/x gives f(1/x) + 2f(x) = 3/x.", "2. Double the second equation and subtract the first: 3f(x) = 6/x − 3x, so f(x) = 2/x − x.", "3. Setting f(x) = 3: 2/x − x = 3, so x² + 3x − 2 = 0.", "4. The discriminant is 9 + 8 = 17 > 0, so there are two real non-zero roots.", "5. Their sum = −3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-20.shtml"}, {"id": "2024-S3-Q21", "year": 2024, "slot": 3, "q_no": 21, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular polygons – octagon diagonals", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 12% correct", "question": "ABCDEFGH is a regular octagon with each side 6 cm. What is the area, in sq cm, of the square ACEG?", "options": ["36(1+√2)", "72(1+√2)", "36(2+√2)", "72(2+√2)"], "answer": "36(2+√2)", "answer_note": "", "concept": "AC skips one vertex. It is the third side of a triangle with two octagon sides and the 135° interior angle between them, and the cosine rule gives its length.", "formulas": ["Interior angle of regular octagon = 135°", "Cosine rule: c² = a² + b² − 2ab·cos C"], "solution": ["1. In triangle ABC, AB = BC = 6 and angle B = 135°.", "2. AC² = 36 + 36 − 2·36·cos 135° = 72 + 36√2.", "3. ACEG is a square with side AC, so its area = AC² = 72 + 36√2.", "4. = 36(2 + √2) sq cm."], "shortcut": "Area of the square = AC², so there is no need to take a square root. The octagon's area, 72(1+√2), is option 2 and is a trap.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-21.shtml"}, {"id": "2024-S3-Q22", "year": 2024, "slot": 3, "q_no": 22, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equation via substitution", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 7% correct", "question": "Find the sum of all distinct real x satisfying 10ˣ + 4/10ˣ = 17/2.", "options": ["2log₁₀2", "3log₁₀2", "4log₁₀2", "log₁₀2"], "answer": "2log₁₀2", "answer_note": "", "concept": "Substitute y = 10ˣ to get a quadratic. The product of its roots gives the product of the 10ˣ values, whose log is the sum of the x values.", "formulas": ["y = 10ˣ > 0", "Product of roots = c/a", "log(pq) = log p + log q"], "solution": ["1. Let y = 10ˣ. Then y + 4/y = 17/2, so 2y² − 17y + 8 = 0.", "2. (2y − 1)(y − 8) = 0, so y = 1/2 or y = 8. Both are positive, so both are valid.", "3. x₁ + x₂ = log₁₀(1/2) + log₁₀8 = log₁₀4.", "4. = 2log₁₀2."], "shortcut": "The product of the roots in y is 8/2 = 4, so the sum of the x values is log₁₀4 = 2log₁₀2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-3-Quant/quants-question-22.shtml"}, {"id": "2025-S1-Q01", "year": 2025, "slot": 1, "q_no": 1, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Two equations, three unknowns – target expression", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 34.1% correct", "question": "Real numbers a, b, c satisfy a − 6b + 6c = 4 and 6a + 3b − 3c = 50. What is 2a + 3b − 3c?", "options": ["18", "20", "15", "14"], "answer": "18", "answer_note": "", "concept": "There are fewer equations than unknowns, but b and c appear only as the combination (b − c), so treat it as one variable.", "formulas": ["Substitute t = b − c and solve the resulting 2×2 system"], "solution": ["1. Let t = b − c. The equations become a − 6t = 4 and 6a + 3t = 50.", "2. Multiply the second by 2: 12a + 6t = 100. Add it to the first: 13a = 104, so a = 8.", "3. Then 6t = a − 4 = 4, so t = 2/3.", "4. 2a + 3b − 3c = 2a + 3t = 16 + 2 = 18."], "shortcut": "Add the first equation to twice the second to eliminate t directly: 13a = 104.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-1.shtml"}, {"id": "2025-S1-Q02", "year": 2025, "slot": 1, "q_no": 2, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Multiplication principle with selections", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 9.12% correct", "question": "A canteen offers 5 kinds of sandwich. Each sandwich can be made on any one of 4 breads and in one of 2 sizes (small or large). The customer may also add sauces, choosing at most 2 different sauces from 6 available (choosing none is allowed). How many different sandwich orders are possible?", "options": ["880", "600", "800", "840"], "answer": "880", "answer_note": "", "concept": "Independent choices multiply. The sauce choice is a selection of 0, 1 or 2 items from 6.", "formulas": ["Total = product of independent choices", "Selections of at most r from n = C(n,0) + C(n,1) + … + C(n,r)"], "solution": ["1. Sandwich kind × bread × size = 5 × 4 × 2 = 40 ways.", "2. Sauces: none, one or two of 6, giving C(6,0) + C(6,1) + C(6,2) = 1 + 6 + 15 = 22 ways.", "3. Total orders = 40 × 22 = 880."], "shortcut": "The answer must be a multiple of 40 × 22, and only 880 is.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-2.shtml"}, {"id": "2025-S1-Q03", "year": 2025, "slot": 1, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log with base less than 1 – inequality", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 15.45% correct", "question": "How many integers n satisfy log base (1/4) of (n² − 7n + 11) > 0?", "options": ["infinite", "0", "2", "1"], "answer": "0", "answer_note": "", "concept": "When the base is between 0 and 1, log of x is positive exactly when 0 < x < 1. So the quadratic must lie strictly between 0 and 1.", "formulas": ["For 0 < b < 1: log_b(x) > 0 ⇔ 0 < x < 1", "An integer-valued expression cannot lie strictly between two consecutive integers"], "solution": ["1. Since 1/4 < 1, the condition becomes 0 < n² − 7n + 11 < 1.", "2. For integer n, n² − 7n + 11 is an integer.", "3. No integer lies strictly between 0 and 1.", "4. So no integer n works, and the count is 0."], "shortcut": "Integer input gives integer output, and no integer fits in (0, 1). No algebra is needed.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-3.shtml"}, {"id": "2025-S1-Q04", "year": 2025, "slot": 1, "q_no": 4, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Sum of odd numbers – balancing point", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.85% correct", "question": "Consider the odd numbers 1, 3, 5, …, 57. A number k in this list is such that the sum of all list numbers smaller than k equals the sum of all list numbers larger than k. Find k.", "options": ["41", "39", "37", "43"], "answer": "41", "answer_note": "", "concept": "The sum of the first n odd numbers is n². Write both sides in terms of k's position and set them equal.", "formulas": ["1 + 3 + … + (2n − 1) = n²"], "solution": ["1. The list has 29 terms, and the total is 29² = 841.", "2. If k is the (n+1)-th odd number, the sum below k is n² and k = 2n + 1.", "3. Sum above k = 841 − n² − (2n + 1). Set it equal to n²: 2n² + 2n + 1 = 841, so n² + n = 420.", "4. So n = 20, and k = 2(20) + 1 = 41.", "5. Check: below 41 the sum is 400. Above 41, 43 + … + 57 is 8 terms with sum 8 × 50 = 400."], "shortcut": "(Total − k) must be even and split as n² + n². Test the options: 841 − 41 = 800 = 2 × 400 = 2 × 20², and 41 is the 21st odd number.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-4.shtml"}, {"id": "2025-S1-Q05", "year": 2025, "slot": 1, "q_no": 5, "area": "Number System", "topic": "Number System", "subtopic": "Digit constraints & number of factors", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 13.88% correct", "question": "N is a three-digit number with three different non-zero digits. None of its digits is a perfect square, and exactly one of its digits is a prime. For the smallest such N, how many positive factors does N have?", "options": [], "answer": "6", "answer_note": "", "concept": "First narrow down the allowed digits, then build the smallest number. Count its factors from its prime factorisation.", "formulas": ["If N = p^a × q^b …, number of factors = (a+1)(b+1)…"], "solution": ["1. The non-zero perfect-square digits are 1, 4 and 9. Remove them, leaving {2, 3, 5, 6, 7, 8}.", "2. The primes here are 2, 3, 5 and 7. The non-primes are only 6 and 8.", "3. Exactly one digit is prime, so the other two must be 6 and 8. The digits are {p, 6, 8}.", "4. The smallest choice is p = 2, arranged in increasing order: N = 268.", "5. 268 = 2² × 67, so it has (2+1)(1+1) = 6 factors."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-5.shtml"}, {"id": "2025-S1-Q06", "year": 2025, "slot": 1, "q_no": 6, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "SI to find rate, then half-yearly CI", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 17.01% correct", "question": "At a fixed simple interest rate of R% per year, a sum grows to Rs 13920 in 3 years and to Rs 18960 in 6½ years. If the same sum is instead invested for 2 years at R% per year compounded half-yearly, the compound interest earned (in Rs) is closest to", "options": ["3096", "3150", "3180", "3221"], "answer": "3221", "answer_note": "", "concept": "The difference between two SI amounts gives the yearly interest. That gives the principal and the rate, which then feed into the CI formula with half-yearly periods.", "formulas": ["SI per year = (A₂ − A₁)/(t₂ − t₁)", "CI = P[(1 + R/200)^(2t) − 1] for half-yearly compounding"], "solution": ["1. Interest for 3.5 years = 18960 − 13920 = 5040, so the yearly interest is 1440.", "2. Principal = 13920 − 3 × 1440 = 9600, and R = 1440/9600 × 100 = 15%.", "3. Half-yearly: the rate is 7.5% per period, over 4 periods.", "4. Amount = 9600 × (1.075)⁴ ≈ 9600 × 1.335469 ≈ 12820.50.", "5. CI ≈ 12820.50 − 9600 ≈ 3220.50, so the closest option is 3221."], "shortcut": "CI must exceed SI (2 × 1440 = 2880) by a fair margin with 4 compounding periods. Effective rate ≈ 4 × 7.5% plus compounding ≈ 33.5%, and 0.335 × 9600 ≈ 3221.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-6.shtml"}, {"id": "2025-S1-Q07", "year": 2025, "slot": 1, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Integer roots via Vieta", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 13.5% correct", "question": "For how many non-negative integers k does the equation x² − 5x + k = 0 have only integer roots?", "options": [], "answer": "3", "answer_note": "", "concept": "Integer roots p and q must satisfy p + q = 5 and pq = k. Requiring k ≥ 0 limits the roots to 0..5.", "formulas": ["Sum of roots = −b/a, product of roots = c/a"], "solution": ["1. Let the roots be p and q with p + q = 5, so k = p(5 − p).", "2. k ≥ 0 requires 0 ≤ p ≤ 5.", "3. The unordered pairs are (0,5), (1,4), (2,3), giving k = 0, 4, 6.", "4. There are 3 distinct values of k."], "shortcut": "Remember k = 0 (roots 0 and 5). It is the most commonly missed case.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-7.shtml"}, {"id": "2025-S1-Q08", "year": 2025, "slot": 1, "q_no": 8, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Min of one quadratic vs max of another", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 13.13% correct", "question": "Let f(x) = x² − 4cx + 8c and g(x) = −x² + 3cx − 2c. For which of these values of c is the minimum value of f greater than the maximum value of g?", "options": ["2", "−1/2", "−2", "1/2"], "answer": "1/2", "answer_note": "", "concept": "An upward parabola has its minimum at its vertex, and a downward one has its maximum at its vertex. Compare the two vertex values to get an inequality in c.", "formulas": ["Vertex of ax² + bx + c is at x = −b/(2a), with extreme value c − b²/(4a)"], "solution": ["1. f is minimised at x = 2c: f_min = 4c² − 8c² + 8c = 8c − 4c².", "2. g is maximised at x = 3c/2: g_max = −9c²/4 + 9c²/2 − 2c = 9c²/4 − 2c.", "3. Require 8c − 4c² > 9c²/4 − 2c, which gives 25c²/4 − 10c < 0, i.e. c(5c − 8) < 0.", "4. So 0 < c < 8/5. Of the options, only c = 1/2 lies in this range."], "shortcut": "Negative c gives c(5c − 8) > 0, which rules out −1/2 and −2. c = 2 > 1.6 is also out.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-8.shtml"}, {"id": "2025-S1-Q09", "year": 2025, "slot": 1, "q_no": 9, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Successive replacement in mixtures", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 30.76% correct", "question": "A tank holds 200 litres of an acid–water solution that is 30% acid by volume. First, 20% of the solution is taken out and replaced with water. Then 10% of the new solution is taken out and replaced with pure acid. Finally, 15% of that solution is taken out and replaced with water. The acid percentage in the final solution is closest to", "options": ["23", "25", "29", "27"], "answer": "27", "answer_note": "", "concept": "Removing a fraction of a uniform solution removes that same fraction of the acid. Track the acid volume step by step. The total stays at 200 L.", "formulas": ["Acid left after removing fraction f = acid × (1 − f)"], "solution": ["1. Initial acid = 30% of 200 = 60 L.", "2. Step 1 (remove 20%, add water): acid = 60 × 0.8 = 48 L.", "3. Step 2 (remove 10%, add 20 L acid): acid = 48 × 0.9 + 20 = 63.2 L.", "4. Step 3 (remove 15%, add water): acid = 63.2 × 0.85 = 53.72 L.", "5. Percentage = 53.72/200 = 26.86%, which is closest to 27."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-9.shtml"}, {"id": "2025-S1-Q10", "year": 2025, "slot": 1, "q_no": 10, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speeds and times in AP", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.65% correct", "question": "Shruti covers 224 km in 3 hours, in four legs. The speeds on the four legs form an arithmetic progression, and so do the times taken. On the first leg she travels at 960 metres per minute for 30 minutes. How many metres does she cover on the fourth leg?", "options": ["96000", "112000", "76800", "86400"], "answer": "86400", "answer_note": "", "concept": "Use the sum of the time AP to find its common difference. Then the total distance (the sum of speed × time) gives the speed AP's common difference.", "formulas": ["Sum of n-term AP = n/2 × (2a + (n−1)d)", "Distance = speed × time"], "solution": ["1. Total time is 180 min: 4 × 30 + 6d = 180, so d = 10. The times are 30, 40, 50, 60 min.", "2. Let the speeds be 960, 960 + e, 960 + 2e, 960 + 3e m/min.", "3. Distance: 960 × 180 + e(40 + 2 × 50 + 3 × 60) = 224000, i.e. 172800 + 320e = 224000, so e = 160.", "4. Speed on leg 4 = 960 + 480 = 1440 m/min.", "5. Fourth-leg distance = 1440 × 60 = 86400 m."], "shortcut": "The fourth leg takes 60 min, so the answer must be a multiple of 60. Only 86400 (1440 × 60) and 96000 (1600 × 60) qualify, and 1600 overshoots the total.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-10.shtml"}, {"id": "2025-S1-Q11", "year": 2025, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio change after transfer and additions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 27.75% correct", "question": "A school runs morning and afternoon shifts with students in the ratio 13 : 9. After 21 students move from the morning shift to the afternoon shift, the ratio becomes 19 : 14. Then some new students join, divided between morning and afternoon in the ratio 3 : 8, after which the morning : afternoon ratio is 5 : 4. How many new students joined?", "options": ["110", "88", "121", "99"], "answer": "99", "answer_note": "", "concept": "Set up the ratios with multipliers. The transfer gives the first multiplier, and the final ratio gives the size of the new intake.", "formulas": ["a/b = m/n ⇔ na = mb"], "solution": ["1. Let the shifts be 13k and 9k. Then 14(13k − 21) = 19(9k + 21), so 182k − 294 = 171k + 399, giving 11k = 693 and k = 63.", "2. After the transfer: morning = 819 − 21 = 798, afternoon = 567 + 21 = 588.", "3. New students 3p and 8p: 4(798 + 3p) = 5(588 + 8p), so 3192 + 12p = 2940 + 40p, giving p = 9.", "4. New students = 11p = 99."], "shortcut": "The new intake is 11p, so the answer is a multiple of 11. That does not help here (all options are), so solve directly.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-11.shtml"}, {"id": "2025-S1-Q12", "year": 2025, "slot": 1, "q_no": 12, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Parallel chords – trapezium area", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 3.33% correct", "question": "A circle has centre C and radius 6√2 cm. PQ and SR are parallel chords on opposite sides of a diameter. ∠PQC = 45°, and the distances of PQ and SR from C are in the ratio 3 : 2. Find the area (in sq. cm) of quadrilateral PQRS.", "options": ["4(3+√14)", "20(3√2+√7)", "20(3+√14)", "4(3√2+√7)"], "answer": "20(3+√14)", "answer_note": "", "concept": "Triangle CPQ is isosceles with base angle 45°, so it is right-angled at C. That fixes PQ and its distance from C. PQRS is a trapezium whose height is the sum of the two distances.", "formulas": ["Half-chord = √(r² − d²)", "Trapezium area = ½ × (sum of parallel sides) × height"], "solution": ["1. CP = CQ = 6√2 and ∠PQC = 45°, so ∠PCQ = 90°. Then PQ = 6√2 × √2 = 12.", "2. Distance of PQ from C = half of PQ (the median to the hypotenuse) = 6 cm.", "3. With ratio 3 : 2, SR's distance is 4 cm. Half of SR = √(72 − 16) = √56 = 2√14, so SR = 4√14.", "4. The chords are on opposite sides of C, so the height = 6 + 4 = 10.", "5. Area = ½ × (12 + 4√14) × 10 = 60 + 20√14 = 20(3 + √14)."], "shortcut": "The height is 10, so the area is 5 × (12 + 4√14) = 20(3 + √14). Options 1 and 4 have the wrong factor 4.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-12.shtml"}, {"id": "2025-S1-Q13", "year": 2025, "slot": 1, "q_no": 13, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – parallelogram diagonal", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.69% correct", "question": "PQRS is a parallelogram with P = (−3, −2), Q = (1, −5) and R = (9, 1). The diagonal SQ, extended if needed, meets the x-axis at (a, 0). Find a.", "options": ["13/4", "29/9", "10/3", "27/7"], "answer": "29/9", "answer_note": "", "concept": "The diagonals of a parallelogram bisect each other, so S = P + R − Q. Then find where line QS crosses y = 0.", "formulas": ["Fourth vertex: S = P + R − Q", "Line through two points: y − y₁ = m(x − x₁)"], "solution": ["1. S = (−3 + 9 − 1, −2 + 1 + 5) = (5, 4).", "2. Slope of QS = (4 − (−5))/(5 − 1) = 9/4.", "3. Line: y + 5 = (9/4)(x − 1).", "4. Put y = 0: x − 1 = 20/9, so a = 29/9."], "shortcut": "You can also run the line through Q and the midpoint of PR, (3, −1/2). It is the same diagonal.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-13.shtml"}, {"id": "2025-S1-Q14", "year": 2025, "slot": 1, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages with integer constraints – minimisation", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 5.94% correct", "question": "A class has more than 10 boys, plus some girls. Then 40% of the girls and 60% of the boys leave. Among those who stay, the girls outnumber the boys by 8. What is the smallest possible number of students in the class at the start?", "options": [], "answer": "55", "answer_note": "", "concept": "40% and 60% of a group must be whole numbers, so both groups are multiples of 5. Then use the 'difference of 8' condition and the boys > 10 bound to minimise the total.", "formulas": ["x% of N is an integer ⇒ N is a multiple of 100/gcd(x,100)"], "solution": ["1. Let boys = 5b and girls = 5g. Remaining boys = 2b, remaining girls = 3g.", "2. Condition: 3g = 2b + 8, so g must be even and b = (3g − 8)/2.", "3. Boys > 10 means 5b > 10, so b ≥ 3.", "4. g = 4 gives b = 2 (too small). g = 6 gives b = 5, which is valid.", "5. The minimum total is 5 × 5 + 5 × 6 = 25 + 30 = 55."], "shortcut": "A common trap is picking 15 or 20 boys. 15 or 20 boys leave 6 or 8, needing 14 or 16 girls to remain, and those are not 60% of any integer.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-14.shtml"}, {"id": "2025-S1-Q15", "year": 2025, "slot": 1, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rhombus – diagonals from side and area", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.59% correct", "question": "A rhombus has side 36 cm and area 396 sq. cm. Find the absolute difference (in cm) between the lengths of its diagonals.", "options": [], "answer": "60", "answer_note": "", "concept": "The half-diagonals and a side form a right triangle, and the area is half the product of the diagonals. Together they give (d₁ − d₂)².", "formulas": ["Area = ½ d₁d₂", "(d₁/2)² + (d₂/2)² = side²", "(d₁ − d₂)² = d₁² + d₂² − 2d₁d₂"], "solution": ["1. d₁d₂ = 2 × 396 = 792.", "2. d₁² + d₂² = 4 × 36² = 5184.", "3. (d₁ − d₂)² = 5184 − 2 × 792 = 3600.", "4. |d₁ − d₂| = 60 cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-15.shtml"}, {"id": "2025-S1-Q16", "year": 2025, "slot": 1, "q_no": 16, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Discount, free item and profit", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 19.65% correct", "question": "A shopkeeper sells chairs at 22% off the marked price. One customer receives 13 chairs but pays the discounted price of only 12. The shopkeeper still makes a 26% profit on this sale. Each chair costs him Rs 100. What is the marked price of one chair, in rupees?", "options": [], "answer": "175", "answer_note": "", "concept": "Revenue (12 chairs at the discounted price) must equal 1.26 × the cost of the 13 chairs handed over.", "formulas": ["SP = MP × (1 − discount)", "SP = CP × (1 + profit%)"], "solution": ["1. Cost of 13 chairs = 1300, so the required revenue = 1300 × 1.26 = 1638.", "2. Revenue = 12 × 0.78 × MP = 9.36 MP.", "3. MP = 1638/9.36 = 175."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-16.shtml"}, {"id": "2025-S1-Q17", "year": 2025, "slot": 1, "q_no": 17, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Counting integer solutions of inequalities", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 16.73% correct", "question": "How many pairs of integers (x, y) satisfy x > y ≥ 3 and x + y < 14?", "options": [], "answer": "16", "answer_note": "", "concept": "Fix y and count the integers x with y < x ≤ 13 − y.", "formulas": ["For fixed y: number of x = (13 − y) − y = 13 − 2y, when positive"], "solution": ["1. For fixed y, x runs over y + 1, …, 13 − y, giving 13 − 2y values (when positive).", "2. y = 3: 7 values; y = 4: 5; y = 5: 3; y = 6: 1.", "3. y ≥ 7 gives none.", "4. Total = 7 + 5 + 3 + 1 = 16."], "shortcut": "The counts are odd numbers 7, 5, 3, 1, which sum to 4² = 16.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-17.shtml"}, {"id": "2025-S1-Q18", "year": 2025, "slot": 1, "q_no": 18, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – cost minimisation", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 13.83% correct", "question": "Working alone, Arun, Varun and Tarun can finish a job in 24, 21 and 15 days. Their daily wages are Rs 2160, Rs 2400 and Rs 2160, and a full day's wage is paid even for part of a day. On each day, any of them may or may not be employed. The job must be finished within 10 days. What is the minimum total wage bill (in Rs)?", "options": ["34400", "38880", "47040", "38400"], "answer": "38400", "answer_note": "", "concept": "Compare cost per unit of work. Use the cheapest worker as much as the deadline allows, then fill the rest with the next cheapest. Days come in whole units.", "formulas": ["Take total work = LCM of times; rate = work/days", "Cost per unit = daily wage ÷ daily rate"], "solution": ["1. Work = 840 units. Daily rates: Arun 35, Varun 40, Tarun 56.", "2. Cost per unit: Arun 2160/35 ≈ 61.7, Varun 2400/40 = 60, Tarun 2160/56 ≈ 38.6. So Tarun is cheapest, then Varun.", "3. Tarun can work at most 10 days: 560 units for Rs 21600.", "4. The remaining 280 units by Varun take exactly 7 days: Rs 16800.", "5. Total = 21600 + 16800 = Rs 38400 (a brute force over all day-counts confirms this is minimal)."], "shortcut": "Using Tarun alone needs 15 days, which is too many. The 'fill with Varun' leftover of 280 = 7 × 40 divides exactly, so no part-day is wasted.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-18.shtml"}, {"id": "2025-S1-Q19", "year": 2025, "slot": 1, "q_no": 19, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Comparing powers – sum of squares vs AP sum", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.54% correct", "question": "For each natural number k, let aₖ = 3ᵏ. Find the smallest natural number m such that (a₁)¹ × (a₂)² × … × (a₂₀)²⁰ < a₂₁ × a₂₂ × … × a₍₂₀₊ₘ₎.", "options": ["59", "56", "58", "57"], "answer": "58", "answer_note": "", "concept": "Both sides are powers of 3. Compare the exponents: a sum of squares on the left and an arithmetic series on the right.", "formulas": ["1² + 2² + … + n² = n(n+1)(2n+1)/6", "Sum of AP = (number of terms)/2 × (first + last)"], "solution": ["1. (aₖ)ᵏ = 3^(k²), so the LHS = 3^(1² + … + 20²) = 3^(20 × 21 × 41/6) = 3^2870.", "2. RHS = 3^(21 + 22 + … + (20 + m)) = 3^(m(m + 41)/2).", "3. We need m(m + 41)/2 > 2870, i.e. m(m + 41) > 5740.", "4. m = 57: 57 × 98 = 5586 (fails). m = 58: 58 × 99 = 5742 (works).", "5. The smallest m is 58."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-19.shtml"}, {"id": "2025-S1-Q20", "year": 2025, "slot": 1, "q_no": 20, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Single-variable linear equation – portfolio", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "2IIM: 58.58% correct", "question": "Shares of stocks A, B and C cost Rs 120, Rs 90 and Rs 150 each. A trader holds 10 shares of A and a combined 20 shares of B and C. Her total holding is worth Rs 3300. How many shares of B does she own?", "options": [], "answer": "15", "answer_note": "", "concept": "Use the fixed combined count of B and C to reduce the problem to one unknown.", "formulas": ["Total value = Σ (shares × price)"], "solution": ["1. Value of A = 10 × 120 = 1200, so B and C together are worth 2100.", "2. Let B = m, so C = 20 − m: 90m + 150(20 − m) = 2100.", "3. 3000 − 60m = 2100, so m = 15."], "shortcut": "If all 20 were C, the value would be 3000. Each switch from C to B saves 60, and we need to save 900, so 15 switches.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-20.shtml"}, {"id": "2025-S1-Q21", "year": 2025, "slot": 1, "q_no": 21, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Investment split – weighted returns", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.49% correct", "question": "Kamala invests Rs 1,00,000 in total across stocks, bonds and gold. The amount in bonds is 25% of the amount in gold. In one year, stocks return 10%, bonds 6% and gold 8%, and her total gain is Rs 8200. How much did she gain (in Rs) from bonds?", "options": [], "answer": "900", "answer_note": "", "concept": "Express all three amounts in terms of the bond amount, then set the total return equal to 8200.", "formulas": ["Gain = Σ (amount × rate)"], "solution": ["1. Let bonds = x. Then gold = 4x and stocks = 100000 − 5x.", "2. Gain: 0.10(100000 − 5x) + 0.06x + 0.32x = 8200.", "3. 10000 − 0.5x + 0.38x = 8200, so 0.12x = 1800, giving x = 15000.", "4. Gain from bonds = 6% of 15000 = 900."], "shortcut": "Alligation view: bonds and gold together (in ratio 1 : 4) earn (6 + 32)/5 = 7.6%. The overall 8.2% sits between 7.6% and 10%, giving stocks : (bonds + gold) = 0.6 : 1.8 = 1 : 3. So bonds + gold = 75000 and bonds = 15000.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-21.shtml"}, {"id": "2025-S1-Q22", "year": 2025, "slot": 1, "q_no": 22, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Greatest integer function – solution set", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.23% correct", "question": "Let [x] denote the greatest integer less than or equal to x. Let S be the set of all x with 3 ≤ x ≤ 6 such that [x²] = [x]². Which of the following could be a subset of S?", "options": ["(4, √18) ∪ [5, √27) ∪ {6}", "[3, √10] ∪ [4, √17] ∪ {6}", "[3, √10] ∪ [5, √26]", "(3, √10) ∪ [5, √26) ∪ {6}"], "answer": "(3, √10) ∪ [5, √26) ∪ {6}", "answer_note": "", "concept": "If [x] = n, the condition says x² does not reach the next integer above n², so x lies in [n, √(n² + 1)).", "formulas": ["[x] = n ⇔ n ≤ x < n + 1", "[y] = n² ⇔ n² ≤ y < n² + 1"], "solution": ["1. Let n = [x], with n ∈ {3, 4, 5, 6}. The condition is n² ≤ x² < n² + 1, i.e. n ≤ x < √(n² + 1).", "2. So S = [3, √10) ∪ [4, √17) ∪ [5, √26) ∪ {6} (at x = 6, both sides equal 36).", "3. Option 1 contains points of (√17, √18), which are outside S, and it also goes beyond √26.", "4. Options 2 and 3 include the endpoint √10, where [x²] = 10 ≠ 9.", "5. Option 4 has every piece inside S, so it is a valid subset."], "shortcut": "Look only at the endpoints. Any closed bracket at √(n² + 1) puts x² exactly at an integer that is too big, so options 2 and 3 fail at once.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2025-Question-Paper-Slot-1-Quant/quants-question-22.shtml"}, {"id": "2025-S2-Q01", "year": 2025, "slot": 2, "q_no": 1, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equations reducible to quadratics", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.3% correct", "question": "Find the product of all real values of x that satisfy 9^(x²+2x−3) − 4·3^(x²+2x−2) + 27 = 0.", "options": ["30", "20", "5", "15"], "answer": "20", "answer_note": "", "concept": "Substituting a single power of 3 turns the exponential equation into a quadratic; each root then gives a quadratic in x, and Vieta's product rule finishes it.", "formulas": ["9^k = (3^k)²", "3^(k+1) = 3·3^k", "Product of roots of ax²+bx+c=0 is c/a"], "solution": ["1. Put t = 3^(x²+2x−3). Then 9^(x²+2x−3) = t² and 3^(x²+2x−2) = 3t.", "2. The equation becomes t² − 12t + 27 = 0, i.e. (t − 3)(t − 9) = 0, so t = 3 or t = 9.", "3. t = 3 ⇒ x²+2x−3 = 1 ⇒ x²+2x−4 = 0 (discriminant 20 > 0, two real roots, product −4).", "4. t = 9 ⇒ x²+2x−3 = 2 ⇒ x²+2x−5 = 0 (discriminant 24 > 0, two real roots, product −5).", "5. The four roots are distinct, so the product of all values = (−4)(−5) = 20."], "shortcut": "Check both quadratics have positive discriminant, then just multiply the constant terms.", "source_url": "https://cracku.in/47-if-9x22x-3-43x22x-2270-then-the-product-of-all-pos-x-cat-2025-slot-2"}, {"id": "2025-S2-Q02", "year": 2025, "slot": 2, "q_no": 2, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – running totals", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 35.47% correct", "question": "A shopkeeper tracks daily sales of a newly launched book. The average daily sales for days 1–7 is 60 copies and for days 1–8 is 63 copies. On day 9 she sells 11 copies fewer than on day 8. The average daily sales for days 2–9 is 66 copies. How many copies were sold on day 1?", "options": [], "answer": "49", "answer_note": "", "concept": "Converting averages into totals lets you isolate individual days by subtraction.", "formulas": ["Total = Average × Number of items"], "solution": ["1. Total for days 1–7 = 7 × 60 = 420; total for days 1–8 = 8 × 63 = 504.", "2. Day 8 = 504 − 420 = 84, so day 9 = 84 − 11 = 73.", "3. Total for days 1–9 = 504 + 73 = 577.", "4. Total for days 2–9 = 8 × 66 = 528.", "5. Day 1 = 577 − 528 = 49."], "shortcut": "", "source_url": "https://cracku.in/48-the-average-number-of-copies-of-a-book-sold-per-da-x-cat-2025-slot-2"}, {"id": "2025-S2-Q03", "year": 2025, "slot": 2, "q_no": 3, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus inequalities", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 32.96% correct", "question": "Find the set of all real x for which x² − |x + 9| + x > 0.", "options": ["(−∞, −3) ∪ (3, ∞)", "(−∞, −9) ∪ (3, ∞)", "(−9, −3) ∪ (3, ∞)", "(−∞, −9) ∪ (9, ∞)"], "answer": "(−∞, −3) ∪ (3, ∞)", "answer_note": "", "concept": "Split the modulus at its critical point x = −9 and solve the resulting quadratic inequality in each region.", "formulas": ["|a| = a if a ≥ 0, −a if a < 0", "x² − k² > 0 ⇔ x < −k or x > k"], "solution": ["1. Case x ≥ −9: |x+9| = x+9, so the expression is x² + x − x − 9 = x² − 9 > 0 ⇒ x < −3 or x > 3. Within x ≥ −9: [−9, −3) ∪ (3, ∞).", "2. Case x < −9: |x+9| = −x−9, so the expression is x² + 2x + 9 = (x+1)² + 8 > 0, true for all such x.", "3. So every x < −9 works.", "4. Union: (−∞, −9) ∪ [−9, −3) ∪ (3, ∞) = (−∞, −3) ∪ (3, ∞)."], "shortcut": "Test x = −10: 100 − 1 − 10 = 89 > 0, so −10 must be included; that kills options C and D. Test x = −5: 25 − 4 − 5 = 16 > 0, so B is out too.", "source_url": "https://cracku.in/49-the-set-of-all-real-values-of-x-for-which-x2-mid-x-x-cat-2025-slot-2"}, {"id": "2025-S2-Q04", "year": 2025, "slot": 2, "q_no": 4, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Discount & profit on marked price", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.32% correct", "question": "An item costing Rs 1650 is sold at some discount on a fixed marked price, giving a 20% profit. If the discount rate were doubled, the profit would be only Rs 110. Find, to the nearest integer, the discount rate (in %) at which the profit percentage would equal the discount percentage.", "options": ["16", "18", "14", "12"], "answer": "14", "answer_note": "", "concept": "Two selling-price scenarios on the same marked price fix both the marked price and the discount; then set profit % equal to discount % and solve a linear equation.", "formulas": ["SP = MP × (1 − d)", "Profit % = (SP − CP)/CP × 100"], "solution": ["1. SP at 20% profit = 1.2 × 1650 = 1980, so M(1 − d) = 1980.", "2. With discount 2d, SP = 1650 + 110 = 1760, so M(1 − 2d) = 1760.", "3. Subtracting: Md = 220, hence M = 1980 + 220 = 2200 and d = 10%.", "4. Let the required discount be r: [2200(1 − r) − 1650]/1650 = r ⇒ 550 − 2200r = 1650r ⇒ r = 550/3850 = 1/7.", "5. r ≈ 14.29%, nearest integer 14."], "shortcut": "Plug options: at r = 14%, SP = 1892, profit = 242/1650 ≈ 14.7%, closest match.", "source_url": "https://cracku.in/50-an-item-with-a-cost-price-of-rs-1650-is-sold-at-a--x-cat-2025-slot-2"}, {"id": "2025-S2-Q05", "year": 2025, "slot": 2, "q_no": 5, "area": "Number System", "topic": "Number System", "subtopic": "Integer solutions – factor pairs", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 1.5% correct", "question": "Integers m and n satisfy (m + 2n)(2m + n) = 27. What is the largest possible value of 2m − 3n?", "options": [], "answer": "17", "answer_note": "", "concept": "Treat the two brackets as integer factors of 27; recovering m and n needs their sum to be divisible by 3, which filters the factor pairs.", "formulas": ["If u = m+2n, v = 2m+n then m = (2v − u)/3, n = (2u − v)/3", "u + v = 3(m + n)"], "solution": ["1. Let u = m + 2n and v = 2m + n, so uv = 27 and u + v = 3(m+n) must be a multiple of 3.", "2. Factor pairs of 27: (±1, ±27), (±27, ±1), (±3, ±9), (±9, ±3). Only (3,9), (9,3), (−3,−9), (−9,−3) have sums divisible by 3.", "3. Solve each: (u,v) = (3,9) ⇒ (m,n) = (5,−1); (9,3) ⇒ (−1,5); (−3,−9) ⇒ (−5,1); (−9,−3) ⇒ (1,−5).", "4. 2m − 3n values: 13, −17, −13, 17.", "5. Maximum = 17 at (m, n) = (1, −5)."], "shortcut": "Don't forget the negative factor pairs – the maximum comes from (−9, −3).", "source_url": "https://cracku.in/51-if-m-and-n-are-integers-such-that-m2n2mn27-then-th-x-cat-2025-slot-2"}, {"id": "2025-S2-Q06", "year": 2025, "slot": 2, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Digit sum – powers of 2 and 5", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 5.96% correct", "question": "What is the sum of the digits of (625)^65 × (128)^36?", "options": [], "answer": "25", "answer_note": "", "concept": "Write the bases as powers of 5 and 2, pair them into powers of 10, and only the leftover factor contributes non-zero digits.", "formulas": ["2^k × 5^k = 10^k", "625 = 5⁴, 128 = 2⁷"], "solution": ["1. 625^65 = 5^260 and 128^36 = 2^252.", "2. Product = 2^252 × 5^252 × 5^8 = 10^252 × 5^8.", "3. 5^8 = 390625.", "4. The number is 390625 followed by 252 zeros, so the digit sum is 3+9+0+6+2+5 = 25."], "shortcut": "", "source_url": "https://cracku.in/52-the-sum-of-digits-of-the-number-62565-times-12836--x-cat-2025-slot-2"}, {"id": "2025-S2-Q07", "year": 2025, "slot": 2, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Common root of two quadratics", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.26% correct", "question": "The quadratics 3x² − 5x + p = 0 and 2x² − 2x + q = 0 share exactly one root. Express the sum of their other two roots in terms of p and q.", "options": ["8/3 − p + (3/2)q", "2/3 − p + (3/2)q", "8/3 + p + (1/3)q", "2/3 − 2p + (2/3)q"], "answer": "8/3 − p + (3/2)q", "answer_note": "", "concept": "Eliminating the x² term between the two equations gives the common root linearly in p and q; Vieta's sum of roots then gives the other roots.", "formulas": ["Sum of roots = −b/a", "Common root α: eliminate α² to get α linearly"], "solution": ["1. Let α be the common root. Then 3α² − 5α + p = 0 and 2α² − 2α + q = 0.", "2. Multiply the first by 2 and the second by 3 and subtract: (−10α + 6α) + (2p − 3q) = 0 ⇒ α = (2p − 3q)/4.", "3. Other root of the first = 5/3 − α; other root of the second = 1 − α.", "4. Their sum = 8/3 − 2α = 8/3 − (2p − 3q)/2 = 8/3 − p + (3/2)q."], "shortcut": "Take a concrete common root, e.g. α = 2 ⇒ p = −2, q = −4; other roots are −1/3 and −1, sum −4/3. Only option A gives −4/3.", "source_url": "https://cracku.in/53-the-equations-3x2-5xp0-and-2x2-2xq0-have-one-commo-x-cat-2025-slot-2"}, {"id": "2025-S2-Q08", "year": 2025, "slot": 2, "q_no": 8, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log base conversion + AM–GM", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 19% correct", "question": "Positive reals x, y, z satisfy log₆₄(x²) + log₈(√y) + 3·log₅₁₂(√y·z) = 4. What is the least possible value of x + y + z?", "options": ["48", "36", "24", "96"], "answer": "48", "answer_note": "", "concept": "Convert all logs to base 2 to get a fixed product xyz; with a fixed product, the sum is minimised when the numbers are equal (AM–GM).", "formulas": ["log_(a^k) b = (1/k) log_a b", "AM ≥ GM: (x+y+z)/3 ≥ ∛(xyz)"], "solution": ["1. log₆₄(x²) = (2/6)log₂x = (1/3)log₂x.", "2. log₈(√y) = (1/3)(1/2)log₂y = (1/6)log₂y.", "3. 3·log₅₁₂(√y·z) = 3·(1/9)[(1/2)log₂y + log₂z] = (1/6)log₂y + (1/3)log₂z.", "4. Sum = (1/3)log₂(xyz) = 4 ⇒ xyz = 2^12 = 4096.", "5. By AM–GM, x + y + z ≥ 3∛4096 = 3 × 16 = 48, attained at x = y = z = 16."], "shortcut": "", "source_url": "https://cracku.in/54-if-log64x2log8sqrty3log512sqrtyz4-where-xy-and-z-a-x-cat-2025-slot-2"}, {"id": "2025-S2-Q09", "year": 2025, "slot": 2, "q_no": 9, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Boats & streams", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 6.01% correct", "question": "In still water Rita rows at 5 km/h and Sneha at 6 km/h. The river has a constant current. Sneha takes 48 minutes more to row 14 km upstream than to row 14 km downstream. Rita rows from a point downstream to some spot and comes back to the start, the whole trip taking 100 minutes. What total distance (in km) does Rita row?", "options": [], "answer": "8", "answer_note": "", "concept": "Use Sneha's upstream/downstream time gap to find the current speed, then apply it to Rita's round trip.", "formulas": ["Upstream speed = b − s, downstream speed = b + s", "Time = Distance / Speed"], "solution": ["1. Let current = s km/h. For Sneha: 14/(6 − s) − 14/(6 + s) = 48/60 = 4/5.", "2. ⇒ 14·2s/(36 − s²) = 4/5 ⇒ 140s = 4(36 − s²) ⇒ s² + 35s − 36 = 0 ⇒ s = 1.", "3. Rita: downstream 6 km/h, upstream 4 km/h. With one-way distance d: d/6 + d/4 = 100/60 = 5/3.", "4. ⇒ 5d/12 = 5/3 ⇒ d = 4 km.", "5. Total distance = 2d = 8 km."], "shortcut": "Guess s = 1: 14/5 − 14/7 = 2.8 − 2 = 0.8 h = 48 min. Confirmed instantly.", "source_url": "https://cracku.in/55-rita-and-sneha-can-row-a-boat-at-5-kmh-and-6-kmh-i-x-cat-2025-slot-2"}, {"id": "2025-S2-Q10", "year": 2025, "slot": 2, "q_no": 10, "area": "Number System", "topic": "Number System", "subtopic": "Diophantine – minimisation", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 16.67% correct", "question": "a, b, c are three distinct natural numbers with 3ac = 8(a + b). Find the smallest possible value of 3a + 2b + c.", "options": [], "answer": "12", "answer_note": "", "concept": "Rewrite to express b in terms of a and c, require b to be a positive integer distinct from a and c, and search small values.", "formulas": ["b = 3ac/8 − a, so 8 | 3ac ⇒ 8 | ac"], "solution": ["1. b = (3ac − 8a)/8 = a(3c − 8)/8, which must be a positive integer, so c ≥ 3 and 8 | a(3c − 8).", "2. a = 1: need 8 | (3c − 8) ⇒ c = 8 ⇒ b = 2; sum = 3 + 4 + 8 = 15.", "3. a = 2: need 4 | (3c − 8) ⇒ c = 4 ⇒ b = 2·4/8 = 1; (a,b,c) = (2,1,4) distinct; sum = 6 + 2 + 4 = 12.", "4. a ≥ 3 already gives 3a ≥ 9 and needs c ≥ 3 and b ≥ 1 with stricter divisibility (e.g. a = 4, c = 4 gives b = 2, sum 20); none beat 12.", "5. Minimum = 12."], "shortcut": "", "source_url": "https://cracku.in/56-suppose-abc-are-three-distinct-natural-numbers-suc-x-cat-2025-slot-2"}, {"id": "2025-S2-Q11", "year": 2025, "slot": 2, "q_no": 11, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Domain of composite functions", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.96% correct", "question": "Let f(x) = x/(2x − 1) and g(x) = x/(x − 1), and h(x) = f(g(x)) + g(f(x)). The domain of h is all real numbers except:", "options": ["−1, 1/2 and 1", "1/2, 1 and 3/2", "−1/2, 1/2 and 1", "1/2 and 1"], "answer": "−1, 1/2 and 1", "answer_note": "", "concept": "A composite f(g(x)) needs x in the domain of g AND g(x) in the domain of f; exclude every such failure point.", "formulas": ["Domain of f∘g = {x ∈ Dom g : g(x) ∈ Dom f}"], "solution": ["1. f is undefined at x = 1/2; g is undefined at x = 1.", "2. f(g(x)) fails when x = 1 or when g(x) = 1/2: x/(x − 1) = 1/2 ⇒ 2x = x − 1 ⇒ x = −1.", "3. g(f(x)) fails when x = 1/2 or when f(x) = 1: x/(2x − 1) = 1 ⇒ x = 1.", "4. h needs both parts defined, so exclude {−1, 1/2, 1}."], "shortcut": "Simplifying f(g(x)) = x/(x + 1) shows −1 is excluded immediately, leaving only option A with −1 and both 1/2 and 1.", "source_url": "https://cracku.in/57-let-fxfracx2x-1-and-gxfracxx-1-then-the-domain-of--x-cat-2025-slot-2"}, {"id": "2025-S2-Q12", "year": 2025, "slot": 2, "q_no": 12, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – installments", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 39.72% correct", "question": "A loan of Rs 1000 is cleared with two payments: Rs 530 after one year and Rs 594 after two years. Interest is compounded annually. Find the annual rate of interest (%).", "options": ["10", "11", "9", "8"], "answer": "8", "answer_note": "", "concept": "The loan equals the sum of the present values of the installments at the interest rate.", "formulas": ["Present value of P paid after n years = P/(1 + r)^n"], "solution": ["1. Condition: 1000 = 530/(1 + r) + 594/(1 + r)².", "2. Equivalently, after year 1 th
