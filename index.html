he centre bisects each chord; the longer chord is nearer the centre.", "formulas": ["r² = (half-chord)² + (distance from centre)²"], "solution": ["1. Let the 6 cm chord be d from the centre, so the 4 cm chord is d + 1 away.", "2. r² = 3² + d² = 2² + (d + 1)².", "3. 9 + d² = 5 + 2d + d² ⇒ d = 2.", "4. r² = 9 + 4 = 13 ⇒ r = √13."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-30.shtml"}, {"id": "2018-S1-Q31", "year": 2018, "slot": 1, "q_no": 31, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes & cisterns – fill and drain", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A tank has several filling pipes, all with the same rate, and several draining pipes, all with the same rate. With 6 filling and 5 draining pipes open, an empty tank fills in 6 hours; with 5 filling and 6 draining pipes open, it fills in 60 hours. How many hours will an empty tank take to fill with 2 filling pipes and 1 draining pipe open?", "options": [], "answer": "10", "answer_note": "", "concept": "Set up net-rate equations; adding and subtracting them isolates the individual rates.", "formulas": ["Net rate = Σ filling rates − Σ draining rates"], "solution": ["1. Let a filler add f and a drain remove g of the tank per hour.", "2. 6f − 5g = 1/6 and 5f − 6g = 1/60.", "3. Subtracting: f + g = 9/60; adding: 11(f − g) = 11/60 ⇒ f − g = 1/60.", "4. f = 1/12, g = 1/15; 2f − g = 1/6 − 1/15 = 1/10 ⇒ 10 hours."], "shortcut": "Note 2f − g = (6f − 5g) − 4(f − g) = 1/6 − 4/60 = 1/10.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-31.shtml"}, {"id": "2018-S1-Q32", "year": 2018, "slot": 1, "q_no": 32, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Two-set Venn – range of a region", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a group of 200 students, 105 like pizza and 134 like burger. Which of the following could be the number of students who like only burger?", "options": ["26", "23", "96", "93"], "answer": "93", "answer_note": "", "concept": "The overlap ranges between its minimum (forced by the total) and maximum (the smaller set), which bounds the 'only burger' region.", "formulas": ["n(A ∩ B) ≥ n(A) + n(B) − Total", "n(A ∩ B) ≤ min(n(A), n(B))"], "solution": ["1. Both = x satisfies 105 + 134 − 200 = 39 ≤ x ≤ 105.", "2. Only burger = 134 − x, so 29 ≤ only burger ≤ 95.", "3. Among the options only 93 lies in [29, 95]."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-32.shtml"}, {"id": "2018-S1-Q33", "year": 2018, "slot": 1, "q_no": 33, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Maximum of a min-function", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Let f(x) = min(2x², 52 − 5x) for positive real x. What is the largest value f(x) can take?", "options": [], "answer": "32", "answer_note": "", "concept": "The minimum of an increasing and a decreasing function peaks where the two are equal.", "formulas": ["max of min(g, h) occurs at g = h when g ↑, h ↓"], "solution": ["1. For x > 0, 2x² increases and 52 − 5x decreases.", "2. Set 2x² = 52 − 5x ⇒ 2x² + 5x − 52 = 0 ⇒ (x − 4)(2x + 13) = 0 ⇒ x = 4.", "3. f(4) = 2 × 16 = 32 = 52 − 20.", "4. Hence the maximum value is 32."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-33.shtml"}, {"id": "2018-S1-Q34", "year": 2018, "slot": 1, "q_no": 34, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – maximising a group average", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In an apartment complex, 30 residents are aged 51 or older, and no more than 39 residents are younger than 51. The average age of all the residents is 38 years. What is the greatest possible average age, in years, of the residents younger than 51?", "options": ["25", "26", "27", "28"], "answer": "28", "answer_note": "", "concept": "Make the older group as young as possible (all exactly 51) and choose the size of the younger group that maximises its average.", "formulas": ["Group sum = Total sum − Other group's sum"], "solution": ["1. Let n (≤ 39) people be under 51 with average m. Total sum = 38(30 + n).", "2. Older sum is at least 30 × 51 = 1530, so nm ≤ 38(30 + n) − 1530 = 38n − 390.", "3. m ≤ 38 − 390/n, which grows with n; take n = 39.", "4. m ≤ 38 − 10 = 28."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-34.shtml"}, {"id": "2018-S2-Q01", "year": 2018, "slot": 2, "q_no": 1, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes – inlets of two types", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "An empty tank has inlets of two kinds, A and B; all A-inlets pump at one common rate and all B-inlets at another. With 10 A-inlets and 45 B-inlets open, the tank fills in 30 minutes. With 8 A-inlets and 18 B-inlets open, it fills in 1 hour. How many minutes will it take to fill the empty tank if 7 A-inlets and 27 B-inlets are open?", "options": [], "answer": "48", "answer_note": "", "concept": "Equate the tank capacity from two scenarios to get the ratio of the two inlet rates, then use it for the third scenario.", "formulas": ["Capacity = (combined rate) × time", "Time = Capacity ÷ combined rate"], "solution": ["1. Let the rates be a and b (per minute). Capacity = 30(10a + 45b) = 60(8a + 18b).", "2. 300a + 1350b = 480a + 1080b ⇒ 180a = 270b ⇒ a = 1.5b.", "3. Capacity = 30(15b + 45b) = 1800b.", "4. New rate = 7a + 27b = 10.5b + 27b = 37.5b.", "5. Time = 1800b ÷ 37.5b = 48 minutes."], "shortcut": "", "source_url": "https://cracku.in/67-a-water-tank-has-inlets-of-two-types-a-and-b-all-i-x-cat-2018-slot-2"}, {"id": "2018-S2-Q02", "year": 2018, "slot": 2, "q_no": 2, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Max function – minimum value", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Define f(x) = max(5x, 52 − 2x²) for positive real x. What is the least value f(x) can take?", "options": [], "answer": "20", "answer_note": "", "concept": "The maximum of an increasing and a decreasing function is smallest where the two graphs cross.", "formulas": ["min of max(g, h) occurs at g = h when one rises and the other falls"], "solution": ["1. For x > 0, 5x increases while 52 − 2x² decreases.", "2. So f is smallest where 5x = 52 − 2x², i.e. 2x² + 5x − 52 = 0.", "3. (x − 4)(2x + 13) = 0 ⇒ x = 4 (positive root).", "4. f(4) = 5 × 4 = 20."], "shortcut": "", "source_url": "https://cracku.in/68-let-fx-max5x-52-2x2-where-x-is-any-positive-real-n-x-cat-2018-slot-2"}, {"id": "2018-S2-Q03", "year": 2018, "slot": 2, "q_no": 3, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative speed – meeting points", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "On a straight road, points P, Q and B are 100 km, 200 km and 300 km from A respectively, in that order. Cars 1 and 2 leave A for B at the same moment, and at that same moment car 3 leaves B for A. Each car moves at a constant speed. Car 3 meets car 1 at Q and meets car 2 at P. Find the ratio of car 2's speed to car 1's speed.", "options": ["2 : 7", "2 : 9", "1 : 2", "1 : 4"], "answer": "1 : 4", "answer_note": "", "concept": "When two bodies start together, distances covered up to a meeting are in the ratio of their speeds.", "formulas": ["For equal time, distance ∝ speed"], "solution": ["1. At Q: car 1 has gone 200 km, car 3 has gone 100 km ⇒ v1 : v3 = 2 : 1.", "2. At P: car 2 has gone 100 km, car 3 has gone 200 km ⇒ v2 : v3 = 1 : 2.", "3. Take v3 = 2: then v1 = 4, v2 = 1.", "4. v2 : v1 = 1 : 4."], "shortcut": "", "source_url": "https://cracku.in/69-points-a-p-q-and-b-lie-on-the-same-line-such-that--x-cat-2018-slot-2"}, {"id": "2018-S2-Q04", "year": 2018, "slot": 2, "q_no": 4, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Cubic inequality – factorisation", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the smallest integer n satisfying n³ − 11n² + 32n − 28 > 0.", "options": [], "answer": "8", "answer_note": "", "concept": "Factorise the cubic using a rational root and read off the sign pattern.", "formulas": ["Factor theorem: p(r) = 0 ⇒ (x − r) is a factor"], "solution": ["1. n = 2: 8 − 44 + 64 − 28 = 0, so (n − 2) is a factor.", "2. Dividing: n³ − 11n² + 32n − 28 = (n − 2)(n² − 9n + 14) = (n − 2)²(n − 7).", "3. (n − 2)² ≥ 0, so the product is positive only when n − 7 > 0 (and n ≠ 2).", "4. Smallest integer with n > 7 is 8."], "shortcut": "", "source_url": "https://cracku.in/70-the-smallest-integer-n-such-that-n3-11n232n-28gt0--x-cat-2018-slot-2"}, {"id": "2018-S2-Q05", "year": 2018, "slot": 2, "q_no": 5, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – equal addition", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Amal's and Bimal's marks in an exam are in the ratio 11 : 14. On re-evaluation, each of them gains the same number of marks, and the new marks are in the ratio 47 : 56. What is the ratio of Bimal's new marks to his original marks?", "options": ["4 : 3", "8 : 5", "5 : 4", "3 : 2"], "answer": "4 : 3", "answer_note": "", "concept": "Adding the same amount to both terms of a ratio; set up one linear equation in the common increase.", "formulas": ["(a + k)/(b + k) = new ratio"], "solution": ["1. Let the marks be 11x and 14x, and the increase k.", "2. (11x + k)/(14x + k) = 47/56 ⇒ 616x + 56k = 658x + 47k ⇒ 9k = 42x ⇒ k = 14x/3.", "3. Bimal's new marks = 14x + 14x/3 = 56x/3.", "4. Ratio new : original = (56x/3) : 14x = 4 : 3."], "shortcut": "Option check: 4:3 means Bimal 14x → 56x/3, gain 14x/3; Amal 11x + 14x/3 = 47x/3, and 47 : 56 ✓.", "source_url": "https://cracku.in/71-the-scores-of-amal-and-bimal-in-an-examination-are-x-cat-2018-slot-2"}, {"id": "2018-S2-Q06", "year": 2018, "slot": 2, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Two-digit numbers – digit reversal", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Count the two-digit numbers whose units digit is non-zero and which are greater than three times the number obtained by reversing their digits.", "options": [], "answer": "6", "answer_note": "", "concept": "Write the number as 10a + b and turn the condition into a linear inequality in digits.", "formulas": ["Two-digit number = 10a + b; reverse = 10b + a"], "solution": ["1. Need 10a + b > 3(10b + a) ⇒ 7a > 29b, with 1 ≤ a ≤ 9 and 1 ≤ b ≤ 9.", "2. b = 1: a > 29/7 ≈ 4.14 ⇒ a = 5,…,9 → 5 numbers.", "3. b = 2: a > 58/7 ≈ 8.29 ⇒ a = 9 → 1 number.", "4. b ≥ 3: a > 12.4, impossible.", "5. Total = 6."], "shortcut": "", "source_url": "https://cracku.in/72-how-many-two-digit-numbers-with-a-non-zero-digit-i-x-cat-2018-slot-2"}, {"id": "2018-S2-Q07", "year": 2018, "slot": 2, "q_no": 7, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Symmetric difference", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For sets A and B, A Δ B denotes the set of elements lying in exactly one of A and B. With P = {1, 2, 3, 4}, Q = {2, 3, 5, 6}, R = {1, 3, 7, 8, 9} and S = {2, 4, 9, 10}, how many elements does (P Δ Q) Δ (R Δ S) have?", "options": [], "answer": "7", "answer_note": "", "concept": "Symmetric difference keeps elements that appear an odd number of times across the sets combined.", "formulas": ["A Δ B = (A ∪ B) − (A ∩ B)", "Δ is associative: result = elements in an odd number of the sets"], "solution": ["1. P Δ Q = {1, 4, 5, 6}.", "2. R Δ S = {1, 2, 3, 4, 7, 8, 10}.", "3. (P Δ Q) Δ (R Δ S): remove the common elements 1 and 4 and keep the rest.", "4. Result = {2, 3, 5, 6, 7, 8, 10}, which has 7 elements."], "shortcut": "Count how many of P, Q, R, S each element is in; keep those appearing an odd number of times.", "source_url": "https://cracku.in/73-for-two-sets-a-and-b-let-ab-denote-the-set-of-elem-x-cat-2018-slot-2"}, {"id": "2018-S2-Q08", "year": 2018, "slot": 2, "q_no": 8, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Parallelogram – area & sides", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Parallelogram ABCD has area 48 sq cm, CD = 8 cm and AD = s cm. Which statement must hold?", "options": ["s ≠ 6", "s ≥ 6", "5 ≤ s ≤ 7", "s ≤ 6"], "answer": "s ≥ 6", "answer_note": "", "concept": "Area of a parallelogram = product of adjacent sides × sine of the included angle, and sine is at most 1.", "formulas": ["Area = a·b·sin θ", "sin θ ≤ 1"], "solution": ["1. Area = CD × AD × sin D = 8s sin D = 48.", "2. So s sin D = 6, i.e. s = 6/sin D.", "3. Since 0 < sin D ≤ 1, s ≥ 6 (equality for a rectangle).", "4. Hence s ≥ 6 is always true."], "shortcut": "Equivalently, the height on CD is 48/8 = 6, and the slant side AD cannot be shorter than the height.", "source_url": "https://cracku.in/74-a-parallelogram-abcd-has-area-48-sqcm-if-the-lengt-x-cat-2018-slot-2"}, {"id": "2018-S2-Q09", "year": 2018, "slot": 2, "q_no": 9, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – successive mixing", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A 20% ethanol solution is mixed with a solution S of unknown strength in the volume ratio 1 : 3. The result is then mixed with an equal volume of 20% ethanol solution. The final mixture is 31.25% ethanol. What is the ethanol concentration of S?", "options": ["30%", "40%", "50%", "60%"], "answer": "50%", "answer_note": "", "concept": "Concentration of a mixture is the volume-weighted average of the parts.", "formulas": ["Mixture % = Σ(volume × %) ÷ Σ volume"], "solution": ["1. Let S have concentration s%. First mixture: (1 × 20 + 3s)/4.", "2. Mixing equal volumes with 20%: final = [(20 + 3s)/4 + 20]/2 = 31.25.", "3. (20 + 3s)/4 = 42.5 ⇒ 20 + 3s = 170 ⇒ s = 50.", "4. S is 50% ethanol."], "shortcut": "Equal-volume mix with 20% gives 31.25 ⇒ first mixture was 42.5%; then 1:3 with 20% ⇒ s = (4×42.5 − 20)/3 = 50.", "source_url": "https://cracku.in/75-a-20-ethanol-solution-is-mixed-with-another-ethano-x-cat-2018-slot-2"}, {"id": "2018-S2-Q10", "year": 2018, "slot": 2, "q_no": 10, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Combinations – round-robin matches", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A tournament has 43 juniors and 51 seniors. Every two juniors play each other once and every two seniors play each other once; juniors never play seniors. There are 153 girl-versus-girl matches among juniors and 276 boy-versus-boy matches among seniors. How many matches in total are boy-versus-girl?", "options": [], "answer": "1098", "answer_note": "", "concept": "Use C(n, 2) to recover the number of girls/boys in each group, then count mixed pairs as (boys × girls) in each group.", "formulas": ["Matches among n players = C(n, 2) = n(n − 1)/2", "Mixed matches = (boys) × (girls)"], "solution": ["1. Junior girls g: C(g, 2) = 153 ⇒ g(g − 1) = 306 ⇒ g = 18; junior boys = 43 − 18 = 25.", "2. Senior boys b: C(b, 2) = 276 ⇒ b(b − 1) = 552 ⇒ b = 24; senior girls = 51 − 24 = 27.", "3. Junior boy-girl matches = 25 × 18 = 450.", "4. Senior boy-girl matches = 24 × 27 = 648.", "5. Total = 450 + 648 = 1098."], "shortcut": "", "source_url": "https://cracku.in/76-in-a-tournament-there-are-43-junior-level-and-51-s-x-cat-2018-slot-2"}, {"id": "2018-S2-Q11", "year": 2018, "slot": 2, "q_no": 11, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – chords & central angle", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a circle, a chord of length 5 cm subtends 60° at the centre. Find the length (in cm) of a chord of the same circle that subtends 120° at the centre.", "options": ["5√3", "2π", "8", "6√2"], "answer": "5√3", "answer_note": "", "concept": "A chord subtending 60° forms an equilateral triangle with the centre; chord length = 2r sin(θ/2).", "formulas": ["Chord = 2r sin(θ/2)"], "solution": ["1. A 60° chord with two radii forms an equilateral triangle, so r = 5 cm.", "2. Chord for 120° = 2r sin 60° = 2 × 5 × (√3/2).", "3. Length = 5√3 cm."], "shortcut": "For a 120° chord, length = r√3 (side of the inscribed equilateral triangle).", "source_url": "https://cracku.in/77-a-chord-of-length-5-cm-subtends-an-angle-of-60-at--x-cat-2018-slot-2"}, {"id": "2018-S2-Q12", "year": 2018, "slot": 2, "q_no": 12, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Averages of increasing integers – extremal value", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Positive integers a₁ < a₂ < … < a₅₂ are such that the mean of all 52 of them is 1 less than the mean of a₂, a₃, …, a₅₂. If a₅₂ = 100, what is the greatest possible value of a₁?", "options": ["48", "20", "23", "45"], "answer": "23", "answer_note": "", "concept": "Turn the mean condition into a relation between the total sum and a₁, then bound the sum of a₂…a₅₂ by its largest possible value.", "formulas": ["Mean = Sum ÷ count", "Max sum of 51 distinct integers ≤ 100 = 50 + 51 + … + 100"], "solution": ["1. Let T = a₂ + … + a₅₂. Condition: T/51 − (T + a₁)/52 = 1.", "2. Multiply by 51 × 52: 52T − 51T − 51a₁ = 2652 ⇒ T = 2652 + 51a₁.", "3. T is largest when a₂, …, a₅₂ = 50, 51, …, 100: T ≤ 51 × 75 = 3825.", "4. 2652 + 51a₁ ≤ 3825 ⇒ a₁ ≤ 1173/51 = 23.", "5. a₁ = 23 works with a₂…a₅₂ = 50…100 (all exceed 23). Answer 23."], "shortcut": "", "source_url": "https://cracku.in/78-let-a_1a_2a_52-be-positive-integers-such-that-a_1--x-cat-2018-slot-2"}, {"id": "2018-S2-Q13", "year": 2018, "slot": 2, "q_no": 13, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Sum of products of AP terms", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Evaluate 7 × 11 + 11 × 15 + 15 × 19 + … + 95 × 99.", "options": [], "answer": "80707", "answer_note": "", "concept": "Each term is a product of consecutive terms of an AP; write the general term as a quadratic and use standard sums.", "formulas": ["Σk = n(n + 1)/2", "Σk² = n(n + 1)(2n + 1)/6"], "solution": ["1. The k-th term is (4k + 3)(4k + 7) for k = 1, 2, …; the last term 95 × 99 gives k = 23.", "2. (4k + 3)(4k + 7) = 16k² + 40k + 21.", "3. Σk² (k = 1..23) = 23 × 24 × 47/6 = 4324; Σk = 276.", "4. Sum = 16 × 4324 + 40 × 276 + 21 × 23 = 69184 + 11040 + 483 = 80707."], "shortcut": "Telescoping: (4k+3)(4k+7) = [(4k+3)(4k+7)(4k+11) − (4k−1)(4k+3)(4k+7)]/12.", "source_url": "https://cracku.in/79-the-value-of-the-sum-7-x-11-11-x-15-15-x-19-95-x-9-x-cat-2018-slot-2"}, {"id": "2018-S2-Q14", "year": 2018, "slot": 2, "q_no": 14, "area": "Number System", "topic": "Number System", "subtopic": "Highest power of 2 dividing an expression", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Positive integers N and x satisfy N^N = 2¹⁶⁰, and N² + 2^N is a multiple of 2^x. What is the largest possible x?", "options": [], "answer": "10", "answer_note": "", "concept": "Rewrite 2¹⁶⁰ as N^N to find N, then factor out the highest common power of 2.", "formulas": ["(a^m)^n = a^(mn)"], "solution": ["1. 2¹⁶⁰ = 2^(5 × 32) = (2⁵)³² = 32³², so N = 32.", "2. N² + 2^N = 2¹⁰ + 2³² = 2¹⁰(1 + 2²²).", "3. 1 + 2²² is odd, so the highest power of 2 dividing the sum is 2¹⁰.", "4. Largest x = 10."], "shortcut": "", "source_url": "https://cracku.in/80-if-n-and-x-are-positive-integers-such-that-nn-2160-x-cat-2018-slot-2"}, {"id": "2018-S2-Q15", "year": 2018, "slot": 2, "q_no": 15, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes – filling with clock times", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A tank is emptied every day at the same fixed time, and right afterwards pump A, pump B or both are run until it is full. On Monday only A was used and the tank became full at 8 pm. On Tuesday only B was used and it became full at 6 pm. On Wednesday A alone ran till 5 pm, and then B alone ran from 5 pm to 7 pm, filling the tank. On Thursday both pumps run together throughout. When does the tank become full on Thursday?", "options": ["4:48 pm", "4:12 pm", "4:24 pm", "4:36 pm"], "answer": "4:24 pm", "answer_note": "", "concept": "Let the emptying time be unknown; express each pump's filling time in terms of it and use Wednesday's data to find it.", "formulas": ["Work done = time ÷ time to fill alone", "Combined time = ab/(a + b)"], "solution": ["1. Let the tank be emptied at T hours (24-hour clock). A alone needs 20 − T hours, B alone 18 − T hours.", "2. Wednesday: (17 − T)/(20 − T) + 2/(18 − T) = 1.", "3. Testing/solving gives T = 14 (2 pm): 3/6 + 2/4 = 1. So A takes 6 h, B takes 4 h.", "4. Together: 6 × 4/(6 + 4) = 2.4 h = 2 h 24 min.", "5. Thursday the tank is full at 2 pm + 2 h 24 min = 4:24 pm."], "shortcut": "Wednesday ran 2 h longer of B in place of A finishing; try T = 2 pm, which fits instantly.", "source_url": "https://cracku.in/81-a-tank-is-emptied-everyday-at-a-fixed-time-point-i-x-cat-2018-slot-2"}, {"id": "2018-S2-Q16", "year": 2018, "slot": 2, "q_no": 16, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Averages – minimising a variable", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The mean of x, y, z is 80 and the mean of x, y, z, u, v is 75, where u = (x + y)/2 and v = (y + z)/2. If x ≥ z, what is the least possible value of x?", "options": [], "answer": "105", "answer_note": "", "concept": "Convert means to sums, substitute u and v, solve for y, then use x ≥ z on x + z.", "formulas": ["Sum = mean × count"], "solution": ["1. x + y + z = 240 and x + y + z + u + v = 375 ⇒ u + v = 135.", "2. u + v = (x + 2y + z)/2 = 135 ⇒ x + 2y + z = 270.", "3. Subtract: y = 30, so x + z = 210.", "4. With x ≥ z, x ≥ 105. Minimum x = 105."], "shortcut": "", "source_url": "https://cracku.in/82-the-arithmetic-mean-of-x-y-and-z-is-80-and-that-of-x-cat-2018-slot-2"}, {"id": "2018-S2-Q17", "year": 2018, "slot": 2, "q_no": 17, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "TSD – piecewise speeds", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "A and B are 150 km apart. Car 1 drives from A to B; car 2 starts from A towards B at the moment car 1 is 20 km from A. Each car covers the first 50 km at 100 km/h, the next 50 km at 50 km/h and the last 50 km at 25 km/h. How far (in km) is car 2 from B when car 1 reaches B?", "options": [], "answer": "5", "answer_note": "", "concept": "Compute total travel time of car 1, subtract its head start time, and find car 2's position after that time using the segment speeds.", "formulas": ["Time = distance ÷ speed, segment by segment"], "solution": ["1. Car 1's total time = 50/100 + 50/50 + 50/25 = 0.5 + 1 + 2 = 3.5 h.", "2. Car 1 reached 20 km after 20/100 = 0.2 h, so car 2 travels for 3.5 − 0.2 = 3.3 h.", "3. Car 2: first 50 km takes 0.5 h, next 50 km takes 1 h ⇒ at 100 km after 1.5 h.", "4. Remaining 1.8 h at 25 km/h = 45 km ⇒ car 2 is at 145 km.", "5. Distance from B = 150 − 145 = 5 km."], "shortcut": "Car 2 lags car 1 by 0.2 h throughout; in the last segment that lag at 25 km/h is 0.2 × 25 = 5 km.", "source_url": "https://cracku.in/83-points-a-and-b-are-150-km-apart-cars-1-and-2-trave-x-cat-2018-slot-2"}, {"id": "2018-S2-Q18", "year": 2018, "slot": 2, "q_no": 18, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of squares vs product", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two numbers have squares summing to 97. Which of the following cannot be their product?", "options": ["−32", "16", "48", "64"], "answer": "64", "answer_note": "", "concept": "Since a square is non-negative, a² + b² ≥ 2|ab|, which bounds the product.", "formulas": ["(a − b)² ≥ 0 ⇒ a² + b² ≥ 2ab", "(a + b)² ≥ 0 ⇒ a² + b² ≥ −2ab"], "solution": ["1. (a − b)² = 97 − 2ab ≥ 0 ⇒ ab ≤ 48.5.", "2. (a + b)² = 97 + 2ab ≥ 0 ⇒ ab ≥ −48.5.", "3. −32, 16 and 48 all lie within [−48.5, 48.5]; 64 does not.", "4. The product cannot be 64."], "shortcut": "", "source_url": "https://cracku.in/84-if-the-sum-of-squares-of-two-numbers-is-97-then-wh-x-cat-2018-slot-2"}, {"id": "2018-S2-Q19", "year": 2018, "slot": 2, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rectangle – area and perimeter", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For a rectangle, area : (perimeter)² = 1 : 25. Find the ratio of its shorter side to its longer side.", "options": ["1 : 4", "2 : 9", "1 : 3", "3 : 8"], "answer": "1 : 4", "answer_note": "", "concept": "Express the ratio condition as a homogeneous quadratic in the sides and factorise.", "formulas": ["Area = lb", "Perimeter = 2(l + b)"], "solution": ["1. lb / [2(l + b)]² = 1/25 ⇒ 25lb = 4(l + b)².", "2. 4l² + 8lb + 4b² − 25lb = 0 ⇒ 4l² − 17lb + 4b² = 0.", "3. (4l − b)(l − 4b) = 0 ⇒ l : b = 4 : 1 or 1 : 4.", "4. Shorter : longer = 1 : 4."], "shortcut": "Test options: 1:4 gives area 4, perimeter 10, 4/100 = 1/25 ✓.", "source_url": "https://cracku.in/85-the-area-of-a-rectangle-and-the-square-of-its-peri-x-cat-2018-slot-2"}, {"id": "2018-S2-Q20", "year": 2018, "slot": 2, "q_no": 20, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangle – two expressions for area", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In triangle ABC, a circle with BC as diameter cuts AB again at P and AC again at Q. If AB = 30 cm, AC = 25 cm and CP = 20 cm, find BQ in cm.", "options": [], "answer": "24", "answer_note": "", "concept": "An angle in a semicircle is 90°, so CP and BQ are altitudes of triangle ABC; equate two area expressions.", "formulas": ["Angle in a semicircle = 90°", "Area = ½ × base × height"], "solution": ["1. P and Q lie on the circle with diameter BC, so ∠BPC = ∠BQC = 90°.", "2. Thus CP ⊥ AB and BQ ⊥ AC: both are altitudes.", "3. Area = ½ × AB × CP = ½ × 30 × 20 = 300.", "4. Also area = ½ × AC × BQ ⇒ 25 × BQ = 600 ⇒ BQ = 24 cm."], "shortcut": "", "source_url": "https://cracku.in/86-on-a-triangle-abc-a-circle-with-diameter-bc-is-dra-x-cat-2018-slot-2"}, {"id": "2018-S2-Q21", "year": 2018, "slot": 2, "q_no": 21, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – triangle & distance", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Triangle ABC has area 32 sq units, and its side BC, of length 8 units, lies on the line x = 4. What is the least possible distance from A to the origin (0, 0)?", "options": ["8 units", "4 units", "2√2 units", "4√2 units"], "answer": "4 units", "answer_note": "", "concept": "The height from A to BC is fixed, so A lies on one of two vertical lines; the nearest point of a line to the origin is the foot of the perpendicular.", "formulas": ["Area = ½ × base × height", "Distance from origin to x = c is |c|"], "solution": ["1. Height from A to line x = 4: 2 × 32 / 8 = 8 units.", "2. So A lies on x = 4 − 8 = −4 or x = 4 + 8 = 12.", "3. Nearest point to the origin on x = −4 is (−4, 0), at distance 4; on x = 12 it is 12.", "4. B and C can be placed anywhere on x = 4, so A = (−4, 0) is feasible. Minimum distance = 4."], "shortcut": "", "source_url": "https://cracku.in/87-a-triangle-abc-has-area-32-sq-units-and-its-side-b-x-cat-2018-slot-2"}, {"id": "2018-S2-Q22", "year": 2018, "slot": 2, "q_no": 22, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – composite figure perimeter", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A semicircle with diameter AB and area 72π sq cm is cut out of a rectangle ABCD of area 768 sq cm. What is the perimeter (in cm) of the remaining figure?", "options": ["80 + 16π", "86 + 8π", "88 + 12π", "82 + 24π"], "answer": "88 + 12π", "answer_note": "", "concept": "Get the radius from the semicircle's area, the other side from the rectangle's area; the cut edge AB is replaced by the arc.", "formulas": ["Semicircle area = πr²/2", "Semicircle arc = πr"], "solution": ["1. πr²/2 = 72π ⇒ r² = 144 ⇒ r = 12, so AB = 24 cm.", "2. BC = 768 / 24 = 32 cm.", "3. Remaining boundary = BC + CD + DA + arc = 32 + 24 + 32 + 12π.", "4. Perimeter = 88 + 12π cm."], "shortcut": "", "source_url": "https://cracku.in/88-from-a-rectangle-abcd-of-area-768-sq-cm-a-semicirc-x-cat-2018-slot-2"}, {"id": "2018-S2-Q23", "year": 2018, "slot": 2, "q_no": 23, "area": "Number System", "topic": "Number System", "subtopic": "Divisibility – binomial expansion", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let A = {6²ⁿ − 35n − 1 : n = 1, 2, 3, …} and B = {35(n − 1) : n = 1, 2, 3, …}. Which of these is true?", "options": ["Every member of A is in B and at least one member of B is not in A", "Neither every member of A is in B nor every member of B is in A", "Every member of B is in A", "At least one member of A is not in B"], "answer": "Every member of A is in B and at least one member of B is not in A", "answer_note": "", "concept": "6²ⁿ = 36ⁿ = (1 + 35)ⁿ; binomial expansion shows 36ⁿ − 35n − 1 is a multiple of 35² ⊂ multiples of 35.", "formulas": ["(1 + x)ⁿ = 1 + nx + C(n,2)x² + …"], "solution": ["1. 36ⁿ = (1 + 35)ⁿ = 1 + 35n + C(n,2)·35² + …", "2. So 36ⁿ − 35n − 1 = 35²(C(n,2) + …), a non-negative multiple of 35 (even of 1225).", "3. B = {0, 35, 70, …}, all non-negative multiples of 35, so A ⊆ B.", "4. A's values are 0, 1225, …, so 35 ∈ B but 35 ∉ A. Hence A is a proper subset of B."], "shortcut": "n = 1 gives 0, n = 2 gives 1225; 35 is clearly missing from A.", "source_url": "https://cracku.in/89-if-a-62n-35n-1-where-n-123-and-b-35n-1-where-n-123-x-cat-2018-slot-2"}, {"id": "2018-S2-Q24", "year": 2018, "slot": 2, "q_no": 24, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Comparing powers using logs", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The least integer n with 4ⁿ > 17¹⁹ is closest to which value?", "options": ["37", "35", "33", "39"], "answer": "39", "answer_note": "", "concept": "Take logarithms: n > 19 log 17 / log 4.", "formulas": ["aⁿ > b ⇔ n > log b / log a (a > 1)", "log 17 ≈ 1.2304, log 4 ≈ 0.6021"], "solution": ["1. 4ⁿ > 17¹⁹ ⇔ n > 19 × log 17 / log 4.", "2. log 17 / log 4 ≈ 1.2304 / 0.6021 ≈ 2.0437.", "3. 19 × 2.0437 ≈ 38.83, so the smallest integer n is 39.", "4. Closest option: 39."], "shortcut": "4ⁿ = 16^(n/2); 17¹⁹ is a bit more than 16¹⁹ ⇒ n/2 slightly above 19 ⇒ n just above 38.", "source_url": "https://cracku.in/90-the-smallest-integer-n-for-which-4n-gt-1719-holds--x-cat-2018-slot-2"}, {"id": "2018-S2-Q25", "year": 2018, "slot": 2, "q_no": 25, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – repeated replacement", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A jar holds 175 ml of water and 700 ml of alcohol. Gopal takes out 10% of the mixture and replaces it with an equal amount of water, then repeats this once more. What percentage of the mixture is now water?", "options": ["30.3", "35.2", "25.4", "20.5"], "answer": "35.2", "answer_note": "", "concept": "In repeated replacement with water, the alcohol (the component not added back) shrinks by a fixed factor each time.", "formulas": ["Remaining = Initial × (1 − fraction removed)ⁿ"], "solution": ["1. Total volume stays 875 ml.", "2. Alcohol after two operations = 700 × 0.9² = 567 ml.", "3. Water = 875 − 567 = 308 ml.", "4. Water % = 308/875 × 100 = 35.2%."], "shortcut": "Alcohol share 80% → 80 × 0.81 = 64.8%, so water = 35.2%.", "source_url": "https://cracku.in/91-a-jar-contains-a-mixture-of-175-ml-water-and-700-m-x-cat-2018-slot-2"}, {"id": "2018-S2-Q26", "year": 2018, "slot": 2, "q_no": 26, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Quadratic always positive – discriminant", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Integers a and b are such that 2x² − ax + 2 > 0 and x² − bx + 8 ≥ 0 for every real x. Find the largest possible value of 2a − 6b.", "options": [], "answer": "36", "answer_note": "", "concept": "A quadratic with positive leading coefficient is positive (non-negative) for all x iff its discriminant is negative (non-positive).", "formulas": ["ax² + bx + c > 0 ∀x ⇔ a > 0 and D < 0", "D = b² − 4ac"], "solution": ["1. 2x² − ax + 2 > 0 ∀x ⇒ a² − 16 < 0 ⇒ −4 < a < 4 ⇒ integer a ≤ 3.", "2. x² − bx + 8 ≥ 0 ∀x ⇒ b² − 32 ≤ 0 ⇒ |b| ≤ 5.66 ⇒ integer b ≥ −5.", "3. 2a − 6b is largest with the largest a and the smallest b: a = 3, b = −5.", "4. Maximum = 6 + 30 = 36."], "shortcut": "", "source_url": "https://cracku.in/92-if-a-and-b-are-integers-such-that-2x2ax2gt0-and-x2-x-cat-2018-slot-2"}, {"id": "2018-S2-Q27", "year": 2018, "slot": 2, "q_no": 27, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Change of base – alternating sum", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Evaluate 1/log₂100 − 1/log₄100 + 1/log₅100 − 1/log₁₀100 + 1/log₂₀100 − 1/log₂₅100 + 1/log₅₀100.", "options": ["1/2", "10", "0", "−4"], "answer": "1/2", "answer_note": "", "concept": "1/logₐb = log_b a, so the sum becomes a single logarithm to base 100.", "formulas": ["1/logₐb = log_b a", "log x + log y = log xy; log x − log y = log(x/y)"], "solution": ["1. Each term 1/logₖ100 = log₁₀₀k.", "2. Sum = log₁₀₀[(2 × 5 × 20 × 50)/(4 × 10 × 25)].", "3. Numerator = 10000, denominator = 1000 ⇒ ratio = 10.", "4. log₁₀₀10 = 1/2."], "shortcut": "", "source_url": "https://cracku.in/93-frac1log_2100-frac1log_4100frac1log_5100-frac1log_-x-cat-2018-slot-2"}, {"id": "2018-S2-Q28", "year": 2018, "slot": 2, "q_no": 28, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Equal powers – log value", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If p³ = q⁴ = r⁵ = s⁶, find log_s(pqr).", "options": ["47/10", "24/5", "16/5", "1"], "answer": "47/10", "answer_note": "", "concept": "Set the common value to k and express each variable as a power of k (or of s).", "formulas": ["log_s(xyz) = log_s x + log_s y + log_s z", "If p³ = s⁶ then p = s²"], "solution": ["1. From p³ = s⁶: p = s², so log_s p = 2.", "2. q⁴ = s⁶ ⇒ q = s^(3/2); r⁵ = s⁶ ⇒ r = s^(6/5).", "3. log_s(pqr) = 2 + 3/2 + 6/5.", "4. = (20 + 15 + 12)/10 = 47/10."], "shortcut": "", "source_url": "https://cracku.in/94-if-p3-q4-r5-s6-then-the-value-of-log_spqr-is-equal-x-cat-2018-slot-2"}, {"id": "2018-S2-Q29", "year": 2018, "slot": 2, "q_no": 29, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – ratio of components", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two drums each hold a mixture of paints A and B. In drum 1, A : B = 18 : 7. Mixtures from drum 1 and drum 2 are combined in the ratio 3 : 4, and in the result A : B = 13 : 7. What was A : B in drum 2?", "options": ["251 : 163", "239 : 161", "220 : 149", "229 : 141"], "answer": "239 : 161", "answer_note": "", "concept": "Track the fraction of paint A: it is a weighted average of the two drums' A-fractions.", "formulas": ["Mixture fraction = (w₁f₁ + w₂f₂)/(w₁ + w₂)"], "solution": ["1. Fraction of A: drum 1 = 18/25, final = 13/20; let drum 2 be f.", "2. (3 × 18/25 + 4f)/7 = 13/20 ⇒ 54/25 + 4f = 91/20.", "3. 4f = 91/20 − 54/25 = (455 − 216)/100 = 239/100 ⇒ f = 239/400.", "4. A : B in drum 2 = 239 : (400 − 239) = 239 : 161."], "shortcut": "Only option B has A + B = 400 (= 4 × 100), consistent with the denominators.", "source_url": "https://cracku.in/95-there-are-two-drums-each-containing-a-mixture-of-p-x-cat-2018-slot-2"}, {"id": "2018-S2-Q30", "year": 2018, "slot": 2, "q_no": 30, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – change in efficiency", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Ramesh and Ganesh together can finish a job in 16 days. After 7 days of working together, Ramesh fell ill and his efficiency dropped by 30%; as a result the job took 17 days in total rather than 16. Had Ganesh worked alone after Ramesh fell ill, how many days would he have taken to finish the remaining work?", "options": ["14.5", "11", "13.5", "12"], "answer": "13.5", "answer_note": "", "concept": "The loss of 30% of Ramesh's rate over 10 days equals one day of joint work; this gives individual rates.", "formulas": ["Work = rate × time"], "solution": ["1. Let total work = 16 units (joint rate 1/day). Let Ramesh's rate be R, Ganesh's G, R + G = 1.", "2. Work left after 7 days = 9 units, done in 10 days at rate 0.7R + G: 10(1 − 0.3R) = 9 ⇒ R = 1/3, G = 2/3.", "3. Ganesh alone on 9 units takes 9 ÷ (2/3) = 13.5 days.", "4. Answer: 13.5 days."], "shortcut": "", "source_url": "https://cracku.in/96-ramesh-and-ganesh-can-together-complete-a-work-in--x-cat-2018-slot-2"}, {"id": "2018-S2-Q31", "year": 2018, "slot": 2, "q_no": 31, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – borrowing and lending", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Gopal borrows Rs. X from Ankit at 8% per annum compound interest (annual compounding). He adds Rs. Y of his own and lends Rs. (X + Y) to Ishan at 10% per annum compound interest (annual compounding). After one year, having paid Ankit what is due, Gopal's net interest earned equals the interest Ankit received. Had Gopal lent Rs. (X + 2Y) instead, his net interest would have been Rs. 150 more. Find X + Y.", "options": [], "answer": "4000", "answer_note": "", "concept": "Over one year, compound interest equals simple interest; set up two linear equations from the two conditions.", "formulas": ["One-year interest = P × r"], "solution": ["1. Gopal's net interest = 0.1(X + Y) − 0.08X; Ankit's interest = 0.08X.", "2. 0.1(X + Y) − 0.08X = 0.08X ⇒ 0.1Y = 0.06X ⇒ X = 5Y/3.", "3. Lending X + 2Y instead raises his interest by 0.1Y = 150 ⇒ Y = 1500.", "4. X = 2500, so X + Y = 4000."], "shortcut": "", "source_url": "https://cracku.in/97-gopal-borrows-rs-x-from-ankit-at-8-annual-interest-x-cat-2018-slot-2"}, {"id": "2018-S2-Q32", "year": 2018, "slot": 2, "q_no": 32, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – solving for strengths", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A salt solution has strength p% if 100 ml of it contains p g of salt. Mixing solutions A, B, C in the volume ratio 1 : 2 : 3 gives strength 20%; mixing them in the ratio 3 : 2 : 1 gives 30%. Solution D is made by mixing B and C in the ratio 2 : 7. Find the ratio of D's strength to A's strength.", "options": ["3 : 10", "1 : 3", "1 : 4", "2 : 5"], "answer": "1 : 3", "answer_note": "", "concept": "Two weighted-average equations in three unknown strengths are enough because D needs only a specific combination of B and C relative to A.", "formulas": ["Mixture strength = Σ(volume × strength)/Σ volume"], "solution": ["1. a + 2b + 3c = 120 and 3a + 2b + c = 180.", "2. Eliminate a: 3 × (first) − (second) gives 4b + 8c = 180 ⇒ b + 2c = 45.", "3. Subtract the equations: 2a − 2c = 60 ⇒ a = c + 30; then b = 45 − 2c.", "4. D = (2b + 7c)/9 = (90 − 4c + 7c)/9 = (90 + 3c)/9 = (c + 30)/3 = a/3.", "5. D : A = 1 : 3."], "shortcut": "", "source_url": "https://cracku.in/98-the-strength-of-a-salt-solution-is-p-if-100-ml-of--x-cat-2018-slot-2"}, {"id": "2018-S2-Q33", "year": 2018, "slot": 2, "q_no": 33, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative speed – same and opposite direction", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "On a long east–west road, B is 350 km west of A. Two cars start at the same time, one from A and one from B. If they drive towards each other they meet after 1 hour; if both drive eastward they meet after 7 hours. What is the difference of their speeds in km/h?", "options": [], "answer": "50", "answer_note": "", "concept": "Approaching: relative speed is the sum; same direction: relative speed is the difference.", "formulas": ["Opposite direction: d = (u + v)t", "Same direction: d = (u − v)t"], "solution": ["1. Moving towards each other: u + v = 350/1 = 350.", "2. Both moving east, the car from B (west) catches up: u − v = 350/7 = 50.", "3. Difference of speeds = 50 km/h (speeds 200 and 150)."], "shortcut": "", "source_url": "https://cracku.in/99-on-a-long-stretch-of-east-west-road-a-and-b-are-tw-x-cat-2018-slot-2"}, {"id": "2018-S2-Q34", "year": 2018, "slot": 2, "q_no": 34, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Sum of n terms to nth term", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Real numbers t₁, t₂, … satisfy t₁ + t₂ + … + tₙ = 2n² + 9n + 13 for every integer n ≥ 2. If t_k = 103, find k.", "options": [], "answer": "24", "answer_note": "", "concept": "For n ≥ 3, tₙ = Sₙ − Sₙ₋₁; note the formula is given only for n ≥ 2, so the first term is special.", "formulas": ["tₙ = Sₙ − Sₙ₋₁"], "solution": ["1. For n ≥ 3: tₙ = (2n² + 9n + 13) − (2(n − 1)² + 9(n − 1) + 13) = 4n + 7.", "2. 4k + 7 = 103 ⇒ k = 24.", "3. Since the sum formula holds only from n = 2, t₁ and t₂ are not individually determined, but every term from t₃ onward follows 4n + 7; k = 24 lies in that range, so k = 24."], "shortcut": "", "source_url": "https://cracku.in/100-let-t_1t_2-be-real-numbers-such-that-t_1t_2t_n-2n2-x-cat-2018-slot-2"}, {"id": "2019-S1-Q01", "year": 2019, "slot": 1, "q_no": 1, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed–time inverse proportion", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two cars cover the same distance on the same day. The first leaves at 10:00 am and the second at 11:00 am, and both arrive at the common destination at the same moment. Given that the first car is on the road for at least 6 hours, what is the largest possible percentage by which the second car's speed can exceed the first car's speed?", "options": ["20", "10", "35", "25"], "answer": "20", "answer_note": "", "concept": "For a fixed distance, speed is inversely proportional to time; the ratio of times determines the ratio of speeds.", "formulas": ["Speed ∝ 1/Time for fixed distance", "% excess = (v₂ − v₁)/v₁ × 100"], "solution": ["1. Let the first car take t hours (t ≥ 6). The second starts an hour later and arrives together, so it takes t − 1 hours.", "2. Speed ratio v₂/v₁ = t/(t − 1) = 1 + 1/(t − 1).", "3. This decreases as t grows, so it is largest at the smallest t, i.e. t = 6.", "4. Then v₂/v₁ = 6/5 = 1.2, so the second car is at most 20% faster."], "shortcut": "Max excess = 1/(t−1) at t = 6 → 1/5 = 20%.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-14.shtml"}, {"id": "2019-S1-Q02", "year": 2019, "slot": 1, "q_no": 2, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – telescoping surd sum", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let a₁, a₂, a₃, … be in arithmetic progression. The sum 1/(√a₁ + √a₂) + 1/(√a₂ + √a₃) + … + 1/(√aₙ + √aₙ₊₁) equals which of the following?", "options": ["n/(√a₁ + √aₙ₊₁)", "(n − 1)/(√a₁ + √aₙ)", "n/(√a₁ − √aₙ₊₁)", "(n − 1)/(√a₁ + √aₙ₋₁)"], "answer": "n/(√a₁ + √aₙ₊₁)", "answer_note": "", "concept": "Rationalising each term turns it into a difference of consecutive square roots divided by the common difference, so the sum telescopes.", "formulas": ["1/(√p + √q) = (√q − √p)/(q − p)", "aₖ₊₁ − aₖ = d", "aₙ₊₁ − a₁ = nd"], "solution": ["1. Rationalise: 1/(√aₖ + √aₖ₊₁) = (√aₖ₊₁ − √aₖ)/(aₖ₊₁ − aₖ) = (√aₖ₊₁ − √aₖ)/d.", "2. Adding k = 1 to n, the middle terms cancel: sum = (√aₙ₊₁ − √a₁)/d.", "3. Multiply numerator and denominator by (√aₙ₊₁ + √a₁): sum = (aₙ₊₁ − a₁)/[d(√aₙ₊₁ + √a₁)].", "4. Since aₙ₊₁ − a₁ = nd, the sum = n/(√a₁ + √aₙ₊₁)."], "shortcut": "Test a constant AP (d = 0, all terms = 1): each term is 1/2, sum = n/2; only n/(√a₁ + √aₙ₊₁) gives n/2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-20.shtml"}, {"id": "2019-S1-Q03", "year": 2019, "slot": 1, "q_no": 3, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – angle in semicircle", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In a circle of radius 5 cm, AB is a diameter. P and Q are points on the circle with PB = 6 cm and AP = 2 × AQ. The length of QB, in cm, is nearest to", "options": ["8.5", "9.3", "9.1", "7.8"], "answer": "9.1", "answer_note": "", "concept": "Any point on a circle subtends a right angle on a diameter, so triangles APB and AQB are right-angled and Pythagoras applies.", "formulas": ["Angle in a semicircle = 90°", "AP² + PB² = AB², AQ² + QB² = AB²"], "solution": ["1. AB = 10. Triangle APB is right-angled at P, so AP = √(100 − 36) = 8.", "2. AQ = AP/2 = 4.", "3. Triangle AQB is right-angled at Q, so QB = √(100 − 16) = √84.", "4. √84 ≈ 9.17, and among the options the closest is 9.1."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-21.shtml"}, {"id": "2019-S1-Q04", "year": 2019, "slot": 1, "q_no": 4, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – change of base", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Given (5.55)^x = (0.555)^y = 1000, find the value of 1/x − 1/y.", "options": ["1", "1/3", "2/3", "3"], "answer": "1/3", "answer_note": "", "concept": "Convert the exponential equations to logarithms in base 1000; reciprocals of exponents become logs that combine neatly.", "formulas": ["a^x = N ⇒ 1/x = log_N a", "log a − log b = log(a/b)"], "solution": ["1. From 5.55^x = 1000, 1/x = log₁₀₀₀ 5.55.", "2. From 0.555^y = 1000, 1/y = log₁₀₀₀ 0.555.", "3. 1/x − 1/y = log₁₀₀₀ (5.55/0.555) = log₁₀₀₀ 10.", "4. Since 1000 = 10³, log₁₀₀₀ 10 = 1/3."], "shortcut": "Ratio 5.55/0.555 = 10 and 10 = 1000^(1/3).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-2.shtml"}, {"id": "2019-S1-Q05", "year": 2019, "slot": 1, "q_no": 5, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – successive change", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Amala earns 20% more than Bimala and 20% less than Kamala. If Kamala's income falls by 4% and Bimala's rises by 10%, then Kamala's income would exceed Bimala's by approximately what percentage?", "options": ["28", "29", "31", "32"], "answer": "31", "answer_note": "", "concept": "Fix a convenient base value, express each income from the given relations, then apply the changes.", "formulas": ["x% more than B = B(1 + x/100)", "% excess = (K − B)/B × 100"], "solution": ["1. Let Bimala = 100. Then Amala = 120.", "2. Amala is 20% less than Kamala: 0.8K = 120 ⇒ K = 150.", "3. New Kamala = 150 × 0.96 = 144; new Bimala = 100 × 1.1 = 110.", "4. Excess = (144 − 110)/110 × 100 = 34/110 × 100 ≈ 30.9%, nearest 31."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-18.shtml"}, {"id": "2019-S1-Q06", "year": 2019, "slot": 1, "q_no": 6, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Wheel revolutions & speed", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Bicycle A's wheels have radius 30 cm and bicycle B's wheels have radius 40 cm. Over a certain distance, each wheel of A makes 5000 more revolutions than each wheel of B. If B covers that distance in 45 minutes, what is B's speed in km/h?", "options": ["18π", "16π", "12π", "14π"], "answer": "16π", "answer_note": "", "concept": "Distance = revolutions × circumference; equate the distance and use the difference in revolutions.", "formulas": ["Circumference = 2πr", "Revolutions = Distance/(2πr)", "Speed = Distance/Time"], "solution": ["1. Circumferences: A = 0.6π m, B = 0.8π m.", "2. d/(0.6π) − d/(0.8π) = 5000 ⇒ (d/π)(5/3 − 5/4) = 5000 ⇒ (d/π)(5/12) = 5000.", "3. d = 12000π m = 12π km.", "4. Speed of B = 12π ÷ 0.75 h = 16π km/h."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-32.shtml"}, {"id": "2019-S1-Q07", "year": 2019, "slot": 1, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Modulus equation with quadratic", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the product of the distinct real roots of |x² − x − 6| = x + 2.", "options": ["−4", "−16", "−8", "−24"], "answer": "−16", "answer_note": "", "concept": "Split the modulus into two cases and keep only those roots that satisfy the original equation (RHS must be ≥ 0).", "formulas": ["|A| = B ⇒ A = ±B with B ≥ 0", "x² − x − 6 = (x − 3)(x + 2)"], "solution": ["1. Since |…| ≥ 0, we need x + 2 ≥ 0, i.e. x ≥ −2.", "2. Write |(x − 3)(x + 2)| = x + 2. x = −2 is a root (both sides 0).", "3. For x > −2, divide by (x + 2): |x − 3| = 1 ⇒ x = 4 or x = 2.", "4. Distinct roots: −2, 2, 4. Product = −16."], "shortcut": "Factor out (x + 2) first rather than squaring.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-31.shtml"}, {"id": "2019-S1-Q08", "year": 2019, "slot": 1, "q_no": 8, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Races – three runners", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In a horse race with three horses, the first horse beats the second by 11 m and the third by 90 m. The second horse beats the third by 80 m. What is the length of the racecourse in metres?", "options": [], "answer": "880", "answer_note": "", "concept": "Constant speeds mean distance ratios stay fixed: the ratio of distances of the 3rd to 2nd horse is the same whenever measured.", "formulas": ["Speed ratio = distance ratio in equal time"], "solution": ["1. Let the course be L. When the first finishes, the second has run L − 11 and the third L − 90.", "2. When the second finishes (runs L), the third has run L − 80.", "3. Speed ratio third : second is constant: (L − 90)/(L − 11) = (L − 80)/L.", "4. Cross-multiply: L² − 90L = L² − 91L + 880 ⇒ L = 880 m."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-19.shtml"}, {"id": "2019-S1-Q09", "year": 2019, "slot": 1, "q_no": 9, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recurrence – linear growth", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A town's population changes each year so that if it is p at the start of a year, it is 3 + 2p at the start of the next year. If the population at the start of 2019 is 1000, what is it at the start of 2034?", "options": ["(1003)^15 + 6", "(997)^15 − 3", "997 × 2¹⁴ + 3", "1003 × 2¹⁵ − 3"], "answer": "1003 × 2¹⁵ − 3", "answer_note": "", "concept": "A recurrence of the form pₙ₊₁ = 2pₙ + 3 becomes a geometric progression after shifting by a constant.", "formulas": ["pₙ₊₁ + 3 = 2(pₙ + 3)", "GP: Tₙ = T₁ · r^(n−1)"], "solution": ["1. Add 3 to both sides: pₙ₊₁ + 3 = 2(pₙ + 3), so (p + 3) doubles every year.", "2. Start of 2019: p + 3 = 1003.", "3. From 2019 to 2034 there are 15 steps, so p + 3 = 1003 × 2¹⁵.", "4. Population in 2034 = 1003 × 2¹⁵ − 3."], "shortcut": "Check with one step: 1003 × 2 − 3 = 2003 = 3 + 2 × 1000. ✓", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-10.shtml"}, {"id": "2019-S1-Q10", "year": 2019, "slot": 1, "q_no": 10, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equation – exponential", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A function f defined on positive integers satisfies f(x + y) = f(x) · f(y) for all positive integers x, y, and f(1) = 2. If f(a + 1) + f(a + 2) + … + f(a + n) = 16(2ⁿ − 1), find a.", "options": [], "answer": "3", "answer_note": "", "concept": "The multiplicative property with f(1) = 2 forces f(x) = 2ˣ; the given sum is then a geometric series.", "formulas": ["f(x + y) = f(x)f(y), f(1) = k ⇒ f(x) = kˣ", "GP sum: r^m(rⁿ − 1)/(r − 1)"], "solution": ["1. f(2) = f(1)² = 4, f(3) = 8, …, so f(x) = 2ˣ.", "2. Sum = 2^(a+1) + 2^(a+2) + … + 2^(a+n) = 2^(a+1)(2ⁿ − 1).", "3. Equate with 16(2ⁿ − 1): 2^(a+1) = 16 = 2⁴.", "4. a + 1 = 4 ⇒ a = 3."], "shortcut": "Put n = 1: f(a + 1) = 16 = 2⁴ ⇒ a = 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-33.shtml"}, {"id": "2019-S1-Q11", "year": 2019, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest – ratios", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Amala, Bina and Gouri put money into fixed deposits in the ratio 3 : 4 : 5, at annual interest rates in the ratio 6 : 5 : 4. If Bina earns Rs 250 more interest than Amala in a year, what is the combined interest of the three after one year (in Rs)?", "options": ["7000", "6000", "6350", "7250"], "answer": "7250", "answer_note": "", "concept": "Annual interest is principal × rate, so the interest ratio is the product of the principal and rate ratios.", "formulas": ["SI for 1 year = P × R/100", "Interest ratio = (P ratio) × (R ratio)"], "solution": ["1. Interest ratio = 3×6 : 4×5 : 5×4 = 18 : 20 : 20.", "2. Bina − Amala = 2 parts = Rs 250 ⇒ 1 part = Rs 125.", "3. Total = 58 parts = 58 × 125.", "4. Total interest = Rs 7250."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-23.shtml"}, {"id": "2019-S1-Q12", "year": 2019, "slot": 1, "q_no": 12, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Piecewise function – parity cases", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For each positive integer n, define f(n) = n(n + 1) when n is even and f(n) = n + 3 when n is odd. If a positive integer m satisfies 8f(m + 1) − f(m) = 2, find m.", "options": [], "answer": "10", "answer_note": "", "concept": "Split by the parity of m, since m and m + 1 have opposite parity and use different formulas.", "formulas": ["Case analysis on parity", "Quadratic factorisation"], "solution": ["1. If m is odd: m + 1 is even, so 8(m + 1)(m + 2) − (m + 3) = 2 ⇒ 8m² + 23m + 11 = 0, which has no positive root.", "2. If m is even: m + 1 is odd, so 8(m + 4) − m(m + 1) = 2.", "3. Expand: 8m + 32 − m² − m = 2 ⇒ m² − 7m − 30 = 0.", "4. (m − 10)(m + 3) = 0 ⇒ m = 10 (even, positive). ✓"], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-9.shtml"}, {"id": "2019-S1-Q13", "year": 2019, "slot": 1, "q_no": 13, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Algebraic identities – cubes", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two positive numbers have product 616. The ratio of the difference of their cubes to the cube of their difference is 157 : 3. Find the sum of the two numbers.", "options": ["50", "85", "95", "58"], "answer": "50", "answer_note": "", "concept": "Use a³ − b³ = (a − b)(a² + ab + b²) to cancel (a − b) and get a relation between (a − b)² and ab.", "formulas": ["a³ − b³ = (a − b)(a² + ab + b²)", "(a + b)² = (a − b)² + 4ab"], "solution": ["1. (a³ − b³)/(a − b)³ = (a² + ab + b²)/(a − b)² = 157/3.", "2. Write a² + ab + b² = (a − b)² + 3ab and set (a − b)² = t: (t + 3×616)/t = 157/3.", "3. 3t + 5544 = 157t ⇒ t = 36, so a − b = 6.", "4. (a + b)² = 36 + 4×616 = 2500 ⇒ a + b = 50 (numbers 28 and 22)."], "shortcut": "Factor pairs of 616 summing to an option: 28 × 22 = 616 and sum 50; check 28³ − 22³ = 11304 = (157/3) × 216. ✓", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-12.shtml"}, {"id": "2019-S1-Q14", "year": 2019, "slot": 1, "q_no": 14, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Average speed – equal time vs equal distance", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Three modes of transport move at 10, 20 and 30 km/h. Amal spends equal amounts of time on each mode. Bimal covers equal distances on each mode. For the same total journey length, by approximately what percentage is Bimal's travel time more than Amal's?", "options": ["22", "19", "21", "20"], "answer": "22", "answer_note": "", "concept": "Equal time gives the arithmetic mean of speeds; equal distance gives the harmonic mean. Compare times for the same distance.", "formulas": ["Equal-time average speed = AM of speeds", "Equal-distance average speed = HM of speeds"], "solution": ["1. Amal's average speed = (10 + 20 + 30)/3 = 20 km/h.", "2. Bimal's average speed = 3/(1/10 + 1/20 + 1/30) = 3/(11/60) = 180/11 km/h.", "3. For the same distance, time ratio Bimal : Amal = 20 : 180/11 = 220 : 180 = 11 : 9.", "4. Excess = 2/9 ≈ 22.2%, nearest 22."], "shortcut": "Take distance 60 km: Amal 3 h; Bimal 2 + 1 + 2/3 = 11/3 h → 2/9 more.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-22.shtml"}, {"id": "2019-S1-Q15", "year": 2019, "slot": 1, "q_no": 15, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – exam marks", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Meena gets 40% in an exam. After re-evaluation her score goes up by 50%, yet she still misses the pass mark by 35 marks. If her re-evaluated score were raised by a further 20%, she would be 7 marks above the pass mark. What percentage of the maximum marks is required to pass?", "options": ["75", "80", "60", "70"], "answer": "70", "answer_note": "", "concept": "Express every score as a percentage of the maximum marks M and set up two equations with the pass mark.", "formulas": ["x% increase of S = S(1 + x/100)"], "solution": ["1. Original = 0.4M; after review = 0.4M × 1.5 = 0.6M.", "2. 0.6M = P − 35 and 0.6M × 1.2 = 0.72M = P + 7.", "3. Subtract: 0.12M = 42 ⇒ M = 350.", "4. P = 0.6 × 350 + 35 = 245, i.e. 245/350 = 70%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-6.shtml"}, {"id": "2019-S1-Q16", "year": 2019, "slot": 1, "q_no": 16, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest – weighted rate", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A person invests Rs 15 lakh in all. Part goes into a fixed deposit at 6% per year; the rest is split between two other deposits in the ratio 2 : 1, earning 4% and 3% per year respectively. If the total yearly interest is Rs 76,000, how much (in Rs lakh) went into the fixed deposit?", "options": [], "answer": "9", "answer_note": "", "concept": "Combine the two other deposits into one with an effective rate, then solve a single linear equation (or use alligation).", "formulas": ["Weighted rate = (2×4 + 1×3)/3", "Interest = P × R/100"], "solution": ["1. The 2 : 1 split at 4% and 3% has effective rate (8 + 3)/3 = 11/3 %.", "2. Let x lakh go into the FD: 0.06x + (11/300)(15 − x) = 0.76.", "3. 18x + 11(15 − x) = 228 ⇒ 7x + 165 = 228 ⇒ x = 9.", "4. Rs 9 lakh was in the fixed deposit."], "shortcut": "Overall rate = 0.76/15 = 76/15 %; alligation between 6% and 11/3% gives 9 : 6.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-11.shtml"}, {"id": "2019-S1-Q17", "year": 2019, "slot": 1, "q_no": 17, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Three-set Venn – only one set", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A club has 256 members. 144 play football, 123 play tennis and 132 play cricket. 58 play both football and tennis, 25 play both cricket and tennis, and 63 play both football and cricket. Every member plays at least one of the three games. How many members play only tennis?", "options": ["32", "43", "38", "45"], "answer": "43", "answer_note": "", "concept": "Use inclusion–exclusion to find the triple overlap, then subtract the pairwise overlaps from tennis.", "formulas": ["n(F∪T∪C) = ΣA − Σ(pairs) + n(F∩T∩C)", "Only T = T − (F∩T) − (C∩T) + (F∩T∩C)"], "solution": ["1. 256 = 144 + 123 + 132 − 58 − 25 − 63 + x = 253 + x ⇒ x = 3 (all three).", "2. Only tennis = 123 − 58 − 25 + 3.", "3. = 43."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-4.shtml"}, {"id": "2019-S1-Q18", "year": 2019, "slot": 1, "q_no": 18, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Sum of n terms → nth term", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The sum of the first n terms of a sequence is a₁ + a₂ + … + aₙ = 3(2ⁿ⁺¹ − 2). Find a₁₁.", "options": [], "answer": "6144", "answer_note": "", "concept": "Any term equals the difference of consecutive partial sums.", "formulas": ["aₙ = Sₙ − Sₙ₋₁"], "solution": ["1. a₁₁ = S₁₁ − S₁₀.", "2. = 3(2¹² − 2) − 3(2¹¹ − 2) = 3(2¹² − 2¹¹).", "3. = 3 × 2¹¹ = 3 × 2048 = 6144."], "shortcut": "aₙ = 3 × 2ⁿ in general.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-16.shtml"}, {"id": "2019-S1-Q19", "year": 2019, "slot": 1, "q_no": 19, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Number of roots via range bounds", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many real roots does the equation 2cos(x(x + 1)) = 2ˣ + 2⁻ˣ have?", "options": ["0", "Infinite", "1", "2"], "answer": "1", "answer_note": "", "concept": "Compare ranges: the left side is at most 2 while the right side is at least 2 (AM–GM), so equality forces both to equal 2.", "formulas": ["−1 ≤ cos θ ≤ 1", "t + 1/t ≥ 2 for t > 0, equality at t = 1"], "solution": ["1. LHS = 2cos(x(x + 1)) ≤ 2.", "2. RHS = 2ˣ + 1/2ˣ ≥ 2, with equality only when 2ˣ = 1, i.e. x = 0.", "3. So we need x = 0 and cos(0 × 1) = 1, which holds.", "4. Exactly one real root, x = 0."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-17.shtml"}, {"id": "2019-S1-Q20", "year": 2019, "slot": 1, "q_no": 20, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – efficiency change", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Working at their usual rates, A and B together complete a job in 12 days. If A worked at half her usual rate and B at three times his usual rate, they would finish in 9 days. How many days would A alone need at her usual rate?", "options": ["18", "12", "24", "36"], "answer": "18", "answer_note": "", "concept": "Represent daily work rates as unknowns and form two equations in total work.", "formulas": ["Work = Rate × Time"], "solution": ["1. Let rates be a and b (job = 1). 12(a + b) = 1.", "2. 9(a/2 + 3b) = 1.", "3. Equate: 12a + 12b = 4.5a + 27b ⇒ 7.5a = 15b ⇒ a = 2b.", "4. 12(3b) = 1 ⇒ b = 1/36, a = 1/18 ⇒ A alone takes 18 days."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-15.shtml"}, {"id": "2019-S1-Q21", "year": 2019, "slot": 1, "q_no": 21, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – class composition", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a class, 60% of students are girls and the remaining are boys, and there are 30 more girls than boys. If 68% of all students pass an exam, and 30 of those who pass are boys, what percentage of girls do not pass?", "options": [], "answer": "20", "answer_note": "", "concept": "Use the percentage gap between girls and boys to find the class size, then count girls who pass.", "formulas": ["Part = % × Whole"], "solution": ["1. Girls − boys = 60% − 40% = 20% of class = 30 ⇒ class = 150.", "2. Girls = 90, boys = 60.", "3. Passed = 68% × 150 = 102, of which 30 boys, so 72 girls passed.", "4. Girls failing = 18 ⇒ 18/90 = 20%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-1.shtml"}, {"id": "2019-S1-Q22", "year": 2019, "slot": 1, "q_no": 22, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – intersecting chords", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A circle has radius 11 cm. CD is a diameter and AB is a chord of length 20.5 cm. AB and CD intersect at an interior point E, and CE = 7 cm. What is the difference BE − AE, in cm?", "options": ["1.5", "3.5", "0.5", "2.5"], "answer": "0.5", "answer_note": "", "concept": "Intersecting chords theorem gives the product of the segments; with the known sum, the segments are roots of a quadratic.", "formulas": ["AE × EB = CE × ED", "(p − q)² = (p + q)² − 4pq"], "solution": ["1. CD = 22, so ED = 22 − 7 = 15. AE × EB = 7 × 15 = 105.", "2. AE + EB = 20.5.", "3. (BE − AE)² = 20.5² − 4 × 105 = 420.25 − 420 = 0.25.", "4. BE − AE = 0.5 (segments 10.5 and 10)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-5.shtml"}, {"id": "2019-S1-Q23", "year": 2019, "slot": 1, "q_no": 23, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit & loss – two items", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Karim sells a pen at a 5% loss and a book at a 15% profit, gaining Rs 7 overall. Had he sold the pen at a 5% profit and the book at a 10% profit, his gain would have been Rs 13. Find the cost price of the book in Rs.", "options": ["80", "85", "100", "95"], "answer": "80", "answer_note": "", "concept": "Write the net gain in each scenario as a linear combination of the two cost prices and solve.", "formulas": ["Gain = CP × gain%"], "solution": ["1. Let pen CP = p, book CP = b.", "2. −0.05p + 0.15b = 7 and 0.05p + 0.10b = 13.", "3. Add: 0.25b = 20 ⇒ b = 80.", "4. (Pen = 100.) Cost price of the book = Rs 80."], "shortcut": "Adding the equations eliminates p directly.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-13.shtml"}, {"id": "2019-S1-Q24", "year": 2019, "slot": 1, "q_no": 24, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – density", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A chemist mixes two liquids. Liquid 1 has density 1 kg per litre and liquid 2 has density 800 g per litre. Half a litre of the mixture weighs 480 g. What percentage of the mixture's volume is liquid 1?", "options": ["70", "85", "80", "75"], "answer": "80", "answer_note": "", "concept": "The mixture's density is a volume-weighted average of the component densities; alligation gives the volume ratio.", "formulas": ["Mixture density = Σ(vᵢρᵢ)/Σvᵢ", "Alligation"], "solution": ["1. Mixture density = 480 g / 0.5 L = 960 g/L.", "2. Let fraction of liquid 1 by volume be v: 1000v + 800(1 − v) = 960.", "3. 200v = 160 ⇒ v = 0.8.", "4. Liquid 1 is 80% of the volume."], "shortcut": "Alligation: (960 − 800) : (1000 − 960) = 160 : 40 = 4 : 1 → 80%.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-25.shtml"}, {"id": "2019-S1-Q25", "year": 2019, "slot": 1, "q_no": 25, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – inclusion/exclusion", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Ramesh and Gautam are two of 22 students taking an exam. Ramesh scores 82.5. The average of the 21 students excluding Gautam is 62. The average of all 22 students is 1 more than the average of the 21 students excluding Ramesh. What is Gautam's score?", "options": ["51", "53", "49", "48"], "answer": "51", "answer_note": "", "concept": "Express totals in terms of Gautam's score and equate the two averages.", "formulas": ["Total = Average × Count"], "solution": ["1. Total of 21 without Gautam = 21 × 62 = 1302; let Gautam = G, so total of 22 = 1302 + G.", "2. Total of 21 without Ramesh = 1302 + G − 82.5.", "3. (1302 + G)/22 = (1219.5 + G)/21 + 1.", "4. 21(1302 + G) = 22(1219.5 + G) + 462 ⇒ 27342 + 21G = 27291 + 22G + 462 ⇒ G = 51."], "shortcut": "Check option 51: all-22 avg = 1353/22 = 61.5; without Ramesh = 1270.5/21 = 60.5. ✓", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-34.shtml"}, {"id": "2019-S1-Q26", "year": 2019, "slot": 1, "q_no": 26, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Indices – compare prime powers", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Integers m and n satisfy (√2)¹⁹ × 3⁴ × 4² × 9ᵐ × 8ⁿ = 3ⁿ × 16ᵐ × ∜64. Find m.", "options": ["−16", "−24", "−12", "−20"], "answer": "−12", "answer_note": "", "concept": "Write every factor as a power of 2 or 3 and equate exponents of each prime separately.", "formulas": ["(aᵖ)^q = a^(pq)", "Unique prime factorisation ⇒ match exponents"], "solution": ["1. LHS powers of 2: 19/2 + 4 + 3n; of 3: 4 + 2m.", "2. RHS powers of 2: 4m + 6/4 = 4m + 3/2; of 3: n.", "3. From 3: n = 2m + 4. From 2: 27/2 + 3n = 4m + 3/2 ⇒ 4m − 3n = 12.", "4. 4m − 6m − 12 = 12 ⇒ −2m = 24 ⇒ m = −12 (n = −20)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-24.shtml"}, {"id": "2019-S1-Q27", "year": 2019, "slot": 1, "q_no": 27, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work – men and machines", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Three men and eight machines can complete a job in half the time needed by three machines and eight men. If two machines can complete the job in 13 days, how many men can complete the job in 13 days?", "options": [], "answer": "13", "answer_note": "", "concept": "Half the time means double the rate; this gives a ratio between a man's and a machine's work rate.", "formulas": ["Rate ∝ 1/Time", "Work = Rate × Time"], "solution": ["1. Let a man do m and a machine M units/day. 3m + 8M = 2(8m + 3M).", "2. 3m + 8M = 16m + 6M ⇒ 2M = 13m.", "3. 2 machines in 13 days do the job; 2 machines = 13 men in rate.", "4. So 13 men finish the job in 13 days."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-30.shtml"}, {"id": "2019-S1-Q28", "year": 2019, "slot": 1, "q_no": 28, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular hexagon in equilateral triangle", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A regular hexagon H is obtained by cutting off the corners of an equilateral triangle T. Find the ratio of the area of H to the area of T.", "options": ["5 : 6", "3 : 4", "2 : 3", "4 : 5"], "answer": "2 : 3", "answer_note": "", "concept": "For the hexagon to be regular, each side of T is trisected; T then splits into 9 congruent small equilateral triangles.", "formulas": ["Area of equilateral triangle ∝ side²"], "solution": ["1. Cutting equal corner triangles of side a/3 from each corner leaves a regular hexagon of side a/3.", "2. T (side a) contains 9 small triangles of side a/3.", "3. The 3 corners removed are 3 small triangles; H is the other 6.", "4. Area H : Area T = 6 : 9 = 2 : 3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-7.shtml"}, {"id": "2019-S1-Q29", "year": 2019, "slot": 1, "q_no": 29, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithm equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Positive reals x and y satisfy log₅(x + y) + log₅(x − y) = 3 and log₂y − log₂x = 1 − log₂3. Find xy.", "options": ["25", "150", "250", "100"], "answer": "150", "answer_note": "", "concept": "Use product and quotient rules to turn each log equation into an algebraic one.", "formulas": ["logₐp + logₐq = logₐ(pq)", "logₐp − logₐq = logₐ(p/q)"], "solution": ["1. First equation: (x + y)(x − y) = 5³ ⇒ x² − y² = 125.", "2. Second: log₂(y/x) = log₂(2/3) ⇒ y = 2x/3.", "3. x² − 4x²/9 = 125 ⇒ 5x²/9 = 125 ⇒ x² = 225 ⇒ x = 15, y = 10.", "4. xy = 150."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-26.shtml"}, {"id": "2019-S1-Q30", "year": 2019, "slot": 1, "q_no": 30, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – area with modulus", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "S is the set of all points (x, y) in the plane satisfying |x| + |y| ≤ 2 and |x| ≥ 1. Find the area of S in square units.", "options": [], "answer": "2", "answer_note": "", "concept": "|x| + |y| ≤ 2 is a square (diamond) with vertices on the axes at distance 2; |x| ≥ 1 keeps only its two tips beyond x = ±1.", "formulas": ["Area of |x| + |y| ≤ a = 2a²", "Area of triangle = ½ × base × height"], "solution": ["1. The diamond has vertices (±2, 0), (0, ±2).", "2. For x ≥ 1 the region is a triangle with vertices (1, 1), (1, −1), (2, 0): base 2, height 1, area 1.", "3. By symmetry, x ≤ −1 gives another area 1.", "4. Total area = 2."], "shortcut": "Diamond area 8; the tips are similar to the half-diamond (area 4) with scale 1/2, so each is 4/4 = 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-28.shtml"}, {"id": "2019-S1-Q31", "year": 2019, "slot": 1, "q_no": 31, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Lattice paths via a point", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "On a grid with rectangular coordinate axes, each step moves from (x, y) to either (x, y + 1) or (x + 1, y). How many such paths go from (1, 1) to (8, 10) passing through (4, 6)?", "options": [], "answer": "3920", "answer_note": "", "concept": "A monotone lattice path with r right and u up moves is a choice of positions for the right moves; multiply counts for the two legs.", "formulas": ["Paths with r right, u up = C(r + u, r)", "Multiplication principle"], "solution": ["1. (1,1) → (4,6): 3 right, 5 up ⇒ C(8, 3) = 56.", "2. (4,6) → (8,10): 4 right, 4 up ⇒ C(8, 4) = 70.", "3. Total = 56 × 70 = 3920."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-3.shtml"}, {"id": "2019-S1-Q32", "year": 2019, "slot": 1, "q_no": 32, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Cuboid – face diagonals", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The diagonals of the three rectangular faces of a brick are in the ratio 3 : 2√3 : √15. What is the ratio of the brick's shortest edge to its longest edge?", "options": ["1 : √3", "2 : √5", "√2 : √3", "√3 : 2"], "answer": "1 : √3", "answer_note": "", "concept": "Each face diagonal squared is the sum of squares of two edges; solving the three equations gives each edge squared.", "formulas": ["Face diagonal² = a² + b²", "a² = (sum of all three)/2 − (opposite pair)"], "solution": ["1. Take a² + b² = 9, b² + c² = 12, c² + a² = 15 (with a common scale k²).", "2. Sum: a² + b² + c² = 18.", "3. c² = 18 − 9 = 9, a² = 18 − 12 = 6, b² = 18 − 15 = 3.", "4. Shortest : longest = √3 : 3 = 1 : √3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-27.shtml"}, {"id": "2019-S1-Q33", "year": 2019, "slot": 1, "q_no": 33, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Modulus – counting solutions", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many real solutions does the equation |x|(6x² + 1) = 5x² have?", "options": [], "answer": "5", "answer_note": "", "concept": "Factor out x = 0, then the equation depends only on |x|, so each positive root in |x| gives two solutions.", "formulas": ["x² = |x|²", "Each |x| = k > 0 gives x = ±k"], "solution": ["1. x = 0 is a solution.", "2. For x ≠ 0, divide by |x|: 6|x|² + 1 = 5|x| ⇒ 6t² − 5t + 1 = 0 with t = |x| > 0.", "3. (2t − 1)(3t − 1) = 0 ⇒ t = 1/2 or 1/3.", "4. x = ±1/2, ±1/3 plus x = 0 ⇒ 5 solutions."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-29.shtml"}, {"id": "2019-S1-Q34", "year": 2019, "slot": 1, "q_no": 34, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Right triangle circumradius", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "T is the triangle bounded by the line 3x + 5y − 45 = 0 and the two coordinate axes. If L is the radius of T's circumcircle (in axis units), what is the integer nearest to L?", "options": [], "answer": "9", "answer_note": "", "concept": "The triangle is right-angled at the origin, so its circumradius is half the hypotenuse.", "formulas": ["Circumradius of right triangle = hypotenuse/2", "Intercepts: x = c/a, y = c/b"], "solution": ["1. Intercepts: x-intercept 15, y-intercept 9.", "2. Hypotenuse = √(15² + 9²) = √306 ≈ 17.49.", "3. L = 17.49/2 ≈ 8.75.", "4. Nearest integer = 9."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2019-Question-Paper-Slot-1-Quant/quants-question-8.shtml"}, {"id": "2019-S2-Q01", "year": 2019, "slot": 2, "q_no": 1, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – extreme values", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Thirty integers have an average of 5. Exactly 20 of these integers are less than or equal to 5. What is the largest possible average of these 20 integers?", "options": ["3.5", "5", "4.5", "4"], "answer": "4.5", "answer_note": "", "concept": "To maximise the average of one group when the total is fixed, push the other group to its smallest permitted values.", "formulas": ["Sum = average × count"], "solution": ["1. Total of all 30 integers = 30 × 5 = 150.", "2. The other 10 integers are each greater than 5, so as integers each is at least 6; their sum is at least 60.", "3. Hence the 20 integers sum to at most 150 − 60 = 90.", "4. Maximum average of the 20 = 90 ÷ 20 = 4.5 (achievable, e.g. ten 4s and ten 5s)."], "shortcut": "Remember the 'exactly 20' condition forces the rest to be ≥ 6, not ≥ 5.", "source_
