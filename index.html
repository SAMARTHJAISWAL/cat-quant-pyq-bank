e dues are 1000(1 + r); paying 530 leaves 1000(1 + r) − 530, which grows to 594 by year 2.", "3. Try r = 8%: 1000 × 1.08 = 1080; 1080 − 530 = 550; 550 × 1.08 = 594. ✓", "4. Rate = 8%."], "shortcut": "Note 594/550 = 1.08 directly — the second installment must be exactly one year's growth of what remains.", "source_url": "https://cracku.in/58-a-loan-of-rs-1000-is-fully-repaid-by-two-installme-x-cat-2025-slot-2"}, {"id": "2025-S2-Q13", "year": 2025, "slot": 2, "q_no": 13, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – tangents", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 2.44% correct", "question": "From an external point P two tangents touch a circle with centre O at Q and R. Points A on PQ and B on PR are chosen so that AB is also tangent to the circle (with the circle on the far side of AB from P). If ∠AOB = 50°, find ∠APB in degrees.", "options": [], "answer": "80", "answer_note": "", "concept": "The centre lies on the bisectors of angles at A and B, so ∠AOB is half of ∠QOR; the angles of the tangent quadrilateral OQPR then give ∠P.", "formulas": ["Tangent ⟂ radius", "∠AOB = 90° − ∠P/2 for a tangent triangle around the incircle-like configuration"], "solution": ["1. Let AB touch the circle at T. Triangles OAQ and OAT are congruent (RHS), so OA bisects ∠QOT; similarly OB bisects ∠TOR.", "2. Hence ∠QOR = 2∠AOB = 100°.", "3. In quadrilateral OQPR, ∠OQP = ∠ORP = 90°.", "4. ∠QPR = 360° − 90° − 90° − 100° = 80°, and ∠APB = ∠QPR = 80°."], "shortcut": "Direct result: ∠AOB = 90° − ∠P/2 ⇒ 50 = 90 − P/2 ⇒ P = 80°.", "source_url": "https://cracku.in/59-two-tangents-drawn-from-a-point-p-and-a-circle-wit-x-cat-2025-slot-2"}, {"id": "2025-S2-Q14", "year": 2025, "slot": 2, "q_no": 14, "area": "Number System", "topic": "Number System", "subtopic": "Divisors with a remainder condition", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 3.56% correct", "question": "How many divisors of 2⁶ × 3⁵ × 5³ × 7² leave remainder 1 when divided by 3 (i.e. are of the form 3r + 1, r a non-negative integer)?", "options": ["36", "56", "24", "42"], "answer": "42", "answer_note": "", "concept": "A divisor ≡ 1 (mod 3) cannot contain 3; reduce the other primes mod 3 and count exponent choices giving residue 1.", "formulas": ["2 ≡ 5 ≡ −1 (mod 3), 7 ≡ 1 (mod 3)", "(−1)^k ≡ 1 iff k is even"], "solution": ["1. Exponent of 3 must be 0. Divisor = 2^a 5^c 7^d with 0 ≤ a ≤ 6, 0 ≤ c ≤ 3, 0 ≤ d ≤ 2.", "2. Mod 3 the divisor ≡ (−1)^(a+c) × 1, so we need a + c even.", "3. a even (4 choices: 0,2,4,6) with c even (2 choices: 0,2) = 8; a odd (3 choices) with c odd (2 choices) = 6; total 14.", "4. d has 3 free choices, giving 14 × 3 = 42."], "shortcut": "", "source_url": "https://cracku.in/60-the-number-of-divisors-of-26times-35times-53times--x-cat-2025-slot-2"}, {"id": "2025-S2-Q15", "year": 2025, "slot": 2, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular hexagon – area ratio", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 12.96% correct", "question": "ABCDEF is a regular hexagon; P is the midpoint of AB and Q the midpoint of CD. Find the ratio of the area of trapezium PBCQ to the area of the hexagon.", "options": ["6:19", "5:24", "6:25", "7:24"], "answer": "5:24", "answer_note": "", "concept": "PQ is a midline parallel to BC in the trapezium ABCD (half the hexagon); compute its length and the height to BC.", "formulas": ["Area of regular hexagon = (3√3/2)a²", "Midline of a trapezium = (sum of parallel sides)/2"], "solution": ["1. Take side a. ABCD is half the hexagon: a trapezium with parallel sides BC = a and AD = 2a, height √3a/2.", "2. P, Q are midpoints of the legs AB and CD, so PQ = (a + 2a)/2 = 3a/2 and the distance from PQ to BC is √3a/4.", "3. Area of PBCQ = ½(a + 3a/2)(√3a/4) = 5√3a²/16.", "4. Hexagon area = 3√3a²/2 = 24√3a²/16.", "5. Ratio = 5 : 24."], "shortcut": "Hexagon = 24 small units; ABCD = 12 units, cut by the midline into 5 (top, near BC) and 7 (bottom) – the 5:7 split of a trapezium with sides 1:2.", "source_url": "https://cracku.in/61-let-abcdef-be-a-regular-hexagon-and-p-and-q-be-the-x-cat-2025-slot-2"}, {"id": "2025-S2-Q16", "year": 2025, "slot": 2, "q_no": 16, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Minimising a sum of squares under integer constraint", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 17.25% correct", "question": "Integers a, b, c, d add up to 46. Find the minimum possible value of (a − b)² + (a − c)² + (a − d)².", "options": [], "answer": "2", "answer_note": "", "concept": "The expression is 0 only if all four are equal, impossible since 46 isn't divisible by 4; distribute the values as evenly as possible.", "formulas": ["Sum of squares of differences is minimised when values are as close as possible"], "solution": ["1. Zero needs a = b = c = d = 46/4 = 11.5, not an integer, so the value is ≥ 1.", "2. Value 1 needs exactly one of b, c, d differing from a by 1 and the other two equal to a: sum = 4a ± 1, odd — but 46 is even, impossible.", "3. Value 2: two of b, c, d differ from a by 1. Take a = 12, b = c = 11, d = 12: sum 46 ✓, value 1 + 1 + 0 = 2.", "4. Minimum = 2."], "shortcut": "Parity check: value = 1 forces an odd total, so 2 is the next candidate.", "source_url": "https://cracku.in/62-if-abc-and-d-are-integers-such-that-their-sum-is-4-x-cat-2025-slot-2"}, {"id": "2025-S2-Q17", "year": 2025, "slot": 2, "q_no": 17, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratios – income, expenditure, savings", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 44.91% correct", "question": "Lakshmi's and Meenakshi's expenditures are in the ratio 2 : 3. Lakshmi's income to Meenakshi's expenditure is 6 : 7. Their savings (income − expenditure) are in the ratio 4 : 9. Find the ratio of their incomes.", "options": ["3:5", "5:6", "2:1", "7:8"], "answer": "3:5", "answer_note": "", "concept": "Express everything in terms of one unit from the expenditure ratio and chain the given ratios.", "formulas": ["Savings = Income − Expenditure"], "solution": ["1. Let expenditures be 14k and 21k (so 2 : 3 and Meenakshi's 21k fits 6 : 7).", "2. Lakshmi's income = (6/7) × 21k = 18k, so her savings = 18k − 14k = 4k.", "3. Meenakshi's savings = (9/4) × 4k = 9k, so her income = 21k + 9k = 30k.", "4. Income ratio = 18k : 30k = 3 : 5."], "shortcut": "", "source_url": "https://cracku.in/63-the-ratio-of-expenditures-of-lakshmi-and-meenakshi-x-cat-2025-slot-2"}, {"id": "2025-S2-Q18", "year": 2025, "slot": 2, "q_no": 18, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Infinite GP sum", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 10.83% correct", "question": "a_n is the nth term of a decreasing infinite geometric progression. If a₁ + a₂ + a₃ = 52 and a₁a₂ + a₂a₃ + a₃a₁ = 624, find the sum of the progression.", "options": ["57", "54", "60", "63"], "answer": "54", "answer_note": "", "concept": "In a GP the pairwise-product sum equals (middle term) × (sum of three terms), giving the middle term directly.", "formulas": ["Terms a, ar, ar²: a·ar + ar·ar² + ar²·a = ar(a + ar + ar²)", "S∞ = a/(1 − r), |r| < 1"], "solution": ["1. With terms a, ar, ar²: pairwise sum = ar(a + ar + ar²) = ar × 52 = 624 ⇒ ar = 12.", "2. Then 12/r + 12 + 12r = 52 ⇒ 3r² − 10r + 3 = 0 ⇒ r = 3 or 1/3.", "3. Decreasing infinite GP with a convergent sum ⇒ r = 1/3, a = 36 (terms 36, 12, 4).", "4. S∞ = 36/(1 − 1/3) = 54."], "shortcut": "Middle term = 624/52 = 12 straight away; terms 36, 12, 4 add to 52.", "source_url": "https://cracku.in/64-let-an-be-the-nth-term-of-a-decreasing-infinite-ge-x-cat-2025-slot-2"}, {"id": "2025-S2-Q19", "year": 2025, "slot": 2, "q_no": 19, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – component cost", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.17% correct", "question": "Mixture 1 of coffee and cocoa contains 16% coffee and costs Rs 240/kg. Mixture 2 of coffee and cocoa contains 36% coffee and costs Rs 320/kg. A third coffee–cocoa mixture costs Rs 376/kg. How many kg of coffee are in 10 kg of this third mixture?", "options": ["5", "4", "2.5", "6"], "answer": "5", "answer_note": "", "concept": "The two known mixtures give two linear equations for the prices of pure coffee and pure cocoa; the third mixture's price then fixes its coffee fraction.", "formulas": ["Mixture price = (fraction of A)·price A + (fraction of B)·price B"], "solution": ["1. Let coffee cost C and cocoa K per kg: 0.16C + 0.84K = 240 and 0.36C + 0.64K = 320.", "2. Subtract: 0.20C − 0.20K = 80 ⇒ C − K = 400.", "3. Substitute C = K + 400 into the first: K + 64 = 240 ⇒ K = 176, C = 576.", "4. For the third mixture with coffee fraction p: 176 + 400p = 376 ⇒ p = 1/2.", "5. Coffee in 10 kg = 5 kg."], "shortcut": "Price rises Rs 80 per 20 percentage points of coffee (Rs 4 per point). From 240 at 16%, reaching 376 needs 136/4 = 34 more points ⇒ 50%.", "source_url": "https://cracku.in/65-a-mixture-of-coffee-and-cocoa-16-of-which-is-coffe-x-cat-2025-slot-2"}, {"id": "2025-S2-Q20", "year": 2025, "slot": 2, "q_no": 20, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – cevians & similar triangles", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.1% correct", "question": "In triangle ABC, D lies on BC and E lies on AC; AD and BE meet at T. AD : AT = 4 : 3 and BE : BT = 5 : 4. F is a point on AC with DF parallel to BE. Find BD : CD.", "options": ["15:4", "11:4", "7:4", "9:4"], "answer": "11:4", "answer_note": "", "concept": "Use the parallel line DF ∥ BE twice: once in triangle ADF (to scale TE) and once in triangle CBE (to get the split of BC).", "formulas": ["Basic proportionality / similar triangles: a line parallel to one side divides the other sides proportionally"], "solution": ["1. Let TE = y. Since BT : TE = 4 : 1, BE = 5y. Since AT : TD = 3 : 1, AT : AD = 3 : 4.", "2. TE ∥ DF, so triangle ATE ∼ triangle ADF: DF/TE = AD/AT = 4/3 ⇒ DF = 4y/3.", "3. DF ∥ BE, so triangle CDF ∼ triangle CBE: CD/CB = DF/BE = (4y/3)/(5y) = 4/15.", "4. Hence BD/BC = 11/15 and BD : CD = 11 : 4."], "shortcut": "Mass points: from BT:TE = 4:1 and AT:TD = 3:1, assigning masses gives BD:DC = 11:4 directly.", "source_url": "https://cracku.in/66-in-triangle-abc-points-d-and-e-are-on-the-sides-bc-x-cat-2025-slot-2"}, {"id": "2025-S2-Q21", "year": 2025, "slot": 2, "q_no": 21, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – efficiency ratios", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "2IIM: 46.55% correct", "question": "Ankita is twice as efficient as Bipin, and Bipin is twice as efficient as Chandan. All three begin a job together; Bipin leaves after 20 days, and the job finishes in 60 days in total. How many days would Chandan alone take to do the whole job?", "options": [], "answer": "340", "answer_note": "", "concept": "Assign work rates in the efficiency ratio and add up the work done in each phase.", "formulas": ["Work = Rate × Time"], "solution": ["1. Let Chandan do x per day; then Bipin 2x and Ankita 4x.", "2. First 20 days (all three): 7x × 20 = 140x.", "3. Remaining 40 days (Ankita and Chandan): 5x × 40 = 200x.", "4. Total work = 340x, so Chandan alone needs 340 days."], "shortcut": "", "source_url": "https://cracku.in/67-ankita-is-twice-as-efficient-as-bipin-while-bipin--x-cat-2025-slot-2"}, {"id": "2025-S2-Q22", "year": 2025, "slot": 2, "q_no": 22, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – sharing a sum", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 77.07% correct", "question": "A sum of money is shared among Pinu, Meena, Rinu and Seema. Pinu gets 20% of the total, Meena gets 40% of what is left after Pinu, and Seema gets 20% less than Pinu. Rinu gets the rest. Find Pinu's share : Rinu's share.", "options": ["2:1", "1:2", "5:8", "8:5"], "answer": "5:8", "answer_note": "", "concept": "Take the total as 100 and compute each share in turn.", "formulas": ["x% less than A = A(1 − x/100)"], "solution": ["1. Total = 100. Pinu = 20.", "2. Remaining 80; Meena = 40% of 80 = 32.", "3. Seema = 20 × 0.8 = 16.", "4. Rinu = 100 − 20 − 32 − 16 = 32.", "5. Pinu : Rinu = 20 : 32 = 5 : 8."], "shortcut": "", "source_url": "https://cracku.in/68-a-certain-amount-of-money-was-divided-among-pinu-m-x-cat-2025-slot-2"}, {"id": "2025-S3-Q01", "year": 2025, "slot": 3, "q_no": 1, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Marked price & discount", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.98% correct", "question": "A shop sells a product at one fixed marked price throughout January to April. Units sold: 120 in January, 135 in February, 150 in March and 165 in April. The discounts on the marked price are 20% in January, 10% in February, 5% in March and none in April. Each unit costs Rs. 240. If the total profit over the four months is Rs. 1,38,825, what is the marked price per unit (in Rs.)?", "options": ["520", "525", "510", "515"], "answer": "525", "answer_note": "", "concept": "Total revenue at varying discounts is a single multiple of the marked price; profit = revenue − total cost gives a linear equation.", "formulas": ["Selling price = MP × (1 − discount%)", "Profit = Total revenue − Total cost"], "solution": ["1. Total units = 120 + 135 + 150 + 165 = 570, so total cost = 570 × 240 = Rs. 1,36,800.", "2. Let MP = M. Revenue = 120(0.8M) + 135(0.9M) + 150(0.95M) + 165M = 96M + 121.5M + 142.5M + 165M = 525M.", "3. Profit: 525M − 1,36,800 = 1,38,825, so 525M = 2,75,625.", "4. M = 2,75,625 ÷ 525 = 525."], "shortcut": "Revenue coefficient comes to exactly 525, and 2,75,625 = 525², so MP = 525.", "source_url": "https://cracku.in/47-the-monthly-sales-of-a-product-from-january-to-apr-x-cat-2025-slot-3"}, {"id": "2025-S3-Q02", "year": 2025, "slot": 3, "q_no": 2, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – individual efficiency", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 20.43% correct", "question": "Teams A, B and C have 5, 8 and 10 members respectively, and all members of the same team work at the same rate. Working alone, team A finishes a job in 40 hours, team B in 50 hours and team C in 4 hours. Two members of A, three of B and one of C start the job together. After 23 hours the member from C leaves. How many extra members from team B must join in his place so that the job is completed in exactly one more hour?", "options": ["4", "2", "1", "3"], "answer": "2", "answer_note": "", "concept": "Convert team rates into per-member rates, compute work done, then find how many extra workers finish the rest in the given time.", "formulas": ["Per-member rate = 1 ÷ (team size × team time)", "Work = rate × time"], "solution": ["1. Per-member rates (job/hour): A = 1/(5×40) = 1/200, B = 1/(8×50) = 1/400, C = 1/(10×4) = 1/40.", "2. Combined rate of 2A + 3B + 1C = 2/200 + 3/400 + 1/40 = (4 + 3 + 10)/400 = 17/400.", "3. Work in 23 hours = 23 × 17/400 = 391/400; remaining = 9/400.", "4. Without C, the group does 2/200 + 3/400 = 7/400 per hour, so 2/400 is still needed in the last hour.", "5. Each B member gives 1/400 per hour, so 2 extra B members are required."], "shortcut": "Work in units of 1/400: A-member = 2, B-member = 1, C-member = 10; need 9 units in last hour from 4 + 3 = 7, so 2 more B.", "source_url": "https://cracku.in/48-teams-a-b-and-c-consist-of-five-eight-and-ten-memb-x-cat-2025-slot-3"}, {"id": "2025-S3-Q03", "year": 2025, "slot": 3, "q_no": 3, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Integer solutions with constraint – maximisation", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 6.49% correct", "question": "A school has 1500 students, and each chooses exactly one stream: science, arts or commerce. The annual fee per student is Rs. 1100 for science, Rs. 1000 for arts and Rs. 800 for commerce. The total fee collected is Rs. 15,50,000. If the number of science students does not exceed the number of arts students, what is the largest possible number of science students?", "options": [], "answer": "700", "answer_note": "", "concept": "Two linear equations in three unknowns leave one free variable; the inequality and non-negativity bound it.", "formulas": ["s + a + c = 1500", "1100s + 1000a + 800c = 15,50,000"], "solution": ["1. Let s, a, c be the numbers in science, arts, commerce. Then s + a + c = 1500.", "2. Subtract 800 × (first equation) from the fee equation: 300s + 200a = 15,50,000 − 12,00,000 = 3,50,000, i.e. 3s + 2a = 3500.", "3. So a = (3500 − 3s)/2. The condition s ≤ a gives 2s ≤ 3500 − 3s, i.e. 5s ≤ 3500, s ≤ 700.", "4. At s = 700: a = 700, c = 100, all valid non-negative integers.", "5. Maximum number of science students = 700."], "shortcut": "3s + 2a = 3500 with s = a at the boundary gives 5s = 3500.", "source_url": "https://cracku.in/49-in-a-school-with-1500-students-each-student-choose-x-cat-2025-slot-3"}, {"id": "2025-S3-Q04", "year": 2025, "slot": 3, "q_no": 4, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – sum of terms", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 35.17% correct", "question": "In an arithmetic progression, the 4th, 7th and 10th terms add up to 99, and the sum of the first 14 terms is 497. Find the sum of the first 5 terms.", "options": [], "answer": "65", "answer_note": "", "concept": "Express AP terms and sums in terms of first term a and common difference d and solve the two linear equations.", "formulas": ["Tₙ = a + (n − 1)d", "Sₙ = (n/2)[2a + (n − 1)d]"], "solution": ["1. T₄ + T₇ + T₁₀ = 3a + 18d = 99, so a + 6d = 33 (this is T₇).", "2. S₁₄ = 7(2a + 13d) = 497, so 2a + 13d = 71.", "3. From step 1, 2a + 12d = 66; subtracting gives d = 5, and then a = 33 − 30 = 3.", "4. S₅ = (5/2)(2×3 + 4×5) = (5/2)(26) = 65."], "shortcut": "S₅ = 5 × T₃ = 5 × (a + 2d) = 5 × 13 = 65.", "source_url": "https://cracku.in/50-in-an-arithmetic-progression-if-the-sum-of-fourth--x-cat-2025-slot-3"}, {"id": "2025-S3-Q05", "year": 2025, "slot": 3, "q_no": 5, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed ratio – walking and running", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 10.62% correct", "question": "Ankita walks from A to C via B, and then runs back from C to A along the same path. Her running speed is 40% more than her walking speed. Walking from B to C takes her 3 hours 30 minutes, and running from B to A also takes 3 hours 30 minutes. How many minutes, in total, would she take to walk from A to B and to run from B to C?", "options": [], "answer": "444", "answer_note": "", "concept": "For a fixed distance, time is inversely proportional to speed; a 40% higher speed means time is multiplied by 1/1.4.", "formulas": ["Time ∝ 1/Speed for fixed distance", "Running speed = 1.4 × walking speed"], "solution": ["1. Let walking speed = w, running speed = 1.4w.", "2. BC = 3.5w, so running B→C takes 3.5w ÷ 1.4w = 2.5 hours = 150 minutes.", "3. AB = 3.5 × 1.4w = 4.9w, so walking A→B takes 4.9 hours = 294 minutes.", "4. Total = 294 + 150 = 444 minutes."], "shortcut": "Walk time = 1.4 × run time for the same stretch: 210 × 1.4 + 210 ÷ 1.4 = 294 + 150.", "source_url": "https://cracku.in/51-ankita-walks-from-a-to-c-through-b-and-runs-back-t-x-cat-2025-slot-3"}, {"id": "2025-S3-Q06", "year": 2025, "slot": 3, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Digits – conditions on a 4-digit number", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 16.83% correct", "question": "A 4-digit number (greater than 1000) is such that its thousands, hundreds and tens digits add up to 15, its hundreds, tens and units digits add up to 16, and its tens digit exceeds its units digit by 6. What is the difference between the largest and the smallest such number?", "options": ["811", "3289", "735", "4078"], "answer": "811", "answer_note": "", "concept": "Translate digit conditions into equations, then enumerate the few digit choices allowed.", "formulas": ["Number = 1000a + 100b + 10c + d", "Digits lie between 0 and 9"], "solution": ["1. Let the number be abcd. Then a + b + c = 15, b + c + d = 16, c = d + 6.", "2. Subtracting the first two: d − a = 1, so d = a + 1 and c = a + 7.", "3. c ≤ 9 forces a ≤ 2, and a ≥ 1, so a = 1 or 2.", "4. a = 1: d = 2, c = 8, b = 15 − 1 − 8 = 6 → 1682. a = 2: d = 3, c = 9, b = 15 − 2 − 9 = 4 → 2493.", "5. Difference = 2493 − 1682 = 811."], "shortcut": "", "source_url": "https://cracku.in/52-for-a-4-digit-number-greater-than-1000-sum-of-the--x-cat-2025-slot-3"}, {"id": "2025-S3-Q07", "year": 2025, "slot": 3, "q_no": 7, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Stoppage and speed increase", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.86% correct", "question": "Rahul sets out at 5 pm at a constant speed and is due to reach his destination at 11 pm the same day. Somewhere on the way he halts for 20 minutes, and after the halt he increases his speed by 3 km/h so that he still arrives at 11 pm. Had the halt been 10 minutes longer (at the same point), he would have had to increase his speed by 5 km/h to reach on time. What is his initial speed in km/h?", "options": ["12", "15", "18", "20"], "answer": "15", "answer_note": "", "concept": "After the halt, the remaining distance must be covered in (original remaining time − halt); this gives an equation for the remaining time in each scenario.", "formulas": ["Remaining distance = s × T = (s + Δs) × (T − halt)", "⇒ T = halt × (s + Δs)/Δs"], "solution": ["1. Let initial speed be s km/h and T hours be the time that would have remained after the halt point at speed s.", "2. Case 1: sT = (s + 3)(T − 1/3) ⇒ 3T = (s + 3)/3 ⇒ T = (s + 3)/9.", "3. Case 2: sT = (s + 5)(T − 1/2) ⇒ 5T = (s + 5)/2 ⇒ T = (s + 5)/10.", "4. Equate: 10(s + 3) = 9(s + 5) ⇒ s = 15 km/h (T = 2 hours, within the 6-hour trip)."], "shortcut": "Test options: s = 15 gives T = 18/9 = 2 and 20/10 = 2 — consistent.", "source_url": "https://cracku.in/53-rahul-starts-on-his-journey-at-5-pm-at-a-constant--x-cat-2025-slot-3"}, {"id": "2025-S3-Q08", "year": 2025, "slot": 3, "q_no": 8, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes & cisterns – rate ratio", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 41.17% correct", "question": "Water flows through pipes A, B and C at rates in the ratio 4 : 9 : 36. Pipe A by itself fills an empty tank in 15 hours. If all three pipes are opened together, approximately how many minutes will it take to fill the empty tank?", "options": ["73", "78", "76", "71"], "answer": "73", "answer_note": "", "concept": "Use the rate ratio to express the tank's capacity in rate units, then divide by the combined rate.", "formulas": ["Capacity = rate × time", "Combined rate = sum of rates"], "solution": ["1. Let the rates be 4k, 9k and 36k per hour.", "2. Capacity = 4k × 15 = 60k.", "3. Combined rate = 49k, so time = 60k ÷ 49k = 60/49 hours.", "4. In minutes: 3600/49 ≈ 73.47, i.e. about 73 minutes."], "shortcut": "60/49 h is a little over 1.22 h ≈ 73 min.", "source_url": "https://cracku.in/54-the-rate-of-water-flow-through-three-pipes-a-b-and-x-cat-2025-slot-3"}, {"id": "2025-S3-Q09", "year": 2025, "slot": 3, "q_no": 9, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Quartic via substitution", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.69% correct", "question": "Let f(x) = (x² + 3x)(x² + 3x + 2). Find the sum of all real roots of the equation √(f(x) + 1) = 9701.", "options": ["-6", "6", "3", "-3"], "answer": "-3", "answer_note": "", "concept": "The product of two expressions differing by 2, plus 1, is a perfect square; this reduces the quartic to a quadratic.", "formulas": ["t(t + 2) + 1 = (t + 1)²", "Sum of roots of ax² + bx + c = 0 is −b/a"], "solution": ["1. Put t = x² + 3x. Then f(x) + 1 = t(t + 2) + 1 = (t + 1)².", "2. So √(f(x) + 1) = |x² + 3x + 1| = 9701.", "3. Case x² + 3x + 1 = 9701: x² + 3x − 9700 = 0, discriminant 9 + 38800 > 0, giving roots 97 and −100 (sum −3).", "4. Case x² + 3x + 1 = −9701: x² + 3x + 9702 = 0 has negative discriminant, so no real roots.", "5. Sum of all real roots = −3."], "shortcut": "", "source_url": "https://cracku.in/55-if-fx-x2-3xx2-3x2-then-the-sum-of-all-real-roots-o-x-cat-2025-slot-3"}, {"id": "2025-S3-Q10", "year": 2025, "slot": 3, "q_no": 10, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Range of a rational function", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 11.52% correct", "question": "For real x, find the range of the function f(x) = (2x − 3)/(2x² + 4x − 6).", "options": ["(−∞, 1/8] ∪ [1, ∞)", "(−∞, 1/4] ∪ [1, ∞)", "(−∞, 1/8] ∪ [1/2, ∞)", "(−∞, 1/4] ∪ [1/2, ∞)"], "answer": "(−∞, 1/8] ∪ [1/2, ∞)", "answer_note": "", "concept": "Set y = f(x) and require the resulting quadratic in x to have real roots (discriminant ≥ 0), checking excluded points.", "formulas": ["For ax² + bx + c = 0 to have real roots: b² − 4ac ≥ 0"], "solution": ["1. Let y = (2x − 3)/(2x² + 4x − 6). Then 2yx² + (4y − 2)x + (3 − 6y) = 0.", "2. For real x (y ≠ 0): (4y − 2)² − 8y(3 − 6y) ≥ 0 ⇒ 64y² − 40y + 4 ≥ 0 ⇒ 4(8y − 1)(2y − 1) ≥ 0.", "3. Hence y ≤ 1/8 or y ≥ 1/2. Also y = 0 is attained at x = 3/2, which lies in y ≤ 1/8.", "4. The excluded points x = 1 and x = −3 (denominator zero) never satisfy the quadratic, so no value is lost.", "5. Range = (−∞, 1/8] ∪ [1/2, ∞)."], "shortcut": "Plug in x = 0: f(0) = 1/2, which rules out options with [1, ∞).", "source_url": "https://cracku.in/56-for-real-values-of-x-the-range-of-the-function-fxd-x-cat-2025-slot-3"}, {"id": "2025-S3-Q11", "year": 2025, "slot": 3, "q_no": 11, "area": "Number System", "topic": "Number System", "subtopic": "Digit sum of large numbers", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 17.87% correct", "question": "What is the sum of all digits of the number 10⁵⁰ + 10²⁵ − 123?", "options": ["212", "221", "324", "255"], "answer": "221", "answer_note": "", "concept": "Write the number's decimal form by handling the subtraction from the power of 10 and then add the separate block.", "formulas": ["10ⁿ − k produces a string of 9s followed by (10^m − k)"], "solution": ["1. 10²⁵ − 123 = 99…9877, i.e. twenty-two 9s followed by 877 (25 digits).", "2. Adding 10⁵⁰ simply places a 1 at the 51st digit, with zeros in between: 1 000…0 99…9 877.", "3. Digit sum = 1 + 22 × 9 + 8 + 7 + 7 = 1 + 198 + 22 = 221."], "shortcut": "Small case: 10⁶ + 10³ − 123 = 1000877 shows the pattern.", "source_url": "https://cracku.in/57-the-sum-of-all-the-digits-of-the-number-10501025-1-x-cat-2025-slot-3"}, {"id": "2025-S3-Q12", "year": 2025, "slot": 3, "q_no": 12, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – altitudes via area", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 10.27% correct", "question": "In triangle ABC, AB = AC = 50 cm and BC = 80 cm. Find the sum of the lengths (in cm) of its three altitudes.", "options": [], "answer": "126", "answer_note": "", "concept": "Compute the area once using the altitude to the base, then get the other altitudes from area = ½ × side × altitude.", "formulas": ["Area = ½ × base × height", "Altitude to side s = 2 × Area ÷ s"], "solution": ["1. The altitude from A bisects BC: h_A = √(50² − 40²) = 30 cm.", "2. Area = ½ × 80 × 30 = 1200 cm².", "3. Altitudes to AB and AC: 2 × 1200 ÷ 50 = 48 cm each.", "4. Sum = 30 + 48 + 48 = 126 cm."], "shortcut": "", "source_url": "https://cracku.in/58-a-triangle-abc-is-formed-with-ab-ac-50-cm-and-bc-8-x-cat-2025-slot-3"}, {"id": "2025-S3-Q13", "year": 2025, "slot": 3, "q_no": 13, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Algebraic identities – x + 1/x powers", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.87% correct", "question": "Given x > 0 and x² + 1/x² = 25, find the value of x⁷ + 1/x⁷.", "options": ["44853√3", "44856√3", "44859√3", "44850√3"], "answer": "44853√3", "answer_note": "", "concept": "Build higher powers of x + 1/x from lower ones using standard identities and the product rule for xᵐ + x⁻ᵐ.", "formulas": ["(x + 1/x)² = x² + 1/x² + 2", "x³ + 1/x³ = (x + 1/x)³ − 3(x + 1/x)", "(x³ + 1/x³)(x⁴ + 1/x⁴) = (x⁷ + 1/x⁷) + (x + 1/x)"], "solution": ["1. (x + 1/x)² = 27, and x > 0, so x + 1/x = 3√3.", "2. x³ + 1/x³ = (3√3)³ − 3(3√3) = 81√3 − 9√3 = 72√3.", "3. x⁴ + 1/x⁴ = 25² − 2 = 623.", "4. (x³ + 1/x³)(x⁴ + 1/x⁴) = x⁷ + 1/x⁷ + x + 1/x, so x⁷ + 1/x⁷ = 72√3 × 623 − 3√3 = 44856√3 − 3√3 = 44853√3."], "shortcut": "Unit-digit check: 72 × 623 ends in 6, minus 3 gives last digit 3 — only 44853√3 fits.", "source_url": "https://cracku.in/59-if-left-x2frac1x2-right25-and-xgt0-then-the-value--x-cat-2025-slot-3"}, {"id": "2025-S3-Q14", "year": 2025, "slot": 3, "q_no": 14, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Three-set Venn – maximisation", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 9.54% correct", "question": "In a class of 150 students, every student chose at least one of Physics, Mathematics and Chemistry: 75 chose Physics, 111 chose Mathematics and 40 chose Chemistry. At least one student chose all three. The number choosing both Physics and Chemistry equals the number choosing both Chemistry and Mathematics, and this number is half the number choosing both Physics and Mathematics. What is the maximum possible number of students who chose Physics but not Mathematics?", "options": ["30", "35", "40", "55"], "answer": "35", "answer_note": "", "concept": "Use inclusion–exclusion to fix the pairwise counts in terms of the triple overlap, then pick the overlap that maximises the target region.", "formulas": ["n(P∪M∪C) = n(P) + n(M) + n(C) − n(P∩M) − n(P∩C) − n(M∩C) + n(P∩M∩C)", "n(P only or P∩C only) = n(P) − n(P∩M)"], "solution": ["1. Let n(P∩C) = n(C∩M) = k and n(P∩M) = 2k; let g = n(all three) ≥ 1.", "2. Inclusion–exclusion: 150 = 75 + 111 + 40 − 4k + g ⇒ 4k − g = 76 ⇒ g = 4k − 76.", "3. Physics but not Maths = n(P) − n(P∩M) = 75 − 2k, so k should be as small as possible.", "4. g ≥ 1 ⇒ 4k ≥ 77 ⇒ k ≥ 20 (k = 20 gives g = 4). Check regions: P only 19, M only 55, C only 4, PM-only 36, PC-only 16, CM-only 16, all 4 — all non-negative, total 150.", "5. Maximum = 75 − 40 = 35."], "shortcut": "", "source_url": "https://cracku.in/60-in-a-class-of-150-students-75-students-chose-physi-x-cat-2025-slot-3"}, {"id": "2025-S3-Q15", "year": 2025, "slot": 3, "q_no": 15, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log equation with variable base", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 13.56% correct", "question": "Find the sum of all real values of x satisfying log₍ₓ₋₃₎(x² − 9) = log₍ₓ₋₃₎(x + 1) + 2.", "options": ["−3", "√33", "3", "(3 + √33)/2"], "answer": "(3 + √33)/2", "answer_note": "", "concept": "Combine the logs into a single equation, then discard roots that violate the base and argument conditions.", "formulas": ["log_b(M) − log_b(N) = log_b(M/N)", "log_b(M) = k ⇔ M = bᵏ", "Base b > 0, b ≠ 1; arguments > 0"], "solution": ["1. Domain: x − 3 > 0, x − 3 ≠ 1, x² − 9 > 0, x + 1 > 0 ⇒ x > 3, x ≠ 4.", "2. Rewrite: log₍ₓ₋₃₎[(x² − 9)/(x + 1)] = 2 ⇒ (x − 3)(x + 3) = (x + 1)(x − 3)².", "3. Divide by (x − 3) ≠ 0: x + 3 = (x + 1)(x − 3) = x² − 2x − 3 ⇒ x² − 3x − 6 = 0.", "4. x = (3 ± √33)/2. Only (3 + √33)/2 ≈ 4.37 satisfies x > 3, x ≠ 4.", "5. Sum of valid values = (3 + √33)/2."], "shortcut": "The negative root (≈ −1.37) makes the base negative, so only one root survives.", "source_url": "https://cracku.in/61-the-sum-of-all-possible-real-values-of-x-for-which-x-cat-2025-slot-3"}, {"id": "2025-S3-Q16", "year": 2025, "slot": 3, "q_no": 16, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Weighted average with percentage change", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 45.9% correct", "question": "A company has 5 managers and 25 engineers, and the average salary of all 30 employees is Rs. 60,000. Each manager's salary is raised by 20% while engineers' salaries remain the same, and as a result the average salary of all 30 rises by 5%. What is the average salary of an engineer (in Rs.)?", "options": ["45000", "50000", "54000", "40000"], "answer": "54000", "answer_note": "", "concept": "The increase in total payroll comes only from managers, which fixes the managers' total; the rest belongs to engineers.", "formulas": ["Total = average × count", "Increase = 20% of managers' total"], "solution": ["1. Total salary = 30 × 60,000 = Rs. 18,00,000.", "2. New average is 5% higher, so the total rises by 5% of 18,00,000 = Rs. 90,000.", "3. This is 20% of the managers' total, so managers' total = 90,000 ÷ 0.2 = Rs. 4,50,000.", "4. Engineers' total = 18,00,000 − 4,50,000 = 13,50,000; average = 13,50,000 ÷ 25 = Rs. 54,000."], "shortcut": "", "source_url": "https://cracku.in/62-the-average-salary-of-5-managers-and-25-engineers--x-cat-2025-slot-3"}, {"id": "2025-S3-Q17", "year": 2025, "slot": 3, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Tangential right trapezium – incircle", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.54% correct", "question": "ABCD is a trapezium with AB ∥ DC and AD ⊥ AB, and AB = 3 × DC. A circle of radius 3 cm touches all four sides. Find the area of the trapezium in cm².", "options": ["48", "30√3", "36√2", "54"], "answer": "48", "answer_note": "", "concept": "In a quadrilateral with an incircle, the sums of opposite sides are equal; the height of the trapezium equals the diameter.", "formulas": ["Tangential quadrilateral: AB + DC = AD + BC", "Area of trapezium = ½ × (sum of parallel sides) × height"], "solution": ["1. The perpendicular side AD equals the circle's diameter: AD = 6 cm. Let DC = a, AB = 3a.", "2. Slant side BC: horizontal offset 3a − a = 2a, vertical 6, so BC = √(4a² + 36).", "3. Tangential condition: 3a + a = 6 + BC ⇒ BC = 4a − 6.", "4. Square: (4a − 6)² = 4a² + 36 ⇒ 16a² − 48a + 36 = 4a² + 36 ⇒ 12a² = 48a ⇒ a = 4.", "5. Area = ½ × (12 + 4) × 6 = 48 cm²."], "shortcut": "Sides 12, 4, height 6, slant 10 — a 6-8-10 triangle; 12 + 4 = 6 + 10 checks.", "source_url": "https://cracku.in/63-abcd-is-a-trapezium-in-which-ab-is-parallel-to-dc--x-cat-2025-slot-3"}, {"id": "2025-S3-Q18", "year": 2025, "slot": 3, "q_no": 18, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Indices – comparing prime powers", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 12.68% correct", "question": "x, y and z are natural numbers satisfying 12^(12x) × 4^(24x + 12) × 5^(2y) = 8^(4z) × 20^(12x) × 243^(3x − 6). Find x + y + z.", "options": [], "answer": "112", "answer_note": "", "concept": "Write every base as a product of primes and equate the exponents of each prime on both sides.", "formulas": ["(ab)ⁿ = aⁿbⁿ", "If 2^p 3^q 5^r = 2^p' 3^q' 5^r', then p = p', q = q', r = r'"], "solution": ["1. Left side: 12^(12x) = 2^(24x) 3^(12x); 4^(24x+12) = 2^(48x+24); 5^(2y). Total: 2^(72x+24) × 3^(12x) × 5^(2y).", "2. Right side: 8^(4z) = 2^(12z); 20^(12x) = 2^(24x) 5^(12x); 243^(3x−6) = 3^(15x−30). Total: 2^(12z+24x) × 3^(15x−30) × 5^(12x).", "3. Powers of 3: 12x = 15x − 30 ⇒ x = 10.", "4. Powers of 5: 2y = 12x = 120 ⇒ y = 60.", "5. Powers of 2: 72x + 24 = 12z + 24x ⇒ 744 = 12z + 240 ⇒ z = 42. So x + y + z = 10 + 60 + 42 = 112."], "shortcut": "", "source_url": "https://cracku.in/64-if-1212xtimes-424x12times-52y84ztimes-20-12x-times-x-cat-2025-slot-3"}, {"id": "2025-S3-Q19", "year": 2025, "slot": 3, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Similar triangles", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.85% correct", "question": "In triangle ABC, AB = AC = 12 cm. D is a point on BC with AD = 8 cm. AD is produced beyond D to a point E such that ∠AEB = ∠ACB. Find AE in cm.", "options": ["20", "16", "18", "14"], "answer": "18", "answer_note": "", "concept": "Equal base angles of an isosceles triangle transfer the given angle condition into an AA similarity sharing angle A.", "formulas": ["AA similarity", "In similar triangles corresponding sides are proportional"], "solution": ["1. Since AB = AC, ∠ABC = ∠ACB, so ∠AEB = ∠ACB = ∠ABD.", "2. Triangles ABD and AEB share ∠BAD (= ∠BAE), and ∠ABD = ∠AEB, so △ABD ∼ △AEB.", "3. Corresponding sides: AB/AE = AD/AB ⇒ AB² = AD × AE.", "4. AE = 12² ÷ 8 = 144/8 = 18 cm."], "shortcut": "AB² = AD × AE (AB is tangent to circle through B, D, E).", "source_url": "https://cracku.in/65-in-triangle-abc-ab-ac-12-cm-and-d-is-a-point-on-si-x-cat-2025-slot-3"}, {"id": "2025-S3-Q20", "year": 2025, "slot": 3, "q_no": 20, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – replacement between vessels", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.71% correct", "question": "Vessel A holds 60 litres of pure alcohol and vessel B holds 60 litres of pure water. Some volume is drawn from A and poured into B, and B is mixed thoroughly. Then the same volume is drawn from B and poured into A. Now the ratio of alcohol to water in A is 15 : 4. How many litres were originally drawn from A?", "options": [], "answer": "16", "answer_note": "", "concept": "Track alcohol through the two transfers; A returns to 60 litres in total, so the ratio gives the alcohol quantity directly.", "formulas": ["Fraction of a component in a uniform mixture = its quantity ÷ total", "Amount of component removed = volume removed × fraction"], "solution": ["1. Let x litres be drawn. A has 60 − x alcohol; B has x alcohol + 60 water (60 + x litres).", "2. Drawing x from B returns alcohol x × x/(60 + x) and water x × 60/(60 + x) to A. A again holds 60 litres.", "3. Water in A = 60x/(60 + x). Ratio 15 : 4 means water = (4/19) × 60 = 240/19.", "4. 60x/(60 + x) = 240/19 ⇒ 1140x = 14400 + 240x ⇒ 900x = 14400 ⇒ x = 16 litres."], "shortcut": "Alcohol in A = 3600/(60 + x) = (15/19) × 60 ⇒ 60 + x = 76.", "source_url": "https://cracku.in/66-vessels-a-and-b-contain-60-litres-of-alcohol-and-6-x-cat-2025-slot-3"}, {"id": "2025-S3-Q21", "year": 2025, "slot": 3, "q_no": 21, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – transfer between groups", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 24.18% correct", "question": "Boxes A and B contain coins in the ratio 17 : 7. After 108 coins are moved from A to B, the ratio becomes 37 : 20. How many more coins must be moved from A to B so that both boxes have the same number of coins?", "options": [], "answer": "272", "answer_note": "", "concept": "The total is unchanged by transfers, so both ratios split the same total; equate the change in A's share to 108.", "formulas": ["Total remains constant during transfer", "Share = (part ÷ sum of ratio terms) × total"], "solution": ["1. Let A = 17k, B = 7k (total 24k). After the transfer: (17k − 108)/(7k + 108) = 37/20.", "2. 20(17k − 108) = 37(7k + 108) ⇒ 340k − 2160 = 259k + 3996 ⇒ 81k = 6156 ⇒ k = 76.", "3. Total = 24 × 76 = 1824; for equality each box needs 912.", "4. B now has 7 × 76 + 108 = 640, so 912 − 640 = 272 more coins must move."], "shortcut": "Total is a multiple of both 24 and 57: B's share changes from 7/24 to 20/57 of total, a difference of 108.", "source_url": "https://cracku.in/67-the-ratio-of-the-number-of-coins-in-boxes-a-and-b--x-cat-2025-slot-3"}, {"id": "2025-S3-Q22", "year": 2025, "slot": 3, "q_no": 22, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Max/min under constraints", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 2.29% <script>
(function () {
  const RAW = JSON.parse(document.getElementById('qdata').textContent);
  const Q = RAW.questions;
  const AREAS = ['Arithmetic', 'Algebra', 'Geometry', 'Number System', 'Modern Math'];
  const TOPICS = RAW.topics; // ordered [{topic, area}]
  const DIFFS = ['Easy', 'Medium', 'Hard'];
  const PAGE = 40;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const done = new Set(store.get('cq-done', []));
  const st = Object.assign({ areas: [], topic: '', year: '', slot: '', diffs: [], type: '', group: 'topic', search: '', open: false, hideDone: false }, store.get('cq-filters', {}));
  let shown = PAGE;

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const slotLabel = (q) => q.year === 2014 ? (q.slot ? 'Session ' + q.slot : 'session not stated') : 'Slot ' + q.slot;

  // header stats
  const papers = new Set(Q.map((q) => q.year + '-' + q.slot));
  const s = $('stats');
  [['questions', Q.length], ['papers', papers.size], ['topics', TOPICS.length]].forEach(([k, v]) => {
    const span = el('span'); span.append(el('b', null, v.toLocaleString('en-IN')), ' ' + k); s.append(span);
  });
  const dc = DIFFS.map((d) => Q.filter((q) => q.difficulty === d).length);
  const span = el('span'); span.append('Easy ', el('b', null, dc[0]), ' · Medium ', el('b', null, dc[1]), ' · Hard ', el('b', null, dc[2])); s.append(span);

  // controls
  function chips(container, values, key) {
    values.forEach((v) => {
      const b = el('button', 'chip', v); b.type = 'button';
      b.setAttribute('aria-pressed', st[key].includes(v));
      b.addEventListener('click', () => {
        const i = st[key].indexOf(v); if (i >= 0) st[key].splice(i, 1); else st[key].push(v);
        b.setAttribute('aria-pressed', st[key].includes(v));
        if (key === 'areas') fillTopics();
        update();
      });
      container.append(b);
    });
  }
  chips($('areaChips'), AREAS, 'areas');
  chips($('diffChips'), DIFFS, 'diffs');

  function fillTopics() {
    const sel = $('fTopic'); sel.replaceChildren(new Option('All topics', ''));
    TOPICS.filter((t) => !st.areas.length || st.areas.includes(t.area)).forEach((t) => sel.append(new Option(t.topic, t.topic)));
    if (![...sel.options].some((o) => o.value === st.topic)) st.topic = '';
    sel.value = st.topic;
  }
  fillTopics();
  const years = [...new Set(Q.map((q) => q.year))].sort((a, b) => b - a);
  $('fYear').append(new Option('All years', ''), ...years.map((y) => new Option('CAT ' + y, y)));
  $('fSlot').append(new Option('All slots', ''), new Option('Slot 1', '1'), new Option('Slot 2', '2'), new Option('Slot 3', '3'));
  $('fYear').value = st.year; $('fSlot').value = st.slot; $('fType').value = st.type; $('fGroup').value = st.group;
  $('fSearch').value = st.search; $('fOpen').checked = st.open; $('fHideDone').checked = st.hideDone;
  [['fTopic', 'topic'], ['fYear', 'year'], ['fSlot', 'slot'], ['fType', 'type'], ['fGroup', 'group']].forEach(([id, k]) => $(id).addEventListener('change', (e) => { st[k] = e.target.value; update(); }));
  let t; $('fSearch').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { st.search = e.target.value; update(); }, 150); });
  $('fOpen').addEventListener('change', (e) => { st.open = e.target.checked; render(); store.set('cq-filters', st); });
  $('fHideDone').addEventListener('change', (e) => { st.hideDone = e.target.checked; update(); });

  function filtered() {
    const words = st.search.toLowerCase().split(/\s+/).filter(Boolean);
    return Q.filter((q) =>
      (!st.areas.length || st.areas.includes(q.area)) &&
      (!st.topic || q.topic === st.topic) &&
      (!st.year || q.year === +st.year) &&
      (!st.slot || q.slot === +st.slot) &&
      (!st.diffs.length || st.diffs.includes(q.difficulty)) &&
      (!st.type || q.type === st.type) &&
      (!st.hideDone || !done.has(q.id)) &&
      (!words.length || words.every((w) => q._hay.includes(w))));
  }
  Q.forEach((q) => { q._hay = [q.question, q.subtopic, q.topic, (q.options || []).join(' '), q.concept].join(' ').toLowerCase(); });

  const topicIdx = new Map(TOPICS.map((t, i) => [t.topic, i]));
  const byPaperDesc = (a, b) => (b.year - a.year) || (a.slot - b.slot) || (a.q_no - b.q_no);

  function card(q) {
    const c = el('article', 'q' + (done.has(q.id) ? ' done' : '')); c.id = q.id;
    const m = el('div', 'meta');
    m.append(el('span', 'paper', 'CAT ' + q.year + ' · ' + slotLabel(q) + ' · Q' + q.q_no));
    m.append(el('span', 'pill ' + q.difficulty, q.difficulty));
    m.append(el('span', 'pill type', q.type));
    if (q.year < 2017) m.append(el('span', 'pill type', 'Memory-based'));
    if (q.difficulty_basis) m.append(el('span', 'basis', q.difficulty_basis));
    c.append(m);
    c.append(el('div', 'sub', (st.group === 'paper' ? q.topic + ' · ' : '') + (q.subtopic || '')));
    c.append(el('p', 'qtext', q.question));
    if (q.options && q.options.length) {
      const ol = el('ol', 'opts');
      q.options.forEach((o, i) => {
        const li = el('li'); li.dataset.o = o;
        li.append(el('span', 'k', String.fromCharCode(65 + i) + '.'), el('span', 't', o));
        ol.append(li);
      });
      c.append(ol);
    }
    const d = el('details', 'sol'); d.open = st.open;
    d.append(el('summary', null, 'Solution'));
    const body = el('div', 'solbody');
    const a = el('div', 'ans'); a.append('Answer: ', el('b', null, q.answer)); body.append(a);
    if (q.answer_note) body.append(el('div', 'note', q.answer_note));
    if (q.concept) { const b = el('div', 'block'); b.append(el('h4', null, 'Concept'), el('p', null, q.concept)); body.append(b); }
    if (q.formulas && q.formulas.length) { const b = el('div', 'block'); b.append(el('h4', null, 'Formula')); const f = el('div', 'forms'); q.formulas.forEach((x) => f.append(el('code', null, x))); b.append(f); body.append(b); }
    if (q.solution && q.solution.length) { const b = el('div', 'block'); b.append(el('h4', null, 'Solution')); const ol = el('ol', 'steps'); q.solution.forEach((x) => ol.append(el('li', null, x.replace(/^\s*\d+[.)]\s*/, '')))); b.append(ol); body.append(b); }
    if (q.shortcut) body.append(el('div', 'shortcut', 'Shortcut: ' + q.shortcut));
    d.append(body);
    d.addEventListener('toggle', () => {
      const lis = c.querySelectorAll('ol.opts li');
      lis.forEach((li) => li.classList.toggle('right', d.open && li.dataset.o.trim() === String(q.answer).trim()));
    });
    if (st.open) setTimeout(() => d.dispatchEvent(new Event('toggle')), 0);
    c.append(d);
    const f = el('div', 'foot');
    const mk = el('button', 'mark', done.has(q.id) ? 'Done ✓' : 'Mark as done'); mk.type = 'button';
    mk.setAttribute('aria-pressed', done.has(q.id));
    mk.addEventListener('click', () => {
      if (done.has(q.id)) done.delete(q.id); else done.add(q.id);
      store.set('cq-done', [...done]);
      mk.setAttribute('aria-pressed', done.has(q.id)); mk.textContent = done.has(q.id) ? 'Done ✓' : 'Mark as done';
      c.classList.toggle('done', done.has(q.id));
    });
    f.append(mk);
    if (q.source_url) { const l = el('a', null, 'Original question ↗'); l.href = q.source_url; l.target = '_blank'; l.rel = 'noopener'; f.append(l); }
    c.append(f);
    return c;
  }

  function render() {
    const list = $('list'); list.replaceChildren();
    const rows = filtered();
    const cnt = $('count'); cnt.replaceChildren(el('b', null, rows.length.toLocaleString('en-IN')), ' of ' + Q.length.toLocaleString('en-IN') + ' questions');
    if (!rows.length) { list.append(el('p', 'empty', 'No questions match these filters. Clear a filter to see more.')); return; }
    let groups;
    if (st.group === 'paper') {
      rows.sort(byPaperDesc);
      groups = d3group(rows, (q) => 'CAT ' + q.year + ' · ' + slotLabel(q), null);
    } else {
      rows.sort((a, b) => (topicIdx.get(a.topic) - topicIdx.get(b.topic)) || byPaperDesc(a, b));
      groups = d3group(rows, (q) => q.topic, (q) => q.area);
    }
    let left = shown;
    for (const g of groups) {
      if (left <= 0) break;
      const sec = el('section', 'group');
      const h = el('h2');
      if (g.area) h.append(el('span', 'area', g.area));
      h.append(g.key, el('span', 'n', g.items.length + (g.items.length === 1 ? ' question' : ' questions')));
      sec.append(h);
      const mix = el('div', 'mix');
      DIFFS.forEach((d) => { const n = g.items.filter((q) => q.difficulty === d).length; if (n) mix.append(el('span', null, d + ' ' + n)); });
      sec.append(mix);
      for (const q of g.items) { if (left-- <= 0) break; sec.append(card(q)); }
      list.append(sec);
    }
    if (rows.length > shown) {
      const b = el('button', 'more', 'Show ' + Math.min(PAGE, rows.length - shown) + ' more (' + (rows.length - shown) + ' left)'); b.type = 'button';
      b.addEventListener('click', () => { shown += PAGE; render(); });
      list.append(b);
    }
    if (RAW.coverage) {
      const cov = el('details', 'cov'); cov.append(el('summary', null, 'Coverage by paper and notes on sources'));
      const tb = el('table'); const hr = el('tr'); ['Paper', 'Questions', 'Note'].forEach((x) => hr.append(el('th', null, x))); tb.append(hr);
      RAW.coverage.forEach((r) => { const tr = el('tr'); [r.paper, r.found + (r.expected ? ' / ' + r.expected : ''), r.note || ''].forEach((x) => tr.append(el('td', null, x))); tb.append(tr); });
      cov.append(tb);
      const p = el('p', null, 'Questions are restated in our own words with the original numbers and options; use the "Original question" link for the exact wording. Difficulty comes from 2IIM\'s share of test-takers who answered correctly where available (40%+ Easy, 20–39% Medium, under 20% Hard), otherwise from the source\'s label or our own assessment, as shown on each card. 2014–2016 papers were never released: 2014 comes from Career Launcher\'s memory-based reconstruction and 2016 Slot 2 from students\' recall right after the exam. CAT 2015 and 2016 Slot 1 are left out because the sets circulating under those names turned out to be compilations of older CAT questions.');
      cov.append(p);
      list.append(cov);
    }
  }
  function d3group(rows, keyFn, areaFn) {
    const out = []; let cur = null;
    rows.forEach((q) => { const k = keyFn(q); if (!cur || cur.key !== k) { cur = { key: k, area: areaFn ? areaFn(q) : '', items: [] }; out.push(cur); } cur.items.push(q); });
    return out;
  }
  function update() { shown = PAGE; store.set('cq-filters', st); render(); }
  render();
})();
</script>
