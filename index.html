₁₀ ≥ mean of top 9). Then a₁ = 2, total = 425, mean = 42.5.", "5. Difference = 46.5 − 42.5 = 4."], "shortcut": "", "source_url": "https://cracku.in/62-in-a-group-of-10-students-the-mean-of-the-lowest-9-x-cat-2020-slot-2"}, {"id": "2020-S2-Q13", "year": 2020, "slot": 2, "q_no": 13, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Meeting point – post-crossing times", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Ram runs from A towards B and Rahim runs from B towards A along the same straight line, starting at the same moment. After they pass each other, Ram reaches B in 1 minute and Rahim reaches A in 4 minutes. What is Ram's speed divided by Rahim's speed?", "options": ["1/2", "√2", "2", "2√2"], "answer": "2", "answer_note": "", "concept": "Standard result: if after meeting two people take t₁ and t₂ to finish, their speeds are in the ratio √t₂ : √t₁.", "formulas": ["v₁/v₂ = √(t₂/t₁), where t₁, t₂ are times taken after meeting"], "solution": ["1. Let they meet after time t; speeds u (Ram) and v (Rahim).", "2. Ram's remaining distance (= Rahim's covered distance) gives u × 1 = v × t.", "3. Rahim's remaining distance gives v × 4 = u × t.", "4. Dividing: u/(4v) = v/u ⇒ u² = 4v² ⇒ u/v = 2."], "shortcut": "", "source_url": "https://cracku.in/63-a-and-b-are-two-points-on-a-straight-line-ram-runs-x-cat-2020-slot-2"}, {"id": "2020-S2-Q14", "year": 2020, "slot": 2, "q_no": 14, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Circular tracks – meeting at the start point", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two circular tracks T1 and T2, of radii 100 m and 20 m, touch each other at point A. Ram walks along T1 at 15 km/hr and Rahim walks along T2 at 5 km/hr, both starting from A at the same time. How many complete rounds of T1 will Ram have finished when the two first meet again?", "options": ["5", "3", "2", "4"], "answer": "3", "answer_note": "The IIMs accepted both 2 and 3 for this question, because the original wording asked how many rounds Ram completes before they meet; 3 counts the round finished at the meeting itself.", "concept": "The tracks share only the point A, so they can meet only at A; the first meeting is at the LCM of their lap times.", "formulas": ["Lap time = circumference ÷ speed", "First meeting at common point = LCM of lap times"], "solution": ["1. Ram's lap time = 200π m ÷ 15000 m/hr = π/75 hr.", "2. Rahim's lap time = 40π m ÷ 5000 m/hr = π/125 hr.", "3. Lap times are in ratio 5 : 3, i.e. Ram's = 5k, Rahim's = 3k.", "4. LCM = 15k, so Ram completes 15k/5k = 3 rounds (Rahim completes 5)."], "shortcut": "", "source_url": "https://cracku.in/64-two-circular-tracks-t1-and-t2-of-radii-100-m-and-2-x-cat-2020-slot-2"}, {"id": "2020-S2-Q15", "year": 2020, "slot": 2, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Concentric circles – tangent chord", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "C1 and C2 are concentric circles, and the diameter of C1 is 2 cm more than the diameter of C2. A chord of C1 that is 6 cm long touches C2. Find the diameter of C1 in cm.", "options": [], "answer": "10", "answer_note": "", "concept": "A chord of the outer circle tangent to the inner circle is bisected at the point of tangency, giving a right triangle with the two radii.", "formulas": ["R² − r² = (half chord)²"], "solution": ["1. Let C1 have radius R; then C2 has radius R − 1 (diameters differ by 2).", "2. The radius of C2 to the tangency point is perpendicular to the chord and bisects it: half-chord = 3.", "3. R² − (R − 1)² = 9 ⇒ 2R − 1 = 9 ⇒ R = 5.", "4. Diameter of C1 = 10 cm."], "shortcut": "", "source_url": "https://cracku.in/65-let-c1-and-c2-be-concentric-circles-such-that-the--x-cat-2020-slot-2"}, {"id": "2020-S2-Q16", "year": 2020, "slot": 2, "q_no": 16, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Successive discounts & profit", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Anil buys 12 toys and puts the same marked price on each. He sells 8 of them at 20% off the marked price, and sells the other 4 at a further 25% off the already discounted price. His total sales come to Rs 2112, and this gives him a 10% profit. Had he sold all 12 at the marked price, what would his profit percentage have been?", "options": ["50", "60", "54", "55"], "answer": "50", "answer_note": "", "concept": "Find the marked price from total revenue, cost from the profit condition, then recompute profit at full price.", "formulas": ["Successive discounts multiply: 0.8 × 0.75 = 0.6", "Profit % = (SP − CP)/CP × 100"], "solution": ["1. Let marked price = L. 8 toys at 0.8L and 4 toys at 0.8 × 0.75L = 0.6L.", "2. Revenue = 6.4L + 2.4L = 8.8L = 2112 ⇒ L = 240.", "3. Cost = 2112 ÷ 1.1 = 1920.", "4. Full-price revenue = 12 × 240 = 2880.", "5. Profit % = (2880 − 1920)/1920 × 100 = 50%."], "shortcut": "Revenue at full price ÷ actual = 12/8.8 = 15/11; so 1.1 × 15/11 = 1.5 ⇒ 50% profit.", "source_url": "https://cracku.in/66-anil-buys-12-toys-and-labels-each-with-the-same-se-x-cat-2020-slot-2"}, {"id": "2020-S2-Q17", "year": 2020, "slot": 2, "q_no": 17, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Exponential equation aᵇ = 1", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many integers x satisfy (x² − 5x + 7)^(x + 1) = 1?", "options": ["3", "2", "4", "5"], "answer": "3", "answer_note": "", "concept": "aᵇ = 1 happens when a = 1, or b = 0 with a ≠ 0, or a = −1 with b even.", "formulas": ["aᵇ = 1 ⇔ a = 1, or (b = 0, a ≠ 0), or (a = −1, b even)"], "solution": ["1. Base = 1: x² − 5x + 6 = 0 ⇒ x = 2 or 3.", "2. Exponent = 0: x = −1; the base is 1 + 5 + 7 = 13 ≠ 0, so valid.", "3. Base = −1: x² − 5x + 8 = 0 has discriminant 25 − 32 < 0, no real roots.", "4. Integers: −1, 2, 3 ⇒ 3 solutions."], "shortcut": "", "source_url": "https://cracku.in/67-the-number-of-integers-that-satisfy-the-equality-x-x-cat-2020-slot-2"}, {"id": "2020-S2-Q18", "year": 2020, "slot": 2, "q_no": 18, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Integer solutions of linear equation", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many integer pairs (x, y) satisfy 2x + 5y = 99 along with x ≥ y ≥ −20?", "options": [], "answer": "17", "answer_note": "", "concept": "Parametrise the integer solutions of the linear Diophantine equation, then count those meeting both inequality constraints.", "formulas": ["General solution of 2x + 5y = 99: y odd, x = (99 − 5y)/2"], "solution": ["1. 2x = 99 − 5y needs 5y odd, so y is odd.", "2. x ≥ y ⇒ (99 − 5y)/2 ≥ y ⇒ 99 ≥ 7y ⇒ y ≤ 14.", "3. So y is odd with −20 ≤ y ≤ 14: y ∈ {−19, −17, …, 13}.", "4. Count = (13 − (−19))/2 + 1 = 17."], "shortcut": "", "source_url": "https://cracku.in/68-the-number-of-pairs-of-integers-xy-satisfying-xgeq-x-cat-2020-slot-2"}, {"id": "2020-S2-Q19", "year": 2020, "slot": 2, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Equilateral triangle – Viviani's theorem", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "From a point inside an equilateral triangle, perpendiculars are dropped to the three sides, and their lengths add up to s. Find the area of the triangle in terms of s.", "options": ["√3s²/2", "2s²/√3", "s²/(2√3)", "s²/√3"], "answer": "s²/√3", "answer_note": "", "concept": "For any interior point of an equilateral triangle, the sum of distances to the sides equals the altitude (Viviani).", "formulas": ["Sum of perpendiculars = altitude = (√3/2)a", "Area = (√3/4)a²"], "solution": ["1. Splitting the triangle into three from the point: (a/2)(p₁ + p₂ + p₃) = (√3/4)a², so p₁ + p₂ + p₃ = (√3/2)a.", "2. Hence s = (√3/2)a ⇒ a = 2s/√3.", "3. Area = (√3/4) × 4s²/3 = s²/√3."], "shortcut": "Area = altitude²/√3 for any equilateral triangle.", "source_url": "https://cracku.in/69-from-an-interior-point-of-an-equilateral-triangle--x-cat-2020-slot-2"}, {"id": "2020-S2-Q20", "year": 2020, "slot": 2, "q_no": 20, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "GP – terms and integer ratio", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In a geometric progression, the m-th term is 3/4 and the n-th term is 12, where m < n. If the common ratio r is an integer, what is the smallest possible value of r + n − m?", "options": ["6", "2", "-4", "-2"], "answer": "-2", "answer_note": "", "concept": "Dividing the two terms removes the first term: r^(n−m) = 16; list integer possibilities, including negative r with even exponent.", "formulas": ["Tₙ/Tₘ = r^(n−m)"], "solution": ["1. r^(n−m) = 12 ÷ (3/4) = 16.", "2. Possibilities (r, n−m): (16,1), (4,2), (−4,2), (2,4), (−2,4).", "3. r + n − m values: 17, 6, −2, 6, 2.", "4. Smallest = −2 (r = −4, n − m = 2)."], "shortcut": "", "source_url": "https://cracku.in/70-let-the-m-th-and-n-th-terms-of-a-geometric-progres-x-cat-2020-slot-2"}, {"id": "2020-S2-Q21", "year": 2020, "slot": 2, "q_no": 21, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentage change in expenditure", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In May, John purchased the same quantities of rice and wheat as he did in April, but because the price of rice rose by 20% and that of wheat by 12%, he spent Rs 150 more than in April. If he spent Rs 450 on rice in April, how much did he spend on wheat in May (in Rs)?", "options": ["560", "570", "590", "580"], "answer": "560", "answer_note": "", "concept": "With fixed quantities, spending on each item rises by its price-increase percentage; split the extra Rs 150 between the two items.", "formulas": ["New spend = old spend × (1 + p/100)"], "solution": ["1. Extra spent on rice = 20% of 450 = Rs 90.", "2. Extra on wheat = 150 − 90 = Rs 60.", "3. 12% of April wheat spend = 60 ⇒ April wheat spend = Rs 500.", "4. May wheat spend = 500 × 1.12 = Rs 560."], "shortcut": "", "source_url": "https://cracku.in/71-in-may-john-bought-the-same-amount-of-rice-and-the-x-cat-2020-slot-2"}, {"id": "2020-S2-Q22", "year": 2020, "slot": 2, "q_no": 22, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Maximising linear expression under inequality", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Non-negative integers x and y satisfy x + 9 = z, y + 1 = z and x + y < z + 5. Find the largest possible value of 2x + y.", "options": [], "answer": "23", "answer_note": "", "concept": "Express everything in terms of z, turn the inequality into a bound on z, and maximise.", "formulas": ["Substitute x = z − 9, y = z − 1"], "solution": ["1. x = z − 9, y = z − 1.", "2. x + y < z + 5 ⇒ 2z − 10 < z + 5 ⇒ z < 15, so z ≤ 14 (z integer since x is).", "3. Non-negativity: z ≥ 9.", "4. 2x + y = 2(z − 9) + (z − 1) = 3z − 19, maximised at z = 14: 42 − 19 = 23."], "shortcut": "", "source_url": "https://cracku.in/72-if-x-and-y-are-non-negative-integers-such-that-x-9-x-cat-2020-slot-2"}, {"id": "2020-S2-Q23", "year": 2020, "slot": 2, "q_no": 23, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Integer constraints in linear equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Aron and Aditya each spend the same amount buying pencils and sharpeners. Aditya buys twice as many pencils as Aron and 10 fewer sharpeners than Aron. A sharpener costs Rs 2 more than a pencil. What is the minimum possible total number of pencils bought by the two of them together?", "options": ["33", "27", "30", "36"], "answer": "33", "answer_note": "", "concept": "Equate the two spends to get a relation between Aron's pencil count and the pencil price; integrality forces a minimum count.", "formulas": ["Spend = (count × price) summed over items"], "solution": ["1. Aron buys p pencils and k sharpeners; pencil price x, sharpener price x + 2.", "2. px + k(x + 2) = 2px + (k − 10)(x + 2) ⇒ px = 10(x + 2) ⇒ p = 10 + 20/x.", "3. p must be an integer greater than 10, so the smallest is p = 11 (x = 20).", "4. Total pencils = p + 2p = 3p = 33."], "shortcut": "Total pencils = 3p and p > 10, so the total exceeds 30 and is a multiple of 3 ⇒ 33.", "source_url": "https://cracku.in/73-aron-bought-some-pencils-and-sharpeners-spending-t-x-cat-2020-slot-2"}, {"id": "2020-S2-Q24", "year": 2020, "slot": 2, "q_no": 24, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Maximum of a function via AM–GM", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For real x, what is the largest value that x/√(1 + x⁴) can take?", "options": ["1/2", "1", "1/√3", "1/√2"], "answer": "1/√2", "answer_note": "", "concept": "Square the expression (for x > 0) and use AM–GM on 1/x² + x².", "formulas": ["1 + x⁴ ≥ 2x² (AM–GM)"], "solution": ["1. The maximum occurs for x > 0; square: x²/(1 + x⁴) = 1/(x² + 1/x²).", "2. x² + 1/x² ≥ 2, equality at x = 1.", "3. So the squared value ≤ 1/2 and the expression ≤ 1/√2, attained at x = 1."], "shortcut": "Plug x = 1: 1/√2.", "source_url": "https://cracku.in/74-for-real-x-the-maximum-possible-value-of-fracxsqrt-x-cat-2020-slot-2"}, {"id": "2020-S2-Q25", "year": 2020, "slot": 2, "q_no": 25, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Modulus equation – integer solutions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In how many ways can an integer pair (x, a) be chosen so that x² − 2|x| + |a − 2| = 0?", "options": ["6", "5", "4", "7"], "answer": "7", "answer_note": "", "concept": "Rewrite as (|x| − 1)² + |a − 2| = 1; a sum of two non-negative integers equal to 1 means one is 0 and the other is 1.", "formulas": ["x² = |x|²", "(|x| − 1)² + |a − 2| = 1"], "solution": ["1. Equation becomes (|x| − 1)² + |a − 2| = 1.", "2. Case (|x| − 1)² = 0, |a − 2| = 1: x = ±1, a = 1 or 3 ⇒ 4 pairs.", "3. Case (|x| − 1)² = 1, |a − 2| = 0: |x| = 0 or 2 ⇒ x ∈ {0, 2, −2}, a = 2 ⇒ 3 pairs.", "4. Total = 7."], "shortcut": "", "source_url": "https://cracku.in/75-in-how-many-ways-can-a-pair-of-integers-x-a-be-cho-x-cat-2020-slot-2"}, {"id": "2020-S2-Q26", "year": 2020, "slot": 2, "q_no": 26, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Minimum of symmetric expression", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "x and y are positive real numbers with x + y = 102. Find the minimum value of 2601(1 + 1/x)(1 + 1/y).", "options": [], "answer": "2704", "answer_note": "", "concept": "Expand: the product is 1 + (x + y + 1)/(xy); with x + y fixed, it is smallest when xy is largest, i.e. x = y.", "formulas": ["(1 + 1/x)(1 + 1/y) = 1 + (x + y + 1)/(xy)", "For fixed sum, xy is maximum when x = y"], "solution": ["1. (1 + 1/x)(1 + 1/y) = 1 + 103/(xy).", "2. xy ≤ 51² = 2601, equality at x = y = 51.", "3. Minimum = 2601 × (1 + 103/2601) = 2601 + 103 = 2704."], "shortcut": "Note 2704 = 52² and 2601 = 51²: at x = y = 51 the value is 2601 × (52/51)² = 52².", "source_url": "https://cracku.in/76-if-x-and-y-are-positive-real-numbers-satisfying-xy-x-cat-2020-slot-2"}, {"id": "2020-S3-Q01", "year": 2020, "slot": 3, "q_no": 1, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recursive sequence – triangular numbers", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A sequence has x₁ = −1, and for every positive integer m, xₘ = xₘ₊₁ + (m + 1). Find x₁₀₀.", "options": ["−5050", "−5051", "−5150", "−5151"], "answer": "−5050", "answer_note": "", "concept": "Rewrite the recurrence as a forward step and spot that each term subtracts the next natural number, giving negative triangular numbers.", "formulas": ["xₘ₊₁ = xₘ − (m + 1)", "1 + 2 + … + n = n(n + 1)/2"], "solution": ["1. Rearrange: xₘ₊₁ = xₘ − (m + 1).", "2. x₁ = −1, x₂ = −1 − 2 = −3, x₃ = −3 − 3 = −6, x₄ = −10 …", "3. So xₙ = −(1 + 2 + … + n) = −n(n + 1)/2.", "4. x₁₀₀ = −100 × 101/2 = −5050."], "shortcut": "First few terms −1, −3, −6 are negative triangular numbers; only −5050 = −T₁₀₀ is triangular among the options.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-1.shtml"}, {"id": "2020-S3-Q02", "year": 2020, "slot": 3, "q_no": 2, "area": "Number System", "topic": "Number System", "subtopic": "Integer values of a sum under range constraints", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "N, x and y are positive integers with N = x + y, where 2 < x < 10 and 14 < y < 23. Given that N > 25, how many different values can N take?", "options": [], "answer": "6", "answer_note": "", "concept": "Find the range of a sum of two bounded integers and check which values above the threshold are attainable.", "formulas": ["min(x+y) = min x + min y; max(x+y) = max x + max y"], "solution": ["1. x ∈ {3,…,9} and y ∈ {15,…,22}.", "2. So x + y covers every integer from 18 to 31 (consecutive integers in each range give all sums in between).", "3. N > 25 ⇒ N ∈ {26, 27, 28, 29, 30, 31}.", "4. Each is attainable, e.g. 26 = 9 + 17, 31 = 9 + 22. Number of values = 6."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-2.shtml"}, {"id": "2020-S3-Q03", "year": 2020, "slot": 3, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Change of base", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Given logₐ30 = A, logₐ(5/3) = −B and log₂a = 1/3, find log₃a.", "options": ["2/(A + B − 3)", "(A + B − 3)/2", "(A + B)/2 − 3", "2/(A + B) − 3"], "answer": "2/(A + B − 3)", "answer_note": "", "concept": "Convert all logs to a single convenient base (base a), split 30 and 5/3 into prime logs, and isolate logₐ3.", "formulas": ["logₐ(xy) = logₐx + logₐy", "logₐ(x/y) = logₐx − logₐy", "log₃a = 1/logₐ3"], "solution": ["1. log₂a = 1/3 ⇒ logₐ2 = 3.", "2. logₐ30 = logₐ2 + logₐ3 + logₐ5 = A ⇒ logₐ3 + logₐ5 = A − 3.", "3. logₐ(5/3) = logₐ5 − logₐ3 = −B.", "4. Subtract: 2·logₐ3 = A − 3 + B ⇒ logₐ3 = (A + B − 3)/2.", "5. log₃a = 1/logₐ3 = 2/(A + B − 3)."], "shortcut": "Plug a = 2^(1/3): A ≈ 14.72, B ≈ 2.21, log₃a ≈ 0.210; only 2/(A + B − 3) gives 0.210.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-3.shtml"}, {"id": "2020-S3-Q04", "year": 2020, "slot": 3, "q_no": 4, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – extra workers", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A contractor has to build a 6 km road in 200 days and starts with 140 workers. After 60 days only 1.5 km is complete. If every worker works at the same rate, how many more workers must he hire to finish the road exactly on schedule?", "options": [], "answer": "40", "answer_note": "", "concept": "Work done is proportional to (workers × days); use the rate from the first phase to size the workforce needed for the rest.", "formulas": ["Work ∝ Men × Days", "M₁D₁/W₁ = M₂D₂/W₂"], "solution": ["1. Phase 1: 140 workers × 60 days produce 1.5 km.", "2. Remaining: 4.5 km in 200 − 60 = 140 days.", "3. 140 × 60 / 1.5 = M × 140 / 4.5 ⇒ M = 4.5 × 60 / 1.5 = 180 workers.", "4. Extra workers = 180 − 140 = 40."], "shortcut": "Remaining work is 3× done work, time is 140/60 of elapsed: workers needed = 140 × 3 × 60/140 = 180.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-4.shtml"}, {"id": "2020-S3-Q05", "year": 2020, "slot": 3, "q_no": 5, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – area under a modulus graph", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the area (in sq. units) of the region bounded by the line x = 2, the graph y = |x − 2| + 4, the x-axis and the y-axis.", "options": ["12", "8", "6", "10"], "answer": "10", "answer_note": "", "concept": "Over 0 ≤ x ≤ 2 the modulus opens up to a straight line, so the region is a trapezium.", "formulas": ["|x − 2| = 2 − x for x ≤ 2", "Trapezium area = ½ × (sum of parallel sides) × height"], "solution": ["1. For 0 ≤ x ≤ 2, y = (2 − x) + 4 = 6 − x.", "2. At x = 0, y = 6; at x = 2, y = 4.", "3. The region is a trapezium with parallel vertical sides 6 and 4, width 2.", "4. Area = ½ × (6 + 4) × 2 = 10."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-5.shtml"}, {"id": "2020-S3-Q06", "year": 2020, "slot": 3, "q_no": 6, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ages and averages", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Dick's age is three times Tom's, and Harry's age is twice Dick's. If Dick is 1 year younger than the average age of the three, what is Harry's age in years?", "options": [], "answer": "18", "answer_note": "", "concept": "Express all ages in one variable and translate the average condition into a linear equation.", "formulas": ["Average = Sum / Count"], "solution": ["1. Let Tom = t; then Dick = 3t, Harry = 6t.", "2. Average = (t + 3t + 6t)/3 = 10t/3.", "3. Dick = average − 1 ⇒ 3t = 10t/3 − 1 ⇒ 9t = 10t − 3 ⇒ t = 3.", "4. Harry = 6t = 18."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-6.shtml"}, {"id": "2020-S3-Q07", "year": 2020, "slot": 3, "q_no": 7, "area": "Number System", "topic": "Number System", "subtopic": "Inclusion–exclusion on divisibility", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Among the integers 1, 2, …, 120, how many are not divisible by any of 2, 5 or 7?", "options": ["41", "42", "40", "43"], "answer": "41", "answer_note": "", "concept": "Count numbers divisible by at least one of the primes via inclusion–exclusion and subtract from the total.", "formulas": ["|A∪B∪C| = |A|+|B|+|C| − |A∩B| − |B∩C| − |A∩C| + |A∩B∩C|", "Count of multiples of k up to n = ⌊n/k⌋"], "solution": ["1. Multiples: of 2 → 60, of 5 → 24, of 7 → 17.", "2. Pairs: of 10 → 12, of 14 → 8, of 35 → 3. Triple: of 70 → 1.", "3. Divisible by at least one = 60 + 24 + 17 − 12 − 8 − 3 + 1 = 79.", "4. Divisible by none = 120 − 79 = 41."], "shortcut": "Odd non-multiples of 5 up to 120: 120 × ½ × 4/5 = 48; remove odd multiples of 7 not divisible by 5: 7, 21, 49, 63, 77, 91, 119 → 48 − 7 = 41.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-7.shtml"}, {"id": "2020-S3-Q08", "year": 2020, "slot": 3, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – marks comparison", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a final exam, Bishnu got 52% and Asha got 64%. Bishnu's marks were 23 below Ramesh's and Asha's marks were 34 above Ramesh's. Geeta got 84%. How many marks did Geeta get?", "options": ["399", "439", "357", "417"], "answer": "399", "answer_note": "", "concept": "The gap between two scores, known both in marks and in percentage points, fixes the maximum marks.", "formulas": ["Marks = (percentage/100) × Maximum marks"], "solution": ["1. Asha − Bishnu = (R + 34) − (R − 23) = 57 marks.", "2. The same gap is 64% − 52% = 12% of the maximum marks.", "3. Maximum marks = 57/0.12 = 475.", "4. Geeta = 84% of 475 = 399."], "shortcut": "Geeta's score = 57 × 84/12 = 57 × 7 = 399.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-8.shtml"}, {"id": "2020-S3-Q09", "year": 2020, "slot": 3, "q_no": 9, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equation – exponential type", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A function satisfies f(x + y) = f(x)·f(y) for all x, y, and f(5) = 4. Find f(10) − f(−10).", "options": ["3", "0", "14.0625", "15.9375"], "answer": "15.9375", "answer_note": "", "concept": "The rule f(x + y) = f(x)f(y) behaves like an exponential, so f(0) = 1 and f(−x) = 1/f(x).", "formulas": ["f(x + y) = f(x)f(y) ⇒ f(0) = 1 (f non-zero)", "f(−x) = 1/f(x)"], "solution": ["1. f(10) = f(5)·f(5) = 16.", "2. Put x = y = 0: f(0) = f(0)² ⇒ f(0) = 1 (f(0) = 0 would make f ≡ 0, contradicting f(5) = 4).", "3. f(0) = f(10)·f(−10) ⇒ f(−10) = 1/16.", "4. f(10) − f(−10) = 16 − 1/16 = 255/16 = 15.9375."], "shortcut": "Take f(x) = 4^(x/5): f(10) = 16, f(−10) = 1/16.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-9.shtml"}, {"id": "2020-S3-Q10", "year": 2020, "slot": 3, "q_no": 10, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithm evaluation", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Evaluate (2 × 4 × 8 × 16) ÷ [(log₂4)² × (log₄8)³ × (log₈16)⁴].", "options": [], "answer": "24", "answer_note": "", "concept": "Each log is a simple ratio of exponents of 2, so the expression reduces to arithmetic.", "formulas": ["log_(2^p) (2^q) = q/p"], "solution": ["1. Numerator = 2¹·2²·2³·2⁴ = 2¹⁰ = 1024.", "2. log₂4 = 2, log₄8 = 3/2, log₈16 = 4/3.", "3. Denominator = 2² × (3/2)³ × (4/3)⁴ = 4 × 27/8 × 256/81 = 128/3.", "4. Value = 1024 × 3/128 = 24."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-10.shtml"}, {"id": "2020-S3-Q11", "year": 2020, "slot": 3, "q_no": 11, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Equal powers – indices", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "a, b and c are non-zero numbers with 14ᵃ = 36ᵇ = 84ᶜ. Find the value of 6b(1/c − 1/a).", "options": [], "answer": "3", "answer_note": "", "concept": "Set the common value to k, express a, b, c as logs of k, and use 84/14 = 6 with 36 = 6².", "formulas": ["If pˣ = k then x = log k / log p", "log(m/n) = log m − log n"], "solution": ["1. Let 14ᵃ = 36ᵇ = 84ᶜ = k; then 1/a = log14/log k, 1/c = log84/log k, b = log k/log36.", "2. 1/c − 1/a = (log84 − log14)/log k = log6/log k.", "3. 6b(1/c − 1/a) = 6 × (log k/log36) × (log6/log k) = 6 log6/(2 log6).", "4. = 3."], "shortcut": "Exponent view: 84 = 14 × 6 ⇒ k^(1/c) = k^(1/a) · 6 and 6 = k^(1/(2b)); so 1/c − 1/a = 1/(2b) and 6b × 1/(2b) = 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-11.shtml"}, {"id": "2020-S3-Q12", "year": 2020, "slot": 3, "q_no": 12, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Integer solutions of inequalities", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "m and n are natural numbers, n is even, and each of m/20, n/m and n/11 lies strictly between 0.2 and 0.5. Find m − 2n.", "options": ["4", "2", "1", "3"], "answer": "1", "answer_note": "", "concept": "Use each bounded fraction to bracket the integers, then intersect the ranges.", "formulas": ["a < x/k < b ⇒ ak < x < bk (k > 0)"], "solution": ["1. 0.2 < m/20 < 0.5 ⇒ 4 < m < 10 ⇒ m ∈ {5,…,9}.", "2. 0.2 < n/11 < 0.5 ⇒ 2.2 < n < 5.5 ⇒ n ∈ {3,4,5}; n even ⇒ n = 4.", "3. 0.2 < 4/m < 0.5 ⇒ 8 < m < 20; with m ≤ 9 ⇒ m = 9.", "4. m − 2n = 9 − 8 = 1."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-12.shtml"}, {"id": "2020-S3-Q13", "year": 2020, "slot": 3, "q_no": 13, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Circular track – meeting at start", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Anil, Sunil and Ravi start together from one point on a 3 km circular track and all run clockwise at 15, 10 and 8 km/h respectively. When Anil and Sunil are together at the starting point for the first time, how many km has Ravi covered?", "options": ["4.6", "4.2", "4.8", "5.2"], "answer": "4.8", "answer_note": "", "concept": "Two runners are together at the start for the first time at the LCM of their lap times.", "formulas": ["Lap time = track length / speed", "First meeting at start = LCM of lap times"], "solution": ["1. Anil's lap time = 3/15 h = 12 min.", "2. Sunil's lap time = 3/10 h = 18 min.", "3. First common time at start = LCM(12, 18) = 36 min = 0.6 h.", "4. Ravi's distance = 8 × 0.6 = 4.8 km."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-13.shtml"}, {"id": "2020-S3-Q14", "year": 2020, "slot": 3, "q_no": 14, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Markup, discount and wastage", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A trader buys 35 kg of sugar and marks it up to earn 20% profit. He sells 5 kg at the marked price and 15 kg at 10% off the marked price. By mistake 3 kg is wasted. He sells the remaining sugar at a price p% above the marked price and ends up with an overall profit of 15%. Find p, to the nearest option.", "options": ["35", "31", "22", "25"], "answer": "25", "answer_note": "", "concept": "Fix cost per kg, compute revenue already earned, and back out the selling price needed on the remaining stock to reach the target total revenue.", "formulas": ["SP = CP × (1 + profit%)", "Discounted price = MP × (1 − d%)"], "solution": ["1. Let CP = 1 per kg ⇒ total cost 35, MP = 1.2.", "2. Revenue so far: 5 × 1.2 + 15 × 1.08 = 6 + 16.2 = 22.2.", "3. Target revenue for 15% profit = 1.15 × 35 = 40.25.", "4. Remaining 35 − 5 − 15 − 3 = 12 kg must bring 40.25 − 22.2 = 18.05 ⇒ price ≈ 1.504 per kg.", "5. p = (1.504/1.2 − 1) × 100 ≈ 25.3% ⇒ nearest option 25."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-14.shtml"}, {"id": "2020-S3-Q15", "year": 2020, "slot": 3, "q_no": 15, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Unique solution of a linear system", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For a constant k, the system kx + y = 3 and 4x + ky = 4 has exactly one solution if and only if:", "options": ["|k| = 2", "k ≠ 2", "|k| ≠ 2", "k = 2"], "answer": "|k| ≠ 2", "answer_note": "", "concept": "Two linear equations have a unique solution exactly when their coefficient ratios differ (the determinant is non-zero).", "formulas": ["a₁x + b₁y = c₁, a₂x + b₂y = c₂ unique ⇔ a₁/a₂ ≠ b₁/b₂ ⇔ a₁b₂ − a₂b₁ ≠ 0"], "solution": ["1. Determinant = k·k − 4·1 = k² − 4.", "2. Unique solution ⇔ k² − 4 ≠ 0.", "3. ⇔ k ≠ 2 and k ≠ −2 ⇔ |k| ≠ 2."], "shortcut": "k = −2 also makes the lines parallel, so 'k ≠ 2' is incomplete; only |k| ≠ 2 excludes both.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-15.shtml"}, {"id": "2020-S3-Q16", "year": 2020, "slot": 3, "q_no": 16, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting with complement – repeated digits", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many of the integers 100, 101, …, 999 have at least one digit appearing more than once?", "options": [], "answer": "252", "answer_note": "", "concept": "Count the complement: three-digit numbers with all distinct digits.", "formulas": ["At least one repeat = Total − All distinct"], "solution": ["1. Total three-digit numbers = 900.", "2. All distinct: hundreds digit 9 ways (1–9), tens 9 ways, units 8 ways = 648.", "3. At least one repeated digit = 900 − 648 = 252."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-16.shtml"}, {"id": "2020-S3-Q17", "year": 2020, "slot": 3, "q_no": 17, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – extreme value", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A batsman got out in every one of his n + 2 innings, averaging 29 runs over all of them. He scored 38 and 15 in the last two innings. In each of the first n innings he scored less than 38, with an average of 30 and a lowest score of x. What is the smallest possible x?", "options": ["1", "3", "2", "4"], "answer": "2", "answer_note": "", "concept": "Use the two averages to find n, then minimise the lowest score by pushing all other scores to their maximum allowed value.", "formulas": ["Sum = Average × Count"], "solution": ["1. Total of all innings: 29(n + 2) = 30n + 38 + 15 ⇒ 29n + 58 = 30n + 53 ⇒ n = 5.", "2. First 5 innings total = 150, each score ≤ 37.", "3. To minimise x, make the other four scores 37 each: 4 × 37 = 148.", "4. x ≥ 150 − 148 = 2, achieved by scores 2, 37, 37, 37, 37. Smallest x = 2."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-17.shtml"}, {"id": "2020-S3-Q18", "year": 2020, "slot": 3, "q_no": 18, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – alcohol concentration", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Solutions A and B are mixed by volume in the ratio 1 : 3. Then more of solution A is added until the volume doubles, and the resulting mixture is 72% alcohol. If A is 60% alcohol, what percentage of B is alcohol?", "options": ["94%", "92%", "90%", "89%"], "answer": "92%", "answer_note": "", "concept": "Track the final volumes of A and B and apply the weighted average of concentrations.", "formulas": ["Mixture % = (V₁c₁ + V₂c₂)/(V₁ + V₂)"], "solution": ["1. Start: 1 unit A + 3 units B = 4 units.", "2. Doubling with A adds 4 units of A ⇒ final A : B = 5 : 3 in 8 units.", "3. (5 × 60 + 3b)/8 = 72 ⇒ 300 + 3b = 576.", "4. 3b = 276 ⇒ b = 92%."], "shortcut": "Alligation: (72 − 60) : (b − 72) = 3 : 5 ⇒ b − 72 = 20 ⇒ b = 92.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-18.shtml"}, {"id": "2020-S3-Q19", "year": 2020, "slot": 3, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circumcircle in coordinate geometry", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A triangle has vertices (0, 0), (4, 0) and (3, 9). What is the area of the circle that passes through all three vertices?", "options": ["14π/3", "123π/7", "205π/9", "12π/5"], "answer": "205π/9", "answer_note": "", "concept": "The circumcentre is equidistant from all three vertices; the chord on the x-axis fixes its x-coordinate.", "formulas": ["Circumcentre lies on perpendicular bisectors of sides", "Distance² = (x₂ − x₁)² + (y₂ − y₁)²", "Area = πr²"], "solution": ["1. The perpendicular bisector of (0,0)–(4,0) is x = 2, so centre = (2, k).", "2. Equidistance from (0,0) and (3,9): 4 + k² = 1 + (9 − k)².", "3. 4 + k² = 82 − 18k + k² ⇒ k = 78/18 = 13/3.", "4. r² = 4 + 169/9 = 205/9.", "5. Area = 205π/9."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-19.shtml"}, {"id": "2020-S3-Q20", "year": 2020, "slot": 3, "q_no": 20, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – half-yearly", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Money invested at 10% per annum compounded every six months grows to Rs. 18522 in 1.5 years. Find the amount invested, in rupees.", "options": [], "answer": "16000", "answer_note": "", "concept": "Half-yearly compounding halves the rate and doubles the number of periods.", "formulas": ["A = P(1 + r/(100k))^(nk), k = compounding periods per year"], "solution": ["1. Rate per half-year = 5%; periods = 3.", "2. 18522 = P × (1.05)³ = P × 9261/8000.", "3. P = 18522 × 8000/9261 = 2 × 8000 = 16000."], "shortcut": "18522 = 2 × 9261 = 2 × 21³, so P = 2 × 20³ = 16000.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-20.shtml"}, {"id": "2020-S3-Q21", "year": 2020, "slot": 3, "q_no": 21, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Trains moving towards each other", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Stations A and B are 90 km apart. A train starts from A at 9:00 am towards B at 40 km/h; another starts from B at 10:30 am towards A at 20 km/h. At what time do they meet?", "options": ["11:20 am", "11:00 am", "10:45 am", "11:45 am"], "answer": "11:00 am", "answer_note": "", "concept": "Account for the head start, then close the remaining gap at the relative speed.", "formulas": ["Relative speed (opposite directions) = s₁ + s₂", "Time = Distance / Speed"], "solution": ["1. By 10:30 am the first train has covered 40 × 1.5 = 60 km.", "2. Remaining gap = 90 − 60 = 30 km.", "3. Relative speed = 40 + 20 = 60 km/h ⇒ time = 30/60 h = 30 min.", "4. They meet at 10:30 + 0:30 = 11:00 am."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-21.shtml"}, {"id": "2020-S3-Q22", "year": 2020, "slot": 3, "q_no": 22, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed needed to arrive on time", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Vimla leaves for office at 9 am daily. Driving at 40 km/h she arrives on time; at 35 km/h she is 6 minutes late. One day she covers two-thirds of the distance in one-third of her usual time, then stops for 8 minutes. At what speed (km/h) must she cover the rest to reach exactly on time?", "options": ["27", "28", "29", "26"], "answer": "28", "answer_note": "", "concept": "Use the two speeds and the delay to find the distance and usual time, then budget the leftover time for the leftover distance.", "formulas": ["D = S × T", "D/S₁ − D/S₂ = time difference"], "solution": ["1. D/35 − D/40 = 6/60 ⇒ D/280 = 1/10 ⇒ D = 28 km; usual time = 28/40 h = 42 min.", "2. First part: 2/3 × 28 = 56/3 km in 42/3 = 14 min.", "3. After the 8-min stop, time used = 22 min; time left = 20 min = 1/3 h.", "4. Remaining distance = 28/3 km ⇒ speed = (28/3)/(1/3) = 28 km/h."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-22.shtml"}, {"id": "2020-S3-Q23", "year": 2020, "slot": 3, "q_no": 23, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Real roots – discriminant conditions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "m and n are positive integers such that both x² + mx + 2n = 0 and x² + 2nx + m = 0 have real roots. What is the least possible value of m + n?", "options": ["8", "6", "5", "7"], "answer": "6", "answer_note": "", "concept": "Real roots need non-negative discriminants; combine the two resulting inequalities and search small integers.", "formulas": ["Real roots of ax² + bx + c = 0 ⇔ b² − 4ac ≥ 0"], "solution": ["1. First equation: m² − 8n ≥ 0 ⇒ m² ≥ 8n.", "2. Second equation: 4n² − 4m ≥ 0 ⇒ m ≤ n².", "3. n = 1: m² ≥ 8 needs m ≥ 3 but m ≤ 1 — impossible.", "4. n = 2: m² ≥ 16 ⇒ m ≥ 4 and m ≤ 4 ⇒ m = 4, giving m + n = 6.", "5. Any sum ≤ 5 fails (n ≥ 2 forces m ≥ 4, n ≥ 3 forces m ≥ 5), so the minimum is 6."], "shortcut": "Check options from the smallest: 5 fails for (4,1), (3,2), (2,3), (1,4); 6 works with (4,2).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-23.shtml"}, {"id": "2020-S3-Q24", "year": 2020, "slot": 3, "q_no": 24, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Trapezium area", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In trapezium ABCD, AB ∥ DC, BC ⊥ DC and ∠BAD = 45°. If DC = 5 cm and BC = 4 cm, find the area of the trapezium in sq. cm.", "options": [], "answer": "28", "answer_note": "", "concept": "Dropping a perpendicular from D splits the trapezium into a rectangle and a 45-45-90 triangle.", "formulas": ["Area of trapezium = ½ × (sum of parallel sides) × height", "In a 45-45-90 triangle the legs are equal"], "solution": ["1. Drop DE ⊥ AB; then DE = BC = 4 and EB = DC = 5.", "2. Triangle ADE has ∠A = 45°, so AE = DE = 4.", "3. AB = AE + EB = 9.", "4. Area = ½ × (9 + 5) × 4 = 28 sq. cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-24.shtml"}, {"id": "2020-S3-Q25", "year": 2020, "slot": 3, "q_no": 25, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Parallelogram – diagonals bisect", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Points (2, 1) and (−3, −4) are opposite vertices of a parallelogram. The other two vertices lie on the line x + 9y + c = 0. Find c.", "options": ["15", "13", "14", "12"], "answer": "14", "answer_note": "", "concept": "The diagonals of a parallelogram bisect each other, so the line through the other two vertices passes through the midpoint of the given diagonal.", "formulas": ["Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2)", "Diagonals of a parallelogram bisect each other"], "solution": ["1. Midpoint of the given diagonal = (−1/2, −3/2).", "2. The other diagonal lies on x + 9y + c = 0, so it passes through this midpoint.", "3. −1/2 + 9(−3/2) + c = 0 ⇒ −14 + c = 0.", "4. c = 14."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-25.shtml"}, {"id": "2020-S3-Q26", "year": 2020, "slot": 3, "q_no": 26, "area": "Number System", "topic": "Number System", "subtopic": "Factor pairs of a prime power", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many pairs (a, b) of positive integers satisfy a ≤ b and ab = 4²⁰¹⁷?", "options": ["2019", "2018", "2020", "2017"], "answer": "2018", "answer_note": "", "concept": "Write the number as a prime power and count divisors a up to the square root.", "formulas": ["Number of divisors of pᵏ = k + 1", "For a perfect square N with d divisors, pairs a ≤ b = (d + 1)/2"], "solution": ["1. 4²⁰¹⁷ = 2⁴⁰³⁴, so a = 2ᵏ and b = 2⁴⁰³⁴⁻ᵏ.", "2. a ≤ b ⇔ k ≤ 4034 − k ⇔ k ≤ 2017.", "3. k = 0, 1, …, 2017 gives 2018 pairs."], "shortcut": "Divisors = 4035 (odd, perfect square); pairs = (4035 + 1)/2 = 2018.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2020-Question-Paper-Slot-3-Quant/quants-question-26.shtml"}, {"id": "2021-S1-Q01", "year": 2021, "slot": 1, "q_no": 1, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Rational inequality – wavy curve", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 48.72% correct", "question": "Find all real values of x for which the expression (x² + 2x − 15)/(x² − 7x − 18) takes a negative value.", "options": ["−5 < x < −2 or 3 < x < 9", "−2 < x < 3 or x > 9", "x < −5 or 3 < x < 9", "x < −5 or −2 < x < 3"], "answer": "−5 < x < −2 or 3 < x < 9", "answer_note": "", "concept": "Sign of a rational expression changes only at the zeros of the numerator and denominator; the wavy-curve method locates the negative intervals.", "formulas": ["x² + 2x − 15 = (x + 5)(x − 3)", "x² − 7x − 18 = (x − 9)(x + 2)", "Wavy curve: signs alternate across simple critical points"], "solution": ["1. Factor: the expression is (x + 5)(x − 3)/[(x − 9)(x + 2)].", "2. Critical points in order: −5, −2, 3, 9 (x = −2 and x = 9 are excluded).", "3. For x > 9 all four factors are positive, so the expression is positive.", "4. Moving left, the sign alternates: (3, 9) negative, (−2, 3) positive, (−5, −2) negative, x < −5 positive.", "5. Hence the expression is negative for −5 < x < −2 or 3 < x < 9."], "shortcut": "Test x = 0: value is −15/−18 > 0, which rules out every option containing 0 (options 2 and 4); x = −6 gives positive, ruling out option 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-1.shtml"}, {"id": "2021-S1-Q02", "year": 2021, "slot": 1, "q_no": 2, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus inequalities – distance on number line", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 12.02% correct", "question": "Count the integers n for which |n − 60| < |n − 100| < |n − 20| holds.", "options": ["21", "18", "20", "19"], "answer": "19", "answer_note": "", "concept": "|n − a| is the distance from n to a; each strict inequality says n is closer to one point than another, i.e. on one side of their midpoint.", "formulas": ["|n − a| < |n − b| ⇔ n is on a's side of the midpoint (a + b)/2"], "solution": ["1. |n − 60| < |n − 100| means n is closer to 60 than to 100, so n < 80.", "2. |n − 100| < |n − 20| means n is closer to 100 than to 20, so n > 60.", "3. Combining: 60 < n < 80.", "4. Integers 61, 62, …, 79: that is 79 − 61 + 1 = 19 integers."], "shortcut": "Midpoints 80 and 60 bound the range directly; count integers strictly between them: 19.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-2.shtml"}, {"id": "2021-S1-Q03", "year": 2021, "slot": 1, "q_no": 3, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentage change – price per unit", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 21.21% correct", "question": "Identical chocolate pieces are packed into small and large boxes. A large box is priced at twice a small box, yet its price per gram is 12% lower than that of the small box. The weight of chocolate in a large box exceeds that in a small box by a percentage nearest to", "options": ["127", "135", "124", "144"], "answer": "127", "answer_note": "", "concept": "Weight = total price ÷ price per gram, so the weight ratio is the price ratio divided by the per-gram price ratio.", "formulas": ["Weight = Price ÷ (Price per gram)", "% increase = (new/old − 1) × 100"], "solution": ["1. Let the small box cost P at p per gram, so its weight is P/p.", "2. The large box costs 2P at 0.88p per gram, so its weight is 2P/(0.88p).", "3. Ratio of weights = 2/0.88 = 2.2727.", "4. Excess = (2.2727 − 1) × 100 ≈ 127.27%, nearest to 127."], "shortcut": "2/0.88 = 25/11 = 2.27, so the excess is about 127%.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-3.shtml"}, {"id": "2021-S1-Q04", "year": 2021, "slot": 1, "q_no": 4, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log equations – product/power rules", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 11.33% correct", "question": "If 5 − log₁₀ √(1 + x) + 4 log₁₀ √(1 − x) = log₁₀ [1/√(1 − x²)], find the value of 100x.", "options": [], "answer": "99", "answer_note": "", "concept": "Split the log of a product/quotient into sums so the common term cancels, leaving a linear equation in a single log.", "formulas": ["log(ab) = log a + log b", "log(1/a) = −log a", "√(1 − x²) = √(1 − x) · √(1 + x)"], "solution": ["1. Right side: log₁₀ [1/√(1 − x²)] = −log₁₀ √(1 − x) − log₁₀ √(1 + x).", "2. The −log₁₀ √(1 + x) terms on both sides cancel.", "3. Left with 5 + 4 log₁₀ √(1 − x) = −log₁₀ √(1 − x), i.e. 5 log₁₀ √(1 − x) = −5.", "4. So log₁₀ √(1 − x) = −1, giving √(1 − x) = 1/10 and 1 − x = 1/100.", "5. x = 0.99, so 100x = 99."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-4.shtml"}, {"id": "2021-S1-Q05", "year": 2021, "slot": 1, "q_no": 5, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Linear equations – equal-cost baskets", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 34.87% correct", "question": "A basket holding 2 apples, 4 oranges and 6 mangoes costs the same as a basket holding 1 apple, 4 oranges and 8 mangoes, and also the same as a basket holding 8 oranges and 7 mangoes. How many mangoes would a basket containing only mangoes need to hold so that it also costs the same?", "options": ["12", "13", "11", "10"], "answer": "13", "answer_note": "", "concept": "Equate basket costs pairwise to express every fruit's price in terms of one fruit.", "formulas": ["Cost = Σ (count × unit price)"], "solution": ["1. Let apple, orange, mango cost a, o, m.", "2. 2a + 4o + 6m = a + 4o + 8m ⇒ a = 2m.", "3. 2a + 4o + 6m = 8o + 7m ⇒ 4m + 4o + 6m = 8o + 7m ⇒ 3m = 4o ⇒ o = 3m/4.", "4. Basket cost = 2(2m) + 4(3m/4) + 6m = 4m + 3m + 6m = 13m.", "5. So 13 mangoes cost the same."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-5.shtml"}, {"id": "2021-S1-Q06", "year": 2021, "slot": 1, "q_no": 6, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular hexagon & equilateral triangle – area", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 58.49% correct", "question": "A regular hexagon has the same area as an equilateral triangle whose side is 12 cm. What is the side of the hexagon, in cm?", "options": ["4√6", "6√6", "2√6", "√6"], "answer": "2√6", "answer_note": "", "concept": "A regular hexagon is made of six equilateral triangles of its own side.", "formulas": ["Area of equilateral triangle = (√3/4)a²", "Area of regular hexagon = 6 × (√3/4)s² = (3√3/2)s²"], "solution": ["1. Triangle area = (√3/4) × 144 = 36√3.", "2. Hexagon area = 6 × (√3/4)s².", "3. Set equal: 6 × (√3/4)s² = (√3/4) × 144 ⇒ 6s² = 144.", "4. s² = 24, so s = 2√6 cm."], "shortcut": "Six small triangles equal one big triangle, so s² = 144/6 = 24.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-6.shtml"}, {"id": "2021-S1-Q07", "year": 2021, "slot": 1, "q_no": 7, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Weighted average price", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 33.92% correct", "question": "Over five consecutive months onion sells at ₹10, ₹20, ₹25, ₹25 and ₹50 per kg respectively. A family spends a fixed amount on onion in each of the first three months, and half that amount in each of the next two months. The family's average expense on onion, in ₹ per kg, over the five months is closest to", "options": ["18", "26", "16", "20"], "answer": "18", "answer_note": "", "concept": "Average price per kg = total money spent ÷ total quantity bought; with money fixed per month, quantity = money/price (a weighted harmonic mean).", "formulas": ["Average price = Σ spend ÷ Σ (spend/price)"], "solution": ["1. Take the fixed amount as ₹100 (it cancels out). Monthly spends: 100, 100, 100, 50, 50.", "2. Quantities: 100/10 = 10 kg, 100/20 = 5 kg, 100/25 = 4 kg, 50/25 = 2 kg, 50/50 = 1 kg.", "3. Total spend = ₹400; total quantity = 22 kg.", "4. Average = 400/22 ≈ 18.18, closest to 18."], "shortcut": "Pick ₹100 so every quantity is an integer; 400/22 ≈ 18.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-7.shtml"}, {"id": "2021-S1-Q08", "year": 2021, "slot": 1, "q_no": 8, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Modulus of quadratic – number of roots", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.12% correct", "question": "For what value of the constant r does the equation |x² − 4x − 13| = r have exactly three distinct real roots?", "options": ["15", "18", "17", "21"], "answer": "17", "answer_note": "", "concept": "The graph of |quadratic| has a reflected 'hump' between the roots; a horizontal line meets it exactly three times when it touches the top of that hump.", "formulas": ["x² − 4x − 13 = (x − 2)² − 17", "|f(x)| = r ⇔ f(x) = r or f(x) = −r"], "solution": ["1. Write the quadratic as (x − 2)² − 17; its minimum value is −17 at x = 2.", "2. |f(x)| = r splits into (x − 2)² = 17 + r and (x − 2)² = 17 − r.", "3. For r > 0 the first always gives two roots.", "4. The second gives two roots if r < 17, one root (x = 2) if r = 17, none if r > 17.", "5. Exactly three distinct roots ⇒ r = 17."], "shortcut": "Three roots occur when r equals |minimum of the quadratic| = 17.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-8.shtml"}, {"id": "2021-S1-Q09", "year": 2021, "slot": 1, "q_no": 9, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit & loss – two scenarios with fixed cost", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.47% correct", "question": "Amal buys some pens at ₹8 each and engages an employee for a fixed wage. He sells 100 of the pens at ₹12 each. If he sells the rest at ₹11 each, he makes a net profit of ₹300; if he sells the rest at ₹9 each, he makes a net loss of ₹300. Find the employee's wage, in ₹.", "options": [], "answer": "1000", "answer_note": "", "concept": "Write net profit = revenue − purchase cost − wage for each scenario; the two linear equations fix the unknown count and wage.", "formulas": ["Net profit = Revenue − Cost of goods − Fixed cost"], "solution": ["1. Let r be the remaining pens and w the wage. Profit on the first 100 pens = 100 × (12 − 8) = ₹400.", "2. Scenario 1: 400 + 3r − w = 300.", "3. Scenario 2: 400 + r − w = −300.", "4. Subtracting: 2r = 600, so r = 300.", "5. Then w = 400 + 900 − 300 = ₹1000."], "shortcut": "The ₹2 difference in price on the remaining pens makes a ₹600 swing, so 300 pens remain; then w follows.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-9.shtml"}, {"id": "2021-S1-Q10", "year": 2021, "slot": 1, "q_no": 10, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – yearly interest as GP", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 36.05% correct", "question": "Anil invests a sum at a fixed rate of interest compounded annually. The interest earned during the second year is ₹806.25 and during the third year is ₹866.72. The interest earned during the fourth year, in ₹, is nearest to", "options": ["931.72", "926.84", "929.48", "934.65"], "answer": "931.72", "answer_note": "", "concept": "Under annual compounding, each year's interest is the previous year's interest multiplied by (1 + r), so yearly interests form a GP.", "formulas": ["Iₙ₊₁ = Iₙ × (1 + r)", "I₄ = I₃² / I₂"], "solution": ["1. Ratio 1 + r = 866.72/806.25 ≈ 1.075 (rate 7.5%).", "2. Check: 806.25 × 1.075 = 866.72.", "3. Fourth-year interest = 866.72 × 1.075 ≈ 931.72.", "4. Answer: ₹931.72."], "shortcut": "The increase from year 2 to 3 is ₹60.47; the next increase is 7.5% larger ≈ ₹65, giving ≈ 931.7.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-10.shtml"}, {"id": "2021-S1-Q11", "year": 2021, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – replacement", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 11.56% correct", "question": "The strength of an indigo solution in percent equals the grams of indigo in 100 cc of water. Two 800 cc bottles hold indigo solution of strength 33% and 17% respectively. A portion of the solution in the first bottle is taken out and replaced by an equal volume of solution taken from the second bottle. If the first bottle now has strength 21%, how many cc of solution are left in the second bottle?", "options": [], "answer": "200", "answer_note": "", "concept": "Balance the amount of indigo in the first bottle before and after the replacement; the volume stays at 800 cc.", "formulas": ["Quantity of solute = strength × volume", "Alligation: ratio of volumes = (c₂ − m)/(m − c₁)"], "solution": ["1. Let x cc be removed from bottle 1 and replaced by x cc from bottle 2.", "2. Indigo in bottle 1 afterwards: 0.33(800 − x) + 0.17x = 0.21 × 800 = 168.", "3. 264 − 0.16x = 168 ⇒ x = 600.", "4. Bottle 2 gave away 600 cc, so 800 − 600 = 200 cc remain."], "shortcut": "Alligation: 33% and 17% mixed to 21% are in ratio (21 − 17):(33 − 21) = 1:3, so 600 cc of the 800 came from bottle 2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-11.shtml"}, {"id": "2021-S1-Q12", "year": 2021, "slot": 1, "q_no": 12, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – pairwise rates", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 36.7% correct", "question": "Amar and Akbar together can finish a project in 1 year, Akbar and Anthony together in 16 months, and Anthony and Amar together in 2 years. How many months would the person who is neither the fastest nor the slowest of the three take to finish the project alone?", "options": [], "answer": "32", "answer_note": "", "concept": "Add the three pairwise rates to get twice the combined rate, then subtract each pair to isolate individuals.", "formulas": ["Rate = 1/time", "(a + b) + (b + c) + (c + a) = 2(a + b + c)"], "solution": ["1. Monthly rates: Amar + Akbar = 1/12, Akbar + Anthony = 1/16, Anthony + Amar = 1/24.", "2. Sum = 1/12 + 1/16 + 1/24 = 9/48 = 3/16, so all three together = 3/32.", "3. Amar = 3/32 − 1/16 = 1/32; Akbar = 3/32 − 1/24 = 5/96; Anthony = 3/32 − 1/12 = 1/96.", "4. Fastest is Akbar (19.2 months), slowest is Anthony (96 months), middle is Amar.", "5. Amar alone takes 32 months."], "shortcut": "Use LCM 48 units of work: pair rates 4, 3, 2 units/month ⇒ total 4.5 ⇒ individuals 2.5, 0.5, 1.5; middle 1.5 ⇒ 48/1.5 = 32.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-12.shtml"}, {"id": "2021-S1-Q13", "year": 2021, "slot": 1, "q_no": 13, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Subsets with inclusion/exclusion constraints", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 1.83% correct", "question": "Groups are formed, each containing three or more distinct numbers chosen from 1, 2, 3, 4, 5, 6, 7 and 8. Every group must contain both 3 and 5, and no group may contain 7 and 8 together. How many such groups are possible?", "options": [], "answer": "47", "answer_note": "", "concept": "Fix the compulsory elements, count subsets of the remaining elements, and subtract the forbidden ones (complement counting).", "formulas": ["Number of subsets of an n-element set = 2ⁿ", "Valid = Total − Forbidden"], "solution": ["1. 3 and 5 are fixed; the other six numbers 1, 2, 4, 6, 7, 8 may each be in or out: 2⁶ = 64 choices.", "2. At least three elements needed ⇒ exclude the empty choice: 63.", "3. Choices containing both 7 and 8: the remaining 1, 2, 4, 6 are free: 2⁴ = 16 (all of these have ≥ 3 elements anyway).", "4. Valid groups = 63 − 16 = 47."], "shortcut": "Count {7,8} options as 3 (neither, only 7, only 8) × 2⁴ for the rest = 48, minus the empty case = 47.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-13.shtml"}, {"id": "2021-S1-Q14", "year": 2021, "slot": 1, "q_no": 14, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Right triangle – inradius", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 16.56% correct", "question": "A circle of diameter 8 inches is inscribed in triangle ABC with ∠ABC = 90°. If BC = 10 inches, find the area of the triangle in square inches.", "options": [], "answer": "120", "answer_note": "", "concept": "In a right triangle the inradius equals (sum of legs − hypotenuse)/2; with one leg known, this plus Pythagoras fixes the other leg.", "formulas": ["Right triangle: r = (a + b − c)/2", "Tangent lengths from a vertex are equal", "a² + b² = c²"], "solution": ["1. Inradius r = 4. Let AB = b; then hypotenuse AC = 10 + b − 2r = b + 2.", "2. Pythagoras: 10² + b² = (b + 2)² ⇒ 100 = 4b + 4 ⇒ b = 24.", "3. Sides are 10, 24, 26 (check: (10 + 24 − 26)/2 = 4).", "4. Area = (1/2) × 10 × 24 = 120 sq inches."], "shortcut": "Recognise the 5-12-13 triple scaled by 2: 10-24-26 has inradius 4.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-14.shtml"}, {"id": "2021-S1-Q15", "year": 2021, "slot": 1, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular hexagon – diagonals & distances", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 14.57% correct", "question": "ABCDEF is a regular hexagon of side 2 cm, and T is the midpoint of side CD. Find the length of AT, in cm.", "options": ["√15", "√13", "√12", "√14"], "answer": "√13", "answer_note": "", "concept": "In a regular hexagon the short diagonal AC is perpendicular to side CD, so AT is the hypotenuse of a right triangle.", "formulas": ["Short diagonal of regular hexagon = s√3", "Interior angle = 120°, ∠ACD = 90°"], "solution": ["1. AC is a short diagonal: AC = 2√3.", "2. In triangle ABC, ∠BCA = 30°; interior angle BCD = 120°, so ∠ACD = 90°.", "3. CT = half of CD = 1.", "4. AT² = AC² + CT² = 12 + 1 = 13, so AT = √13 cm."], "shortcut": "Coordinates: centre at origin, A = (2, 0), C = (−1, √3), D = (−2, 0) ⇒ T = (−1.5, √3/2), AT² = 12.25 + 0.75 = 13.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-15.shtml"}, {"id": "2021-S1-Q16", "year": 2021, "slot": 1, "q_no": 16, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – equation in count", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 10.49% correct", "question": "Hospital A admitted 21 fewer COVID-infected patients than hospital B, and every patient in both hospitals eventually recovered. The recovery times of all patients in A add up to 200 days, and in B to 152 days. If the average recovery time in A was 3 days more than in B, how many patients did A admit?", "options": [], "answer": "35", "answer_note": "", "concept": "Average = total ÷ count; set up the difference of averages as an equation in the unknown count.", "formulas": ["Average = Sum ÷ Number"], "solution": ["1. Let A have x patients, so B has x + 21.", "2. 200/x − 152/(x + 21) = 3.", "3. 200(x + 21) − 152x = 3x(x + 21) ⇒ 48x + 4200 = 3x² + 63x ⇒ 3x² + 15x − 4200 = 0 ⇒ x² + 5x − 1400 = 0.", "4. (x + 40)(x − 35) = 0 ⇒ x = 35.", "5. Check: 200/35 − 152/56 = 40/7 − 19/7 = 3. A admitted 35 patients."], "shortcut": "x must make 200/x and 152/(x + 21) have the same fractional part; try divisors-friendly values: x = 35 gives 40/7 and 19/7.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-16.shtml"}, {"id": "2021-S1-Q17", "year": 2021, "slot": 1, "q_no": 17, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – linear relations", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 46.85% correct", "question": "In one day, Neeta and Geeta together earn as much as Sita earns in 6 days. In one day, Sita and Neeta together earn as much as Geeta earns in 2 days. What is the ratio of the daily earning of the highest earner to that of the lowest earner?", "options": ["7 : 3", "11 : 3", "11 : 7", "3 : 2"], "answer": "11 : 3", "answer_note": "", "concept": "Two homogeneous linear equations in three unknowns determine their ratio.", "formulas": ["Solve n + g = 6s and n + s = 2g for n : g : s"], "solution": ["1. Let daily earnings be n, g, s: n + g = 6s and n + s = 2g.", "2. Subtract: g − s = 6s − 2g ⇒ 3g = 7s ⇒ g = 7s/3.", "3. Then n = 6s − 7s/3 = 11s/3.", "4. n : g : s = 11 : 7 : 3; highest is Neeta, lowest is Sita.", "5. Required ratio = 11 : 3."], "shortcut": "Put s = 3: n + g = 18 and n + 3 = 2g ⇒ g = 7, n = 11.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-17.shtml"}, {"id": "2021-S1-Q18", "year": 2021, "slot": 1, "q_no": 18, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Grouped natural numbers – sum of a group", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 17.86% correct", "question": "The natural numbers are split into consecutive groups as (1), (2, 3, 4), (5, 6, 7, 8, 9), and so on, each group having two more numbers than the previous one. What is the sum of the numbers in the 15th group?", "options": ["6119", "7471", "4941", "6090"], "answer": "6119", "answer_note": "", "concept": "Group sizes 1, 3, 5, … are odd numbers, so the first n groups contain n² numbers; group n ends at n².", "formulas": ["1 + 3 + … + (2n − 1) = n²", "Sum of AP = (number of terms/2) × (first + last)"], "solution": ["1. The kth group has 2k − 1 numbers and ends at k².", "2. Group 14 ends at 196, so group 15 runs from 197 to 225 (29 numbers).", "3. Sum = (29/2) × (197 + 225) = 29 × 211.", "4. = 6119."], "shortcut": "The group sum is (number of terms) × (middle term) = 29 × 211 = 6119; only option ending in 9 apart from none of others matching 29 × 211.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-18.shtml"}, {"id": "2021-S1-Q19", "year": 2021, "slot": 1, "q_no": 19, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – alternate days", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 61.31% correct", "question": "Anu, Vinu and Manu can each finish a piece of work alone in 15, 12 and 20 days respectively. Vinu works every day, Anu works only on alternate days starting from the first day, and Manu works only on the days Anu does not. In how many days will the work be finished?", "options": ["8", "6", "5", "7"], "answer": "7", "answer_note": "", "concept": "Group the work into a repeating 2-day cycle and check how many full cycles plus extra days complete the job.", "formulas": ["Rate = 1/time", "Take total work = LCM of times"], "solution": ["1. Take total work = 60 units: Anu 4, Vinu 5, Manu 3 units/day.", "2. Odd days (Anu + Vinu): 9 units; even days (Vinu + Manu): 8 units.", "3. Each 2-day cycle = 17 units; after 3 cycles (6 days) 51 units are done.", "4. Day 7 is odd: 9 more units, total 60. Work finishes in 7 days."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-19.shtml"}, {"id": "2021-S1-Q20", "year": 2021, "slot": 1, "q_no": 20, "area": "Number System", "topic": "Number System", "subtopic": "Digits – reversal of a three-digit number", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 12.29% correct", "question": "How many three-digit numbers greater than 100 become exactly 198 larger when their digits are written in reverse order?", "options": [], "answer": "70", "answer_note": "", "concept": "Reversing a three-digit number abc changes its value by 99(c − a), independent of the middle digit.", "formulas": ["cba − abc = 99(c − a)"], "solution": ["1. Let the number be 100a + 10b + c with a ≥ 1.", "2. Reverse − original = 99(c − a) = 198 ⇒ c = a + 2.", "3. a can be 1 to 7 (so c ≤ 9): 7 choices; b can be 0 to 9: 10 choices.", "4. Total = 7 × 10 = 70 (all exceed 100)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-20.shtml"}, {"id": "2021-S1-Q21", "year": 2021, "slot": 1, "q_no": 21, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Trains – crossing each other", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 52.08% correct", "question": "Two trains on parallel tracks moving in opposite directions cross each other in 14 seconds. The faster train is 160 m long and crosses a lamp post in 12 seconds. If the slower train is 6 km/h slower than the faster one, find the length of the slower train in metres.", "options": ["184", "180", "190", "192"], "answer": "190", "answer_note": "", "concept": "Crossing a pole covers the train's own length; crossing each other in opposite directions covers the sum of lengths at the sum of speeds.", "formulas": ["Speed = length ÷ time", "Opposite directions: relative speed = v₁ + v₂", "1 km/h = 5/18 m/s"], "solution": ["1. Faster train speed = 160/12 = 40/3 m/s = 48 km/h.", "2. Slower train speed = 42 km/h = 35/3 m/s.", "3. Relative speed = 40/3 + 35/3 = 25 m/s.", "4. Sum of lengths = 25 × 14 = 350 m.", "5. Slower train length = 350 − 160 = 190 m."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-21.shtml"}, {"id": "2021-S1-Q22", "year": 2021, "slot": 1, "q_no": 22, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Recursive sequence – periodicity", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 19.61% correct", "question": "A sequence satisfies x₀ = 1, x₁ = 2 and xₙ₊₂ = (1 + xₙ₊₁)/xₙ for n = 0, 1, 2, …. What is x₂₀₂₁?", "options": ["4", "3", "1", "2"], "answer": "2", "answer_note": "", "concept": "Recurrences of the form xₙ₊₂ = (1 + xₙ₊₁)/xₙ are periodic; compute a few terms to find the period.", "formulas": ["If a sequence has period p, xₙ = x₍ₙ mod p₎"], "solution": ["1. x₂ = (1 + 2)/1 = 3.", "2. x₃ = (1 + 3)/2 = 2; x₄ = (1 + 2)/3 = 1.", "3. x₅ = (1 + 1)/2 = 1; x₆ = (1 + 1)/1 = 2.", "4. Since (x₅, x₆) = (x₀, x₁), the sequence repeats with period 5.", "5. 2021 = 5 × 404 + 1, so x₂₀₂₁ = x₁ = 2."], "shortcut": "This is the well-known period-5 (Lyness) recurrence; just reduce the index mod 5.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-1-Quant/quants-question-22.shtml"}, {"id": "2021-S2-Q01", "year": 2021, "slot": 2, "q_no": 1, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Distribution of identical objects", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.45% correct", "question": "Three children are to receive 15 identical balloons, 6 identical pencils and 3 identical erasers. Every child must end up with at least 4 balloons and at least 1 pencil (erasers have no restriction). In how many ways can the items be distributed?", "options": [], "answer": "1000", "answer_note": "", "concept": "Distributing identical items among distinct people is a stars-and-bars count; independent item types multiply.", "formulas": ["Ways to give n identical items to r people (each ≥ 0) = C(n+r−1, r−1)", "Handle minimums by pre-allotting them"], "solution": ["1. Balloons: give 4 to each child first, leaving 3 balloons to distribute freely: C(3+2, 2) = 10.", "2. Pencils: give 1 to each child first, leaving 3 pencils: C(5, 2) = 10.", "3. Erasers: 3 erasers with no restriction: C(5, 2) = 10.", "4. The three distributions are independent, so total = 10 × 10 × 10 = 1000."], "shortcut": "After pre-allotting minimums, each item type reduces to '3 identical things among 3 children' = 10 ways, so 10³.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-1.shtml"}, {"id": "2021-S2-Q02", "year": 2021, "slot": 2, "q_no": 2, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Nested logarithms", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "2IIM: 45.74% correct", "question": "If log₂[3 + log₃{4 + log₄(x − 1)}] − 2 = 0, what is the value of 4x?", "options": [], "answer": "5", "answer_note": "", "concept": "Peel nested logarithms from the outside in by converting each to exponential form.", "formulas": ["logₐ N = k ⇔ N = aᵏ"], "solution": ["1. log₂[...] = 2, so 3 + log₃{4 + log₄(x − 1)} = 2² = 4.", "2. Hence log₃{4 + log₄(x − 1)} = 1, so 4 + log₄(x − 1) = 3.", "3. So log₄(x − 1) = −1, giving x − 1 = 1/4.", "4. x = 5/4, so 4x = 5."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-2.shtml"}, {"id": "2021-S2-Q03", "year": 2021, "slot": 2, "q_no": 3, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Simultaneous non-linear equations", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.89% correct", "question": "Real numbers x and y satisfy x² − xy − x = 22 and y² − xy + y = 34, with x > y. Find x − y.", "options": ["8", "6", "7", "4"], "answer": "8", "answer_note": "", "concept": "Adding the two equations produces a perfect square in (x − y), turning the system into a quadratic in one variable.", "formulas": ["(x − y)² = x² − 2xy + y²"], "solution": ["1. Add the equations: x² − 2xy + y² − x + y = 56.", "2. This is (x − y)² − (x − y) = 56. Let t = x − y.", "3. t² − t − 56 = 0 ⇒ (t − 8)(t + 7) = 0 ⇒ t = 8 or −7.", "4. Since x > y, t > 0, so x − y = 8.", "5. Check: x(x − y − 1) = 22 gives x = 22/7, and y = x − 8 = −34/7 satisfies y(y − x + 1) = 34."], "shortcut": "Sum the equations to get t² − t = 56 with t = x − y; only 8 among the options satisfies it.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-3.shtml"}, {"id": "2021-S2-Q04", "year": 2021, "slot": 2, "q_no": 4, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Repeated replacement", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 19.85% correct", "question": "A container is completely full of pure milk. 9 litres are removed and replaced with water; then 9 litres of the mixture are removed and again replaced with water. Now milk and water are in the ratio 16 : 9. What is the capacity of the container in litres?", "options": [], "answer": "45", "answer_note": "", "concept": "When a fixed quantity is repeatedly withdrawn and replaced, the fraction of the original liquid shrinks by a constant factor each time.", "formulas": ["Milk remaining after n replacements = C × (1 − x/C)ⁿ"], "solution": ["1. Milk fraction after two operations = 16/(16 + 9) = 16/25.", "2. So (1 − 9/C)² = 16/25, giving 1 − 9/C = 4/5.", "3. 9/C = 1/5 ⇒ C = 45 litres."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-4.shtml"}, {"id": "2021-S2-Q05", "year": 2021, "slot": 2, "q_no": 5, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Trains crossing in opposite directions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.57% correct", "question": "Trains A and B travel towards each other on parallel tracks; their speeds are in the ratio 5 : 3. Starting from the instant their front ends are level, the front of A reaches the rear of B after 46 seconds. After a further 69 seconds, the rear ends of the two trains pass each other. Find the ratio of length of A to length of B.", "options": ["2 : 3", "2 : 1", "5 : 3", "3 : 2"], "answer": "3 : 2", "answer_note": "", "concept": "In opposite-direction crossing, relative speed is the sum of speeds, and each phase of the crossing covers a specific train length at that constant relative speed.", "formulas": ["Relative speed (opposite directions) = v₁ + v₂", "Distance = relative speed × time"], "solution": ["1. Let relative speed = v (constant throughout).", "2. From fronts level to A's front reaching B's rear, the relative distance covered is the length of B: L_B = 46v.", "3. From then until the rears pass, the additional relative distance is the length of A: L_A = 69v.", "4. L_A : L_B = 69 : 46 = 3 : 2 (the 5 : 3 speed ratio is not needed)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-5.shtml"}, {"id": "2021-S2-Q06", "year": 2021, "slot": 2, "q_no": 6, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work and wages", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 45.19% correct", "question": "Anil alone can paint a house in 60 days and Bimal alone in 84 days. Anil works by himself for 10 days, after which Bimal and Charu join him and the three finish the job in another 14 days. If ₹21000 is paid for the whole job and shared in proportion to work done, how much (in INR) does Charu get?", "options": ["9000", "9100", "9200", "9150"], "answer": "9100", "answer_note": "", "concept": "Wages are split in proportion to the fraction of total work each person completes.", "formulas": ["Work done = rate × time", "Share = (fraction of work) × total payment"], "solution": ["1. Anil works 24 days in total: 24/60 = 2/5 of the job.", "2. Bimal works 14 days: 14/84 = 1/6 of the job.", "3. Charu does the rest: 1 − 2/5 − 1/6 = 13/30.", "4. Charu's share = 13/30 × 21000 = ₹9100."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-6.shtml"}, {"id": "2021-S2-Q07", "year": 2021, "slot": 2, "q_no": 7, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "2IIM: 45.19% correct", "question": "A box holds 450 balls, each white or black. Exactly 40% of the white balls and 50% of the black balls are metallic, and the number of metallic white balls equals the number of metallic black balls. How many balls in the box are non-metallic?", "options": [], "answer": "250", "answer_note": "", "concept": "Equating two percentage-parts gives the ratio of the two groups.", "formulas": ["0.4W = 0.5B ⇒ W : B = 5 : 4"], "solution": ["1. Let W white and B black balls; 0.4W = 0.5B gives W : B = 5 : 4.", "2. With W + B = 450: W = 250, B = 200.", "3. Metallic balls = 0.4 × 250 + 0.5 × 200 = 100 + 100 = 200.", "4. Non-metallic = 450 − 200 = 250."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-7.shtml"}, {"id": "2021-S2-Q08", "year": 2021, "slot": 2, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Partnership", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.37% correct", "question": "Anil, Bobby and Chintu put money into a joint venture and divide the profit in the ratio of their investments. Anil's investment is 70% of the total. If the overall profit rate drops from 18% to 15%, Anil's profit falls by ₹420. If the overall profit rate rises from 15% to 17%, Chintu's profit rises by ₹80. What is Bobby's investment in INR?", "options": ["2400", "2200", "2000", "1800"], "answer": "2000", "answer_note": "", "concept": "With profit proportional to investment, each partner earns the overall profit rate on their own investment, so a change in rate scales each partner's capital.", "formulas": ["Change in profit = investment × change in profit rate"], "solution": ["1. Anil: 3% of his investment = 420 ⇒ Anil invested 14000.", "2. Total investment = 14000/0.7 = 20000.", "3. Chintu: 2% of his investment = 80 ⇒ Chintu invested 4000.", "4. Bobby = 20000 − 14000 − 4000 = ₹2000."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-8.shtml"}, {"id": "2021-S2-Q09", "year": 2021, "slot": 2, "q_no": 9, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rhombus – diagonals", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 9.81% correct", "question": "A rhombus has side 5 cm and area 12 sq cm. What is the length (in cm) of its longer diagonal?", "options": ["(√37 − √13)/2", "(√13 + √12)/2", "√37 + √13", "√13 + √1
