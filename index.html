per-Slot-1-Quant/quant-question-21.shtml"}, {"id": "2017-S1-Q22", "year": 2017, "slot": 1, "q_no": 22, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Powers of a root of a quadratic", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If x² = x + 1 and x > 0, what is the value of 2x⁴?", "options": ["6 + 4√5", "3 + 5√5", "5 + 3√5", "7 + 3√5"], "answer": "7 + 3√5", "answer_note": "", "concept": "Use the defining relation to reduce higher powers to a linear expression in x.", "formulas": ["x² = x + 1 ⇒ x⁴ = (x + 1)² = 3x + 2", "Positive root: x = (1 + √5)/2"], "solution": ["1. x⁴ = (x²)² = (x + 1)² = x² + 2x + 1 = (x + 1) + 2x + 1 = 3x + 2.", "2. The positive root is x = (1 + √5)/2.", "3. 2x⁴ = 6x + 4 = 3(1 + √5) + 4 = 7 + 3√5."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-22.shtml"}, {"id": "2017-S1-Q23", "year": 2017, "slot": 1, "q_no": 23, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – change of base", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the value of log₀.₀₀₈(√5) + log_√3(81) − 7.", "options": ["1/3", "2/3", "5/6", "7/6"], "answer": "5/6", "answer_note": "", "concept": "Write each base and argument as a power of a common prime and use log_(aᵐ)(aⁿ) = n/m.", "formulas": ["log_(aᵐ)(aⁿ) = n/m", "0.008 = 1/125 = 5⁻³"], "solution": ["1. 0.008 = 5⁻³ and √5 = 5^(1/2), so the first term is (1/2)/(−3) = −1/6.", "2. √3 = 3^(1/2) and 81 = 3⁴, so the second term is 4/(1/2) = 8.", "3. Total = −1/6 + 8 − 7 = 5/6."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-23.shtml"}, {"id": "2017-S1-Q24", "year": 2017, "slot": 1, "q_no": 24, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equation – common base", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If 9^(2x − 1) − 81^(x − 1) = 1944, find x.", "options": ["3", "9/4", "4/9", "1/3"], "answer": "9/4", "answer_note": "", "concept": "Rewrite both terms with the same base, factor out the common power, and compare exponents.", "formulas": ["81^(x − 1) = 9^(2x − 2)", "aᵐ = aⁿ ⇒ m = n"], "solution": ["1. 81^(x − 1) = 9^(2x − 2), so the equation is 9^(2x − 1) − 9^(2x − 2) = 1944.", "2. Factor: 9^(2x − 2)(9 − 1) = 1944, so 9^(2x − 2) = 243.", "3. 243 = 3⁵, while 9^(2x − 2) = 3^(4x − 4). So 4x − 4 = 5.", "4. x = 9/4."], "shortcut": "x = 3 gives a huge value; x = 9/4 checks out: 9^3.5 − 9^2.5 = 2187 − 243 = 1944.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-24.shtml"}, {"id": "2017-S1-Q25", "year": 2017, "slot": 1, "q_no": 25, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting integer solutions with bounds", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many triples (x, y, z) of positive integers satisfy x − y − z = 25 with x ≤ 40, y ≤ 12 and z ≤ 12?", "options": ["101", "99", "87", "105"], "answer": "99", "answer_note": "", "concept": "Fix x = 25 + y + z and count (y, z) pairs that keep x within its bound.", "formulas": ["x = 25 + y + z ≤ 40 ⇒ y + z ≤ 15"], "solution": ["1. x = 25 + y + z, so the condition x ≤ 40 becomes y + z ≤ 15, with 1 ≤ y, z ≤ 12.", "2. For y + z = s with 2 ≤ s ≤ 13, there are s − 1 pairs: total 1 + 2 + … + 12 = 78.", "3. For s = 14: y from 2 to 12, giving 11 pairs. For s = 15: y from 3 to 12, giving 10 pairs.", "4. Total = 78 + 11 + 10 = 99."], "shortcut": "Count all pairs with y + z ≤ 15 (1 + … + 14 = 105) and remove those with y = 13 or 14 or z = 13 or 14 (3 + 2 + 1 = 6): 99.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-25.shtml"}, {"id": "2017-S1-Q26", "year": 2017, "slot": 1, "q_no": 26, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Quadratic inequality – integer count", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many integers n satisfy (n − 5)(n − 10) − 3(n − 2) ≤ 0?", "options": [], "answer": "11", "answer_note": "", "concept": "Expand to a standard quadratic and count the integers lying between its roots.", "formulas": ["ax² + bx + c ≤ 0 (a > 0) holds between the roots"], "solution": ["1. Expand: n² − 15n + 50 − 3n + 6 = n² − 18n + 56 ≤ 0.", "2. Factor: (n − 4)(n − 14) ≤ 0.", "3. So 4 ≤ n ≤ 14, giving 14 − 4 + 1 = 11 integers."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-26.shtml"}, {"id": "2017-S1-Q27", "year": 2017, "slot": 1, "q_no": 27, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Discriminant – distinct real roots", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Let f₁(x) = x² + 11x + n and f₂(x) = x. What is the largest positive integer n for which f₁(x) = f₂(x) has two distinct real roots?", "options": [], "answer": "24", "answer_note": "", "concept": "Two distinct real roots require a strictly positive discriminant.", "formulas": ["Discriminant D = b² − 4ac > 0"], "solution": ["1. f₁(x) = f₂(x) gives x² + 10x + n = 0.", "2. Need 100 − 4n > 0, so n < 25.", "3. The largest such positive integer is 24."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-27.shtml"}, {"id": "2017-S1-Q28", "year": 2017, "slot": 1, "q_no": 28, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Minimising sum of squares under integer constraint", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "a, b, c and d are integers with a + b + c + d = 30. What is the smallest possible value of (a − b)² + (a − c)² + (a − d)²?", "options": [], "answer": "2", "answer_note": "", "concept": "Squares are minimised when all variables are as equal as possible; integrality and the sum condition prevent them from being exactly equal.", "formulas": ["Sum of squares = 0 only if all terms are 0"], "solution": ["1. The value is 0 only if a = b = c = d, which needs 4a = 30, impossible for integers.", "2. A value of 1 needs exactly one of b, c, d to differ from a by 1 and the rest equal to a: then the sum is 4a ± 1, which is odd, not 30.", "3. A value of 2: take a = 7 or 8 with two others equal to a ± 1. With a = 8, b = 8, c = 7, d = 7: sum 30 and value 0 + 1 + 1 = 2.", "4. So the minimum is 2."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-28.shtml"}, {"id": "2017-S1-Q29", "year": 2017, "slot": 1, "q_no": 29, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Triangles from points with collinearities", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "AB, CD, EF, GH and JK are five diameters of a circle centred at O. In how many ways can three of the 11 points A, B, C, D, E, F, G, H, J, K and O be chosen so that they form a triangle?", "options": [], "answer": "160", "answer_note": "", "concept": "Count all triples, then subtract collinear ones; the only collinear triples are the two ends of a diameter together with the centre.", "formulas": ["Triangles = C(n, 3) − collinear triples"], "solution": ["1. Total triples from 11 points: C(11, 3) = 165.", "2. Three points on the circle are never collinear.", "3. A triple is collinear only if it is the two ends of one diameter plus O: 5 such triples.", "4. Triangles = 165 − 5 = 160."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-29.shtml"}, {"id": "2017-S1-Q30", "year": 2017, "slot": 1, "q_no": 30, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Distance from a point to a modulus graph", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "What is the shortest distance from the point (1/2, 1) to the curve y = |x − 1| + |x + 1|?", "options": ["1", "0", "√2", "√(3/2)"], "answer": "1", "answer_note": "", "concept": "Sketch the piecewise-linear graph; between −1 and 1 it is the flat line y = 2, which lies directly above the point.", "formulas": ["|x − 1| + |x + 1| = 2 for −1 ≤ x ≤ 1, = 2|x| outside"], "solution": ["1. For −1 ≤ x ≤ 1, y = (1 − x) + (x + 1) = 2: a horizontal segment.", "2. For |x| > 1, y = 2|x| > 2, rising steeply away from the point.", "3. The point (1/2, 1) lies right below the flat part; the perpendicular distance to y = 2 is 2 − 1 = 1, landing at (1/2, 2), which is on the segment.", "4. The sloped parts are further away, so the shortest distance is 1."], "shortcut": "The whole graph has y ≥ 2, so the distance is at least 1 vertically, and (1/2, 2) achieves it.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-30.shtml"}, {"id": "2017-S1-Q31", "year": 2017, "slot": 1, "q_no": 31, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – relation among terms", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In an arithmetic progression with positive common difference, the square of the 7th term equals the product of the 3rd and 17th terms. What is the ratio of the first term to the common difference?", "options": ["2 : 3", "3 : 2", "3 : 4", "4 : 3"], "answer": "2 : 3", "answer_note": "", "concept": "Write each term as a + (n − 1)d and solve the resulting equation for a/d.", "formulas": ["Tₙ = a + (n − 1)d"], "solution": ["1. (a + 6d)² = (a + 2d)(a + 16d).", "2. a² + 12ad + 36d² = a² + 18ad + 32d².", "3. 4d² = 6ad; since d > 0, a = 2d/3.", "4. a : d = 2 : 3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-31.shtml"}, {"id": "2017-S1-Q32", "year": 2017, "slot": 1, "q_no": 32, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Distribution with upper and lower bounds", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In how many ways can 7 identical erasers be shared among 4 children so that each child gets at least 1 and no child gets more than 3?", "options": ["16", "20", "14", "15"], "answer": "16", "answer_note": "", "concept": "After giving each child one eraser, distribute the rest with a cap; list the possible patterns.", "formulas": ["Arrangements of a multiset: n!/(p!q!…)"], "solution": ["1. Give each child 1 eraser; 3 remain, and each child may receive at most 2 more.", "2. Patterns for the extra 3: (2, 1, 0, 0) or (1, 1, 1, 0); (3, 0, 0, 0) is not allowed.", "3. (2, 1, 0, 0) can be assigned in 4!/2! = 12 ways; (1, 1, 1, 0) in 4 ways.", "4. Total = 12 + 4 = 16."], "shortcut": "Without the cap there are C(6, 3) = 20 ways; subtract the 4 where one child gets all 3 extras: 16.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-32.shtml"}, {"id": "2017-S1-Q33", "year": 2017, "slot": 1, "q_no": 33, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Composite functions", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Given f(x) = (5x + 2)/(3x − 5) and g(x) = x² − 2x − 1, find g(f(f(3))).", "options": ["2", "1/3", "6", "2/3"], "answer": "2", "answer_note": "", "concept": "Evaluate the composition from the inside out; f here is its own inverse.", "formulas": ["f(x) = (ax + b)/(cx − a) satisfies f(f(x)) = x"], "solution": ["1. f(3) = (15 + 2)/(9 − 5) = 17/4.", "2. f(17/4) = (85/4 + 2)/(51/4 − 5) = (93/4)/(31/4) = 3.", "3. g(3) = 9 − 6 − 1 = 2."], "shortcut": "f has the form (ax + b)/(cx − a), so f(f(x)) = x and the answer is g(3) = 2 directly.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-33.shtml"}, {"id": "2017-S1-Q34", "year": 2017, "slot": 1, "q_no": 34, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – sum of terms", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "a₁, a₂, …, a₃ₙ is an arithmetic progression with a₁ = 3 and a₂ = 7. If a₁ + a₂ + … + a₃ₙ = 1830, what is the smallest positive integer m for which m(a₁ + a₂ + … + aₙ) > 1830?", "options": ["8", "9", "10", "11"], "answer": "9", "answer_note": "", "concept": "Find n from the sum of 3n terms, compute the sum of the first n terms, then find the multiplier.", "formulas": ["Sₖ = k/2 × [2a + (k − 1)d]"], "solution": ["1. d = 4, so Sₖ = k/2 × (6 + 4(k − 1)) = k(2k + 1).", "2. S₃ₙ = 3n(6n + 1) = 1830, so n(6n + 1) = 610, giving n = 10.", "3. Sₙ = S₁₀ = 10 × 21 = 210.", "4. 8 × 210 = 1680 < 1830 and 9 × 210 = 1890 > 1830, so m = 9."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-1-Quant/quant-question-34.shtml"}, {"id": "2017-S2-Q01", "year": 2017, "slot": 2, "q_no": 1, "area": "Number System", "topic": "Number System", "subtopic": "Magic square", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The digits 1 to 9 are each placed once in a 3 × 3 grid so that all three rows, all three columns and both diagonals have the same total. The top-left cell holds 6 and the top-right cell holds 2. What number is in the middle cell of the bottom row?", "options": [], "answer": "3", "answer_note": "", "concept": "In a 3 × 3 magic square using 1–9, every line sums to 15 and the centre is always 5; the remaining cells follow from line sums.", "formulas": ["Magic sum = (1 + 2 + … + 9)/3 = 15", "Centre of a 3 × 3 magic square = 15/3 = 5"], "solution": ["1. Total of 1–9 is 45, so each of the 3 rows sums to 15.", "2. The centre is 5 (it equals one-third of the magic sum).", "3. Top row: 6 + top-middle + 2 = 15, so top-middle = 7.", "4. The middle column is top-middle, centre, bottom-middle: 7 + 5 + bottom-middle = 15.", "5. Bottom-middle = 3."], "shortcut": "Bottom-middle = 15 − 5 − (15 − 6 − 2) = 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-1.shtml"}, {"id": "2017-S2-Q02", "year": 2017, "slot": 2, "q_no": 2, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Races – relative distance", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a 10 km race run at constant speeds, A, B and C finish first, second and third. When A finishes, B is 1 km behind; when B finishes, C is 1 km behind. By how many metres does A beat C?", "options": [], "answer": "1900", "answer_note": "", "concept": "With constant speeds, distances covered in equal times are in the ratio of speeds, so speed ratios can be chained.", "formulas": ["Distance ratio in the same time = speed ratio", "Speed ratios multiply: C/A = (C/B)(B/A)"], "solution": ["1. While A runs 10 km, B runs 9 km, so B/A = 9/10.", "2. While B runs 10 km, C runs 9 km, so C/B = 9/10.", "3. Hence C/A = 81/100: when A runs 10 km, C runs 8.1 km.", "4. A beats C by 10 − 8.1 = 1.9 km = 1900 m."], "shortcut": "Not 2000: lead = 10(1 − 0.9²) km.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-2.shtml"}, {"id": "2017-S2-Q03", "year": 2017, "slot": 2, "q_no": 3, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – alligation", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Bottle 1 holds milk and water in the ratio 7 : 2 and Bottle 2 holds milk and water in the ratio 9 : 4. In what ratio of volumes should the contents of the two bottles be combined so that the final milk-to-water ratio is 3 : 1?", "options": ["27 : 14", "27 : 13", "27 : 16", "27 : 18"], "answer": "27 : 13", "answer_note": "", "concept": "Alligation on the milk fraction of each bottle gives the mixing ratio directly.", "formulas": ["Alligation: V1 : V2 = (c2 − m) : (m − c1), using concentrations c1, c2 and mean m"], "solution": ["1. Milk fractions: Bottle 1 = 7/9, Bottle 2 = 9/13, target = 3/4.", "2. Bottle 1 is above the target and Bottle 2 below it.", "3. V1 : V2 = (3/4 − 9/13) : (7/9 − 3/4) = (3/52) : (1/36).", "4. = 3 × 36 : 52 = 108 : 52 = 27 : 13."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-3.shtml"}, {"id": "2017-S2-Q04", "year": 2017, "slot": 2, "q_no": 4, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Average speed – unequal routes", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Arun drove from home to his hostel at 60 miles per hour. Coming back, he covered the first half of the same route at 25 mph, and then used a bypass that was 5 miles longer than the remaining half of the route, driving it at 50 mph. The return trip took 30 minutes more than the onward trip. What total distance did he drive (both ways)?", "options": ["55 miles", "60 miles", "65 miles", "70 miles"], "answer": "65 miles", "answer_note": "", "concept": "Set the one-way route as 2x, express both journey times in x and use the 30-minute difference.", "formulas": ["Time = Distance / Speed"], "solution": ["1. Let the one-way route be 2x miles; onward time = 2x/60 = x/30 h.", "2. Return time = x/25 + (x + 5)/50 h.", "3. x/25 + (x + 5)/50 − x/30 = 1/2; multiply by 150: 6x + 3x + 15 − 5x = 75.", "4. 4x = 60, so x = 15; onward = 30 miles, return = 15 + 20 = 35 miles.", "5. Total = 65 miles."], "shortcut": "Total = 4x + 5 must be odd → only 55 or 65; check x = 15 works.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-4.shtml"}, {"id": "2017-S2-Q05", "year": 2017, "slot": 2, "q_no": 5, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Successive percentages", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a factory, 15% of the shirts made are defective. Of the non-defective shirts, 20% are sold in the domestic market and the remaining 8840 are exported. How many shirts were made in all?", "options": ["13600", "13000", "13400", "14000"], "answer": "13000", "answer_note": "", "concept": "Successive percentage reductions multiply on the original quantity.", "formulas": ["Remaining = N × (1 − p1)(1 − p2)"], "solution": ["1. Let N shirts be made; non-defective = 0.85N.", "2. Exported = 80% of that = 0.8 × 0.85N = 0.68N.", "3. 0.68N = 8840, so N = 13000."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-5.shtml"}, {"id": "2017-S2-Q06", "year": 2017, "slot": 2, "q_no": 6, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – removal of members", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The mean height of a group of 22 toddlers goes up by 2 inches when two of them leave the group. The mean height of the two who left is one-third of the original mean of all 22. What is the mean height, in inches, of the 20 toddlers who remain?", "options": ["30", "28", "32", "26"], "answer": "32", "answer_note": "", "concept": "Write the total before and after removal in terms of the unknown original average and equate.", "formulas": ["Sum = Average × Count"], "solution": ["1. Let the original mean be A; total = 22A.", "2. The two who left total 2 × A/3 = 2A/3.", "3. Remaining total = 22A − 2A/3 = 20(A + 2).", "4. 22A − 2A/3 − 20A = 40 ⇒ 4A/3 = 40 ⇒ A = 30.", "5. New mean = A + 2 = 32."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-6.shtml"}, {"id": "2017-S2-Q07", "year": 2017, "slot": 2, "q_no": 7, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Successive profits along a chain", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A table's maker sells it to a wholesaler at a 10% profit, the wholesaler sells it to a retailer at a 30% profit, and the retailer sells it to a customer at a 50% profit. The customer pays Rs 4290. What did it cost to make the table (in Rs)?", "options": ["1500", "2000", "2500", "3000"], "answer": "2000", "answer_note": "", "concept": "Successive markups multiply on the original cost.", "formulas": ["Final price = C × (1 + p1)(1 + p2)(1 + p3)"], "solution": ["1. Let the cost be C.", "2. Customer price = C × 1.1 × 1.3 × 1.5 = 2.145C.", "3. 2.145C = 4290 ⇒ C = 2000."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-7.shtml"}, {"id": "2017-S2-Q08", "year": 2017, "slot": 2, "q_no": 8, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes & cisterns", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A tank has one inlet and one outlet. With the outlet closed, the inlet fills the empty tank in 8 hours; with the outlet open, the inlet takes 10 hours. If the tank is full and only the outlet is opened, how many hours does it take for the tank to become half full?", "options": ["20", "30", "40", "45"], "answer": "20", "answer_note": "", "concept": "Outlet rate = inlet rate − net rate when both are open.", "formulas": ["Rate = 1/time", "Net rate = inlet − outlet"], "solution": ["1. Inlet rate = 1/8 tank/h; inlet + outlet together = 1/10 tank/h.", "2. Outlet rate = 1/8 − 1/10 = 1/40 tank/h (emptying).", "3. Full tank alone empties in 40 h, so half the tank drains in 20 h."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-8.shtml"}, {"id": "2017-S2-Q09", "year": 2017, "slot": 2, "q_no": 9, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit on mixed purchase", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Mayank buys some candies at Rs 15 per dozen and an equal number of a different candy at Rs 12 per dozen. He sells all of them at Rs 16.50 per dozen and earns a total profit of Rs 150. How many dozens of candies did he buy altogether?", "options": ["50", "30", "25", "45"], "answer": "50", "answer_note": "", "concept": "With equal quantities, use the average cost price per dozen.", "formulas": ["Profit = (SP − average CP) × quantity"], "solution": ["1. Equal numbers of each, so average cost = (15 + 12)/2 = Rs 13.50 per dozen.", "2. Profit per dozen = 16.50 − 13.50 = Rs 3.", "3. Total dozens = 150/3 = 50."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-9.shtml"}, {"id": "2017-S2-Q10", "year": 2017, "slot": 2, "q_no": 10, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentage change – per capita", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a village, food grain production rises by 40% while per capita production of food grains rises by 27%. To the nearest integer, by what percentage has the village population increased?", "options": ["16", "13", "10", "7"], "answer": "10", "answer_note": "", "concept": "Per capita = production/population, so the population factor is the ratio of the two growth factors.", "formulas": ["Per capita = Total / Population", "Population factor = 1.40/1.27"], "solution": ["1. New population / old population = 1.40 / 1.27.", "2. 1.40/1.27 ≈ 1.102.", "3. Population increased by about 10%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-10.shtml"}, {"id": "2017-S2-Q11", "year": 2017, "slot": 2, "q_no": 11, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Combining ratios", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "a, b and c are positive integers with a : b = 3 : 4 and b : c = 2 : 1. Which of the following could equal a + b + c?", "options": ["201", "205", "207", "210"], "answer": "207", "answer_note": "", "concept": "Combine the ratios into a : b : c; the sum must be a multiple of the sum of the ratio terms.", "formulas": ["a : b : c from a : b and b : c by equalising b"], "solution": ["1. a : b = 3 : 4 and b : c = 2 : 1 = 4 : 2.", "2. So a : b : c = 3 : 4 : 2, i.e. a = 3k, b = 4k, c = 2k.", "3. a + b + c = 9k must be a multiple of 9.", "4. Among the options only 207 = 9 × 23 qualifies."], "shortcut": "Digit sum divisible by 9: 2 + 0 + 7 = 9.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-11.shtml"}, {"id": "2017-S2-Q12", "year": 2017, "slot": 2, "q_no": 12, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Meeting point – staggered starts", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A motorbike leaves point A at 1 pm heading towards point B at a constant speed. A car leaves B at 2 pm heading towards A at a constant speed twice that of the motorbike. They meet at 3:40 pm at a point 168 km from A. What is the distance between A and B, in km?", "options": ["364", "378", "380", "388"], "answer": "378", "answer_note": "", "concept": "Find the bike's speed from its distance and time to the meeting, then add the car's distance.", "formulas": ["Distance = Speed × Time"], "solution": ["1. Bike travels 1 pm–3:40 pm = 8/3 h and covers 168 km, so its speed = 63 km/h.", "2. Car speed = 126 km/h; it travels 2 pm–3:40 pm = 5/3 h.", "3. Car distance = 126 × 5/3 = 210 km.", "4. AB = 168 + 210 = 378 km."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-12.shtml"}, {"id": "2017-S2-Q13", "year": 2017, "slot": 2, "q_no": 13, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work & wages", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Amal can finish a job alone in 10 days and Bimal alone in 8 days. Amal, Bimal and Kamal together complete the job in 4 days and are paid Rs 1000 in total, split in proportion to the work each did. How much (in Rs) does Kamal get?", "options": ["100", "200", "300", "400"], "answer": "100", "answer_note": "", "concept": "Wages are shared in proportion to the fraction of work done; find Kamal's fraction over the 4 days.", "formulas": ["Work done = rate × time", "Share ∝ work done"], "solution": ["1. In 4 days Amal does 4/10 = 0.4 of the job.", "2. Bimal does 4/8 = 0.5 of the job.", "3. Kamal does 1 − 0.4 − 0.5 = 0.1 of the job.", "4. Kamal's share = 0.1 × 1000 = Rs 100."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-13.shtml"}, {"id": "2017-S2-Q14", "year": 2017, "slot": 2, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – comparing components", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "There are three mixtures: the first has water and liquid A in the ratio 1 : 2, the second has water and liquid B in the ratio 1 : 3, and the third has water and liquid C in the ratio 1 : 4. The three mixtures (with A, with B and with C respectively) are combined in the ratio 4 : 3 : 2 by volume. The final mixture then contains:", "options": ["equal amounts of water and liquid B", "equal amounts of liquids B and C", "more water than liquid B", "more water than liquid A"], "answer": "more water than liquid B", "answer_note": "", "concept": "Compute the quantity of each component contributed by the given volumes of each mixture.", "formulas": ["Component amount = volume × fraction of that component"], "solution": ["1. Take volumes 4, 3 and 2 units.", "2. From mixture 1: water 4/3, A = 8/3.", "3. From mixture 2: water 3/4, B = 9/4. From mixture 3: water 2/5, C = 8/5.", "4. Total water = 4/3 + 3/4 + 2/5 = 149/60 ≈ 2.48.", "5. A ≈ 2.67, B = 2.25, C = 1.6: water > B, water < A, B ≠ C."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-14.shtml"}, {"id": "2017-S2-Q15", "year": 2017, "slot": 2, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular hexagon – diagonal", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "ABCDEF is a regular hexagon with each side 1 cm. What is the area, in sq cm, of a square drawn with AC as one of its sides?", "options": ["3√2", "3", "4", "√3"], "answer": "3", "answer_note": "", "concept": "The short diagonal AC of a regular hexagon subtends 120° at B; apply the cosine rule (or 30-60-90 geometry).", "formulas": ["AC² = AB² + BC² − 2·AB·BC·cos120°", "Short diagonal of regular hexagon = √3 × side"], "solution": ["1. In triangle ABC, AB = BC = 1 and ∠ABC = 120°.", "2. AC² = 1 + 1 − 2 × 1 × 1 × (−1/2) = 3.", "3. Area of square on AC = AC² = 3 sq cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-15.shtml"}, {"id": "2017-S2-Q16", "year": 2017, "slot": 2, "q_no": 16, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Prism – surface area", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A vertical pillar of uniform cross-section has a base that is a trapezium with parallel sides 10 cm and 20 cm, and its other two sides equal. The perpendicular distance between the parallel sides is 12 cm. If the pillar is 20 cm tall, what is the total area, in sq cm, of all six faces of the pillar?", "options": ["1300", "1340", "1480", "1520"], "answer": "1480", "answer_note": "", "concept": "Total surface area of a prism = 2 × base area + base perimeter × height; the equal legs follow from Pythagoras.", "formulas": ["Trapezium area = ½(a + b)h", "TSA of prism = 2 × base area + perimeter × height"], "solution": ["1. Each leg spans horizontally (20 − 10)/2 = 5 cm and vertically 12 cm, so each leg = √(25 + 144) = 13 cm.", "2. Base area = ½ × (10 + 20) × 12 = 180; top + bottom = 360.", "3. Perimeter = 10 + 20 + 13 + 13 = 56; lateral area = 56 × 20 = 1120.", "4. Total = 1120 + 360 = 1480 sq cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-16.shtml"}, {"id": "2017-S2-Q17", "year": 2017, "slot": 2, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – rectangle diagonals", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The points (2, 5) and (6, 3) are the two ends of one diagonal of a rectangle. The other diagonal lies on the line y = 3x + c. What is c?", "options": ["−5", "−6", "−7", "−8"], "answer": "−8", "answer_note": "", "concept": "The diagonals of a rectangle bisect each other, so the other diagonal passes through the midpoint of the given one.", "formulas": ["Midpoint = ((x1 + x2)/2, (y1 + y2)/2)"], "solution": ["1. Midpoint of (2, 5) and (6, 3) is (4, 4).", "2. The other diagonal passes through (4, 4): 4 = 3 × 4 + c.", "3. c = −8."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-17.shtml"}, {"id": "2017-S2-Q18", "year": 2017, "slot": 2, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – cyclic quadrilateral", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "ABCD is a quadrilateral inscribed in a circle whose centre O lies inside the quadrilateral. If ∠COD = 120° and ∠BAC = 30°, find ∠BCD in degrees.", "options": [], "answer": "90", "answer_note": "", "concept": "An inscribed angle is half the central angle on the same arc, and opposite angles of a cyclic quadrilateral are supplementary.", "formulas": ["Inscribed angle = ½ × central angle on the same arc", "Opposite angles of a cyclic quadrilateral sum to 180°"], "solution": ["1. Arc CD subtends 120° at the centre, so ∠CAD = 60°.", "2. ∠BAD = ∠BAC + ∠CAD = 30° + 60° = 90°.", "3. ∠BCD = 180° − ∠BAD = 90°."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-18.shtml"}, {"id": "2017-S2-Q19", "year": 2017, "slot": 2, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – maximising area", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Three sides of a rectangular park have a combined length of 400 feet. For the area of the park to be as large as possible, how long (in feet) must the longer side be?", "options": [], "answer": "200", "answer_note": "", "concept": "With a fixed sum of 2x + y, the product xy is greatest when 2x = y (AM–GM on 2x and y).", "formulas": ["AM ≥ GM: for 2x + y fixed, 2x·y is max when 2x = y"], "solution": ["1. Let the two equal sides be x and the third side y: 2x + y = 400.", "2. Area = xy = ½ × (2x)(y), maximised when 2x = y = 200.", "3. So x = 100 and y = 200; the longer side is 200 ft."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-19.shtml"}, {"id": "2017-S2-Q20", "year": 2017, "slot": 2, "q_no": 20, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – incircle of right isosceles triangle", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "P is a point inside a right-angled isosceles triangle ABC whose hypotenuse is AB. If P is 4(√2 − 1) cm away from each side of the triangle, what is the area of triangle ABC in sq cm?", "options": [], "answer": "16", "answer_note": "", "concept": "A point equidistant from all three sides is the incentre; for a right triangle r = (a + b − c)/2.", "formulas": ["Right triangle inradius r = (a + b − c)/2", "Legs a, hypotenuse a√2"], "solution": ["1. P is the incentre, so r = 4(√2 − 1).", "2. With legs a, a and hypotenuse a√2: r = (2a − a√2)/2 = a(2 − √2)/2.", "3. a(2 − √2)/2 = 4(√2 − 1) ⇒ a·√2(√2 − 1)/2 = 4(√2 − 1) ⇒ a = 8/√2 = 4√2.", "4. Area = a²/2 = 32/2 = 16 sq cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-20.shtml"}, {"id": "2017-S2-Q21", "year": 2017, "slot": 2, "q_no": 21, "area": "Number System", "topic": "Number System", "subtopic": "Consecutive integers – product", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The product of three consecutive positive integers is 15600. What is the sum of their squares?", "options": ["1777", "1785", "1875", "1877"], "answer": "1877", "answer_note": "", "concept": "Estimate the middle integer from the cube root of the product, then confirm.", "formulas": ["n(n+1)(n+2) ≈ (n+1)³"], "solution": ["1. ∛15600 ≈ 25, so try 24 × 25 × 26 = 15600 ✓.", "2. Sum of squares = 576 + 625 + 676 = 1877."], "shortcut": "Squares of 24, 25, 26 end in 6, 5, 6 → sum ends in 7; 1777 too small.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-21.shtml"}, {"id": "2017-S2-Q22", "year": 2017, "slot": 2, "q_no": 22, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log equation – bounding", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "x is a real number with log₃5 = log₅(2 + x). Which of the following is true?", "options": ["0 < x < 3", "23 < x < 30", "x > 30", "3 < x < 23"], "answer": "3 < x < 23", "answer_note": "", "concept": "Bound log₃5 between simple values and convert back to bounds on 2 + x.", "formulas": ["logₐb = k ⇔ b = aᵏ"], "solution": ["1. log₃5 lies between 1 and 2 (3 < 5 < 9); more sharply, it is about 1.46.", "2. 2 + x = 5^(log₃5), so 5¹ < 2 + x < 5².", "3. Hence 3 < x < 23 (indeed x ≈ 8.57)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-22.shtml"}, {"id": "2017-S2-Q23", "year": 2017, "slot": 2, "q_no": 23, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Composite functions", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Let f(x) = x² and g(x) = 2ˣ for all real x. Find the value of f[f(g(x)) + g(f(x))] at x = 1.", "options": ["16", "18", "36", "40"], "answer": "36", "answer_note": "", "concept": "Evaluate the inner compositions step by step.", "formulas": ["(f∘g)(x) = f(g(x))"], "solution": ["1. g(1) = 2, so f(g(1)) = 4.", "2. f(1) = 1, so g(f(1)) = 2.", "3. Sum = 6, and f(6) = 36."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-23.shtml"}, {"id": "2017-S2-Q24", "year": 2017, "slot": 2, "q_no": 24, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of squares of roots – minimum", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "What is the least possible value of the sum of the squares of the roots of x² + (a + 3)x − (a + 5) = 0, as a varies over the reals?", "options": ["1", "2", "3", "4"], "answer": "3", "answer_note": "", "concept": "Express α² + β² via Vieta's formulas as a quadratic in a and minimise it.", "formulas": ["α + β = −b/a, αβ = c/a", "α² + β² = (α + β)² − 2αβ"], "solution": ["1. α + β = −(a + 3), αβ = −(a + 5).", "2. α² + β² = (a + 3)² + 2(a + 5) = a² + 8a + 19.", "3. = (a + 4)² + 3, minimised at a = −4.", "4. Minimum value = 3 (the discriminant (a + 3)² + 4(a + 5) = 1 + 4 > 0 at a = −4, so the roots are real)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-24.shtml"}, {"id": "2017-S2-Q25", "year": 2017, "slot": 2, "q_no": 25, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Solve for x: 9^(x − 1/2) − 2^(2x − 2) = 4^x − 3^(2x − 3).", "options": ["3/2", "2/5", "3/4", "4/9"], "answer": "3/2", "answer_note": "", "concept": "Group powers of 3 on one side and powers of 2 on the other, then factor out the smallest power.", "formulas": ["aᵐ⁺ⁿ = aᵐ·aⁿ", "aᵏ = bᵏ with a ≠ b ⇒ k = 0"], "solution": ["1. Rewrite: 3^(2x − 1) + 3^(2x − 3) = 2^(2x) + 2^(2x − 2).", "2. Left: 3^(2x − 3)(9 + 1) = 10·3^(2x − 3).", "3. Right: 2^(2x − 2)(4 + 1) = 5·2^(2x − 2) = 10·2^(2x − 3).", "4. So 3^(2x − 3) = 2^(2x − 3), forcing 2x − 3 = 0.", "5. x = 3/2."], "shortcut": "Plug in x = 3/2: both sides equal 7.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-25.shtml"}, {"id": "2017-S2-Q26", "year": 2017, "slot": 2, "q_no": 26, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log properties – arithmetic mean", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "log(2ᵃ × 3ᵇ × 5ᶜ) equals the arithmetic mean of log(2² × 3³ × 5), log(2⁶ × 3 × 5⁷) and log(2 × 3² × 5⁴). Find a.", "options": [], "answer": "3", "answer_note": "", "concept": "The log of a product is a sum of logs, so the mean of logs matches exponent-wise averages of the prime powers.", "formulas": ["log(xy) = log x + log y", "log(xⁿ) = n log x"], "solution": ["1. Mean of logs = (1/3) log[(2²·3³·5)(2⁶·3·5⁷)(2·3²·5⁴)].", "2. = (1/3) log(2⁹·3⁶·5¹²) = log(2³·3²·5⁴).", "3. Matching with 2ᵃ·3ᵇ·5ᶜ gives a = 3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-26.shtml"}, {"id": "2017-S2-Q27", "year": 2017, "slot": 2, "q_no": 27, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Consecutive odd/even numbers", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "a₁, a₂, a₃, a₄, a₅ are five consecutive odd numbers. A new list of five consecutive even numbers is formed whose last term is 2a₃. If the five new numbers add up to 450, what is a₅?", "options": [], "answer": "51", "answer_note": "", "concept": "Consecutive even numbers ending at 2a₃ form an AP with difference 2; its sum gives a₃.", "formulas": ["Sum of AP = n × middle term"], "solution": ["1. The even numbers are 2a₃ − 8, 2a₃ − 6, 2a₃ − 4, 2a₃ − 2, 2a₃.", "2. Their sum = 10a₃ − 20 = 450, so a₃ = 47.", "3. a₅ = a₃ + 4 = 51."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-27.shtml"}, {"id": "2017-S2-Q28", "year": 2017, "slot": 2, "q_no": 28, "area": "Number System", "topic": "Number System", "subtopic": "Diophantine – reciprocal sum", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many pairs (a, b) of positive integers with a ≥ b satisfy 1/a + 1/b = 1/9?", "options": [], "answer": "3", "answer_note": "", "concept": "Clearing denominators gives (a − 9)(b − 9) = 81, so solutions correspond to factor pairs of 81.", "formulas": ["1/a + 1/b = 1/n ⇔ (a − n)(b − n) = n²"], "solution": ["1. ab = 9(a + b) ⇒ ab − 9a − 9b + 81 = 81 ⇒ (a − 9)(b − 9) = 81.", "2. Both factors must be positive (negatives would make a or b non-positive).", "3. Factor pairs of 81 with a ≥ b: (81, 1), (27, 3), (9, 9).", "4. So 3 pairs: (90, 10), (36, 12), (18, 18)."], "shortcut": "Unordered pairs = (d(n²) + 1)/2 = (5 + 1)/2 = 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-28.shtml"}, {"id": "2017-S2-Q29", "year": 2017, "slot": 2, "q_no": 29, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Distribution of identical objects", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In how many ways can 8 identical pens be given to Amal, Bimal and Kamal so that Amal gets at least 1, Bimal at least 2 and Kamal at least 3 pens?", "options": [], "answer": "6", "answer_note": "", "concept": "Give each person their minimum first, then distribute the rest freely using stars and bars.", "formulas": ["Non-negative solutions of x₁ + … + x_r = n: C(n + r − 1, r − 1)"], "solution": ["1. Hand out the minimums: 1 + 2 + 3 = 6 pens, leaving 2.", "2. Distribute 2 identical pens among 3 people with no restriction.", "3. Ways = C(2 + 2, 2) = C(4, 2) = 6."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-29.shtml"}, {"id": "2017-S2-Q30", "year": 2017, "slot": 2, "q_no": 30, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Forming numbers – divisibility", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "How many four-digit numbers divisible by 6 can be formed from the digits 0, 2, 3, 4, 6, with no digit repeated and 0 not in the first place?", "options": [], "answer": "50", "answer_note": "", "concept": "Divisible by 6 means even and digit sum divisible by 3; choose the 4-digit set first, then count valid arrangements.", "formulas": ["Divisible by 6 ⇔ divisible by 2 and 3", "Digit sum ≡ 0 (mod 3)"], "solution": ["1. Total of all five digits = 15; dropping one digit leaves a sum divisible by 3 only if the dropped digit is 0, 3 or 6.", "2. Set {2, 3, 4, 6} (drop 0): last digit must be 2, 4 or 6 → 3 × 3! = 18.", "3. Set {0, 2, 4, 6} (drop 3): all even. Arrangements with no leading 0 = 4! − 3! = 18, and all end in an even digit → 18.", "4. Set {0, 2, 3, 4} (drop 6): end in 0 → 3! = 6; end in 2 or 4 → 2 × (2 × 2) = 8; total 14.", "5. Total = 18 + 18 + 14 = 50."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-30.shtml"}, {"id": "2017-S2-Q31", "year": 2017, "slot": 2, "q_no": 31, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equations", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "If f(ab) = f(a)f(b) for every pair of positive integers a and b, what is the largest value f(1) can take?", "options": [], "answer": "1", "answer_note": "", "concept": "Substitute a = b = 1 to obtain an equation in f(1) alone.", "formulas": ["Put a = b = 1 in the functional equation"], "solution": ["1. With a = b = 1: f(1) = f(1)².", "2. So f(1)(f(1) − 1) = 0, i.e. f(1) = 0 or 1.", "3. Both are possible (f ≡ 0 and f ≡ 1 work), so the largest value is 1."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-31.shtml"}, {"id": "2017-S2-Q32", "year": 2017, "slot": 2, "q_no": 32, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus – triangle inequality equality", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let f(x) = 2x − 5 and g(x) = 7 − 2x. Then |f(x) + g(x)| = |f(x)| + |g(x)| holds if and only if:", "options": ["5/2 < x < 7/2", "x ≤ 5/2 or x ≥ 7/2", "x < 5/2 or x ≥ 7/2", "5/2 ≤ x ≤ 7/2"], "answer": "5/2 ≤ x ≤ 7/2", "answer_note": "", "concept": "|p + q| = |p| + |q| exactly when p and q have the same sign (or one is zero), i.e. pq ≥ 0.", "formulas": ["|p + q| = |p| + |q| ⇔ pq ≥ 0"], "solution": ["1. f + g = 2, so the condition is |f| + |g| = 2.", "2. Equality needs f·g ≥ 0: (2x − 5)(7 − 2x) ≥ 0.", "3. This holds for 5/2 ≤ x ≤ 7/2 (endpoints included since one term is 0)."], "shortcut": "Test x = 5/2: |0 + 2| = 0 + 2 ✓, so endpoints are included → option with ≤.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-32.shtml"}, {"id": "2017-S2-Q33", "year": 2017, "slot": 2, "q_no": 33, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Infinite GP", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "An infinite geometric progression a₁, a₂, a₃, … satisfies aₙ = 3(aₙ₊₁ + aₙ₊₂ + …) for every n ≥ 1. If the sum of all its terms is 32, what is a₅?", "options": ["1/32", "2/32", "3/32", "4/32"], "answer": "3/32", "answer_note": "", "concept": "The tail after aₙ is itself an infinite GP; the condition fixes the common ratio.", "formulas": ["Sum of infinite GP = a/(1 − r), |r| < 1"], "solution": ["1. aₙ₊₁ + aₙ₊₂ + … = aₙ·r/(1 − r), so 1 = 3r/(1 − r) ⇒ r = 1/4.", "2. Sum = a₁/(1 − 1/4) = 32 ⇒ a₁ = 24.", "3. a₅ = 24 × (1/4)⁴ = 24/256 = 3/32."], "shortcut": "Since aₙ = 3 × (rest), aₙ is 3/4 of the sum from aₙ onward: a₁ = ¾ × 32 = 24.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-33.shtml"}, {"id": "2017-S2-Q34", "year": 2017, "slot": 2, "q_no": 34, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Telescoping series", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Let a₁ = 1/(2 × 5), a₂ = 1/(5 × 8), a₃ = 1/(8 × 11), and so on. What is a₁ + a₂ + … + a₁₀₀?", "options": ["25/151", "1/2", "1/4", "111/55"], "answer": "25/151", "answer_note": "", "concept": "Each term is 1/[(3k − 1)(3k + 2)], which splits into a difference of reciprocals that telescope.", "formulas": ["1/[n(n + d)] = (1/d)(1/n − 1/(n + d))"], "solution": ["1. aₖ = 1/[(3k − 1)(3k + 2)] = (1/3)[1/(3k − 1) − 1/(3k + 2)].", "2. Summing k = 1 to 100, the middle terms cancel: S = (1/3)(1/2 − 1/302).", "3. S = (1/3)(150/302) = 50/302 = 25/151."], "shortcut": "Sum must be under (1/3)(1/2) = 1/6 → only 25/151 fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2017-Question-Paper-Slot-2-Quant/quant-question-34.shtml"}, {"id": "2018-S1-Q01", "year": 2018, "slot": 1, "q_no": 1, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – cost minimisation", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A trader sells 10 litres of a blend of paints A and B, in which the quantity of B is not more than the quantity of A. Per litre, paint A costs Rs 8 more than paint B. Selling the whole 10 litres for Rs 264 earns him a 10% profit. What is the maximum possible cost of paint B, in Rs per litre?", "options": ["20", "16", "22", "26"], "answer": "20", "answer_note": "", "concept": "Total cost is fixed by the profit; the cost of B is largest when the costlier paint A is used as little as allowed.", "formulas": ["Cost = SP ÷ (1 + profit%)", "Total cost = x(b + 8) + (10 − x)b"], "solution": ["1. Cost of 10 litres = 264 ÷ 1.1 = Rs 240.", "2. Let A = x litres, B = 10 − x litres, B costs b per litre: x(b + 8) + (10 − x)b = 240 ⇒ 10b + 8x = 240.", "3. So b = 24 − 0.8x, which falls as x rises.", "4. B ≤ A means x ≥ 5; least x = 5 gives b = 24 − 4 = 20."], "shortcut": "Equal mix is the extreme: average cost 24 = b + 4 ⇒ b = 20.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-1.shtml"}, {"id": "2018-S1-Q02", "year": 2018, "slot": 1, "q_no": 2, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – sector & triangle area", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A circle has centre O and radius 1 cm, and the arc AB subtends 60° at O. Let R be the sector bounded by OA, OB and the arc AB. Points C on OA and D on OB are chosen with OC = OD so that the area of triangle OCD equals half the area of R. Find OC in cm.", "options": ["(π/4)^(1/2)", "(π/6)^(1/2)", "(π/(4√3))^(1/2)", "(π/(3√3))^(1/2)"], "answer": "(π/(3√3))^(1/2)", "answer_note": "", "concept": "An isosceles triangle with a 60° apex is equilateral; equate its area to half the sector area.", "formulas": ["Sector area = (θ/360) × πr²", "Equilateral triangle area = (√3/4)a²"], "solution": ["1. Area of R = (60/360) × π × 1² = π/6.", "2. Required area of OCD = π/12.", "3. OC = OD with ∠COD = 60° ⇒ OCD is equilateral with side a = OC.", "4. (√3/4)a² = π/12 ⇒ a² = π/(3√3).", "5. OC = (π/(3√3))^(1/2)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-2.shtml"}, {"id": "2018-S1-Q03", "year": 2018, "slot": 1, "q_no": 3, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Recursive functions", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A function satisfies f(x + 2) = f(x) + f(x + 1) for every positive integer x. If f(11) = 91 and f(15) = 617, find f(10).", "options": [], "answer": "54", "answer_note": "", "concept": "A Fibonacci-type recurrence: express later terms in terms of one unknown and match the given value.", "formulas": ["f(n + 2) = f(n) + f(n + 1)"], "solution": ["1. Let f(10) = a. Then f(12) = a + 91.", "2. f(13) = f(11) + f(12) = a + 182.", "3. f(14) = f(12) + f(13) = 2a + 273.", "4. f(15) = f(13) + f(14) = 3a + 455 = 617 ⇒ a = 54."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-3.shtml"}, {"id": "2018-S1-Q04", "year": 2018, "slot": 1, "q_no": 4, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative timing – same route", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two people, Partha and Narayan, set off together from A towards B, which is 60 km away. Partha needs 4 hours more than Narayan to reach B. Partha reaches the halfway point of AB 2 hours before Narayan reaches B. What is Partha's speed in km/h?", "options": ["6", "3", "4", "5"], "answer": "5", "answer_note": "", "concept": "Translate both timing statements into equations in Narayan's total time.", "formulas": ["Time = Distance ÷ Speed"], "solution": ["1. Let Narayan take t hours; Partha takes t + 4 hours for 60 km.", "2. Partha reaches the midpoint in (t + 4)/2 hours.", "3. (t + 4)/2 = t − 2 ⇒ t + 4 = 2t − 4 ⇒ t = 8.", "4. Partha's time = 12 h, speed = 60/12 = 5 km/h."], "shortcut": "Test options: speed 5 ⇒ 12 h total, 6 h to midpoint; Narayan 8 h; 8 − 6 = 2 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-4.shtml"}, {"id": "2018-S1-Q05", "year": 2018, "slot": 1, "q_no": 5, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – exclusion of terms", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A CAT aspirant writes some number of mock tests. If the first 10 tests are left out, his average score goes up by 1; if the last 10 tests are left out, his average goes down by 1. His average over the first 10 tests is 20 and over the last 10 is 30. How many tests did he write in all?", "options": [], "answer": "60", "answer_note": "", "concept": "Write the total with and without the excluded blocks and form two linear equations in n and the average.", "formulas": ["Sum = Average × Count"], "solution": ["1. Let n tests, overall average A, total nA. First 10 sum to 200, last 10 sum to 300.", "2. (nA − 200) = (A + 1)(n − 10) ⇒ 10A − n = 190.", "3. (nA − 300) = (A − 1)(n − 10) ⇒ 10A + n = 310.", "4. Adding: 20A = 500 ⇒ A = 25; then n = 310 − 250 = 60."], "shortcut": "Subtracting the two equations directly: 2n = 120 ⇒ n = 60.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-5.shtml"}, {"id": "2018-S1-Q06", "year": 2018, "slot": 1, "q_no": 6, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures with profit", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two teas A and B are blended and the blend is sold at Rs 40 per kg. Mixing A and B in the ratio 3 : 2 yields a 10% profit, while mixing them in the ratio 2 : 3 yields a 5% profit. Find the ratio of the cost price per kg of A to that of B.", "options": ["21:25", "19:24", "18:25", "17:25"], "answer": "19:24", "answer_note": "", "concept": "From the profit, get the cost per kg of each blend, then solve the two weighted-average equations.", "formulas": ["CP = SP ÷ (1 + profit%)", "Weighted average cost = (m·a + n·b)/(m + n)"], "solution": ["1. Blend 1 cost = 40/1.1 = 400/11 per kg ⇒ 3a + 2b = 2000/11.", "2. Blend 2 cost = 40/1.05 = 800/21 per kg ⇒ 2a + 3b = 4000/21.", "3. Solving the pair: a = 7600/231 and b = 3200/77 = 9600/231.", "4. a : b = 7600 : 9600 = 19 : 24."], "shortcut": "Since the 2:3 (more B) blend costs more, B is costlier; only options with a < b remain — compute one ratio quickly to confirm 19:24.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-6.shtml"}, {"id": "2018-S1-Q07", "year": 2018, "slot": 1, "q_no": 7, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit on mixtures – multi-stage", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A wholesaler prices walnuts per kg at three times what he pays for peanuts per kg. He sells 8 kg of peanuts at 10% profit and 16 kg of walnuts at 20% profit to a shopkeeper. On the way, the shopkeeper loses 3 kg of peanuts and 5 kg of walnuts. He mixes what remains and sells it at Rs 166 per kg, earning 25% overall profit on what he paid. At what price per kg did the wholesaler buy walnuts?", "options": ["84", "86", "96", "98"], "answer": "96", "answer_note": "", "concept": "Track the shopkeeper's total purchase cost in one variable; his revenue is 125% of it.", "formulas": ["Revenue = (1 + profit%) × Cost"], "solution": ["1. Let wholesaler's peanut cost = p, walnut cost = 3p per kg.", "2. Shopkeeper pays 8 × 1.1p + 16 × 1.2 × 3p = 8.8p + 57.6p = 66.4p.", "3. Remaining nuts = (8 − 3) + (16 − 5) = 16 kg, sold for 16 × 166 = 2656.", "4. 2656 = 1.25 × 66.4p = 83p ⇒ p = 32.", "5. Walnut cost = 3 × 32 = Rs 96 per kg."], "shortcut": "2656/83 = 32 is clean, and only 96 is a multiple of 3 that fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-7.shtml"}, {"id": "2018-S1-Q08", "year": 2018, "slot": 1, "q_no": 8, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – phased work", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Working alone, B takes 25% longer than A to finish a job. The job gets done in 13 days like this: A alone does the first half, then A and B together work for 4 days, and finally B alone finishes the last 5% of the work. How many days would B take alone to do the whole job?", "options": ["16", "22", "20", "18"], "answer": "20", "answer_note": "", "concept": "Use the 4-day joint stretch (which completes 45% of work) to find A's time, then verify with the 13-day total.", "formulas": ["Work done = rate × time", "Combined rate = 1/a + 1/b"], "solution": ["1. Let A take a days; B takes 1.25a = 5a/4 days.", "2. Joint 4 days cover 100% − 50% − 5% = 45%: 4(1/a + 4/(5a)) = 0.45 ⇒ 36/(5a) = 0.45 ⇒ a = 16.", "3. B = 20 days.", "4. Check: A's half = 8 days, joint = 4 days, B's 5% = 1 day; total 13 ✓."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-8.shtml"}, {"id": "2018-S1-Q09", "year": 2018, "slot": 1, "q_no": 9, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – infinite midpoint triangles", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "An equilateral triangle T1 has side 24 cm. Joining the midpoints of its sides gives T2, joining the midpoints of T2's sides gives T3, and the process continues forever. Find the total area of all the triangles in sq cm.", "options": ["192√3", "164√3", "248√3", "188√3"], "answer": "192√3", "answer_note": "", "concept": "Each midpoint triangle has one-quarter the area of the previous one, so the areas form an infinite GP.", "formulas": ["Equilateral area = (√3/4)a²", "Infinite GP sum = a/(1 − r)"], "solution": ["1. Area of T1 = (√3/4) × 576 = 144√3.", "2. Each next triangle has half the side, so area ratio r = 1/4.", "3. Sum = 144√3 ÷ (1 − 1/4) = 144√3 × 4/3 = 192√3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-9.shtml"}, {"id": "2018-S1-Q10", "year": 2018, "slot": 1, "q_no": 10, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Products & AM–GM minimisation", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Ashok was multiplying three real numbers but mistakenly used 73 in place of 37 for one of them, which made the product larger by 720. What is the least possible value of the sum of the squares of the other two numbers?", "options": [], "answer": "40", "answer_note": "", "concept": "The error fixes the product of the other two numbers; for a fixed product, sum of squares is minimised when the numbers are equal.", "formulas": ["(73 − 37)·yz = 720", "y² + z² ≥ 2yz (AM ≥ GM)"], "solution": ["1. Let the other two numbers be y, z. Then 73yz − 37yz = 720 ⇒ 36yz = 720 ⇒ yz = 20.", "2. y² + z² = (y − z)² + 2yz ≥ 2yz = 40.", "3. Equality at y = z = √20, so the minimum is 40."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-10.shtml"}, {"id": "2018-S1-Q11", "year": 2018, "slot": 1, "q_no": 11, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – change of base", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "If x is a positive number with 2^x = 3^(log₅2), then x equals", "options": ["log₅9", "1 + log₅(3/5)", "1 + log₃(5/3)", "log₅8"], "answer": "1 + log₅(3/5)", "answer_note": "", "concept": "Take log base 2 of both sides and use change of base to collapse the product of logs.", "formulas": ["log_a b × log_b c = log_a c", "log(a^b) = b log a"], "solution": ["1. Taking log₂: x = log₅2 × log₂3.", "2. By chain rule, log₅2 × log₂3 = log₅3.", "3. Write log₅3 = log₅5 + log₅(3/5) = 1 + log₅(3/5)."], "shortcut": "x = log₅3 ≈ 0.68; log₅9 ≈ 1.37, log₅8 ≈ 1.29, 1 + log₃(5/3) ≈ 1.46 — only option 2 is below 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-11.shtml"}, {"id": "2018-S1-Q12", "year": 2018, "slot": 1, "q_no": 12, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – expression in a parameter", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Given log₁₂81 = p, the value of 3 × (4 − p)/(4 + p) is", "options": ["log₂8", "log₆8", "log₄16", "log₆16"], "answer": "log₆8", "answer_note": "", "concept": "Rewrite p as 4 log₁₂3, then turn 1 ± log₁₂3 into logs of single numbers.", "formulas": ["log_b(m^n) = n log_b m", "log_b m − log_b n = log_b(m/n)"], "solution": ["1. p = log₁₂3⁴ = 4 log₁₂3, so (4 − p)/(4 + p) = (1 − log₁₂3)/(1 + log₁₂3).", "2. 1 − log₁₂3 = log₁₂4 and 1 + log₁₂3 = log₁₂36.", "3. Ratio = log₁₂4 / log₁₂36 = log₃₆4 = log₆2.", "4. Multiply by 3: 3 log₆2 = log₆8."], "shortcut": "Options 1 and 3 equal 3 and 2; the expression is about 1.16, which matches log₆8.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-12.shtml"}, {"id": "2018-S1-Q13", "year": 2018, "slot": 1, "q_no": 13, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – frustum of a cone", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A right circular cone of height 12 ft has a base of diameter 8 ft and stands on that base. A plane parallel to the base, 9 ft above it, slices off the top. Taking π = 22/7, find the volume in cubic feet of the part that is left.", "options": [], "answer": "198", "answer_note": "", "concept": "The removed tip is a similar small cone; subtract its volume from the full cone.", "formulas": ["Cone volume = (1/3)πr²h", "Similar cones: r/h is constant"], "solution": ["1. Full cone: r = 4, h = 12 ⇒ V = (1/3)π × 16 × 12 = 64π.", "2. Tip cone has height 12 − 9 = 3, so radius = 4 × 3/12 = 1 ⇒ V = (1/3)π × 1 × 3 = π.", "3. Remaining volume = 63π = 63 × 22/7 = 198."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-13.shtml"}, {"id": "2018-S1-Q14", "year": 2018, "slot": 1, "q_no": 14, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Selections – increasing digit numbers", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "From the digits 1 to 9, how many numbers having at least two digits can be formed in which no digit repeats and the digits are in increasing order from left to right?", "options": [], "answer": "502", "answer_note": "", "concept": "Any chosen set of digits can be arranged in increasing order in exactly one way, so count subsets of size ≥ 2.", "formulas": ["Number of subsets of n items = 2ⁿ", "ΣC(9,k) for k ≥ 2 = 2⁹ − C(9,0) − C(9,1)"], "solution": ["1. Each subset of {1,…,9} of size k ≥ 2 gives exactly one valid number.", "2. Total subsets = 2⁹ = 512.", "3. Remove the empty set (1) and single-digit sets (9).", "4. Count = 512 − 1 − 9 = 502."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-14.shtml"}, {"id": "2018-S1-Q15", "year": 2018, "slot": 1, "q_no": 15, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – equal instalments", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "John takes a loan of Rs 2,10,000 at 10% per annum compound interest (annual compounding). He clears it in two equal yearly payments, the first at the end of year 1 and the second at the end of year 2. What is the amount of each payment in Rs?", "options": [], "answer": "121000", "answer_note": "", "concept": "The loan equals the sum of the present values of the two equal instalments.", "formulas": ["PV of X after n years = X/(1 + r)ⁿ"], "solution": ["1. Let each instalment be X.", "2. 210000 = X/1.1 + X/1.21 = X(1.1 + 1)/1.21 = 2.1X/1.21.", "3. X = 210000 × 1.21/2.1 = 100000 × 1.21 = 121000."], "shortcut": "Check: after year 1, owe 231000 − 121000 = 110000; after year 2, owe 121000 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-15.shtml"}, {"id": "2018-S1-Q16", "year": 2018, "slot": 1, "q_no": 16, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of squares equal to zero", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Real numbers u and v satisfy u² + (u − 2v − 1)² = −4v(u + v). Find u + 3v.", "options": ["1/4", "1/2", "0", "−1/4"], "answer": "−1/4", "answer_note": "", "concept": "Move everything to one side to form a sum of two perfect squares, each of which must be zero.", "formulas": ["a² + b² = 0 ⇒ a = b = 0 (reals)", "(u + 2v)² = u² + 4uv + 4v²"], "solution": ["1. Rearrange: u² + 4uv + 4v² + (u − 2v − 1)² = 0.", "2. That is (u + 2v)² + (u − 2v − 1)² = 0.", "3. So u + 2v = 0 and u − 2v = 1 ⇒ u = 1/2, v = −1/4.", "4. u + 3v = 1/2 − 3/4 = −1/4."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-16.shtml"}, {"id": "2018-S1-Q17", "year": 2018, "slot": 1, "q_no": 17, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Opposite-direction travel – meeting point", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A point P lies on segment AB with BP equal to three times AP. Car 1 leaves A heading for B and, at the same moment, car 2 leaves B heading for A. Car 2's speed is half of car 1's speed, and car 2 arrives at P one hour after car 1 arrives at P. How many minutes does car 1 take to get from A to P?", "options": [], "answer": "12", "answer_note": "", "concept": "Compare times to P using distance and speed ratios; the difference of times is given.", "formulas": ["Time ∝ Distance/Speed"], "solution": ["1. Let AP = d, BP = 3d; car 1 speed = 2s, car 2 speed = s.", "2. Car 1 time = d/(2s) = t; car 2 time = 3d/s = 6t.", "3. 6t − t = 60 min ⇒ t = 12 minutes."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-17.shtml"}, {"id": "2018-S1-Q18", "year": 2018, "slot": 1, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rectangle inscribed in circle", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Rectangle ABCD is drawn inside a circle of radius 13 cm with all four vertices on the circle. Which of these could be its length and breadth (in cm)?", "options": ["25, 10", "24, 12", "25, 9", "24, 10"], "answer": "24, 10", "answer_note": "", "concept": "A rectangle inscribed in a circle has its diagonal equal to the diameter.", "formulas": ["l² + b² = (2r)²"], "solution": ["1. Diagonal = diameter = 26 cm, so l² + b² = 676.", "2. 24² + 10² = 576 + 100 = 676 ✓.", "3. Others: 625 + 100, 576 + 144, 625 + 81 — none equal 676."], "shortcut": "Recognise the 5-12-13 triple scaled by 2: 10-24-26.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-18.shtml"}, {"id": "2018-S1-Q19", "year": 2018, "slot": 1, "q_no": 19, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – pass marks", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "An exam has a maximum score of N, and passing requires 45% of N. A candidate scores 36 marks and misses the pass mark by 68% (of the pass mark). Which of the following is true?", "options": ["N ≤ 200", "243 ≤ N ≤ 252", "N ≥ 253", "201 ≤ N ≤ 242"], "answer": "243 ≤ N ≤ 252", "answer_note": "", "concept": "Falling short by 68% of the pass mark means the score is 32% of the pass mark.", "formulas": ["Score = (100 − shortfall)% × Pass mark"], "solution": ["1. 36 = 32% of pass mark ⇒ pass mark = 36/0.32 = 112.5.", "2. 0.45N = 112.5 ⇒ N = 250.", "3. 250 lies in 243 ≤ N ≤ 252."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-19.shtml"}, {"id": "2018-S1-Q20", "year": 2018, "slot": 1, "q_no": 20, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "GP and AP combined", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Positive reals x, y, z with x < y < z form a geometric progression, and 5x, 16y, 12z form an arithmetic progression. What is the common ratio of the GP?", "options": ["1/6", "3/6", "3/2", "5/2"], "answer": "5/2", "answer_note": "", "concept": "Substitute y = xr, z = xr² into the AP condition and keep the root greater than 1.", "formulas": ["AP: 2b = a + c", "GP: y = xr, z = xr²"], "solution": ["1. AP condition: 2 × 16y = 5x + 12z ⇒ 32xr = 5x + 12xr².", "2. 12r² − 32r + 5 = 0 ⇒ (6r − 1)(2r − 5) = 0 ⇒ r = 1/6 or 5/2.", "3. Increasing GP with positive terms needs r > 1 ⇒ r = 5/2."], "shortcut": "x < y < z rules out every option below 1; between 3/2 and 5/2, plug in r = 5/2: 32 × 2.5 = 80 = 5 + 75 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-20.shtml"}, {"id": "2018-S1-Q21", "year": 2018, "slot": 1, "q_no": 21, "area": "Number System", "topic": "Number System", "subtopic": "Divisibility – powers of 2", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many integers x satisfy both 0.25 < 2^x < 200 and the condition that 2^x + 2 is divisible by 3 or by 4?", "options": [], "answer": "5", "answer_note": "", "concept": "List the integer exponents in range and check divisibility of 2^x + 2 directly; negative x make it a non-integer.", "formulas": ["2^x mod 3 alternates 1, 2", "2^x + 2 divisible by 4 only for x = 1"], "solution": ["1. 0.25 < 2^x < 200 ⇒ x ∈ {−1, 0, 1, …, 7}. For x = −1, 2^x + 2 = 2.5 is not an integer.", "2. Values of 2^x + 2 for x = 0…7: 3, 4, 6, 10, 18, 34, 66, 130.", "3. Divisible by 3: 3, 6, 18, 66 (x = 0, 2, 4, 6). Divisible by 4: 4 (x = 1).", "4. Total = 5 values of x."], "shortcut": "For x ≥ 2, 2^x + 2 ≡ 2 (mod 4), so only x = 1 works for 4; for 3, x must be even.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-21.shtml"}, {"id": "2018-S1-Q22", "year": 2018, "slot": 1, "q_no": 22, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Three-set Venn with constraints", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A group of 74 students each study at least one of the subjects H, E and P. Ten study all three, and twenty study H and E but not P. Everyone who studies P also studies at least one of H and E. The number studying H is the same as the number studying E. How many study H?", "options": [], "answer": "52", "answer_note": "", "concept": "Fill the Venn regions, note that 'only P' is empty, and use H = E to split the remaining students equally.", "formulas": ["Sum of all Venn regions = total"], "solution": ["1. Regions: only H = a, only E = b, H∩P only = c, E∩P only = d, H∩E only = 20, all three = 10, only P = 0.", "2. a + b + c + d + 30 = 74 ⇒ a + b + c + d = 44.", "3. H = a + c + 30 and E = b + d + 30; H = E ⇒ a + c = b + d = 22.", "4. H = 22 + 30 = 52."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-22.shtml"}, {"id": "2018-S1-Q23", "year": 2018, "slot": 1, "q_no": 23, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Trains – meeting at a station", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Train T sets off from station X towards station Y at 3 pm. Train S, whose speed is three-quarters of T's, leaves Y towards X at 4 pm. The two trains cross each other at station Z, and XZ is three-fifths of XY. How many hours does train T need to travel from X to Y?", "options": [], "answer": "15", "answer_note": "", "concept": "Up to the meeting, T has run 1 hour longer than S; equate the ratio of distances covered to speed × time.", "formulas": ["Distance = Speed × Time"], "solution": ["1. Let XY = D, T's speed v, S's speed 3v/4; T runs t hours to Z, S runs t − 1 hours.", "2. vt = 3D/5 and (3v/4)(t − 1) = 2D/5.", "3. Dividing: t / (0.75(t − 1)) = 3/2 ⇒ t = 1.125(t − 1) ⇒ t = 9.", "4. T covers 3/5 of XY in 9 h ⇒ full trip = 9 × 5/3 = 15 hours."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-23.shtml"}, {"id": "2018-S1-Q24", "year": 2018, "slot": 1, "q_no": 24, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Square inscribed in square", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Points E, F, G, H lie on sides AB, BC, CD, DA respectively of square ABCD such that EFGH is a square whose area is 62.5% of the area of ABCD. If CG is longer than EB, find EB : CG.", "options": ["1 : 3", "4 : 9", "2 : 5", "3 : 8"], "answer": "1 : 3", "answer_note": "", "concept": "An inscribed square cuts each side of the outer square into the same two segments, which act as legs of the corner right triangles.", "formulas": ["Inner side² = x² + (s − x)²"], "solution": ["1. Take side of ABCD = 1 and EB = x; by symmetry the other segment on each side is 1 − x, and CG = 1 − x.", "2. EF² = x² + (1 − x)² = 0.625 = 5/8.", "3. 2x² − 2x + 3/8 = 0 ⇒ 16x² − 16x + 3 = 0 ⇒ x = 1/4 or 3/4.", "4. CG > EB ⇒ EB = 1/4, CG = 3/4 ⇒ ratio 1 : 3."], "shortcut": "Check option 1: parts 1 and 3 of side 4 give inner area 1 + 9 = 10 out of 16 = 62.5% ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-24.shtml"}, {"id": "2018-S1-Q25", "year": 2018, "slot": 1, "q_no": 25, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Indices – solving power equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Given x^2018 · y^2017 = 1/2 and x^2016 · y^2019 = 8, find x² + y³.", "options": ["37/4", "31/4", "35/4", "33/4"], "answer": "33/4", "answer_note": "", "concept": "Dividing the equations isolates the ratio y/x; substituting back pins down x and y.", "formulas": ["a^m / a^n = a^(m − n)"], "solution": ["1. Dividing second by first: y²/x² = 16 ⇒ y = ±4x.", "2. Multiplying the two equations: x^4034 · y^4036 = 4 ⇒ (xy)^4034 · y² = 4.", "3. With y = 4x substituted into the first: x^4035 · 4^2017 = 1/2 ⇒ x^4035 = 2^(−4035) ⇒ x = 1/2, y = 2. (y = −4x gives x = −1/2, y = 2.)", "4. Either way x² + y³ = 1/4 + 8 = 33/4."], "shortcut": "Guess x = 1/2, y = 2: (1/2)^2018 · 2^2017 = 1/2 ✓ and (1/2)^2016 · 2^2019 = 8 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-25.shtml"}, {"id": "2018-S1-Q26", "year": 2018, "slot": 1, "q_no": 26, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – transfer between two people", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Raju and Lalitha initially have marbles in the ratio 4 : 9. Lalitha then gives some of her marbles to Raju, after which Raju and Lalitha have marbles in the ratio 5 : 6. What fraction of her original marbles did Lalitha give away?", "options": ["1/4", "1/5", "6/19", "7/33"], "answer": "7/33", "answer_note": "", "concept": "The total is unchanged by the transfer, so rescale both ratios to the same total.", "formulas": ["Total constant ⇒ equalise ratio sums"], "solution": ["1. Total parts: 4 + 9 = 13 and 5 + 6 = 11; use total 143.", "2. Before: Raju 44, Lalitha 99. After: Raju 65, Lalitha 78.", "3. Lalitha gave 99 − 78 = 21 marbles.", "4. Fraction = 21/99 = 7/33."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-26.shtml"}, {"id": "2018-S1-Q27", "year": 2018, "slot": 1, "q_no": 27, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – nested equations", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If log₂(5 + log₃a) = 3 and log₅(4a + 12 + log₂b) = 3, find a + b.", "options": ["32", "59", "67", "40"], "answer": "59", "answer_note": "", "concept": "Unwrap each logarithm by converting to exponential form from the outside in.", "formulas": ["log_b N = k ⇔ N = b^k"], "solution": ["1. 5 + log₃a = 2³ = 8 ⇒ log₃a = 3 ⇒ a = 27.", "2. 4a + 12 + log₂b = 5³ = 125 ⇒ 108 + 12 + log₂b = 125 ⇒ log₂b = 5 ⇒ b = 32.", "3. a + b = 27 + 32 = 59."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-27.shtml"}, {"id": "2018-S1-Q28", "year": 2018, "slot": 1, "q_no": 28, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work – two types of workers", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Humans and robots work at different (but individually constant) rates. A team of 15 humans and 5 robots completes a job in 30 days, while a team of 5 humans and 15 robots completes the same job in 60 days. How many days would 15 humans alone need for the job?", "options": ["40", "32", "36", "45"], "answer": "32", "answer_note": "", "concept": "Equate the total work from both teams to get the human-to-robot efficiency ratio.", "formulas": ["Work = (number × rate) × days"], "solution": ["1. Let a human do h and a robot r units per day.", "2. 30(15h + 5r) = 60(5h + 15r) ⇒ 450h + 150r = 300h + 900r ⇒ h = 5r.", "3. Total work = 30(75r + 5r) = 2400r.", "4. 15 humans do 75r per day ⇒ days = 2400r/75r = 32."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-28.shtml"}, {"id": "2018-S1-Q29", "year": 2018, "slot": 1, "q_no": 29, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Parallelogram – area & right triangle", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Parallelogram ABCD has area 72 sq cm, with CD = 9 cm and AD = 16 cm. Point P on line CD is such that AP is perpendicular to CD. Find the area of triangle APD in sq cm.", "options": ["18√3", "24√3", "32√3", "12√3"], "answer": "32√3", "answer_note": "", "concept": "AP is the height on base CD; Pythagoras in right triangle APD gives PD.", "formulas": ["Area of parallelogram = base × height", "Pythagoras"], "solution": ["1. Height AP = 72/9 = 8 cm.", "2. In right triangle APD: PD = √(16² − 8²) = √192 = 8√3.", "3. Area APD = (1/2) × 8 × 8√3 = 32√3."], "shortcut": "AP : AD = 8 : 16 = 1 : 2, so triangle APD is a 30-60-90 triangle.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2018-Question-Paper-Slot-1-Quant/quant-question-29.shtml"}, {"id": "2018-S1-Q30", "year": 2018, "slot": 1, "q_no": 30, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – parallel chords", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two parallel chords of a circle, of lengths 4 cm and 6 cm, lie on the same side of a diameter and are 1 cm apart. Find the radius of the circle in cm.", "options": ["√13", "√14", "√11", "√12"], "answer": "√13", "answer_note": "", "concept": "The perpendicular from t
