url": "https://cracku.in/67-the-average-of-30-integers-is-5-among-these-30-int-x-cat-2019-slot-2"}, {"id": "2019-S2-Q02", "year": 2019, "slot": 2, "q_no": 2, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound vs simple interest", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Amal puts Rs 12000 in an account paying 8% per annum compounded annually, and Rs 10000 in an account paying 6% per annum compounded half-yearly, both for one year. Bimal invests some amount at 7.5% per annum simple interest for one year. If both earn the same total interest, how much (in Rs) did Bimal invest?", "options": [], "answer": "20920", "answer_note": "", "concept": "Compute one-year compound interest, including half-yearly compounding, and equate it to simple interest.", "formulas": ["CI = P[(1 + r/n)^(nt) − 1]", "SI = P × r × t / 100"], "solution": ["1. Interest on Rs 12000 at 8% annual compounding for 1 year = 12000 × 0.08 = 960.", "2. Half-yearly at 6% p.a. means 3% per half-year: 10000 × (1.03² − 1) = 10000 × 0.0609 = 609.", "3. Amal's total interest = 960 + 609 = 1569.", "4. Bimal: P × 0.075 = 1569, so P = 1569 ÷ 0.075 = 20920."], "shortcut": "", "source_url": "https://cracku.in/68-amal-invests-rs-12000-at-8-interest-compounded-ann-x-cat-2019-slot-2"}, {"id": "2019-S2-Q03", "year": 2019, "slot": 2, "q_no": 3, "area": "Number System", "topic": "Number System", "subtopic": "Divisibility of algebraic fractions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the largest positive integer n for which (n² + 7n + 12)/(n² − n − 12) is a positive integer.", "options": ["6", "8", "16", "12"], "answer": "12", "answer_note": "", "concept": "Factorise and cancel the common factor; the expression reduces to a simple fraction whose integrality depends on divisibility.", "formulas": ["n² + 7n + 12 = (n + 3)(n + 4)", "n² − n − 12 = (n − 4)(n + 3)"], "solution": ["1. The expression = (n + 3)(n + 4)/[(n + 3)(n − 4)] = (n + 4)/(n − 4), for n ≠ 4.", "2. Write (n + 4)/(n − 4) = 1 + 8/(n − 4).", "3. 8/(n − 4) must be an integer with the whole value positive; n − 4 < 0 gives no valid positive value here, so n − 4 ∈ {1, 2, 4, 8}.", "4. Largest n − 4 = 8, so n = 12 (value = 2)."], "shortcut": "Test options from the largest: n = 16 gives 20/12, not an integer; n = 12 gives 16/8 = 2.", "source_url": "https://cracku.in/69-what-is-the-largest-positive-integer-n-such-that-f-x-cat-2019-slot-2"}, {"id": "2019-S2-Q04", "year": 2019, "slot": 2, "q_no": 4, "area": "Number System", "topic": "Number System", "subtopic": "Difference of squares – integer solutions", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many ordered pairs (m, n) of positive integers satisfy m² + 105 = n²?", "options": [], "answer": "4", "answer_note": "", "concept": "Rewrite as a difference of two squares and count factor pairs of the same parity.", "formulas": ["n² − m² = (n − m)(n + m)"], "solution": ["1. (n − m)(n + m) = 105 = 3 × 5 × 7.", "2. 105 is odd, so every factor pair has both factors odd, giving integer m and n.", "3. Factor pairs with n − m < n + m: (1, 105), (3, 35), (5, 21), (7, 15).", "4. These give (m, n) = (52, 53), (16, 19), (8, 13), (4, 11); all have m > 0, so there are 4 pairs."], "shortcut": "", "source_url": "https://cracku.in/70-how-many-pairs-m-n-of-positive-integers-satisfy-th-x-cat-2019-slot-2"}, {"id": "2019-S2-Q05", "year": 2019, "slot": 2, "q_no": 5, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Circular track – meeting and return", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Ants A and B start at the same instant from a point P on a circular track, A moving clockwise and B anticlockwise, each at a constant speed. They meet for the first time at 10:00 am, by which time A has covered 60% of the track. A gets back to P at 10:12 am. At what time does B get back to P?", "options": ["10:27 am", "10:25 am", "10:45 am", "10:18 am"], "answer": "10:27 am", "answer_note": "", "concept": "Until the first meeting they together cover one full lap; speeds are proportional to distances covered in equal time.", "formulas": ["Time = Distance / Speed", "At first meeting (opposite directions) distances add to one lap"], "solution": ["1. At the meeting A has done 60% of the lap, so B has done 40%.", "2. After meeting, A covers the remaining 40% in 12 minutes, so A's speed is 40% per 12 min, i.e. 10% per 3 min.", "3. Hence A's 60% took 18 minutes, so both started at 9:42 am.", "4. B covered 40% in 18 minutes, i.e. 1% per 0.45 min. Remaining 60% takes 60 × 0.45 = 27 minutes.", "5. B reaches P at 10:00 + 27 min = 10:27 am."], "shortcut": "Time ratio trick: after meeting, the times to finish satisfy t_A × t_B = (time before meeting)²: 12 × t_B = 18² ⇒ t_B = 27.", "source_url": "https://cracku.in/71-two-ants-a-and-b-start-from-a-point-p-on-a-circle--x-cat-2019-slot-2"}, {"id": "2019-S2-Q06", "year": 2019, "slot": 2, "q_no": 6, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recursively defined sequences", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Integers a₁, a₂, a₃, … satisfy a₁ − a₂ + a₃ − a₄ + … + (−1)^(n−1)·aₙ = n for every n ≥ 1. Find a₅₁ + a₅₂ + … + a₁₀₂₃.", "options": ["0", "1", "10", "−1"], "answer": "1", "answer_note": "", "concept": "Subtract consecutive partial-sum conditions to get each term, then sum using the alternating pattern.", "formulas": ["Sₙ − Sₙ₋₁ = (−1)^(n−1)·aₙ"], "solution": ["1. n = 1 gives a₁ = 1.", "2. Subtracting the condition for n − 1 from that for n: (−1)^(n−1)·aₙ = n − (n − 1) = 1, so aₙ = 1 for odd n and aₙ = −1 for even n.", "3. From a₅₁ to a₁₀₂₃ there are 1023 − 51 + 1 = 973 terms, starting and ending with an odd index.", "4. Pair (a₅₁ + a₅₂), (a₅₃ + a₅₄), …, (a₁₀₂₁ + a₁₀₂₂): 486 pairs each summing to 0.", "5. The unpaired last term a₁₀₂₃ = 1, so the sum is 1."], "shortcut": "", "source_url": "https://cracku.in/72-let-a_1-a_2-be-integers-such-that-a_1-a_2-a_3-a_4--x-cat-2019-slot-2"}, {"id": "2019-S2-Q07", "year": 2019, "slot": 2, "q_no": 7, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – common tangent", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two circles, each of radius 4 cm, touch each other externally. A third circle touches both of them externally, and all three circles have a common tangent line. What is the radius of the third circle, in cm?", "options": ["π/3", "1", "1/√2", "√2"], "answer": "1", "answer_note": "", "concept": "Circles resting on a common line: the horizontal distance between centres combined with the radius difference forms a right triangle whose hypotenuse is the sum of radii.", "formulas": ["Distance between centres of externally touching circles = r₁ + r₂", "Pythagoras theorem"], "solution": ["1. Let the line be the common tangent; the big centres are 4 cm above it and 8 cm apart. The small circle (radius r) sits in the gap between them, its centre r above the line, midway horizontally (4 cm from each big centre horizontally).", "2. Triangle formed by a big centre, the small centre and the vertical drop: legs 4 (horizontal) and 4 − r (vertical), hypotenuse 4 + r.", "3. (4 + r)² = 4² + (4 − r)² ⇒ 16 + 8r + r² = 16 + 16 − 8r + r².", "4. 16r = 16 ⇒ r = 1 cm."], "shortcut": "Known result for circles on a line: 1/√r = 1/√R₁ + 1/√R₂ = 1/2 + 1/2 = 1 ⇒ r = 1.", "source_url": "https://cracku.in/73-two-circles-each-of-radius-4-cm-touch-externally-e-x-cat-2019-slot-2"}, {"id": "2019-S2-Q08", "year": 2019, "slot": 2, "q_no": 8, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Nature of roots with logarithmic coefficient", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A is a real number. The equation x² − 4x − log₂A = 0 has real and distinct roots if and only if:", "options": ["A < 1/16", "A > 1/8", "A > 1/16", "A < 1/8"], "answer": "A > 1/16", "answer_note": "", "concept": "Real distinct roots require a positive discriminant; then convert the logarithmic inequality.", "formulas": ["Discriminant D = b² − 4ac > 0", "log₂A > k ⇔ A > 2^k"], "solution": ["1. D = (−4)² − 4(1)(−log₂A) = 16 + 4 log₂A.", "2. D > 0 ⇒ log₂A > −4.", "3. Since base 2 > 1, A > 2⁻⁴ = 1/16 (this also ensures A > 0, so the log is defined)."], "shortcut": "", "source_url": "https://cracku.in/74-let-a-be-a-real-number-then-the-roots-of-the-equat-x-cat-2019-slot-2"}, {"id": "2019-S2-Q09", "year": 2019, "slot": 2, "q_no": 9, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum and product of roots", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The equation x² + bx + c = 0 has roots 4a and 3a, where a is an integer. Which of the following is a possible value of b² + c?", "options": ["3721", "549", "361", "427"], "answer": "549", "answer_note": "", "concept": "Express b and c through Vieta's relations in terms of a, giving b² + c as a fixed multiple of a perfect square.", "formulas": ["Sum of roots = −b, product = c for x² + bx + c"], "solution": ["1. Sum = 7a = −b, so b² = 49a².", "2. Product = 12a² = c.", "3. b² + c = 61a², so it must be 61 times a perfect square.", "4. 549 = 61 × 9 = 61 × 3² (a = ±3). Check others: 3721 = 61², and 61 is not a perfect square; 361 and 427 are not multiples of 61 by a square.", "5. Answer: 549."], "shortcut": "Divide each option by 61 and see which quotient is a perfect square.", "source_url": "https://cracku.in/75-the-quadratic-equation-x2-bx-c-0-has-two-roots-4a--x-cat-2019-slot-2"}, {"id": "2019-S2-Q10", "year": 2019, "slot": 2, "q_no": 10, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Pyramids – height", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A regular pyramid has a square base, and each of its four slanting faces is an equilateral triangle of side 20 cm. Find the vertical height of the pyramid, in cm.", "options": ["10√2", "8√3", "12", "5√5"], "answer": "10√2", "answer_note": "", "concept": "The apex lies directly above the centre of the square; a lateral edge, the half-diagonal and the height form a right triangle.", "formulas": ["Diagonal of square = side × √2", "Height² = lateral edge² − (half diagonal)²"], "solution": ["1. Base side = 20, so the base diagonal = 20√2 and half-diagonal = 10√2.", "2. Each slant edge = 20 (side of the equilateral face).", "3. h² = 20² − (10√2)² = 400 − 200 = 200.", "4. h = √200 = 10√2 cm."], "shortcut": "", "source_url": "https://cracku.in/76-the-base-of-a-regular-pyramid-is-a-square-and-each-x-cat-2019-slot-2"}, {"id": "2019-S2-Q11", "year": 2019, "slot": 2, "q_no": 11, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Right triangle – altitude to hypotenuse", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "ABC is a right-angled triangle whose hypotenuse BC is 20 cm long. If AP is perpendicular to BC (P on BC), what is the greatest possible length of AP, in cm?", "options": ["10", "8√2", "6√2", "5"], "answer": "10", "answer_note": "", "concept": "The right-angle vertex lies on the circle with the hypotenuse as diameter, so its distance from BC is at most the radius.", "formulas": ["Angle in a semicircle is 90°", "Altitude ≤ circumradius = hypotenuse/2"], "solution": ["1. Since ∠A = 90°, A lies on the circle with diameter BC (radius 10 cm).", "2. AP is the distance of A from the diameter BC.", "3. This distance is largest when A is at the top of the semicircle, directly above the centre.", "4. Maximum AP = radius = 10 cm (isosceles right triangle)."], "shortcut": "Equivalently, AP = AB·AC/20 and AB·AC ≤ (AB² + AC²)/2 = 200, so AP ≤ 10.", "source_url": "https://cracku.in/77-let-abc-be-a-right-angled-triangle-with-hypotenuse-x-cat-2019-slot-2"}, {"id": "2019-S2-Q12", "year": 2019, "slot": 2, "q_no": 12, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Domain of log under square root", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For real x, the expression √(logₑ((4x − x²)/3)) is a real number exactly when:", "options": ["−3 ≤ x ≤ 3", "1 ≤ x ≤ 2", "1 ≤ x ≤ 3", "−1 ≤ x ≤ 3"], "answer": "1 ≤ x ≤ 3", "answer_note": "", "concept": "A square root needs a non-negative radicand, and ln(t) ≥ 0 exactly when t ≥ 1.", "formulas": ["ln t ≥ 0 ⇔ t ≥ 1", "Quadratic inequality sign analysis"], "solution": ["1. Need logₑ((4x − x²)/3) ≥ 0, i.e. (4x − x²)/3 ≥ 1 (this also makes the argument positive).", "2. 4x − x² ≥ 3 ⇒ x² − 4x + 3 ≤ 0.", "3. (x − 1)(x − 3) ≤ 0 ⇒ 1 ≤ x ≤ 3."], "shortcut": "Test x = 0 or x = −1: argument is ≤ 0, eliminating A and D; x = 2.5 works, eliminating B.", "source_url": "https://cracku.in/78-if-x-is-a-real-number-then-sqrtlogedfrac4x-x23-is--x-cat-2019-slot-2"}, {"id": "2019-S2-Q13", "year": 2019, "slot": 2, "q_no": 13, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential simultaneous equations", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Given that 5^x − 3^y = 13438 and 5^(x−1) + 3^(y+1) = 9686, find x + y.", "options": [], "answer": "13", "answer_note": "", "concept": "Treat 5^x and 3^y as unknowns, solve the resulting linear system, then identify the powers.", "formulas": ["5^(x−1) = 5^x/5", "3^(y+1) = 3 × 3^y"], "solution": ["1. Let p = 5^x and q = 3^y. Then p − q = 13438 and p/5 + 3q = 9686.", "2. Multiply the second by 5: p + 15q = 48430.", "3. Subtract the first: 16q = 34992 ⇒ q = 2187 = 3⁷, so y = 7.", "4. p = 13438 + 2187 = 15625 = 5⁶, so x = 6.", "5. x + y = 13."], "shortcut": "", "source_url": "https://cracku.in/79-if-5x-3y-13438-and-5x-1-3y-1-9686-then-x-y-equals-x-cat-2019-slot-2"}, {"id": "2019-S2-Q14", "year": 2019, "slot": 2, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – successive transfers", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A salt solution is said to have strength p% if every 100 ml of it contains p grams of salt. Vessels A, B and C each contain 500 ml of solution, of strengths 10%, 22% and 32% respectively. First 100 ml is poured from A into B, then 100 ml from the (mixed) B into C, and finally 100 ml from the (mixed) C into A. What is the strength, in %, of the final solution in A?", "options": ["15", "13", "12", "14"], "answer": "14", "answer_note": "", "concept": "Track grams of salt through each transfer; a withdrawn sample carries the vessel's current concentration.", "formulas": ["Salt moved = volume moved × current concentration"], "solution": ["1. Initial salt: A = 50 g, B = 110 g, C = 160 g (each 500 ml).", "2. A → B: 100 ml of A carries 10 g. A: 40 g/400 ml; B: 120 g/600 ml (20%).", "3. B → C: 100 ml of B carries 20 g. C: 180 g/600 ml (30%).", "4. C → A: 100 ml of C carries 30 g. A: 70 g/500 ml.", "5. Strength of A = 70/500 × 100 = 14%."], "shortcut": "", "source_url": "https://cracku.in/80-the-strength-of-a-salt-solution-is-p-if-100-ml-of--x-cat-2019-slot-2"}, {"id": "2019-S2-Q15", "year": 2019, "slot": 2, "q_no": 15, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative timing – departures at intervals", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A cyclist leaves A at 10:00 am and arrives at B at 11:00 am. Starting at 10:01 am, one motorcycle leaves A for B every minute, all motorcycles travelling at the same constant speed. By 11:00 am, 45 motorcycles have reached B. Had the cyclist ridden at twice his speed, how many motorcycles would have reached B by the time he arrived?", "options": ["22", "20", "15", "23"], "answer": "15", "answer_note": "", "concept": "Find each motorcycle's travel time from the count that arrive by a given time, then redo the count for the new arrival time.", "formulas": ["Travel time constant for equal speeds"], "solution": ["1. Motorcycles leave at 10:01, 10:02, …; the 45th leaves at 10:45.", "2. Exactly 45 have arrived by 11:00, so the 45th arrives at 11:00 and the 46th does not; each takes 15 minutes.", "3. At double speed the cyclist takes 30 minutes, arriving at 10:30 am.", "4. Motorcycles arriving by 10:30 must leave by 10:15: those leaving 10:01 to 10:15, i.e. 15 motorcycles."], "shortcut": "", "source_url": "https://cracku.in/81-a-cyclist-leaves-a-at-10-am-and-reaches-b-at-11-am-x-cat-2019-slot-2"}, {"id": "2019-S2-Q16", "year": 2019, "slot": 2, "q_no": 16, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Cylinders – volume and surface area", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A man fully uses 405 cc of iron, 783 cc of aluminium and 351 cc of copper to cast solid right circular cylinders, each made of a single metal. All cylinders have the same volume and a radius of 3 cm. If the total number of cylinders is as small as possible, what is the total surface area of all the cylinders, in sq cm?", "options": ["1044(4 + π)", "8464π", "928π", "1026(1 + π)"], "answer": "1026(1 + π)", "answer_note": "", "concept": "Fewest equal-volume pieces means each piece's volume is the HCF of the given volumes; then use the cylinder formulas.", "formulas": ["Volume of cylinder = πr²h", "Total surface area = 2πr(r + h)", "Fewest equal parts ⇒ HCF"], "solution": ["1. HCF(405, 783, 351) = 27, so each cylinder has volume 27 cc.", "2. Number of cylinders = 15 + 29 + 13 = 57.", "3. π × 9 × h = 27 ⇒ h = 3/π cm.", "4. TSA of one = 2π × 3 × (3 + 3/π) = 18π + 18 = 18(1 + π).", "5. Total = 57 × 18(1 + π) = 1026(1 + π) sq cm."], "shortcut": "", "source_url": "https://cracku.in/82-a-man-makes-complete-use-of-405-cc-of-iron-783-cc--x-cat-2019-slot-2"}, {"id": "2019-S2-Q17", "year": 2019, "slot": 2, "q_no": 17, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equation via substitution", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the real root of the equation 2^(6x) + 2^(3x+2) − 21 = 0.", "options": ["log₂9", "(log₂3)/3", "log₂27", "(log₂7)/3"], "answer": "(log₂3)/3", "answer_note": "", "concept": "Substitute y = 2^(3x) to convert the equation into a quadratic, and reject the non-positive root.", "formulas": ["2^(3x+2) = 4 × 2^(3x)", "2^k > 0 for all real k"], "solution": ["1. Let y = 2^(3x) > 0. Then 2^(6x) = y² and 2^(3x+2) = 4y.", "2. y² + 4y − 21 = 0 ⇒ (y + 7)(y − 3) = 0.", "3. y = −7 is impossible, so 2^(3x) = 3.", "4. 3x = log₂3 ⇒ x = (log₂3)/3."], "shortcut": "", "source_url": "https://cracku.in/83-the-real-root-of-the-equation-26x-23x-2-21-0-is-x-cat-2019-slot-2"}, {"id": "2019-S2-Q18", "year": 2019, "slot": 2, "q_no": 18, "area": "Number System", "topic": "Number System", "subtopic": "Factors – perfect square factors", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many factors of 2⁴ × 3⁵ × 10⁴ are perfect squares greater than 1?", "options": [], "answer": "44", "answer_note": "", "concept": "Write the number in prime-power form; a perfect-square factor uses an even exponent of each prime.", "formulas": ["Square factors of p^a q^b r^c: (⌊a/2⌋ + 1)(⌊b/2⌋ + 1)(⌊c/2⌋ + 1)"], "solution": ["1. 10⁴ = 2⁴ × 5⁴, so the number is 2⁸ × 3⁵ × 5⁴.", "2. Even exponent choices: for 2: 0, 2, 4, 6, 8 (5 ways); for 3: 0, 2, 4 (3 ways); for 5: 0, 2, 4 (3 ways).", "3. Perfect-square factors = 5 × 3 × 3 = 45.", "4. Exclude 1: 45 − 1 = 44."], "shortcut": "", "source_url": "https://cracku.in/84-how-many-factors-of-24-times-35-times-104-are-perf-x-cat-2019-slot-2"}, {"id": "2019-S2-Q19", "year": 2019, "slot": 2, "q_no": 19, "area": "Number System", "topic": "Number System", "subtopic": "Digits – conditions on a six-digit number", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a six-digit number, the sixth (units) digit equals the sum of the first three digits, the fifth digit equals the sum of the first two digits, the third digit equals the first digit, the second digit is twice the first digit, and the fourth digit equals the sum of the fifth and sixth digits. What is the largest possible value of the fourth digit?", "options": [], "answer": "7", "answer_note": "", "concept": "Express every digit in terms of the first digit and apply the constraint that each digit is at most 9.", "formulas": ["Each digit lies in 0–9; leading digit ≥ 1"], "solution": ["1. Let the first digit be a (a ≥ 1). Second = 2a, third = a.", "2. Fifth = a + 2a = 3a; sixth = a + 2a + a = 4a.", "3. Fourth = 3a + 4a = 7a.", "4. 7a ≤ 9 forces a = 1, giving the number 121734.", "5. Largest fourth digit = 7."], "shortcut": "", "source_url": "https://cracku.in/85-in-a-six-digit-number-the-sixth-that-is-the-rightm-x-cat-2019-slot-2"}, {"id": "2019-S2-Q20", "year": 2019, "slot": 2, "q_no": 20, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed and track lengths", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "John jogs around track A at 6 km/h and Mary jogs around track B at 7.5 km/h. The combined length of the two tracks is 325 m. In the time John completes 9 rounds of track A, Mary completes 5 rounds of track B. How many seconds would Mary need to complete one round of track A?", "options": [], "answer": "48", "answer_note": "", "concept": "Equal elapsed time gives a relation between the track lengths; combine with their total and convert units.", "formulas": ["Time = Distance/Speed", "1 km/h = 5/18 m/s"], "solution": ["1. Let the lengths be a (track A) and b (track B) in metres. Equal time: 9a/6 = 5b/7.5 ⇒ 1.5a = (2/3)b ⇒ a = 4b/9.", "2. a + b = 325 ⇒ 13b/9 = 325 ⇒ b = 225, a = 100.", "3. Mary's speed = 7.5 × 5/18 = 25/12 m/s.", "4. Time for 100 m = 100 ÷ (25/12) = 48 seconds."], "shortcut": "", "source_url": "https://cracku.in/86-john-jogs-on-track-a-at-6-kmph-and-mary-jogs-on-tr-x-cat-2019-slot-2"}, {"id": "2019-S2-Q21", "year": 2019, "slot": 2, "q_no": 21, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentage increase – two components", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In 2010 a library had 11500 books, each either fiction or non-fiction. In 2015 it had 12760 books. From 2010 to 2015 the number of fiction books grew by 10% and the number of non-fiction books grew by 12%. How many fiction books did it have in 2015?", "options": ["6600", "6160", "6000", "5500"], "answer": "6600", "answer_note": "", "concept": "Set up the growth equation for the two parts and solve for the base value of one part.", "formulas": ["New value = old × (1 + r/100)"], "solution": ["1. Let fiction in 2010 = f; non-fiction = 11500 − f.", "2. Increase = 12760 − 11500 = 1260 = 0.10f + 0.12(11500 − f).", "3. 1260 = 1380 − 0.02f ⇒ f = 6000.", "4. Fiction in 2015 = 6000 × 1.1 = 6600."], "shortcut": "If everything grew 10% the rise would be 1150; the extra 110 is 2% of non-fiction, so non-fiction = 5500, fiction = 6000 → 6600.", "source_url": "https://cracku.in/87-in-2010-a-library-contained-a-total-of-11500-books-x-cat-2019-slot-2"}, {"id": "2019-S2-Q22", "year": 2019, "slot": 2, "q_no": 22, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Wages – regular and overtime", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "John is paid Rs 57 per hour of regular work and Rs 114 per hour of overtime. Altogether he works 172 hours, and his earnings from overtime are 15% of his earnings from regular hours. How many hours of overtime did he work?", "options": [], "answer": "12", "answer_note": "", "concept": "Translate the hour total and the income relation into two linear equations.", "formulas": ["Income = rate × hours"], "solution": ["1. Let regular hours = r and overtime hours = t, so r + t = 172.", "2. 114t = 0.15 × 57r ⇒ 2t = 0.15r ⇒ t = 0.075r.", "3. 1.075r = 172 ⇒ r = 160.", "4. t = 172 − 160 = 12 hours."], "shortcut": "", "source_url": "https://cracku.in/88-john-gets-rs-57-per-hour-of-regular-work-and-rs-11-x-cat-2019-slot-2"}, {"id": "2019-S2-Q23", "year": 2019, "slot": 2, "q_no": 23, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Arithmetic progression sums", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If (2n + 1) + (2n + 3) + (2n + 5) + … + (2n + 47) = 5280, find the value of 1 + 2 + 3 + … + n.", "options": [], "answer": "4851", "answer_note": "", "concept": "Count the terms, split the sum into a constant part and the sum of the first several odd numbers, and solve for n.", "formulas": ["Sum of first k odd numbers = k²", "1 + 2 + … + n = n(n + 1)/2"], "solution": ["1. The odd numbers 1, 3, …, 47 number 24, so there are 24 terms.", "2. Sum = 24 × 2n + (1 + 3 + … + 47) = 48n + 24² = 48n + 576.", "3. 48n + 576 = 5280 ⇒ 48n = 4704 ⇒ n = 98.", "4. 1 + 2 + … + 98 = 98 × 99/2 = 4851."], "shortcut": "", "source_url": "https://cracku.in/89-if-2n-1-2n-3-2n-5-2n-47-5280-then-whatis-the-value-x-cat-2019-slot-2"}, {"id": "2019-S2-Q24", "year": 2019, "slot": 2, "q_no": 24, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Successive profit and loss", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A shopkeeper buys two tables at Rs p each. He sells one to Amal at 20% profit and the other to Asim at 20% loss. Amal resells his table to Bimal at 30% profit, and Asim resells his to Barun at 30% loss. If Bimal pays Rs x and Barun pays Rs y, what is (x − y)/p?", "options": ["1", "1.2", "0.7", "0.50"], "answer": "1", "answer_note": "", "concept": "Successive percentage changes multiply.", "formulas": ["Final price = p × (1 ± r₁)(1 ± r₂)"], "solution": ["1. x = p × 1.2 × 1.3 = 1.56p.", "2. y = p × 0.8 × 0.7 = 0.56p.", "3. x − y = 1.00p, so (x − y)/p = 1."], "shortcut": "", "source_url": "https://cracku.in/90-a-shopkeeper-sells-two-tables-each-procured-at-cos-x-cat-2019-slot-2"}, {"id": "2019-S2-Q25", "year": 2019, "slot": 2, "q_no": 25, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – medians and centroid", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In triangle ABC, the medians AD and BE are perpendicular to each other, with AD = 12 cm and BE = 9 cm. Find the area of triangle ABC, in sq cm.", "options": ["80", "68", "72", "78"], "answer": "72", "answer_note": "", "concept": "The centroid splits each median 2:1, and the three triangles formed with the centroid and two vertices each have one-third of the total area.", "formulas": ["Centroid divides median in ratio 2:1", "Area(ABG) = (1/3) Area(ABC)", "For perpendicular medians: Area = (2/3) × m₁ × m₂"], "solution": ["1. Let G be the centroid. AG = (2/3) × 12 = 8 cm and BG = (2/3) × 9 = 6 cm.", "2. AD ⊥ BE, so triangle AGB is right-angled at G: area = (1/2) × 8 × 6 = 24 sq cm.", "3. Triangle ABG is one-third of triangle ABC.", "4. Area of ABC = 3 × 24 = 72 sq cm."], "shortcut": "Direct formula: (2/3) × 12 × 9 = 72.", "source_url": "https://cracku.in/91-in-a-triangle-abc-medians-ad-and-be-are-perpendicu-x-cat-2019-slot-2"}, {"id": "2019-S2-Q26", "year": 2019, "slot": 2, "q_no": 26, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Common terms of two APs", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many terms are common to the two sequences 15, 19, 23, 27, …, 415 and 14, 19, 24, 29, …, 464?", "options": ["20", "18", "21", "19"], "answer": "20", "answer_note": "", "concept": "Common terms of two APs form an AP whose difference is the LCM of the two differences, starting at the first common term.", "formulas": ["Common difference of common terms = LCM(d₁, d₂)", "Number of terms = (last − first)/d + 1"], "solution": ["1. Differences are 4 and 5, so common terms differ by LCM = 20.", "2. The first common term is 19.", "3. Common terms: 19, 39, 59, …, up to at most min(415, 464) = 415.", "4. Largest such term: 19 + 20k ≤ 415 ⇒ k ≤ 19.8, so the last is 399.", "5. Count = (399 − 19)/20 + 1 = 20."], "shortcut": "", "source_url": "https://cracku.in/92-the-number-of-common-terms-in-the-two-sequences-15-x-cat-2019-slot-2"}, {"id": "2019-S2-Q27", "year": 2019, "slot": 2, "q_no": 27, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Cauchy–Schwarz / Lagrange identity", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Real numbers a, b, x, y satisfy a² + b² = 25, x² + y² = 169 and ax + by = 65. If k = ay − bx, which of the following is true?", "options": ["0 < k ≤ 5/13", "k > 5/13", "k = 5/13", "k = 0"], "answer": "k = 0", "answer_note": "", "concept": "The identity (a² + b²)(x² + y²) = (ax + by)² + (ay − bx)² shows that equality in Cauchy–Schwarz forces the cross term to vanish.", "formulas": ["(a² + b²)(x² + y²) = (ax + by)² + (ay − bx)²"], "solution": ["1. Left side = 25 × 169 = 4225.", "2. (ax + by)² = 65² = 4225.", "3. So k² = (ay − bx)² = 4225 − 4225 = 0.", "4. Hence k = 0."], "shortcut": "ax + by already reaches its maximum √25·√169 = 65, so (a, b) ∥ (x, y), making ay − bx = 0.", "source_url": "https://cracku.in/93-let-a-b-x-y-be-real-numbers-such-that-a2-b2-25-x2--x-cat-2019-slot-2"}, {"id": "2019-S2-Q28", "year": 2019, "slot": 2, "q_no": 28, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit and loss on a batch", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In 2017 Mukesh bought 10 bicycles, all at the same price. He sold six of them at a profit of 25% and the other four at a loss of 25%. His total profit was Rs 2000. What was the purchase price of each bicycle, in Rs?", "options": ["2000", "6000", "8000", "4000"], "answer": "4000", "answer_note": "", "concept": "Net profit equals the profit on the gaining units minus the loss on the losing units, each a percentage of the same cost price.", "formulas": ["Profit = cost × profit%"], "solution": ["1. Let the cost per bicycle be C.", "2. Profit on six = 6 × 0.25C = 1.5C; loss on four = 4 × 0.25C = C.", "3. Net profit = 0.5C = 2000.", "4. C = Rs 4000."], "shortcut": "", "source_url": "https://cracku.in/94-mukesh-purchased-10-bicycles-in-2017-all-at-the-sa-x-cat-2019-slot-2"}, {"id": "2019-S2-Q29", "year": 2019, "slot": 2, "q_no": 29, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentage chain", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In an examination, A scored 10% less than B, B scored 25% more than C, and C scored 20% less than D. If A scored 72, what did D score?", "options": [], "answer": "80", "answer_note": "", "concept": "Chain the percentage relationships as multiplicative factors.", "formulas": ["Successive percentage factors multiply"], "solution": ["1. A = 0.9B ⇒ B = 72 ÷ 0.9 = 80.", "2. B = 1.25C ⇒ C = 80 ÷ 1.25 = 64.", "3. C = 0.8D ⇒ D = 64 ÷ 0.8 = 80."], "shortcut": "Overall A = 0.9 × 1.25 × 0.8 D = 0.9D, so D = 72 ÷ 0.9 = 80.", "source_url": "https://cracku.in/95-in-an-examination-the-score-of-a-was-10-less-than--x-cat-2019-slot-2"}, {"id": "2019-S2-Q30", "year": 2019, "slot": 2, "q_no": 30, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratios across two years", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The salaries of Ramesh, Ganesh and Rajesh were in the ratio 6 : 5 : 7 in 2010 and in the ratio 3 : 4 : 3 in 2015. If Ramesh's salary went up by 25% from 2010 to 2015, the percentage increase in Rajesh's salary over the same period is closest to:", "options": ["7", "8", "9", "10"], "answer": "7", "answer_note": "", "concept": "Anchor both ratios to a common person whose actual change is known, then compare the other person's values.", "formulas": ["% change = (new − old)/old × 100"], "solution": ["1. Let 2010 salaries be 6k, 5k, 7k.", "2. Ramesh in 2015 = 1.25 × 6k = 7.5k.", "3. In 2015 Rajesh earns the same as Ramesh (ratio 3 : 3), so Rajesh = 7.5k.", "4. Rajesh's increase = (7.5k − 7k)/7k = 1/14 ≈ 7.14% ≈ 7."], "shortcut": "", "source_url": "https://cracku.in/96-the-salaries-of-ramesh-ganesh-and-rajesh-were-in-t-x-cat-2019-slot-2"}, {"id": "2019-S2-Q31", "year": 2019, "slot": 2, "q_no": 31, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular polygons – interior angles", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A and B are regular polygons with a and b sides respectively, where b = 2a. Each interior angle of B is 3/2 times each interior angle of A. What is each interior angle, in degrees, of a regular polygon with a + b sides?", "options": [], "answer": "150", "answer_note": "", "concept": "Use the interior angle formula for a regular n-gon to build an equation in a.", "formulas": ["Interior angle of regular n-gon = 180 − 360/n degrees"], "solution": ["1. Interior angle of B (2a sides) = 180 − 180/a; of A = 180 − 360/a.", "2. 180 − 180/a = (3/2)(180 − 360/a) = 270 − 540/a.", "3. 360/a = 90 ⇒ a = 4, so b = 8 (square and octagon: 135 = 1.5 × 90 ✓).", "4. a + b = 12; interior angle = 180 − 360/12 = 150°."], "shortcut": "", "source_url": "https://cracku.in/97-let-a-and-b-be-two-regular-polygons-having-a-and-b-x-cat-2019-slot-2"}, {"id": "2019-S2-Q32", "year": 2019, "slot": 2, "q_no": 32, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Multiplicative functions", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "f is a function defined on positive integers with f(mn) = f(m)f(n) for all positive integers m, n. Values f(1), f(2) and f(3) are positive integers, f(1) < f(2), and f(24) = 54. Find f(18).", "options": [], "answer": "12", "answer_note": "", "concept": "A completely multiplicative function is determined by its values at primes; factorise the given value to pin them down.", "formulas": ["f(1) = 1 when f(1) ≠ 0 (since f(1) = f(1)²)", "f(p^a q^b) = f(p)^a f(q)^b"], "solution": ["1. f(1) = f(1 × 1) = f(1)², and f(1) > 0, so f(1) = 1; hence f(2) > 1.", "2. f(24) = f(2)³ × f(3) = 54 = 3³ × 2.", "3. f(2)³ must divide 54 with f(2) > 1, so f(2) = 3 and f(3) = 2.", "4. f(18) = f(2) × f(3)² = 3 × 4 = 12."], "shortcut": "", "source_url": "https://cracku.in/98-let-f-be-a-function-such-that-f-mn-f-m-f-n-for-eve-x-cat-2019-slot-2"}, {"id": "2019-S2-Q33", "year": 2019, "slot": 2, "q_no": 33, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work – people joining midway", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Anil alone can finish a job in 20 days and Sunil alone in 40 days. Anil starts the job alone, Sunil joins him after 3 days, and some days later Bimal also joins; the three then complete the job together. If Bimal did 10% of the work, how many days did the job take in all?", "options": ["13", "12", "15", "14"], "answer": "13", "answer_note": "", "concept": "Sum the fractions of work done by each person over the time they worked.", "formulas": ["Work = rate × time", "Rate = 1/(days to finish alone)"], "solution": ["1. Let the job take D days. Anil works D days, Sunil works D − 3 days.", "2. Anil and Sunil together do 90% of the job: D/20 + (D − 3)/40 = 9/10.", "3. Multiply by 40: 2D + D − 3 = 36 ⇒ 3D = 39.", "4. D = 13 days."], "shortcut": "", "source_url": "https://cracku.in/99-anil-alone-can-do-a-job-in-20-days-while-sunil-alo-x-cat-2019-slot-2"}, {"id": "2019-S2-Q34", "year": 2019, "slot": 2, "q_no": 34, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratios – changed scores", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In an exam, Rama's score equalled one-twelfth of the combined scores of Mohan and Anjali. After a review, each of the three got 6 extra marks, and the revised scores of Anjali, Mohan and Rama were in the ratio 11 : 10 : 3. By how many marks does Anjali's original score exceed Rama's?", "options": ["26", "32", "24", "35"], "answer": "32", "answer_note": "", "concept": "Use the ratio after the change to define all revised scores by a multiplier, and substitute into the original relation.", "formulas": ["Ratio a : b : c ⇒ values ak, bk, ck"], "solution": ["1. Revised scores: Anjali = 11k, Mohan = 10k, Rama = 3k.", "2. Originals: Anjali = 11k − 6, Mohan = 10k − 6, Rama = 3k − 6.", "3. 12(3k − 6) = (11k − 6) + (10k − 6) ⇒ 36k − 72 = 21k − 12 ⇒ k = 4.", "4. Anjali = 38, Rama = 6; difference = 32 (equal to the revised difference 44 − 12)."], "shortcut": "Difference is unchanged by adding 6 to both: answer = 8k, so it must be a multiple of 8 → 24 or 32; check.", "source_url": "https://cracku.in/100-in-an-examination-ramas-score-was-one-twelfth-of-t-x-cat-2019-slot-2"}, {"id": "2020-S1-Q01", "year": 2020, "slot": 1, "q_no": 1, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equation with logs", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "y is a negative real number satisfying 2^(y²·log₃5) = 5^(log₂3). Find y.", "options": ["log₂(1/5)", "log₂(1/3)", "−log₂(1/5)", "−log₂(1/3)"], "answer": "log₂(1/3)", "answer_note": "", "concept": "Taking logarithms of both sides turns an exponential equation into a simple equation in y², using change of base to simplify.", "formulas": ["log(aᵇ) = b·log a", "log_a b = log b / log a", "log_a b · log_b a = 1"], "solution": ["1. Take log base 2 of both sides: y²·log₃5 = log₂3 · log₂5.", "2. Write log₃5 = log₂5 / log₂3, so y²·(log₂5 / log₂3) = log₂3 · log₂5.", "3. Cancel log₂5: y² = (log₂3)².", "4. So y = ±log₂3; since y < 0, y = −log₂3 = log₂(1/3)."], "shortcut": "−log₂(1/3) is positive and log₂(1/5) has the wrong base number, so only log₂(1/3) is both negative and built from 3.", "source_url": "https://cracku.in/51-if-y-is-a-negative-number-such-that-2y2log355log23-x-cat-2020-slot-1"}, {"id": "2020-S1-Q02", "year": 2020, "slot": 1, "q_no": 2, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recursive distribution (work backwards)", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A man distributes toffees among some children one after another. To the first child he gives half of all his toffees and one more. To each following child he gives half of the toffees he has left at that point and one more. His toffees run out exactly when he has served the fifth child. How many toffees did he start with?", "options": [], "answer": "62", "answer_note": "", "concept": "A repeated 'take half plus one' process is reversed step by step from the final state of zero.", "formulas": ["If after giving the remainder is R', then before giving: R = 2(R' + 1)"], "solution": ["1. If he holds R before a child, the child gets R/2 + 1 and R/2 − 1 remains.", "2. Reversing: stock before = 2 × (stock after + 1).", "3. After child 5 the stock is 0, so before child 5 it was 2(0 + 1) = 2.", "4. Before child 4: 2(2 + 1) = 6; before child 3: 2(6 + 1) = 14; before child 2: 2(14 + 1) = 30.", "5. Initial stock = 2(30 + 1) = 62."], "shortcut": "The pattern 2, 6, 14, 30, 62 is 2ⁿ⁺¹ − 2, so for 5 children it is 2⁶ − 2 = 62.", "source_url": "https://cracku.in/52-a-gentleman-decided-to-treat-a-few-children-in-the-x-cat-2020-slot-1"}, {"id": "2020-S1-Q03", "year": 2020, "slot": 1, "q_no": 3, "area": "Number System", "topic": "Number System", "subtopic": "Digit product counting", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find how many three-digit numbers have a product of digits strictly greater than 2 and strictly less than 7.", "options": [], "answer": "21", "answer_note": "", "concept": "Count digit triplets (no zero allowed) whose product is 3, 4, 5 or 6, then count the arrangements of each triplet.", "formulas": ["Arrangements of a multiset = n! / (a!·b!·…)"], "solution": ["1. No digit can be 0 (product would be 0), so each product is 3, 4, 5 or 6.", "2. Product 3: {1,1,3} → 3 numbers. Product 5: {1,1,5} → 3 numbers.", "3. Product 4: {1,1,4} → 3 and {1,2,2} → 3, total 6.", "4. Product 6: {1,1,6} → 3 and {1,2,3} → 3! = 6, total 9.", "5. Total = 3 + 3 + 6 + 9 = 21."], "shortcut": "", "source_url": "https://cracku.in/53-how-many-3-digit-numbers-are-there-for-which-the-p-x-cat-2020-slot-1"}, {"id": "2020-S1-Q04", "year": 2020, "slot": 1, "q_no": 4, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Range comparison of two sides", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many real values of x satisfy 2ˣ + 2⁻ˣ = 2 − (x − 2)²?", "options": ["1", "2", "infinite", "0"], "answer": "0", "answer_note": "", "concept": "Compare the ranges of the two sides: the left side has a minimum and the right side has a maximum, and they meet only if both are attained at the same x.", "formulas": ["a + 1/a ≥ 2 for a > 0, with equality only at a = 1", "(x − 2)² ≥ 0"], "solution": ["1. By AM ≥ GM, 2ˣ + 2⁻ˣ ≥ 2, with equality only when 2ˣ = 1, i.e. x = 0.", "2. The right side 2 − (x − 2)² ≤ 2, with equality only at x = 2.", "3. Equality of the two sides would need both to equal 2, which needs x = 0 and x = 2 at once.", "4. That is impossible, so there are no real solutions."], "shortcut": "At x = 2 the LHS is 4.25 > 2, and elsewhere the RHS is below 2 while the LHS is at least 2.", "source_url": "https://cracku.in/54-the-number-of-real-valued-solutions-of-the-equatio-x-cat-2020-slot-1"}, {"id": "2020-S1-Q05", "year": 2020, "slot": 1, "q_no": 5, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Equations of the form aᵇ = 1", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the number of distinct positive integers x for which (x² − 7x + 11)^(x² − 13x + 42) = 1.", "options": ["8", "4", "2", "6"], "answer": "6", "answer_note": "", "concept": "aᵇ = 1 in integers happens in three ways: base 1, exponent 0 with non-zero base, or base −1 with an even exponent.", "formulas": ["aᵇ = 1 ⇔ a = 1, or (b = 0 and a ≠ 0), or (a = −1 and b even)"], "solution": ["1. Base = 1: x² − 7x + 10 = 0 gives x = 2, 5.", "2. Exponent = 0: x² − 13x + 42 = 0 gives x = 6, 7; the bases there are 5 and 11, both non-zero, so both are valid.", "3. Base = −1: x² − 7x + 12 = 0 gives x = 3, 4; the exponents are 12 and 6, both even, so both are valid.", "4. Distinct solutions: 2, 3, 4, 5, 6, 7, so there are 6."], "shortcut": "", "source_url": "https://cracku.in/55-how-many-disticnt-positive-integer-valued-solution-x-cat-2020-slot-1"}, {"id": "2020-S1-Q06", "year": 2020, "slot": 1, "q_no": 6, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Cone cut parallel to the base (frustum)", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A solid right circular cone of height 27 cm is sliced by a plane parallel to its base, 18 cm above the base. The two pieces differ in volume by 225 cc. What is the volume, in cc, of the original cone?", "options": ["243", "232", "256", "264"], "answer": "243", "answer_note": "", "concept": "The piece cut off at the top is a smaller similar cone, so its volume scales with the cube of the height ratio.", "formulas": ["Similar solids: volume ratio = (linear ratio)³", "Cone volume = (1/3)πr²h"], "solution": ["1. The top piece is a cone of height 27 − 18 = 9, i.e. 1/3 of the full height.", "2. Its volume is (1/3)³ = 1/27 of the original cone V.", "3. The frustum is V − V/27 = 26V/27.", "4. Difference = 26V/27 − V/27 = 25V/27 = 225.", "5. So V = 225 × 27/25 = 243 cc."], "shortcut": "V = 225 × 27/25 must be a multiple of 27; among the options only 243 = 27 × 9 is.", "source_url": "https://cracku.in/56-a-solid-right-circular-cone-of-height-27-cm-is-cut-x-cat-2020-slot-1"}, {"id": "2020-S1-Q07", "year": 2020, "slot": 1, "q_no": 7, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – area of a region", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the area of the region in the xy-plane defined by |x| − y ≤ 1, y ≥ 0 and y ≤ 1.", "options": [], "answer": "3", "answer_note": "", "concept": "Draw the region bounded by the lines formed from the inequalities and add up simple shapes.", "formulas": ["Area of trapezium = (1/2)(sum of parallel sides) × height"], "solution": ["1. |x| − y ≤ 1 means |x| ≤ 1 + y, i.e. −(1 + y) ≤ x ≤ 1 + y.", "2. With 0 ≤ y ≤ 1, at y = 0 the strip has width 2 (x from −1 to 1); at y = 1 it has width 4 (x from −2 to 2).", "3. The region is a trapezium with parallel sides 2 and 4 and height 1.", "4. Area = (1/2)(2 + 4)(1) = 3."], "shortcut": "", "source_url": "https://cracku.in/57-the-area-of-the-region-satisfying-the-inequalities-x-cat-2020-slot-1"}, {"id": "2020-S1-Q08", "year": 2020, "slot": 1, "q_no": 8, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circle in rectangle – areas", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A rectangular metal sheet has area 135 sq in. A circle is painted on it so that the circle touches two opposite sides of the sheet. The unpainted area is two-thirds of the painted area. Find the perimeter of the sheet, in inches.", "options": ["3√π(5 + 12/π)", "4√π(3 + 9/π)", "3√π(5/2 + 6/π)", "5√π(3 + 9/π)"], "answer": "3√π(5 + 12/π)", "answer_note": "", "concept": "Split the total area into painted and unpainted parts to find the circle's area; its diameter is one side of the rectangle.", "formulas": ["Area of circle = πd²/4", "Perimeter = 2(l + b)"], "solution": ["1. Painted P + unpainted (2/3)P = 135, so (5/3)P = 135 and P = 81.", "2. πd²/4 = 81 gives d = 18/√π; this is the side the circle spans.", "3. Other side = 135/d = 135√π/18 = 7.5√π.", "4. Perimeter = 2(18/√π + 7.5√π) = 36/√π + 15√π.", "5. Factor 3√π: 3√π(5 + 12/π), since 3√π × 12/π = 36/√π."], "shortcut": "Numerically the perimeter ≈ 46.9; option 1 evaluates to 46.9, while the others give about 41.6, 23.4 and 52.0.", "source_url": "https://cracku.in/58-on-a-rectangular-metal-sheet-of-area-135-sq-in-a-c-x-cat-2020-slot-1"}, {"id": "2020-S1-Q09", "year": 2020, "slot": 1, "q_no": 9, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rhombus with inscribed circle", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A circle is inscribed in a rhombus whose diagonals are 12 cm and 16 cm. What is the ratio of the circle's area to the rhombus's area?", "options": ["6π/25", "5π/18", "3π/25", "2π/15"], "answer": "6π/25", "answer_note": "", "concept": "The inradius of a rhombus is the perpendicular distance from the centre to a side, i.e. the altitude of one of the four right triangles formed by the diagonals.", "formulas": ["Area of rhombus = (d₁ × d₂)/2", "Side = √((d₁/2)² + (d₂/2)²)", "Inradius r = (d₁/2)(d₂/2)/side"], "solution": ["1. Half-diagonals are 6 and 8, so the side is √(36 + 64) = 10.", "2. Rhombus area = (12 × 16)/2 = 96.", "3. Inradius r = (6 × 8)/10 = 4.8.", "4. Circle area = π(4.8)² = 23.04π.", "5. Ratio = 23.04π/96 = 0.24π = 6π/25."], "shortcut": "", "source_url": "https://cracku.in/59-a-circle-is-inscribed-in-a-rhombus-with-diagonals--x-cat-2020-slot-1"}, {"id": "2020-S1-Q10", "year": 2020, "slot": 1, "q_no": 10, "area": "Number System", "topic": "Number System", "subtopic": "Pigeonhole principle – minimum of maximum", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Of 100 students, x₁ were born in January, x₂ in February, and so on up to x₁₂ for December. Let x₀ be the largest of x₁, x₂, …, x₁₂. What is the least possible value of x₀?", "options": ["8", "9", "10", "12"], "answer": "9", "answer_note": "", "concept": "To keep the largest month count as small as possible, spread the students as evenly as possible over 12 months.", "formulas": ["Pigeonhole: some box has at least ⌈n/k⌉ items"], "solution": ["1. If every month had at most 8 students, the total would be at most 96 < 100.", "2. So some month has at least 9, i.e. x₀ ≥ 9.", "3. 9 is achievable: 4 months with 9 and 8 months with 8 gives 36 + 64 = 100.", "4. Least possible x₀ = 9."], "shortcut": "⌈100/12⌉ = ⌈8.33⌉ = 9.", "source_url": "https://cracku.in/60-among-100-students-x_1-have-birthdays-in-january-x-x-cat-2020-slot-1"}, {"id": "2020-S1-Q11", "year": 2020, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Meeting point – time after meeting", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Points A and B are joined by a straight road. Car 1 leaves A for B and Car 2 leaves B for A at the same moment. After they pass each other, Car 1 needs 45 minutes and Car 2 needs 20 minutes to finish their trips. If Car 1 travels at 60 km/hr, what is Car 2's speed in km/hr?", "options": ["100", "90", "80", "70"], "answer": "90", "answer_note": "", "concept": "When two bodies start together towards each other, the ratio of their speeds is the square root of the inverse ratio of the times they take after meeting.", "formulas": ["S₁/S₂ = √(t₂/t₁), where t₁, t₂ are times taken after meeting"], "solution": ["1. Let the meeting happen after time t; Car 1 covers 60t and Car 2 covers vt.", "2. After meeting, Car 1 covers Car 2's part: vt = 60 × 45/60 = 45.", "3. Car 2 covers Car 1's part: 60t = v × 20/60 = v/3.", "4. Dividing: v/60 = 135/v, so v² = 8100, v = 90.", "5. Check with the rule: 60/v = √(20/45) = 2/3, so v = 90 km/hr."], "shortcut": "S₂ = 60 × √(45/20) = 60 × 1.5 = 90.", "source_url": "https://cracku.in/61-a-straight-road-connects-points-a-and-b-car-1-trav-x-cat-2020-slot-1"}, {"id": "2020-S1-Q12", "year": 2020, "slot": 1, "q_no": 12, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Overall profit from two items", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A man buys a desktop and a laptop for a combined Rs 50000. He sells the desktop at a 20% profit and the laptop at a 10% loss, and his overall profit is 2%. What did he pay for the desktop, in rupees?", "options": [], "answer": "20000", "answer_note": "", "concept": "The overall profit percentage is a weighted average of the individual profit percentages, weighted by cost price (alligation).", "formulas": ["Overall % = (C₁·p₁ + C₂·p₂)/(C₁ + C₂)", "Alligation: C₁ : C₂ = (p₂ − p)/(p − p₁)"], "solution": ["1. Let the desktop cost D; the laptop then costs 50000 − D.", "2. Profit: 0.2D − 0.1(50000 − D) = 0.02 × 50000 = 1000.", "3. 0.3D − 5000 = 1000, so 0.3D = 6000.", "4. D = 20000."], "shortcut": "Alligation: desktop : laptop = (2 − (−10)) : (20 − 2) = 12 : 18 = 2 : 3, so the desktop = (2/5) × 50000 = 20000.", "source_url": "https://cracku.in/62-a-person-spent-rs-50000-to-purchase-a-desktop-comp-x-cat-2020-slot-1"}, {"id": "2020-S1-Q13", "year": 2020, "slot": 1, "q_no": 13, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Dilution and re-concentration", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A 40-litre solution contains dye and water in the ratio 2 : 3. Water is added until the ratio is 2 : 5. Then one-fourth of this diluted solution is removed. How many litres of dye must now be added to bring the ratio back to 2 : 3?", "options": [], "answer": "8", "answer_note": "", "concept": "Adding water leaves the dye amount unchanged; removing a fraction of a mixture removes each component in the same fraction.", "formulas": ["Removing fraction f leaves (1 − f) of each component"], "solution": ["1. Initially dye = 16 L, water = 24 L.", "2. For 2 : 5 with dye 16 L, water must be 40 L (16 L of water added).", "3. Removing one-fourth leaves dye = 12 L and water = 30 L.", "4. For 2 : 3 with water 30 L, dye must be 20 L.", "5. Dye to add = 20 − 12 = 8 L."], "shortcut": "", "source_url": "https://cracku.in/63-a-solution-of-volume-40-litres-has-dye-and-water-i-x-cat-2020-slot-1"}, {"id": "2020-S1-Q14", "year": 2020, "slot": 1, "q_no": 14, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Indices with surd exponents", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let x = 4096^(7 + 4√3). Which of the following equals 64?", "options": ["x⁷ / x^(2√3)", "x^(7/2) / x^(4/√3)", "x^(7/2) / x^(2√3)", "x⁷ / x^(4√3)"], "answer": "x^(7/2) / x^(2√3)", "answer_note": "", "concept": "Express 64 as a power of 4096 and use the conjugate of (7 + 4√3) to find the exponent needed.", "formulas": ["(a + b)(a − b) = a² − b²", "aᵐ / aⁿ = a^(m − n)", "4096 = 64²"], "solution": ["1. 64 = 4096^(1/2), so we need x^k = 4096^(1/2), i.e. k(7 + 4√3) = 1/2.", "2. (7 + 4√3)(7 − 4√3) = 49 − 48 = 1, so 1/(7 + 4√3) = 7 − 4√3.", "3. Hence k = (7 − 4√3)/2 = 7/2 − 2√3.", "4. x^(7/2 − 2√3) = x^(7/2) / x^(2√3)."], "shortcut": "Spot that 7 − 4√3 is the reciprocal of 7 + 4√3; halving it gives the exponent directly.", "source_url": "https://cracku.in/64-if-x409674sqrt3-then-which-of-the-following-equals-x-cat-2020-slot-1"}, {"id": "2020-S1-Q15", "year": 2020, "slot": 1, "q_no": 15, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Alloy – volume and density ratios", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Three metals A, B and C are combined in the volume ratio 3 : 4 : 7 to make an alloy. Equal volumes of A, B and C weigh in the ratio 5 : 2 : 6. How many kg of metal C are in 130 kg of this alloy?", "options": ["48", "84", "70", "96"], "answer": "84", "answer_note": "", "concept": "Weight = volume × weight per unit volume, so the weight ratio is the product of the volume ratio and the density ratio.", "formulas": ["Weight ratio = (V_A·d_A) : (V_B·d_B) : (V_C·d_C)"], "solution": ["1. Weight ratio A : B : C = 3×5 : 4×2 : 7×6 = 15 : 8 : 42.", "2. Total parts = 65.", "3. Weight of C = 130 × 42/65 = 84 kg."], "shortcut": "", "source_url": "https://cracku.in/65-an-alloy-is-prepared-by-mixing-three-metals-a-b-an-x-cat-2020-slot-1"}, {"id": "2020-S1-Q16", "year": 2020, "slot": 1, "q_no": 16, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Substitution t = x + 1/x", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many distinct real roots does (x + 1/x)² − 3(x + 1/x) + 2 = 0 have?", "options": [], "answer": "1", "answer_note": "", "concept": "Substitute t = x + 1/x to get a quadratic in t, then use the fact that for real x, |x + 1/x| ≥ 2.", "formulas": ["For real x ≠ 0, x + 1/x ≥ 2 or x + 1/x ≤ −2"], "solution": ["1. Let t = x + 1/x; then t² − 3t + 2 = 0, so t = 1 or t = 2.", "2. t = 1 is impossible for real x, since |x + 1/x| ≥ 2 (x² − x + 1 = 0 has negative discriminant).", "3. t = 2 gives x² − 2x + 1 = 0, so x = 1 (a repeated root).", "4. Number of distinct real roots = 1."], "shortcut": "", "source_url": "https://cracku.in/66-the-number-of-distinct-real-roots-of-the-equation--x-cat-2020-slot-1"}, {"id": "2020-S1-Q17", "year": 2020, "slot": 1, "q_no": 17, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Change of base", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If log₄5 = (log₄y) × (log₆√5), find y.", "options": [], "answer": "36", "answer_note": "", "concept": "Rewrite every log in a common base and cancel the common factor log 5.", "formulas": ["log_a b = log b / log a", "log √5 = (1/2) log 5"], "solution": ["1. Write log₄5 = log 5 / log 4, log₄y = log y / log 4, log₆√5 = (1/2) log 5 / log 6.", "2. The equation becomes log 5 / log 4 = (log y / log 4) × (log 5)/(2 log 6).", "3. Cancel log 5 / log 4: 1 = log y / (2 log 6).", "4. log y = 2 log 6 = log 36, so y = 36."], "shortcut": "", "source_url": "https://cracku.in/67-if-log45log4ylog6sqrt5-then-y-equals-x-cat-2020-slot-1"}, {"id": "2020-S1-Q18", "year": 2020, "slot": 1, "q_no": 18, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Speed and arrival time", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Amal always leaves home at the same time. At 8 km/hr he gets to the office at 10:15 am, and at 15 km/hr he gets there at 9:40 am. If he leaves home at 9:10 am, at what speed (km/hr) must he travel to reach the office at exactly 10:00 am?", "options": ["13", "12", "14", "11"], "answer": "12", "answer_note": "", "concept": "The difference in travel times at two speeds fixes the distance.", "formulas": ["d/s₁ − d/s₂ = time difference", "Speed = distance / time"], "solution": ["1. The two arrival times differ by 35 minutes = 7/12 hr.", "2. d/8 − d/15 = 7/12 → d × 7/120 = 7/12 → d = 10 km.", "3. From 9:10 to 10:00 is 50 minutes = 5/6 hr.", "4. Required speed = 10 ÷ (5/6) = 12 km/hr."], "shortcut": "", "source_url": "https://cracku.in/68-leaving-home-at-the-same-time-amal-reaches-the-off-x-cat-2020-slot-1"}, {"id": "2020-S1-Q19", "year": 2020, "slot": 1, "q_no": 19, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Late arrival and speed increase", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A train ran at one-third of its normal speed and reached its destination 30 minutes late. On the way back it ran at normal speed for 5 minutes and then halted for 4 minutes because of an emergency. By what percentage, approximately, must it raise its normal speed for the rest of the trip to arrive on schedule?", "options": ["50", "58", "67", "61"], "answer": "67", "answer_note": "", "concept": "At one-third speed the time triples; the extra time equals twice the usual time, which gives the usual journey time.", "formulas": ["Time ∝ 1/speed for fixed distance"], "solution": ["1. At one-third speed the trip takes 3T, so 3T − T = 30 min, giving the usual time T = 15 min.", "2. Return trip: 5 minutes at normal speed covers 5/15 = 1/3 of the distance.", "3. After the 4-minute halt, 9 minutes are used; 6 minutes remain for the other 2/3 of the distance.", "4. At normal speed 2/3 of the distance would need 10 minutes; doing it in 6 needs speed × 10/6 = 5/3.", "5. Increase = 2/3 ≈ 66.67% ≈ 67%."], "shortcut": "", "source_url": "https://cracku.in/69-a-train-travelled-at-one-thirds-of-its-usual-speed-x-cat-2020-slot-1"}, {"id": "2020-S1-Q20", "year": 2020, "slot": 1, "q_no": 20, "area": "Number System", "topic": "Number System", "subtopic": "Digit structure and averages", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the average of all even four-digit natural numbers of the form aabb, where a > 0.", "options": ["4466", "5050", "4864", "5544"], "answer": "5544", "answer_note": "", "concept": "Write aabb as 1100a + 11b; the average of a sum over independent choices is the sum of the averages.", "formulas": ["aabb = 1100a + 11b", "Mean of a linear expression = expression of the means"], "solution": ["1. aabb = 1000a + 100a + 10b + b = 1100a + 11b.", "2. Even means b ∈ {0, 2, 4, 6, 8}; a runs from 1 to 9 — every pair occurs once (45 numbers).", "3. Average a = 5 and average b = 4.", "4. Mean = 1100 × 5 + 11 × 4 = 5500 + 44 = 5544."], "shortcut": "The mean must be of the form aabb itself with a = 5, b = 4: only 5544 is.", "source_url": "https://cracku.in/70-the-mean-of-all-4-digit-even-natural-numbers-of-th-x-cat-2020-slot-1"}, {"id": "2020-S1-Q21", "year": 2020, "slot": 1, "q_no": 21, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Trains crossing moving people", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two people walk alongside a railway track in the same direction at 2 km/hr and 4 km/hr. A train approaching from behind passes them in 90 seconds and 100 seconds respectively. How many seconds, to the nearest whole number, will the train take to pass an electric pole?", "options": ["87", "82", "78", "75"], "answer": "82", "answer_note": "", "concept": "When a train overtakes a walker, it covers its own length at the relative speed; equating the train length from both cases gives the train's speed.", "formulas": ["Time to pass = length / relative speed", "Same direction: relative speed = s − v"], "solution": ["1. Let the train's speed be s km/hr and length L. Then L = (s − 2) × 90 = (s − 4) × 100 (in km/hr × s units).", "2. 90s − 180 = 100s − 400, so s = 22 km/hr.", "3. L = 20 × 90 = 1800 (km/hr·s), i.e. 1800/3600 km = 0.5 km.", "4. Time to pass a pole = L/s = 1800/22 ≈ 81.8 s ≈ 82 s."], "shortcut": "", "source_url": "https://cracku.in/71-two-persons-are-walking-beside-a-railway-track-at--x-cat-2020-slot-1"}, {"id": "2020-S1-Q22", "year": 2020, "slot": 1, "q_no": 22, "area": "Number System", "topic": "Number System", "subtopic": "Factors – minimising a sum", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "a, b and c are positive integers with ab = 432, bc = 96 and c < 9. What is the smallest possible value of a + b + c?", "options": ["49", "56", "59", "46"], "answer": "46", "answer_note": "", "concept": "b must divide both 432 and 96; with c fixed below 9, list the allowed values of c and pick the one that keeps a + b smallest.", "formulas": ["b | gcd(432, 96) = 48", "a = 432/b, b = 96/c"], "solution": ["1. a/c = 432/96 = 9/2, so a = 9c/2 and c must be even: c ∈ {2, 4, 6, 8}.", "2. c = 2: b = 48, a = 9 → sum 59. c = 4: b = 24, a = 18 → sum 46.", "3. c = 6: b = 16, a = 27 → sum 49. c = 8: b = 12, a = 36 → sum 56.", "4. Smallest a + b + c = 46."], "shortcut": "The other three options (49, 56, 59) are the sums for the other values of c, so it comes down to checking all four.", "source_url": "https://cracku.in/72-if-a-b-and-c-are-positive-integers-such-that-ab-43-x-cat-2020-slot-1"}, {"id": "2020-S1-Q23", "year": 2020, "slot": 1, "q_no": 23, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – two-way classification", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a group, 28% of the members are young and the remainder are old. 65% of the members are literate, and 25% of the literate members are young. Approximately what percentage of the illiterate members are old?", "options": ["62", "55", "59", "66"], "answer": "66", "answer_note": "", "concept": "Build a 2 × 2 table (young/old × literate/illiterate) on a base of 100 members.", "formulas": ["Part = percentage × whole"], "solution": ["1. Take 100 members: 28 young, 72 old; 65 literate, 35 illiterate.", "2. Young literates = 25% of 65 = 16.25.", "3. Young illiterates = 28 − 16.25 = 11.75.", "4. Old illiterates = 35 − 11.75 = 23.25.", "5. Percentage = 23.25/35 × 100 ≈ 66.4% ≈ 66."], "shortcut": "", "source_url": "https://cracku.in/73-in-a-group-of-people-28-of-the-members-are-young-w-x-cat-2020-slot-1"}, {"id": "2020-S1-Q24", "year": 2020, "slot": 1, "q_no": 24, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest – equal balances", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Veeru invests Rs 10000 at 5% simple interest per year. Exactly two years later, Joy invests Rs 8000 at 10% simple interest per year. How many years after Veeru's investment will both their balances (principal plus interest) be equal?", "options": [], "answer": "12", "answer_note": "", "concept": "Write each balance as principal plus simple interest for the time each has been invested and set them equal.", "formulas": ["Amount = P(1 + rt/100)"], "solution": ["1. Let t be years since Veeru invested; Joy's money has been invested for t − 2 years.", "2. Veeru: 10000 + 500t. Joy: 8000 + 800(t − 2) = 6400 + 800t.", "3. 10000 + 500t = 6400 + 800t → 300t = 3600.", "4. t = 12 years."], "shortcut": "", "source_url": "https://cracku.in/74-veeru-invested-rs-10000-at-5-simple-annual-interes-x-cat-2020-slot-1"}, {"id": "2020-S1-Q25", "year": 2020, "slot": 1, "q_no": 25, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Symmetric functions – sum of roots", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A function f satisfies f(5 + x) = f(5 − x) for every real x, and f(x) = 0 has exactly four distinct real roots. What is the sum of these roots?", "options": ["0", "40", "10", "20"], "answer": "20", "answer_note": "", "concept": "The condition means the graph of f is symmetric about the line x = 5, so roots occur in pairs equally spaced on either side of 5.", "formulas": ["f(a + x) = f(a − x) ⇒ symmetry about x = a"], "solution": ["1. If 5 + k is a root, then f(5 − k) = f(5 + k) = 0, so 5 − k is also a root.", "2. Each such pair sums to 10.", "3. x = 5 itself would be an unpaired root, but then the total number of roots would be odd; with four distinct roots, they form two pairs.", "4. Sum = 2 × 10 = 20."], "shortcut": "Try f(x) = (x − 3)(x − 7)(x − 1)(x − 9): roots sum to 20.", "source_url": "https://cracku.in/75-if-f5xf5-x-for-every-real-x-and-fx0-has-four-disti-x-cat-2020-slot-1"}, {"id": "2020-S1-Q26", "year": 2020, "slot": 1, "q_no": 26, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Linear equations in positive integers", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A, B and C are positive integers. A plus the average of B and C equals 5, and B plus the average of A and C equals 7. Find A + B.", "options": ["5", "4", "6", "7"], "answer": "6", "answer_note": "", "concept": "Turn the conditions into two linear equations; subtracting them and using positivity pins down the unique integer solution.", "formulas": ["Mean of two numbers = (p + q)/2"], "solution": ["1. 2A + B + C = 10 and A + 2B + C = 14.", "2. Subtracting: B − A = 4, so B = A + 4.", "3. Substituting: 2A + A + 4 + C = 10 → 3A + C = 6; with A, C positive integers, A = 1, C = 3.", "4. Then B = 5, so A + B = 6."], "shortcut": "", "source_url": "https://cracku.in/76-let-a-b-and-c-be-three-positive-integers-such-that-x-cat-2020-slot-1"}, {"id": "2020-S2-Q01", "year": 2020, "slot": 2, "q_no": 1, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Average speed over two legs", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Points A, B, C lie on a route with BC = 3 × AB. Two trains both go from A to C via B. On the A→B stretch, train 2 moves at twice the speed of train 1; on the B→C stretch the two speeds are interchanged. What is (time taken by train 1 for A→C) : (time taken by train 2 for A→C)?", "options": ["5:7", "4:1", "1:4", "7:5"], "answer": "5:7", "answer_note": "", "concept": "Total time is the sum of leg times; assign convenient values to distance and speed and compare.", "formulas": ["Time = Distance ÷ Speed"], "solution": ["1. Let AB = 1 and BC = 3; let train 1's speed on A→B be v, so train 2's is 2v there.", "2. On B→C the speeds swap: train 1 runs at 2v, train 2 at v.", "3. Train 1 time = 1/v + 3/(2v) = 5/(2v).", "4. Train 2 time = 1/(2v) + 3/v = 7/(2v).", "5. Ratio = 5 : 7."], "shortcut": "Train 1 is faster on the longer leg, so its time must be smaller – only 5:7 or 1:4 fit, and 1:4 is too extreme.", "source_url": "https://cracku.in/51-the-distance-from-b-to-c-is-thrice-that-from-a-to--x-cat-2020-slot-2"}, {"id": "2020-S2-Q02", "year": 2020, "slot": 2, "q_no": 2, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – three workers", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Working alone, John needs twice as many days as Jack to finish a job. Jack and Jim working together need one-third of John's solo time. John alone needs 3 days more than all three of them working together. In how many days would Jim finish the job alone?", "options": [], "answer": "4", "answer_note": "", "concept": "Convert each statement to work rates (fraction of job per day) and solve for one unknown.", "formulas": ["Rate = 1 ÷ time", "Combined rate = sum of individual rates"], "solution": ["1. Let Jack take j days; John takes 2j days.", "2. Jack + Jim take 2j/3 days, so Jim's rate = 3/(2j) − 1/j = 1/(2j); Jim alone takes 2j days.", "3. All three together: rate = 1/(2j) + 1/j + 1/(2j) = 2/j, so time = j/2 days.", "4. John's time is 3 more: 2j = j/2 + 3 ⇒ j = 2.", "5. Jim alone takes 2j = 4 days."], "shortcut": "", "source_url": "https://cracku.in/52-john-takes-twice-as-much-time-as-jack-to-finish-a--x-cat-2020-slot-2"}, {"id": "2020-S2-Q03", "year": 2020, "slot": 2, "q_no": 3, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Quadratic – non-negativity (discriminant)", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let f(x) = x² + ax + b and define g(x) = f(x + 1) − f(x − 1). Given that f(x) ≥ 0 for every real x and that g(20) = 72, find the least possible value of b.", "options": ["16", "4", "1", "0"], "answer": "4", "answer_note": "", "concept": "g(x) simplifies to a linear expression that fixes a; non-negativity of a quadratic needs discriminant ≤ 0, giving a lower bound on b.", "formulas": ["f(x+1) − f(x−1) = 4x + 2a for f = x² + ax + b", "x² + ax + b ≥ 0 ∀x ⇔ a² − 4b ≤ 0"], "solution": ["1. f(x+1) − f(x−1) = [(x+1)² − (x−1)²] + a[(x+1) − (x−1)] = 4x + 2a.", "2. g(20) = 80 + 2a = 72 ⇒ a = −4.", "3. f(x) = x² − 4x + b ≥ 0 for all x requires discriminant 16 − 4b ≤ 0.", "4. So b ≥ 4; the least value is 4."], "shortcut": "", "source_url": "https://cracku.in/53-let-fxx2axb-and-gxfx1-fx-1-if-fxgeq0-for-all-real--x-cat-2020-slot-2"}, {"id": "2020-S2-Q04", "year": 2020, "slot": 2, "q_no": 4, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "CI vs SI difference", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "On the same principal, the compound interest earned in 2 years at 5% per annum is Rs 1125 more than the simple interest earned in 3 years at 3% per annum. Find the principal in rupees.", "options": [], "answer": "90000", "answer_note": "", "concept": "Express both interests as fractions of the principal and equate their difference to the given amount.", "formulas": ["CI = P[(1 + r/100)ⁿ − 1]", "SI = P × r × t / 100"], "solution": ["1. CI for 2 years at 5% = P(1.05² − 1) = 0.1025P.", "2. SI for 3 years at 3% = 0.09P.", "3. Difference = 0.0125P = 1125.", "4. P = 1125 ÷ 0.0125 = 90000."], "shortcut": "0.0125 = 1/80, so P = 1125 × 80 = 90000.", "source_url": "https://cracku.in/54-for-the-same-principal-amount-the-compound-interes-x-cat-2020-slot-2"}, {"id": "2020-S2-Q05", "year": 2020, "slot": 2, "q_no": 5, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – chord length via coordinate geometry", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A circle C has centre O and radius 5 m. Point A is 4 m due north of O and point B is 3 m due east of O. A chord PQ of C passes through both A and B. Which option is closest to is the length of PQ in metres?", "options": ["8.8", "7.8", "6.6", "7.2"], "answer": "8.8", "answer_note": "", "concept": "Place O at the origin; the chord lies on line AB, so its length follows from the perpendicular distance of O from that line.", "formulas": ["Chord length = 2√(r² − d²)", "Distance of origin from line px + qy = c is |c|/√(p² + q²)"], "solution": ["1. Take O = (0,0), A = (0,4), B = (3,0).", "2. Line AB: x/3 + y/4 = 1, i.e. 4x + 3y = 12.", "3. Distance of O from AB = 12/√(16 + 9) = 12/5 = 2.4 m (this is the altitude from O in right triangle OAB).", "4. PQ = 2√(25 − 5.76) = 2√19.24 ≈ 2 × 4.386 ≈ 8.77 m.", "5. Nearest option: 8.8 m."], "shortcut": "", "source_url": "https://cracku.in/55-let-c-be-a-circle-of-radius-5-meters-having-center-x-cat-2020-slot-2"}, {"id": "2020-S2-Q06", "year": 2020, "slot": 2, "q_no": 6, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Races – beating margins", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a car race, A finishes 45 km ahead of B, B finishes 50 km ahead of C, and A finishes 90 km ahead of C. What is the length of the race in km?", "options": ["475", "450", "500", "550"], "answer": "450", "answer_note": "", "concept": "Speed ratios from 'beats by' statements multiply: (A:B) × (B:C) = (A:C).", "formulas": ["If A beats B by x in a race of D, then speed B/A = (D − x)/D"], "solution": ["1. Let the race length be D km.", "2. B/A = (D − 45)/D, C/B = (D − 50)/D, C/A = (D − 90)/D.", "3. (D − 45)(D − 50)/D² = (D − 90)/D ⇒ (D − 45)(D − 50) = D(D − 90).", "4. D² − 95D + 2250 = D² − 90D ⇒ 5D = 2250 ⇒ D = 450."], "shortcut": "Test options: D = 450 gives 405/450 × 400/450 = 360/450 ✓.", "source_url": "https://cracku.in/56-in-a-car-race-car-a-beats-car-b-by-45-km-car-b-bea-x-cat-2020-slot-2"}, {"id": "2020-S2-Q07", "year": 2020, "slot": 2, "q_no": 7, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Arrangements with order condition", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "How many 4-digit numbers greater than 1000 have four distinct digits and contain both 7 and 3, with the digit 7 occurring somewhere to the left of the digit 3?", "options": [], "answer": "315", "answer_note": "", "concept": "Count numbers with distinct digits containing both 7 and 3 (taking care of a leading zero), then use symmetry: half have 7 before 3.", "formulas": ["Symmetry: #(7 before 3) = #(3 before 7)", "Choose and arrange: C(n,r) × r!"], "solution": ["1. Pick the two other digits from the remaining 8 digits {0,1,2,4,5,6,8,9}.", "2. Without 0: C(7,2) = 21 choices, each giving 4! = 24 arrangements ⇒ 504.", "3. With 0 and one other digit: 7 choices; arrangements with 0 not first = 24 − 6 = 18 ⇒ 126.", "4. Total with 7 and 3, distinct digits = 504 + 126 = 630.", "5. Swapping 7 and 3 is a bijection, so exactly half have 7 before 3: 630/2 = 315."], "shortcut": "", "source_url": "https://cracku.in/57-how-many-4-digit-numbers-each-greater-than-1000-an-x-cat-2020-slot-2"}, {"id": "2020-S2-Q08", "year": 2020, "slot": 2, "q_no": 8, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – triangle & rectangle areas", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "An equilateral triangle and a rectangle together have perimeters adding up to 90 cm. Let T be the triangle's area and R the rectangle's area (in sq cm). If R = T² and the rectangle's sides are in the ratio 1 : 3, find the longer side of the rectangle in cm.", "options": ["27", "21", "24", "18"], "answer": "27", "answer_note": "", "concept": "Write both areas in terms of their sides, use R = T² to link the sides, then apply the perimeter condition.", "formulas": ["Area of equilateral triangle = (√3/4)a²", "Rectangle with sides x, 3x: area 3x², perimeter 8x"], "solution": ["1. Triangle side a: T = (√3/4)a², so T² = 3a⁴/16.", "2. Rectangle sides x and 3x: R = 3x².", "3. 3x² = 3a⁴/16 ⇒ x = a²/4.", "4. Perimeters: 3a + 8x = 90 ⇒ 3a + 2a² = 90 ⇒ 2a² + 3a − 90 = 0 ⇒ a = 6.", "5. x = 36/4 = 9, so the longer side = 3x = 27 cm."], "shortcut": "", "source_url": "https://cracku.in/58-the-sum-of-the-perimeters-of-an-equilateral-triang-x-cat-2020-slot-2"}, {"id": "2020-S2-Q09", "year": 2020, "slot": 2, "q_no": 9, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – combining ratios", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Some money is shared among Amal, Sunil and Mita such that Amal : Sunil = 3 : 2 and Sunil : Mita = 4 : 5. The largest share exceeds the smallest share by Rs 400. How much (in Rs) does Sunil get?", "options": [], "answer": "800", "answer_note": "", "concept": "Make Sunil's term common to merge the two ratios, then scale using the given difference.", "formulas": ["a:b and b:c combine by equalising b"], "solution": ["1. Amal : Sunil = 3 : 2 = 6 : 4; Sunil : Mita = 4 : 5.", "2. Amal : Sunil : Mita = 6 : 4 : 5.", "3. Largest (Amal, 6) − smallest (Sunil, 4) = 2 parts = Rs 400 ⇒ 1 part = Rs 200.", "4. Sunil's share = 4 × 200 = Rs 800."], "shortcut": "", "source_url": "https://cracku.in/59-a-sum-of-money-is-split-among-amal-sunil-and-mita--x-cat-2020-slot-2"}, {"id": "2020-S2-Q10", "year": 2020, "slot": 2, "q_no": 10, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log properties – range of expression", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For real numbers a, b with 1 < a ≤ b, which of the following can NOT be a value of logₐ(a/b) + log_b(b/a)?", "options": ["0", "-1", "1", "-0.5"], "answer": "1", "answer_note": "", "concept": "Reduce the expression to 2 − (t + 1/t) with t = logₐ b ≥ 1; by AM–GM, t + 1/t ≥ 2, so the expression is never positive.", "formulas": ["logₐ(a/b) = 1 − logₐ b", "log_b a = 1/logₐ b", "t + 1/t ≥ 2 for t > 0"], "solution": ["1. Let t = logₐ b. Since 1 < a ≤ b, t ≥ 1.", "2. logₐ(a/b) = 1 − t and log_b(b/a) = 1 − 1/t.", "3. Sum = 2 − (t + 1/t).", "4. t + 1/t ≥ 2, so the sum ≤ 0 (equal to 0 at a = b), and it takes every value ≤ 0 (e.g. t = 2 gives −0.5).", "5. Hence the expression can never equal 1."], "shortcut": "", "source_url": "https://cracku.in/60-the-value-of-logafracablogbfracba-for-1ltaleq-b-ca-x-cat-2020-slot-2"}, {"id": "2020-S2-Q11", "year": 2020, "slot": 2, "q_no": 11, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Venn diagram – minimising a set", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In a college, each student must take at least two of the three subjects Chemistry, Mathematics and Physics. 18 students take all three, 23 take Mathematics and 25 take Physics. What is the least possible number of students taking Chemistry?", "options": ["22", "21", "20", "19"], "answer": "20", "answer_note": "", "concept": "Since nobody takes exactly one subject, every region is either 'exactly two' or 'all three'; fix the regions from the given totals and minimise the free one.", "formulas": ["n(M) = only(M∩P) + only(M∩C) + all three (when no one takes a single subject)"], "solution": ["1. Let x = only M&P, y = only M&C, z = only P&C (no single-subject regions).", "2. Maths: x + y + 18 = 23 ⇒ x + y = 5. Physics: x + z + 18 = 25 ⇒ x + z = 7.", "3. Chemistry = y + z + 18 = (5 − x) + (7 − x) + 18 = 30 − 2x.", "4. x ≤ 5 (since y ≥ 0), so minimum at x = 5: Chemistry = 20."], "shortcut": "", "source_url": "https://cracku.in/61-students-in-a-college-have-to-choose-at-least-two--x-cat-2020-slot-2"}, {"id": "2020-S2-Q12", "year": 2020, "slot": 2, "q_no": 12, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – extreme values", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Ten students take a test. The average of the 9 lowest scores is 42 and the average of the 9 highest scores is 47. By how much does the largest possible average of all 10 scores exceed the smallest possible average?", "options": ["5", "4", "3", "6"], "answer": "4", "answer_note": "", "concept": "The two groups of nine share the middle eight scores, so the top score is 45 more than the bottom score; the total then depends only on one variable whose range is limited by the ordering.", "formulas": ["Total of 10 = (sum of lowest 9) + top score", "Top − bottom = 9 × (47 − 42) = 45"], "solution": ["1. Let scores be a₁ ≤ a₂ ≤ … ≤ a₁₀. a₁ + M = 378 and M + a₁₀ = 423 where M = a₂ + … + a₉, so a₁₀ = a₁ + 45.", "2. Total = 378 + a₁₀ = 423 + a₁; the mean depends only on a₁.", "3. Max a₁: all of a₁…a₉ equal 42 (a₁ ≤ mean of lowest 9). Then a₁₀ = 87, total = 465, mean = 46.5.", "4. Min a₁: a₂…a₁₀ all equal 47 (a
