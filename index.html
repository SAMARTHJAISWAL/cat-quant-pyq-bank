TA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A container holds 40 litres of pure milk. Each operation removes 4 litres of the liquid and puts in 4 litres of water. What is the least number of operations after which the container holds less milk than water?", "options": [], "answer": "7", "answer_note": "", "concept": "After each replacement the milk is multiplied by (1 − removed/total); milk < water means milk < half the total.", "formulas": ["Milk after n operations = 40 × (1 − 4/40)ⁿ = 40 × 0.9ⁿ"], "solution": ["1. Need 40 × 0.9ⁿ < 20, i.e. 0.9ⁿ < 0.5.", "2. 0.9⁶ ≈ 0.531 > 0.5.", "3. 0.9⁷ ≈ 0.478 < 0.5.", "4. Least n = 7."], "shortcut": "0.9² = 0.81, 0.9⁴ ≈ 0.656, 0.9⁶ ≈ 0.531, 0.9⁷ ≈ 0.478.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-14.shtml"}, {"id": "2023-S2-Q15", "year": 2023, "slot": 2, "q_no": 15, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Markup & discount – integer counts", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Jayant buys some white shirts at Rs 1000 each and some blue shirts at Rs 1125 each. Every shirt is marked at 25% above the average cost per shirt, then all are sold at 10% off the marked price, yielding a total profit of Rs 51000. If he bought at least one shirt of each colour, find the greatest possible total number of shirts.", "options": [], "answer": "407", "answer_note": "", "concept": "A uniform markup and discount on average cost gives a fixed profit % on total cost, leading to a linear Diophantine equation in the two counts.", "formulas": ["Selling price = 1.25 × 0.9 × cost = 1.125 × cost", "Profit = 12.5% of total cost"], "solution": ["1. Each shirt sells at 1.125 × average cost, so profit = 0.125 × total cost = 51000 ⇒ total cost = 4,08,000.", "2. With w white and b blue: 1000w + 1125b = 408000 ⇒ 8w + 9b = 3264.", "3. To maximise w + b, use as many cheaper shirts as possible, i.e. minimise b.", "4. 8w + 9b = 3264 with 3264 divisible by 8 ⇒ b must be a multiple of 8; b ≥ 1 ⇒ b = 8.", "5. Then w = (3264 − 72)/8 = 399, total = 399 + 8 = 407."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-15.shtml"}, {"id": "2023-S2-Q16", "year": 2023, "slot": 2, "q_no": 16, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Linear inequality – distribution", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A sum of money shared equally among n people gives each Rs 352. If instead two of them get Rs 506 each and the rest is shared equally among the remaining people, each of those gets at most Rs 330. Find the greatest possible n.", "options": [], "answer": "16", "answer_note": "", "concept": "Express the total as 352n and set up an inequality for the equal share of the remaining n − 2 people.", "formulas": ["Share = (Total − 2 × 506) ÷ (n − 2)"], "solution": ["1. Total = 352n.", "2. Remaining share: (352n − 1012)/(n − 2) ≤ 330.", "3. 352n − 1012 ≤ 330n − 660 ⇒ 22n ≤ 352 ⇒ n ≤ 16.", "4. Maximum n = 16 (each of the other 14 gets exactly 330)."], "shortcut": "Each of the two gets 154 extra = 308 total, taken from n − 2 people at ≥ 22 each ⇒ n − 2 ≤ 14.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-16.shtml"}, {"id": "2023-S2-Q17", "year": 2023, "slot": 2, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rectangle – areas in GP", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Rectangle ABCD has AB = 9 cm and BC = 6 cm. Points P and Q lie on BC so that the areas of triangle ABP, triangle APQ and quadrilateral AQCD are in geometric progression, and the area of AQCD is 4 times that of ABP. Find BP : PQ : QC.", "options": ["1 : 1 : 2", "1 : 2 : 4", "2 : 4 : 1", "1 : 2 : 1"], "answer": "2 : 4 : 1", "answer_note": "", "concept": "The three regions tile the rectangle; GP with third term = 4 × first gives ratio 2, and triangle areas with apex A give lengths on BC.", "formulas": ["Area of triangle = ½ × base × height", "GP: t, tr, tr²"], "solution": ["1. tr² = 4t ⇒ r = 2, so the areas are t, 2t, 4t with t + 2t + 4t = 54 ⇒ t = 54/7.", "2. Area ABP = ½ × 9 × BP = 54/7 ⇒ BP = 12/7.", "3. Area APQ = ½ × 9 × PQ = 108/7 ⇒ PQ = 24/7 (height from A to BC is AB = 9).", "4. QC = 6 − 12/7 − 24/7 = 6/7.", "5. BP : PQ : QC = 12 : 24 : 6 = 2 : 4 : 1."], "shortcut": "Triangles ABP and APQ share height 9, so BP : PQ = 1 : 2; and QC must be small because AQCD already contains triangle ACD of area 27 out of 4t ≈ 30.9 — only 2 : 4 : 1 fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-17.shtml"}, {"id": "2023-S2-Q18", "year": 2023, "slot": 2, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – triangle on a diameter", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A triangle is inscribed in a circle C of radius r, with one side being a diameter of C. The other two sides are in the ratio a : b. Find the triangle's area.", "options": ["abr² / (2(a² + b²))", "abr² / (a² + b²)", "4abr² / (a² + b²)", "2abr² / (a² + b²)"], "answer": "2abr² / (a² + b²)", "answer_note": "", "concept": "An angle subtended by a diameter is a right angle, so the triangle is right-angled with hypotenuse 2r.", "formulas": ["Angle in a semicircle = 90°", "Pythagoras: (ak)² + (bk)² = (2r)²"], "solution": ["1. The triangle is right-angled with hypotenuse 2r; let the legs be ak and bk.", "2. a²k² + b²k² = 4r² ⇒ k² = 4r²/(a² + b²).", "3. Area = ½ × ak × bk = ½ab × 4r²/(a² + b²) = 2abr²/(a² + b²)."], "shortcut": "Check a = b = 1: isosceles right triangle with hypotenuse 2r has area r²; only 2abr²/(a² + b²) gives r².", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-18.shtml"}, {"id": "2023-S2-Q19", "year": 2023, "slot": 2, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – modulus lines", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the area of the quadrilateral enclosed by the y-axis, the line x = 5 and the graph of |x − y| − |x − 5| = 2.", "options": [], "answer": "45", "answer_note": "", "concept": "Between x = 0 and x = 5 the |x − 5| term is fixed in sign, so the modulus equation splits into two straight lines; the region is a trapezium.", "formulas": ["|u| = c ⇒ u = ±c", "Trapezium area = ½ × (sum of parallel sides) × distance between them"], "solution": ["1. For 0 ≤ x ≤ 5, |x − 5| = 5 − x, so |x − y| = 7 − x.", "2. Hence y = x + (7 − x) = 7 or y = x − (7 − x) = 2x − 7.", "3. At x = 0 the vertical gap is 7 − (−7) = 14; at x = 5 it is 7 − 3 = 4.", "4. Area = ½ × (14 + 4) × 5 = 45."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-19.shtml"}, {"id": "2023-S2-Q20", "year": 2023, "slot": 2, "q_no": 20, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Arithmetic progressions – prime common differences", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two arithmetic progressions a₁, a₂, a₃, … and b₁, b₂, b₃, … have common differences that are both primes. Given a₅ = b₉, a₁₉ = b₁₉ and b₂ = 0, find a₁₁.", "options": ["79", "83", "86", "84"], "answer": "79", "answer_note": "", "concept": "Subtracting the two equal-term conditions relates the common differences; primality then fixes them.", "formulas": ["aₙ = a₁ + (n − 1)d"], "solution": ["1. Let the differences be p (for a) and q (for b).", "2. a₁₉ − a₅ = b₁₉ − b₉ ⇒ 14p = 10q ⇒ 7p = 5q.", "3. Both prime ⇒ p = 5, q = 7.", "4. b₂ = 0 ⇒ b₁ = −7, so b₉ = −7 + 56 = 49 = a₅.", "5. a₁₁ = a₅ + 6p = 49 + 30 = 79."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-20.shtml"}, {"id": "2023-S2-Q21", "year": 2023, "slot": 2, "q_no": 21, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Algebraic identities – symmetric expressions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Real numbers p and q satisfy p² + q² − 29 = 2pq − 20 = 52 − 2pq. Find the difference between the greatest and least possible values of p³ − q³.", "options": ["486", "189", "378", "243"], "answer": "378", "answer_note": "", "concept": "The chained equalities give pq and p² + q²; then p − q is fixed up to sign and p³ − q³ factorises.", "formulas": ["p³ − q³ = (p − q)(p² + pq + q²)", "(p − q)² = p² + q² − 2pq"], "solution": ["1. 2pq − 20 = 52 − 2pq ⇒ 4pq = 72 ⇒ pq = 18.", "2. p² + q² − 29 = 36 − 20 = 16 ⇒ p² + q² = 45.", "3. (p − q)² = 45 − 36 = 9 ⇒ p − q = ±3.", "4. p³ − q³ = (p − q)(45 + 18) = ±3 × 63 = ±189.", "5. Difference = 189 − (−189) = 378."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-21.shtml"}, {"id": "2023-S2-Q22", "year": 2023, "slot": 2, "q_no": 22, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Common terms of two APs", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Sequences are defined by aₙ = 13 + 6(n − 1) and bₙ = 15 + 7(n − 1) for every natural number n. What is the largest three-digit number that appears in both sequences?", "options": [], "answer": "967", "answer_note": "", "concept": "Common terms of two APs form an AP whose common difference is the LCM of the two differences, starting at the first common term.", "formulas": ["Common difference of common terms = LCM(d₁, d₂)"], "solution": ["1. a: 13, 19, 25, 31, 37, 43, …; b: 15, 22, 29, 36, 43, … ⇒ first common term 43.", "2. Common terms: 43 + 42k (LCM(6, 7) = 42).", "3. 43 + 42k ≤ 999 ⇒ k ≤ 22.76 ⇒ k = 22.", "4. Largest three-digit common term = 43 + 924 = 967."], "shortcut": "Common terms ≡ 1 (mod 6) and ≡ 1 (mod 7) ⇒ ≡ 1 (mod 42) and ≥ 43; 967 = 42 × 23 + 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-22.shtml"}, {"id": "2023-S3-Q01", "year": 2023, "slot": 3, "q_no": 1, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Algebraic identities – x + 1/x powers", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "x is a positive real number with x⁸ + 1/x⁸ = 47. Find the value of x⁹ + 1/x⁹.", "options": ["40√5", "30√5", "36√5", "34√5"], "answer": "34√5", "answer_note": "", "concept": "Repeatedly step down from x⁸ + 1/x⁸ to x + 1/x using the square identity, then build up to the 9th power.", "formulas": ["(x^k + 1/x^k)² = x^(2k) + 1/x^(2k) + 2", "(x + 1/x)³ = x³ + 1/x³ + 3(x + 1/x)", "x⁹ + 1/x⁹ = (x³ + 1/x³)³ − 3(x³ + 1/x³)"], "solution": ["1. x⁴ + 1/x⁴ = √(47 + 2) = 7.", "2. x² + 1/x² = √(7 + 2) = 3.", "3. x + 1/x = √(3 + 2) = √5 (positive since x > 0).", "4. x³ + 1/x³ = (√5)³ − 3√5 = 5√5 − 3√5 = 2√5.", "5. x⁹ + 1/x⁹ = (2√5)³ − 3(2√5) = 40√5 − 6√5 = 34√5."], "shortcut": "Once x³ + 1/x³ = 2√5, cubing gives 40√5 minus something positive, which rules out 40√5 immediately.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-4.shtml"}, {"id": "2023-S3-Q02", "year": 2023, "slot": 3, "q_no": 2, "area": "Number System", "topic": "Number System", "subtopic": "Powers of 2 – counting exponents", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "n and m are positive integers such that exactly 41 integers that are powers of 2 lie strictly between 8^m and 8^n. What is the least possible value of n + m?", "options": ["42", "44", "14", "16"], "answer": "16", "answer_note": "", "concept": "Convert both bounds to powers of 2 and count the integer exponents lying strictly between them.", "formulas": ["8^k = 2^(3k)", "Number of integers strictly between p and q (p < q) = q − p − 1"], "solution": ["1. 8^m = 2^(3m) and 8^n = 2^(3n); take n > m.", "2. Powers of 2 strictly between them are 2^(3m+1), …, 2^(3n−1): that is 3n − 3m − 1 numbers.", "3. 3(n − m) − 1 = 41 ⇒ n − m = 14.", "4. To minimise n + m take the smallest positive m = 1, so n = 15.", "5. n + m = 16."], "shortcut": "n − m = 14 forces n + m = 2m + 14 ≥ 16; 14 is impossible since m ≥ 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-2.shtml"}, {"id": "2023-S3-Q03", "year": 2023, "slot": 3, "q_no": 3, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "System of equations – infinitely many solutions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For real numbers a and b, the system x + y = 4 and (a + 5)x + (b² − 15)y = 8b has infinitely many solutions in x and y. What is the greatest possible value of ab?", "options": ["33", "25", "15", "55"], "answer": "33", "answer_note": "", "concept": "Two linear equations have infinitely many solutions only when one is a constant multiple of the other, i.e. all coefficient ratios are equal.", "formulas": ["a₁/a₂ = b₁/b₂ = c₁/c₂ for infinitely many solutions"], "solution": ["1. Ratios: (a + 5)/1 = (b² − 15)/1 = 8b/4 = 2b.", "2. From b² − 15 = 2b: b² − 2b − 15 = 0 ⇒ (b − 5)(b + 3) = 0 ⇒ b = 5 or b = −3.", "3. a = 2b − 5: b = 5 gives a = 5, ab = 25; b = −3 gives a = −11, ab = 33.", "4. Maximum ab = 33."], "shortcut": "Don't stop at the positive root – the negative root gives a larger product here.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-3.shtml"}, {"id": "2023-S3-Q04", "year": 2023, "slot": 3, "q_no": 4, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms in an AP", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For a real number x, the numbers 1/2, (log₃(2ˣ − 9))/(log₃ 4) and (log₅(2ˣ + 17/2))/(log₅ 4) are in arithmetic progression in that order. What is the common difference?", "options": ["log₄ 7", "log₄(3/2)", "log₄(7/2)", "log₄(23/2)"], "answer": "log₄(7/2)", "answer_note": "", "concept": "Use change of base to rewrite all three terms as logarithms to base 4, then apply the AP middle-term condition.", "formulas": ["logₐ N / logₐ b = log_b N", "For an AP p, q, r: 2q = p + r", "k·log M = log M^k"], "solution": ["1. Change of base: terms are 1/2 = log₄ 2, log₄(2ˣ − 9) and log₄(2ˣ + 17/2).", "2. AP condition: 2 log₄(2ˣ − 9) = log₄ 2 + log₄(2ˣ + 17/2) ⇒ (2ˣ − 9)² = 2(2ˣ) + 17.", "3. Let t = 2ˣ: t² − 18t + 81 = 2t + 17 ⇒ t² − 20t + 64 = 0 ⇒ t = 16 or t = 4.", "4. Need t > 9 for the log to exist, so t = 16 (x = 4).", "5. Terms: log₄ 2, log₄ 7, log₄ 24.5. Common difference = log₄ 7 − log₄ 2 = log₄(7/2)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-1.shtml"}, {"id": "2023-S3-Q05", "year": 2023, "slot": 3, "q_no": 5, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential inequalities", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "n is any natural number satisfying 5^(n−1) < 3^(n+1). Find the least integer m such that 3^(n+1) < 2^(n+m) holds for every such n.", "options": [], "answer": "5", "answer_note": "", "concept": "First find the finite set of n allowed by the first inequality, then find m that works for the hardest (largest) n.", "formulas": ["Compare growth: (5/3)^(n−1) < 9", "2^m > 3^(n+1)/2^n = 3·(3/2)^n"], "solution": ["1. 5^(n−1) < 3^(n+1) ⇔ (5/3)^(n−1) < 9. Powers of 5/3: 1, 1.67, 2.78, 4.63, 7.72, 12.86 … so n − 1 ≤ 4, i.e. n = 1 to 5.", "2. Second inequality ⇔ 2^m > 3·(3/2)^n, which grows with n, so n = 5 is the binding case.", "3. For n = 5: 3⁶ = 729 < 2^(5+m) ⇒ 2^(5+m) > 729 ⇒ 5 + m ≥ 10.", "4. Least m = 5 (2¹⁰ = 1024 > 729, while 2⁹ = 512 < 729)."], "shortcut": "Just check n = 5: 729 must be below 2^(5+m), the next power of two is 1024 = 2¹⁰.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-7.shtml"}, {"id": "2023-S3-Q06", "year": 2023, "slot": 3, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Number of factors", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the sum of the two smallest natural numbers that each have exactly 15 factors (counting 1 and the number itself).", "options": [], "answer": "468", "answer_note": "", "concept": "The factor count of p^a·q^b·… is (a+1)(b+1)…; 15 = 15 or 3 × 5 restricts the possible prime forms.", "formulas": ["Number of factors of p^a q^b = (a + 1)(b + 1)", "15 = 15 × 1 = 5 × 3"], "solution": ["1. 15 factors ⇒ form p¹⁴ or p⁴q².", "2. p¹⁴ is at least 2¹⁴ = 16384, too large.", "3. p⁴q² candidates: 2⁴·3² = 144, 3⁴·2² = 324, 2⁴·5² = 400, …", "4. Two smallest are 144 and 324; sum = 468."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-6.shtml"}, {"id": "2023-S3-Q07", "year": 2023, "slot": 3, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Roots – symmetric functions", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The equation x² + bx + c = 0 has two real roots. The reciprocals of the roots differ by 1/3, and the sum of the squares of the reciprocals of the roots is 5/9. Find the largest possible value of b + c.", "options": [], "answer": "9", "answer_note": "", "concept": "Work with u = 1/α and v = 1/β; find u, v from their difference and sum of squares, then recover the roots and b, c via Vieta.", "formulas": ["α + β = −b, αβ = c", "(u − v)² + (u + v)² = 2(u² + v²)"], "solution": ["1. Let u = 1/α, v = 1/β with u − v = 1/3 and u² + v² = 5/9.", "2. 2uv = (u² + v²) − (u − v)² = 5/9 − 1/9 = 4/9 ⇒ uv = 2/9; (u + v)² = 5/9 + 4/9 = 1 ⇒ u + v = ±1.", "3. u + v = 1: u = 2/3, v = 1/3 ⇒ roots 3/2 and 3 ⇒ b = −9/2, c = 9/2, b + c = 0.", "4. u + v = −1: u = −1/3, v = −2/3 ⇒ roots −3 and −3/2 ⇒ b = 9/2, c = 9/2, b + c = 9.", "5. Largest b + c = 9."], "shortcut": "c = αβ = 1/(uv) = 9/2 in both cases; b + c is largest when b = −(α+β) is positive, i.e. both roots negative.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-5.shtml"}, {"id": "2023-S3-Q08", "year": 2023, "slot": 3, "q_no": 8, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Faulty measures with discount", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A merchant buys cloth at Rs. 100 per metre and gets 5 cm extra free for every 100 cm he pays for. He sells it at a marked price of Rs. 110 per metre, but hands over only 95 cm for every 100 cm the customer pays for. If he also gives a 5% discount, what is his profit percentage?", "options": ["4.2%", "9.7%", "15.5%", "16%"], "answer": "15.5%", "answer_note": "", "concept": "Compute cost per cm actually received and revenue per cm actually given; profit % compares these per-unit values.", "formulas": ["Profit % = (SP per unit / CP per unit − 1) × 100", "Net factor method: multiply successive changes"], "solution": ["1. Cost: Rs. 100 buys 105 cm, so CP = 100/105 per cm.", "2. Selling: customer pays for 100 cm at Rs. 110 less 5% = Rs. 104.5, but gets only 95 cm, so SP = 104.5/95 = 1.1 per cm.", "3. SP/CP = 1.1 × 105/100 = 1.155.", "4. Profit = 15.5%."], "shortcut": "Multiply factors: (105/100) × (100/95) × 1.10 × 0.95 = 1.05 × 1.10 = 1.155 — the 95 cm and the 5% discount cancel.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-11.shtml"}, {"id": "2023-S3-Q09", "year": 2023, "slot": 3, "q_no": 9, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – inequalities", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Rahul, Rakshita and Gurmeet together would need more than 7 days to finish a job, while Rahul and Gurmeet together would need fewer than 15 days. The three work together for 6 days, and then Rakshita alone finishes the remaining work in 3 more days. Which of the following cannot be the number of days Rakshita would need to do the whole job alone?", "options": ["20", "17", "16", "21"], "answer": "21", "answer_note": "", "concept": "Turn the 'more than / less than' day conditions into inequalities on rates, and combine them with the actual work equation to bound Rakshita's rate.", "formulas": ["Work = rate × time", "Taking more than T days ⇔ combined rate < 1/T"], "solution": ["1. Let rates be a (Rahul), r (Rakshita), g (Gurmeet), job = 1. Work equation: 6(a + r + g) + 3r = 1 ⇒ a + r + g = (1 − 3r)/6.", "2. All three need more than 7 days: (1 − 3r)/6 < 1/7 ⇒ 1 − 3r < 6/7 ⇒ r > 1/21 ⇒ Rakshita needs fewer than 21 days.", "3. Rahul + Gurmeet need fewer than 15 days: a + g = (1 − 9r)/6 > 1/15 ⇒ 1 − 9r > 2/5 ⇒ r < 1/15 ⇒ she needs more than 15 days.", "4. So Rakshita's time lies strictly between 15 and 21 days; 16, 17 and 20 are possible, 21 is not."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-8.shtml"}, {"id": "2023-S3-Q10", "year": 2023, "slot": 3, "q_no": 10, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Successive percentage change", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A town had a population of 100000 in 2020. From 2020 to 2021 it fell by y%, and from 2021 to 2022 it rose by x%, where x and y are natural numbers. The 2022 population exceeded the 2020 population, and x and y differ by 10. What is the least possible population in 2021?", "options": ["72000", "74000", "73000", "75000"], "answer": "73000", "answer_note": "", "concept": "A decrease followed by a larger increase must still net above the start; this caps how large the decrease y can be.", "formulas": ["Final = P(1 − y/100)(1 + x/100)"], "solution": ["1. For 2022 > 2020 after a fall, x > y, so x = y + 10.", "2. Condition: (100 − y)(110 + y) > 10000 ⇒ 11000 − 10y − y² > 10000 ⇒ y² + 10y < 1000.", "3. y = 27: 729 + 270 = 999 < 1000 ✓; y = 28: 784 + 280 = 1064 ✗. So y ≤ 27.", "4. 2021 population is least when y is largest: 100000 × 0.73 = 73000 (check: 73000 × 1.37 = 100010 > 100000)."], "shortcut": "Test options: 72000 needs a 38% rise → 99360 < 100000, fails; 73000 with 37% → 100010, works.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-10.shtml"}, {"id": "2023-S3-Q11", "year": 2023, "slot": 3, "q_no": 11, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – concentration", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Mixture A is cocoa and sugar in the ratio 3 : 2. Mixture B is coffee and sugar in the ratio 7 : 3. A and B are combined in the ratio 2 : 3 to get mixture C, which is then mixed with an equal quantity of milk to make a drink. What percentage of the drink is sugar?", "options": ["17", "16", "21", "24"], "answer": "17", "answer_note": "", "concept": "Track the sugar fraction through each mixing step as a weighted average.", "formulas": ["Concentration of mix = Σ(quantity × concentration)/Σ quantity"], "solution": ["1. Sugar fraction: A = 2/5 = 40%, B = 3/10 = 30%.", "2. C with A : B = 2 : 3: sugar = (2 × 40 + 3 × 30)/5 = 170/5 = 34%.", "3. Adding an equal amount of milk halves the concentration: 34/2 = 17%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-9.shtml"}, {"id": "2023-S3-Q12", "year": 2023, "slot": 3, "q_no": 12, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – adding a member", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A room has three persons A, B and C. If person D enters, the average weight in the room drops by x kg. If instead person E enters, the average weight rises by 2x kg. E weighs 12 kg more than D. Find x.", "options": ["2", "0.5", "1", "1.5"], "answer": "1", "answer_note": "", "concept": "When one person joins a group of 3, the new average of 4 shifts linearly with the newcomer's weight; compare the two scenarios.", "formulas": ["Sum = average × count"], "solution": ["1. Let S be the total weight of A, B, C.", "2. (S + D)/4 = new average with D, (S + E)/4 = new average with E.", "3. Difference of the two averages = (E − D)/4 = 12/4 = 3 kg.", "4. That difference is 2x − (−x) = 3x, so 3x = 3 ⇒ x = 1."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-12.shtml"}, {"id": "2023-S3-Q13", "year": 2023, "slot": 3, "q_no": 13, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Boats & streams", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "A boat goes downstream from port A to port B in 2 hours and comes back to A in 3 hours. A second boat takes 6 hours in total to go from B to A and back to B. Assuming the speeds of both boats and of the river are constant, how many hours does the slower boat take to go from A to B?", "options": ["3(3 − √5)", "12(√5 − 2)", "3(3 + √5)", "3(√5 − 1)"], "answer": "3(3 − √5)", "answer_note": "", "concept": "Use the first boat to fix the distance in terms of river speed; then solve the round-trip equation for the second boat's speed.", "formulas": ["Downstream speed = u + w, upstream speed = u − w", "Time = distance/speed"], "solution": ["1. Let river speed = 1 unit and first boat speed = u. d/(u + 1) = 2, d/(u − 1) = 3 ⇒ 2(u + 1) = 3(u − 1) ⇒ u = 5, d = 12 (in river-speed units).", "2. Second boat speed v: 12/(v − 1) + 12/(v + 1) = 6 ⇒ 24v = 6(v² − 1) ⇒ v² − 4v − 1 = 0 ⇒ v = 2 + √5 ≈ 4.24.", "3. Since 2 + √5 < 5, the second boat is slower.", "4. A to B is downstream: time = 12/(v + 1) = 12/(3 + √5) = 12(3 − √5)/4 = 3(3 − √5) hours."], "shortcut": "3(3 − √5) ≈ 2.29 h is just above the faster boat's 2 h downstream — the only option consistent with a slightly slower boat.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-13.shtml"}, {"id": "2023-S3-Q14", "year": 2023, "slot": 3, "q_no": 14, "area": "Number System", "topic": "Number System", "subtopic": "Divisibility – ratios and multiples", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two coin collectors A and B collect coins each week in the ratio 3 : 4. A's total over 5 weeks is a multiple of 7, and B's total over 3 weeks is a multiple of 24. What is the smallest possible number of coins A collects in a week?", "options": [], "answer": "42", "answer_note": "", "concept": "Write weekly counts as 3k and 4k and translate the multiple conditions into divisibility conditions on k.", "formulas": ["If 7 | 15k and gcd(15, 7) = 1 then 7 | k"], "solution": ["1. A = 3k, B = 4k per week.", "2. 5 weeks of A: 15k divisible by 7 ⇒ 7 | k.", "3. 3 weeks of B: 12k divisible by 24 ⇒ 2 | k.", "4. So k is a multiple of 14; least k = 14 ⇒ A = 42 per week."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-15.shtml"}, {"id": "2023-S3-Q15", "year": 2023, "slot": 3, "q_no": 15, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – stock problem with integer constraints", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "A fruit seller's stock contains mangoes, bananas and apples, at least one of each. At the start of a day, 40% of the fruits are mangoes. During the day he sells half of the mangoes, 96 bananas and 40% of the apples. At the end of the day he finds he has sold exactly 50% of the fruits he started with. What is the smallest possible number of fruits he had at the start of the day?", "options": [], "answer": "340", "answer_note": "", "concept": "Build one equation from the 50% sold condition, then use integrality and the constraints bananas ≥ 96 and apples ≥ 1 to find the minimum total.", "formulas": ["Sold = 0.5M + 96 + 0.4A = 0.5T", "M = 0.4T, B + A = 0.6T"], "solution": ["1. Let total T = 10x, mangoes = 4x, bananas = y, apples = 6x − y.", "2. Sold: 2x + 96 + 0.4(6x − y) = 5x ⇒ 0.6x + 0.4y = 96 ⇒ 3x + 2y = 480.", "3. T = 10x is smallest when x is smallest, i.e. when y is largest. x = (480 − 2y)/3 needs y ≡ 0 (mod 3).", "4. Apples ≥ 1: 6x − y ≥ 1 ⇒ 2(480 − 2y) − y ≥ 1 ⇒ 5y ≤ 959 ⇒ y ≤ 191. Largest multiple of 3 is y = 189 ⇒ x = 34.", "5. Check: mangoes 136, bananas 189, apples 15 (40% of 15 = 6, integer); sold 68 + 96 + 6 = 170 = half of 340. Answer 340."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-14.shtml"}, {"id": "2023-S3-Q16", "year": 2023, "slot": 3, "q_no": 16, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – relative efficiency", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Gautam and Suhani can finish a job together in 20 days. On any day that Gautam does only 60% of his usual daily work, Suhani has to do 150% of her usual daily work to complete the same day's share exactly. How many days would the faster of the two take to finish the job alone?", "options": [], "answer": "36", "answer_note": "", "concept": "The shortfall of one worker equals the extra put in by the other; this fixes the ratio of their efficiencies.", "formulas": ["0.4G = 0.5S (shortfall = surplus)", "Total work = (G + S) × 20"], "solution": ["1. Gautam's shortfall 40% of G must equal Suhani's extra 50% of S: 0.4G = 0.5S ⇒ G : S = 5 : 4.", "2. Gautam is faster. Take G = 5, S = 4 units/day.", "3. Total work = 20 × 9 = 180 units.", "4. Gautam alone: 180/5 = 36 days."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-16.shtml"}, {"id": "2023-S3-Q17", "year": 2023, "slot": 3, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – orthocentre & trigonometry", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In triangle ABC, AB = AC. AD is the altitude from A to BC and BE is the altitude from B to AC; they meet at O. If ∠AOB = 105°, find AD/BE.", "options": ["sin 15°", "cos 15°", "2 cos 15°", "2 sin 15°"], "answer": "2 cos 15°", "answer_note": "", "concept": "O is the orthocentre; the angle between two altitudes is supplementary to the angle at the third vertex. Then express both altitudes via AB.", "formulas": ["∠AOB = 180° − ∠C at the orthocentre", "Altitude = side × sine of included angle"], "solution": ["1. In quadrilateral ODCE, ∠ODC = ∠OEC = 90°, so ∠DOE = 180° − ∠C, and ∠AOB = ∠DOE (vertically opposite). Hence ∠C = 75°.", "2. AB = AC ⇒ ∠B = ∠C = 75°, ∠A = 30°.", "3. AD = AB sin B = AB sin 75°; BE = AB sin A = AB sin 30° = AB/2.", "4. AD/BE = 2 sin 75° = 2 cos 15°."], "shortcut": "AD/BE ≈ 1.93 > 1 since AD is the altitude to the short base; only 2 cos 15° exceeds 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-17.shtml"}, {"id": "2023-S3-Q18", "year": 2023, "slot": 3, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Mensuration – maximal inscribed rectangle", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A rectangle of the largest possible area is inscribed in a semicircle of radius 2 cm. What is the ratio of its longer side to its shorter side?", "options": ["2 : 1", "1 : 1", "√5 : 1", "√2 : 1"], "answer": "2 : 1", "answer_note": "", "concept": "The rectangle sits on the diameter with its top corners on the arc; parametrise a corner by an angle and maximise area.", "formulas": ["Corner at (r cos θ, r sin θ): area = 2r cos θ × r sin θ = r² sin 2θ"], "solution": ["1. Place the rectangle with base on the diameter, symmetric about the centre; top corner at (2 cos θ, 2 sin θ).", "2. Sides: base 4 cos θ, height 2 sin θ; area = 8 sin θ cos θ = 4 sin 2θ.", "3. Maximum at θ = 45°: base = 2√2, height = √2.", "4. Ratio = 2√2 : √2 = 2 : 1."], "shortcut": "The largest rectangle in a semicircle is half the largest square in the full circle, so it is a 2 : 1 rectangle.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-18.shtml"}, {"id": "2023-S3-Q19", "year": 2023, "slot": 3, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Polygons – angles & diagonals", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In a regular polygon, each interior angle is 120° more than each exterior angle. How many diagonals does the polygon have?", "options": [], "answer": "54", "answer_note": "", "concept": "Interior and exterior angles are supplementary; the exterior angle gives the number of sides.", "formulas": ["Interior + exterior = 180°", "n = 360°/exterior angle", "Diagonals = n(n − 3)/2"], "solution": ["1. Let exterior angle = e; interior = 180° − e.", "2. (180° − e) − e = 120° ⇒ e = 30°.", "3. n = 360/30 = 12 sides.", "4. Diagonals = 12 × 9/2 = 54."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-19.shtml"}, {"id": "2023-S3-Q20", "year": 2023, "slot": 3, "q_no": 20, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Infinite series – GP of partial sums", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the value of 1 + (1 + 1/3)(1/4) + (1 + 1/3 + 1/9)(1/16) + (1 + 1/3 + 1/9 + 1/27)(1/64) + … (continuing indefinitely).", "options": ["15/13", "27/12", "15/8", "16/11"], "answer": "16/11", "answer_note": "", "concept": "Each bracket is a partial sum of a GP; rewrite it in closed form and split the series into two infinite GPs.", "formulas": ["1 + r + … + r^(n−1) = (1 − rⁿ)/(1 − r)", "Infinite GP sum = a/(1 − r)"], "solution": ["1. The nth term is (1 + 1/3 + … + 1/3^(n−1))·(1/4)^(n−1) = (3/2)(1 − (1/3)ⁿ)(1/4)^(n−1).", "2. Expand: Tₙ = (3/2)(1/4)^(n−1) − (1/2)(1/12)^(n−1).", "3. Σ (3/2)(1/4)^(n−1) = (3/2) × 4/3 = 2.", "4. Σ (1/2)(1/12)^(n−1) = (1/2) × 12/11 = 6/11.", "5. Total = 2 − 6/11 = 16/11."], "shortcut": "Multiply the sum S by 1/4 and regroup; or note first two terms already give 1.333 and later terms are small, so the answer is just under 1.5 — 16/11 ≈ 1.4545.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-20.shtml"}, {"id": "2023-S3-Q21", "year": 2023, "slot": 3, "q_no": 21, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Common terms of two APs", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For natural numbers n ≤ 100, define aₙ = 46 + 8n and bₙ = 98 + 4n. What is the sum of all numbers that appear in both sequences?", "options": ["14900", "14798", "15000", "14602"], "answer": "14900", "answer_note": "", "concept": "Common terms of two APs form an AP whose common difference is the LCM of the two differences; find its first and last terms within both ranges.", "formulas": ["Common difference of common terms = LCM(d₁, d₂)", "Sum of AP = (number of terms/2)(first + last)"], "solution": ["1. aₙ runs 54, 62, …, 846 (step 8); bₙ runs 102, 106, …, 498 (step 4).", "2. aₙ values are ≡ 6 (mod 8); bₙ values are 98 + 4n, ≡ 6 (mod 8) when n is odd. So common terms are numbers ≡ 6 (mod 8) in the overlap [102, 498].", "3. First common term 102, last 494, common difference 8: count = (494 − 102)/8 + 1 = 50.", "4. Sum = 50/2 × (102 + 494) = 25 × 596 = 14900."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-21.shtml"}, {"id": "2023-S3-Q22", "year": 2023, "slot": 3, "q_no": 22, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functions of two variables – substitution", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A real-valued function f(x, y) satisfies f(3x + 2y, 2x − 5y) = 19x for all real x and y. Find the value of x for which f(x, 2x) = 27.", "options": [], "answer": "3", "answer_note": "", "concept": "Find a linear combination of the two arguments that equals 19x, which gives f explicitly.", "formulas": ["If p = 3x + 2y and q = 2x − 5y, then 5p + 2q = 19x"], "solution": ["1. Let p = 3x + 2y, q = 2x − 5y.", "2. 5p + 2q = 15x + 10y + 4x − 10y = 19x, so f(p, q) = 5p + 2q.", "3. f(x, 2x) = 5x + 4x = 9x.", "4. 9x = 27 ⇒ x = 3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-3-Quant/quants-question-22.shtml"}, {"id": "2024-S1-Q01", "year": 2024, "slot": 1, "q_no": 1, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio & proportion", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 24.03% correct", "question": "A vendor has 187 fruits in total, consisting of apples, mangoes and oranges, with apples and mangoes in the ratio 5 : 2. He then sells 75 apples, 26 mangoes and half of his oranges. Among the fruits left, the ratio of apples to oranges is 3 : 2. How many fruits remain unsold in total?", "options": [], "answer": "66", "answer_note": "", "concept": "Express all counts through one ratio multiplier and use the post-sale ratio to form a single linear equation.", "formulas": ["If A : M = 5 : 2, take A = 5t, M = 2t", "Oranges = Total − (A + M)"], "solution": ["1. Let apples = 5t, mangoes = 2t, so oranges = 187 − 7t.", "2. Left over: apples 5t − 75, oranges (187 − 7t)/2.", "3. (5t − 75) : (187 − 7t)/2 = 3 : 2 ⇒ 4(5t − 75) = 3(187 − 7t) ⇒ 41t = 861 ⇒ t = 21.", "4. So apples 105, mangoes 42, oranges 40.", "5. Unsold = (105 − 75) + (42 − 26) + 20 = 30 + 16 + 20 = 66."], "shortcut": "Mangoes 2t ≥ 26 and oranges 187 − 7t must be even, so t is odd and ≥ 15; test t = 21 quickly.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-1.shtml"}, {"id": "2024-S1-Q02", "year": 2024, "slot": 1, "q_no": 2, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Square root of a surd", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.06% correct", "question": "Suppose a + b√n equals the positive square root of 29 − 12√5, where a and b are integers and n is a natural number. What is the largest possible value of a + b + n?", "options": ["22", "6", "18", "4"], "answer": "18", "answer_note": "", "concept": "Find the square root of a binomial surd by writing it as (p − q√5)², then notice that the same surd can be rewritten in several a + b√n forms.", "formulas": ["(p − q√5)² = p² + 5q² − 2pq√5", "k√m = √(k²m)"], "solution": ["1. Try (p − q√5)² = 29 − 12√5: need p² + 5q² = 29 and pq = 6 ⇒ p = 3, q = 2.", "2. So 29 − 12√5 = (3 − 2√5)²; since 2√5 ≈ 4.47 > 3, the positive root is 2√5 − 3.", "3. Write it as a + b√n: (a, b, n) = (−3, 2, 5) gives a + b + n = 4.", "4. Also 2√5 = √20, so (a, b, n) = (−3, 1, 20) gives a + b + n = 18.", "5. b must be positive and b²n = 20, so these are the only options; maximum = 18."], "shortcut": "Push the whole coefficient under the root (b = 1) to make n as large as possible.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-2.shtml"}, {"id": "2024-S1-Q03", "year": 2024, "slot": 1, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equations", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 14.75% correct", "question": "Find the sum of all real values of k that satisfy (1/8)^k × (1/32768)^(1/3) = (1/8) × (1/32768)^(1/k).", "options": ["2/3", "−2/3", "4/3", "−4/3"], "answer": "−2/3", "answer_note": "", "concept": "Convert both bases to a common base (8), equate exponents and get a quadratic in k.", "formulas": ["32768 = 2¹⁵ = 8⁵", "a^m = a^n ⇒ m = n (a ≠ 0, 1)", "Sum of roots of Ak² + Bk + C = 0 is −B/A"], "solution": ["1. 1/32768 = 8⁻⁵, so the equation is 8^(−k) · 8^(−5/3) = 8^(−1) · 8^(−5/k).", "2. Equate exponents: −k − 5/3 = −1 − 5/k.", "3. Multiply by −3k: 3k² + 5k = 3k + 15 ⇒ 3k² + 2k − 15 = 0.", "4. Discriminant 4 + 180 = 184 > 0, so both roots are real (and neither is 0).", "5. Sum of roots = −2/3."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-3.shtml"}, {"id": "2024-S1-Q04", "year": 2024, "slot": 1, "q_no": 4, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – region area", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.9% correct", "question": "In the XY-plane, what is the area of the region consisting of points that satisfy both y ≥ x + 4 and −4 ≤ x² + y² + 4(x − y) ≤ 0?", "options": ["4π", "2π", "π", "3π"], "answer": "2π", "answer_note": "", "concept": "Complete the square to see the second condition as an annulus, then check how the line cuts it.", "formulas": ["x² + y² + 2gx + 2fy + c = 0 has centre (−g, −f)", "Annulus area = π(R² − r²)"], "solution": ["1. x² + 4x + y² − 4y = (x + 2)² + (y − 2)² − 8.", "2. The condition becomes 4 ≤ (x + 2)² + (y − 2)² ≤ 8: an annulus centred at (−2, 2) with radii 2 and 2√2.", "3. Annulus area = π(8 − 4) = 4π.", "4. The line y = x + 4 passes through the centre (2 = −2 + 4), so it splits the annulus into two equal halves.", "5. Required area = 4π/2 = 2π."], "shortcut": "Once you see the line passes through the centre, the answer is half the annulus.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-4.shtml"}, {"id": "2024-S1-Q05", "year": 2024, "slot": 1, "q_no": 5, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – man-hours", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 26.13% correct", "question": "Working alone, Renu finishes a job in 15 days working 4 hours a day, and Seema finishes it in 8 days working 5 hours a day. They do the job together such that Seema works twice as many hours per day as Renu, while Renu works for twice as many days as Seema. If Renu works 2 hours each day, for how many days does Seema work?", "options": [], "answer": "6", "answer_note": "", "concept": "Convert each person's capacity to work per hour and add the contributions over their respective days and hours.", "formulas": ["Work = rate × hours", "Total hours alone: Renu 15 × 4 = 60, Seema 8 × 5 = 40"], "solution": ["1. Renu does 1/60 of the job per hour; Seema does 1/40 per hour.", "2. Renu works 2 h/day, so Seema works 4 h/day.", "3. Let Seema work D days; Renu works 2D days.", "4. Renu's share = 2 × 2D/60 = D/15; Seema's share = 4 × D/40 = D/10.", "5. D/15 + D/10 = 1 ⇒ D/6 = 1 ⇒ D = 6."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-5.shtml"}, {"id": "2024-S1-Q06", "year": 2024, "slot": 1, "q_no": 6, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – share of income", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 51.05% correct", "question": "In September, the incomes of Kamal, Amal and Vimal were in the ratio 8 : 6 : 5. They shared a house rent, contributing 15%, 12% and 18% of their respective incomes. In October the rent stayed the same, but their incomes went up by 10%, 12% and 15% respectively. To the nearest option, what percentage of their combined October income went to rent?", "options": ["14.84", "12.75", "13.26", "15.18"], "answer": "13.26", "answer_note": "", "concept": "Fix the rent from September's figures using ratio units, then divide by the new total income.", "formulas": ["Rent = Σ (income × share %)", "New income = old × (1 + growth)"], "solution": ["1. Take incomes 8, 6, 5 units.", "2. Rent = 0.15×8 + 0.12×6 + 0.18×5 = 1.2 + 0.72 + 0.9 = 2.82 units.", "3. October incomes: 8.8 + 6.72 + 5.75 = 21.27 units.", "4. Rent share = 2.82/21.27 × 100 ≈ 13.26%."], "shortcut": "September share is 2.82/19 ≈ 14.8%; incomes rose about 12%, so the share drops to about 14.8/1.12 ≈ 13.2%.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-6.shtml"}, {"id": "2024-S1-Q07", "year": 2024, "slot": 1, "q_no": 7, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting onto functions", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 3.69% correct", "question": "Let A = {2, 3, 5, 7, 11, 13} and B = {1, 8, 27}. How many functions f from A to B are there such that every element of B is the image of at least one element of A?", "options": ["540", "537", "665", "667"], "answer": "540", "answer_note": "", "concept": "Count onto (surjective) functions from a 6-element set to a 3-element set with inclusion–exclusion.", "formulas": ["Onto functions from n-set to 3-set = 3ⁿ − 3·2ⁿ + 3·1ⁿ"], "solution": ["1. Total functions A → B = 3⁶ = 729.", "2. Functions missing a particular element of B: 2⁶ = 64; there are 3 choices, giving 192.", "3. Functions missing two particular elements: 1⁶ = 1; 3 choices, added back: 3.", "4. Onto functions = 729 − 192 + 3 = 540."], "shortcut": "Answer must be divisible by 3! = 6 (permuting B's labels); only 540 is.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-7.shtml"}, {"id": "2024-S1-Q08", "year": 2024, "slot": 1, "q_no": 8, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of squares = 0", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 2.85% correct", "question": "Real numbers x, y, z satisfy 4(x² + y² + z²) = a and 4(x − y − z) = 3 + a. What is the value of a?", "options": ["3", "1⅓", "1", "4"], "answer": "3", "answer_note": "", "concept": "Eliminate a to get a sum of perfect squares equal to zero, which forces each square to vanish.", "formulas": ["Sum of real squares = 0 ⇒ each term = 0", "4x² − 4x + 1 = (2x − 1)²"], "solution": ["1. Subtract the second equation from the first: 4x² + 4y² + 4z² − 4x + 4y + 4z = −3.", "2. Add 3 to both sides: (2x − 1)² + (2y + 1)² + (2z + 1)² = 0.", "3. Hence x = 1/2, y = −1/2, z = −1/2.", "4. a = 4(1/4 + 1/4 + 1/4) = 3.", "5. Check: 4(1/2 + 1/2 + 1/2) = 6 = 3 + 3. ✓"], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-8.shtml"}, {"id": "2024-S1-Q09", "year": 2024, "slot": 1, "q_no": 9, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Sum of numbers formed by digits", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 1.96% correct", "question": "Using four distinct non-zero digits a, b, c, d, each exactly once, all possible four-digit numbers are formed. Their sum is 153310 + n, where n is a single-digit natural number. Find a + b + c + d + n.", "options": [], "answer": "31", "answer_note": "", "concept": "Each digit appears in each place value equally often, so the total is a fixed multiple of the digit sum.", "formulas": ["Sum of all permutations of 4 distinct digits = 3! × 1111 × (sum of digits) = 6666 × S"], "solution": ["1. Each digit appears 3! = 6 times in each of the 4 positions.", "2. Total = 6 × 1111 × S = 6666S, where S = a + b + c + d.", "3. 153310 + n lies between 153311 and 153319; 6666 × 23 = 153318 is the only multiple of 6666 there.", "4. So S = 23 and n = 8.", "5. a + b + c + d + n = 23 + 8 = 31."], "shortcut": "153310/6666 ≈ 23, so try S = 23 immediately.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-9.shtml"}, {"id": "2024-S1-Q10", "year": 2024, "slot": 1, "q_no": 10, "area": "Number System", "topic": "Number System", "subtopic": "Remainders – cyclicity", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 38.12% correct", "question": "What is the remainder when 10¹⁰⁰ is divided by 7?", "options": ["3", "6", "1", "4"], "answer": "4", "answer_note": "", "concept": "Reduce the base modulo 7 and use the cycle of powers (Fermat: a⁶ ≡ 1 mod 7).", "formulas": ["Fermat's little theorem: a^(p−1) ≡ 1 (mod p)", "10 ≡ 3 (mod 7)"], "solution": ["1. 10 ≡ 3 (mod 7), so 10¹⁰⁰ ≡ 3¹⁰⁰.", "2. 3⁶ ≡ 1 (mod 7).", "3. 100 = 6 × 16 + 4, so 3¹⁰⁰ ≡ 3⁴ = 81.", "4. 81 = 77 + 4, remainder 4."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-10.shtml"}, {"id": "2024-S1-Q11", "year": 2024, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – running averages", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 30.84% correct", "question": "Four numbers are written in order. The average of the first two is 1 more than the first number. The average of the first three is 2 more than the average of the first two. The average of all four is 3 more than the average of the first three. What is the difference between the largest and the smallest of the four numbers?", "options": [], "answer": "15", "answer_note": "", "concept": "Express every number in terms of the first using average-to-sum conversions.", "formulas": ["Sum = average × count"], "solution": ["1. Let the first number be p. Average of first two = p + 1 ⇒ second = 2(p + 1) − p = p + 2.", "2. Average of first three = p + 3 ⇒ third = 3(p + 3) − (2p + 2) = p + 7.", "3. Average of four = p + 6 ⇒ fourth = 4(p + 6) − 3(p + 3) = p + 15.", "4. Numbers: p, p + 2, p + 7, p + 15 ⇒ largest − smallest = 15."], "shortcut": "Take the first number as 0: the numbers are 0, 2, 7, 15.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-11.shtml"}, {"id": "2024-S1-Q12", "year": 2024, "slot": 1, "q_no": 12, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 56.56% correct", "question": "Rs 10,000 is kept in Bank A at 5% simple interest per annum for a certain number of years. The entire amount received is then kept in Bank B for 5 years at 6% simple interest per annum. If the interests earned from A and from B are in the ratio 10 : 13, for how many years was the money kept in Bank A?", "options": ["4", "3", "6", "5"], "answer": "6", "answer_note": "", "concept": "Write both interests in terms of the unknown period and solve the ratio equation.", "formulas": ["SI = P × R × T / 100", "Amount = P + SI"], "solution": ["1. Let the period be n years. Interest from A = 10000 × 5n/100 = 500n.", "2. Amount moved to B = 10000 + 500n.", "3. Interest from B = (10000 + 500n) × 30/100 = 3000 + 150n.", "4. 500n/(3000 + 150n) = 10/13 ⇒ 6500n = 30000 + 1500n ⇒ n = 6."], "shortcut": "Test options: n = 6 gives 3000 : 3900 = 10 : 13.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-12.shtml"}, {"id": "2024-S1-Q13", "year": 2024, "slot": 1, "q_no": 13, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Working backwards", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 53.57% correct", "question": "A shop sells grain to three customers one after another. Each customer receives half of the grain then remaining plus 3 kg more. After the third customer, no grain is left. How many kg of grain did the shop have at the start?", "options": ["18", "36", "50", "42"], "answer": "42", "answer_note": "", "concept": "Reverse each operation: if a sale leaves R, the stock before it was 2(R + 3).", "formulas": ["Before = 2(After + 3)"], "solution": ["1. After the third sale: 0 kg.", "2. Before the third sale: 2(0 + 3) = 6 kg.", "3. Before the second sale: 2(6 + 3) = 18 kg.", "4. Before the first sale: 2(18 + 3) = 42 kg."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-13.shtml"}, {"id": "2024-S1-Q14", "year": 2024, "slot": 1, "q_no": 14, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Arithmetic progression", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 38.36% correct", "question": "The numbers x₁, x₂, …, x₁₀₀ form an arithmetic progression. Given x₅ = −4 and 2x₆ + 2x₉ = x₁₁ + x₁₃, find x₁₀₀.", "options": ["204", "−194", "−196", "206"], "answer": "−194", "answer_note": "", "concept": "Write the terms using first term and common difference and solve the two linear conditions.", "formulas": ["xₙ = a + (n − 1)d"], "solution": ["1. 2x₆ + 2x₉ = 2(2a + 13d) = 4a + 26d; x₁₁ + x₁₃ = 2a + 22d.", "2. 4a + 26d = 2a + 22d ⇒ a = −2d.", "3. x₅ = a + 4d = 2d = −4 ⇒ d = −2, a = 4.", "4. x₁₀₀ = 4 + 99(−2) = −194."], "shortcut": "The condition reduces to a = −2d, so x₅ = a + 4d = 2d immediately gives d = −2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-14.shtml"}, {"id": "2024-S1-Q15", "year": 2024, "slot": 1, "q_no": 15, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative speed – meeting point", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 29.63% correct", "question": "Places A and B are 45 km apart. Anil starts from A towards B and Sunil starts from B towards A at the same moment, and they cross each other after 1 hour 30 minutes. Anil reaches B 1 hour 15 minutes after Sunil reaches A. What is Anil's speed in km/h?", "options": ["16", "14", "12", "18"], "answer": "12", "answer_note": "", "concept": "Use relative speed to get the sum of speeds, then the difference in full-trip times.", "formulas": ["Meeting time = distance / (sum of speeds)", "Time = distance / speed"], "solution": ["1. Sum of speeds = 45/1.5 = 30 km/h. Let Anil = a, Sunil = 30 − a.", "2. Anil is slower: 45/a − 45/(30 − a) = 5/4.", "3. Try a = 12: 45/12 − 45/18 = 3.75 − 2.5 = 1.25 h. ✓", "4. Anil's speed = 12 km/h."], "shortcut": "Options give a + (30 − a) = 30 pairs; check the time gap only for each option.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-15.shtml"}, {"id": "2024-S1-Q16", "year": 2024, "slot": 1, "q_no": 16, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Cuboid inscribed in sphere", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.48% correct", "question": "A closed rectangular box is inscribed in a sphere. The total surface area of the box is 846 sq cm and the sum of the lengths of all its edges is 144 cm. Find the volume of the sphere in cubic cm.", "options": ["750π", "1125π√2", "1125π", "750π√2"], "answer": "1125π√2", "answer_note": "", "concept": "The sphere's diameter is the box's space diagonal, which comes from (l + w + h)² minus the surface area.", "formulas": ["(l + w + h)² = l² + w² + h² + 2(lw + wh + hl)", "Space diagonal = √(l² + w² + h²)", "Sphere volume = (4/3)πR³"], "solution": ["1. 4(l + w + h) = 144 ⇒ l + w + h = 36.", "2. 2(lw + wh + hl) = 846.", "3. l² + w² + h² = 36² − 846 = 1296 − 846 = 450 ⇒ diagonal = √450 = 15√2.", "4. R = 15√2/2.", "5. V = (4/3)π(15√2/2)³ = (4/3)π × 3375 × 2√2/8 = 1125√2 π."], "shortcut": "Diameter² = 450 is not a perfect square, so the answer has √2; pick between the two √2 options by computing R³.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-16.shtml"}, {"id": "2024-S1-Q17", "year": 2024, "slot": 1, "q_no": 17, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – repeated replacement", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 33.36% correct", "question": "A glass is completely full of milk. Two-thirds of it is poured out and the glass is filled back up with water. This process is carried out three more times. What is the final ratio of milk to water in the glass?", "options": ["1:27", "1:81", "1:26", "1:80"], "answer": "1:80", "answer_note": "", "concept": "Each replacement keeps only a fixed fraction of the milk; apply it once per operation.", "formulas": ["Milk left after n replacements = (1 − fraction removed)ⁿ × initial"], "solution": ["1. Each step leaves 1 − 2/3 = 1/3 of the milk.", "2. Total steps = 1 + 3 = 4.", "3. Milk fraction = (1/3)⁴ = 1/81, water = 80/81.", "4. Milk : water = 1 : 80."], "shortcut": "Watch the count: 'three more times' means 4 operations, not 3 (1:26 is the trap).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-17.shtml"}, {"id": "2024-S1-Q18", "year": 2024, "slot": 1, "q_no": 18, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Floor function – summation", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 12.37% correct", "question": "For each natural number n, let aₙ denote the largest integer that does not exceed √n. Find a₁ + a₂ + … + a₅₀.", "options": [], "answer": "217", "answer_note": "", "concept": "⌊√n⌋ stays constant at k for n from k² to (k + 1)² − 1, i.e. for 2k + 1 values; group the terms.", "formulas": ["⌊√n⌋ = k for k² ≤ n ≤ k² + 2k (2k + 1 values)"], "solution": ["1. k = 1 for n = 1–3: 3 × 1 = 3.", "2. k = 2 for n = 4–8: 5 × 2 = 10; k = 3 for n = 9–15: 7 × 3 = 21.", "3. k = 4 for n = 16–24: 9 × 4 = 36; k = 5 for n = 25–35: 11 × 5 = 55.", "4. k = 6 for n = 36–48: 13 × 6 = 78; k = 7 for n = 49–50: 2 × 7 = 14.", "5. Total = 3 + 10 + 21 + 36 + 55 + 78 + 14 = 217."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-18.shtml"}, {"id": "2024-S1-Q19", "year": 2024, "slot": 1, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – inradius", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 27.25% correct", "question": "ABCD is a rectangle with AB = 56 cm and BC = 45 cm. Point E is the midpoint of side CD. Find the radius, in cm, of the circle inscribed in triangle ADE.", "options": [], "answer": "10", "answer_note": "", "concept": "Triangle ADE is right-angled at D, so its inradius is (sum of legs − hypotenuse)/2.", "formulas": ["Right triangle inradius r = (a + b − c)/2", "r = Area / semi-perimeter"], "solution": ["1. AD = BC = 45, DE = CD/2 = 56/2 = 28, angle D = 90°.", "2. AE = √(45² + 28²) = √(2025 + 784) = √2809 = 53.", "3. r = (45 + 28 − 53)/2 = 20/2 = 10 cm."], "shortcut": "28-45-53 is a Pythagorean triple.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-19.shtml"}, {"id": "2024-S1-Q20", "year": 2024, "slot": 1, "q_no": 20, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Common roots", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 3.64% correct", "question": "The quadratic equations x² + mx + 9 = 0, x² + nx + 17 = 0 and x² + (m + n)x + 35 = 0 have a negative root in common. Find 2m + 3n.", "options": [], "answer": "38", "answer_note": "", "concept": "Combine the equations so the m and n terms cancel, leaving an equation in the common root alone.", "formulas": ["If r is a root, substitute r in each equation"], "solution": ["1. Let r be the common root: r² + mr + 9 = 0, r² + nr + 17 = 0, r² + (m + n)r + 35 = 0.", "2. Add the first two and subtract the third: r² + 26 − 35 = 0 ⇒ r² = 9 ⇒ r = −3 (negative root).", "3. From the first: 9 − 3m + 9 = 0 ⇒ m = 6.", "4. From the second: 9 − 3n + 17 = 0 ⇒ n = 26/3.", "5. 2m + 3n = 12 + 26 = 38."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-20.shtml"}, {"id": "2024-S1-Q21", "year": 2024, "slot": 1, "q_no": 21, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit percentage", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 54.97% correct", "question": "An item is priced so that the seller makes a 40% profit. If the cost price had been 40% lower and the selling price Rs 5 lower, the profit would have been 50%. What is the original selling price in Rs?", "options": ["10", "15", "20", "14"], "answer": "14", "answer_note": "", "concept": "Form one equation linking the new selling price to the new cost price with the new profit margin.", "formulas": ["SP = CP × (1 + profit%)"], "solution": ["1. Let CP = c, so SP = 1.4c.", "2. New CP = 0.6c; new SP = 1.4c − 5.", "3. 1.4c − 5 = 1.5 × 0.6c = 0.9c ⇒ 0.5c = 5 ⇒ c = 10.", "4. Original SP = 1.4 × 10 = Rs 14."], "shortcut": "SP must be 1.4 × CP, i.e. a multiple of 7 for a neat CP: only 14 fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-21.shtml"}, {"id": "2024-S1-Q22", "year": 2024, "slot": 1, "q_no": 22, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Change of base", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 20.11% correct", "question": "For a positive real number x, 4 log₁₀ x + 4 log₁₀₀ x + 8 log₁₀₀₀ x = 13. What is the greatest integer that does not exceed x?", "options": [], "answer": "31", "answer_note": "", "concept": "Convert every logarithm to base 10 to get a linear equation in log₁₀ x.", "formulas": ["log_(bᵏ) x = (1/k) log_b x"], "solution": ["1. Let L = log₁₀ x. Then log₁₀₀ x = L/2 and log₁₀₀₀ x = L/3.", "2. 4L + 2L + (8/3)L = 13 ⇒ (26/3)L = 13 ⇒ L = 3/2.", "3. x = 10^(3/2) = 10√10 ≈ 31.62.", "4. Greatest integer not exceeding x = 31."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-1-Quant/quants-question-22.shtml"}, {"id": "2024-S2-Q01", "year": 2024, "slot": 2, "q_no": 1, "area": "Number System", "topic": "Number System", "subtopic": "Remainders – cyclicity of powers", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 41.31% correct", "question": "Find the remainder obtained when 3³³³ is divided by 11.", "options": ["1", "10", "6", "5"], "answer": "5", "answer_note": "", "concept": "Powers of a number modulo a prime repeat in a short cycle; reduce the exponent using the cycle length.", "formulas": ["3⁵ = 243 ≡ 1 (mod 11)", "aⁿ mod m: reduce n modulo the cycle length"], "solution": ["1. 3⁵ = 243 = 22 × 11 + 1, so 3⁵ ≡ 1 (mod 11).", "2. 333 = 5 × 66 + 3.", "3. 3³³³ = (3⁵)⁶⁶ × 3³ ≡ 1 × 27 (mod 11).", "4. 27 = 2 × 11 + 5, so the remainder is 5."], "shortcut": "Once you spot 3⁵ ≡ 1 mod 11, only 3^(333 mod 5) = 3³ matters.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-1.shtml"}, {"id": "2024-S2-Q02", "year": 2024, "slot": 2, "q_no": 2, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus equations – case analysis", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 27.57% correct", "question": "Real numbers x and y satisfy |x| + x + y = 15 and x + |y| − y = 20. What is x − y?", "options": ["10", "5", "20", "15"], "answer": "15", "answer_note": "", "concept": "Remove the modulus signs by deciding the signs of x and y; only one sign combination is consistent.", "formulas": ["|t| = t if t ≥ 0, −t if t < 0"], "solution": ["1. If x ≤ 0, the first equation gives y = 15 > 0, then the second gives x = 20, contradicting x ≤ 0. So x > 0.", "2. With x > 0: 2x + y = 15.", "3. If y ≥ 0, the second equation gives x = 20, then y = 15 − 40 = −25 < 0, a contradiction. So y < 0.", "4. With y < 0: x − 2y = 20.", "5. Solving 2x + y = 15 and x − 2y = 20: x = 10, y = −5.", "6. x − y = 10 − (−5) = 15."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-2.shtml"}, {"id": "2024-S2-Q03", "year": 2024, "slot": 2, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Indices – perfect powers", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 11.35% correct", "question": "m and n are natural numbers with n > 1, and mⁿ = 2²⁵ × 3⁴⁰. Find m − n.", "options": ["209932", "209937", "209947", "209942"], "answer": "209947", "answer_note": "", "concept": "For mⁿ to equal a product of prime powers, n must divide every exponent.", "formulas": ["If mⁿ = p^a × q^b, then n | gcd(a, b) and m = p^(a/n) × q^(b/n)"], "solution": ["1. n must divide both 25 and 40, so n divides gcd(25, 40) = 5.", "2. Since n > 1, n = 5.", "3. m = 2⁵ × 3⁸ = 32 × 6561 = 209952.", "4. m − n = 209952 − 5 = 209947."], "shortcut": "All options end in 2 or 7 near 209950; m ends in 2 (32 × ...1 → 2), so m − 5 ends in 7: options 2 or 3. Compute 32 × 6561 = 209952 to pick 209947.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-3.shtml"}, {"id": "2024-S2-Q04", "year": 2024, "slot": 2, "q_no": 4, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equations – multiplicative form", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.31% correct", "question": "A function f from the natural numbers to the whole numbers satisfies f(xy) = f(x)f(y) + f(x) + f(y) for all natural x, y, and f(p) = 1 for every prime p. Find f(160000).", "options": ["1023", "4095", "2047", "8191"], "answer": "4095", "answer_note": "", "concept": "Adding 1 to both sides factorises the relation, turning f + 1 into a completely multiplicative function.", "formulas": ["f(xy) + 1 = (f(x) + 1)(f(y) + 1)", "g(n) = f(n) + 1 ⇒ g(p^k) = g(p)^k"], "solution": ["1. Let g(n) = f(n) + 1. Then g(xy) = g(x)g(y).", "2. For any prime p, g(p) = 1 + 1 = 2, so g(p^k) = 2^k.", "3. 160000 = 16 × 10⁴ = 2⁴ × 2⁴ × 5⁴ = 2⁸ × 5⁴.", "4. g(160000) = 2⁸ × 2⁴ = 2¹² = 4096.", "5. f(160000) = 4096 − 1 = 4095."], "shortcut": "f(n) = 2^(total number of prime factors counted with multiplicity) − 1; here 8 + 4 = 12.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-4.shtml"}, {"id": "2024-S2-Q05", "year": 2024, "slot": 2, "q_no": 5, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Trapezium – similar triangles", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 28.74% correct", "question": "ABCD is a trapezium with AB ∥ CD, AB = 2 cm and CD = 1 cm. The non-parallel sides AD and BC are extended to meet at E. If the perimeter of ABCD is 6 cm, find the perimeter of triangle AEB (in cm).", "options": ["10", "9", "8", "7"], "answer": "8", "answer_note": "", "concept": "Since DC ∥ AB, triangle EDC is similar to triangle EAB with ratio 1 : 2, so D and C are midpoints of EA and EB.", "formulas": ["Similar triangles: corresponding sides are in the same ratio"], "solution": ["1. Triangles EDC and EAB are similar with ratio DC : AB = 1 : 2.", "2. So ED = DA and EC = CB (D, C are midpoints of EA, EB).", "3. From the trapezium's perimeter: AD + BC = 6 − 2 − 1 = 3.", "4. EA + EB = 2(AD + BC) = 6.", "5. Perimeter of AEB = AB + EA + EB = 2 + 6 = 8 cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-5.shtml"}, {"id": "2024-S2-Q06", "year": 2024, "slot": 2, "q_no": 6, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – alternate-day working", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.65% correct", "question": "Amal and Vimal together can finish a task in 150 days, while Vimal and Sunil together can finish it in 100 days. In one instance Amal worked alone for 75 days, then Vimal alone for the next 135 days, and then Sunil alone completed the rest in 45 days. If instead Amal works every day, Vimal works only every second day and Sunil works only every third day, in how many days will the task be completed?", "options": [], "answer": "139", "answer_note": "", "concept": "Find individual rates from the three conditions, then compute the work done per LCM cycle of the working pattern.", "formulas": ["Rate = 1/time", "Work = rate × days"], "solution": ["1. Let daily rates be a, v, s. a + v = 1/150, v + s = 1/100, and 75a + 135v + 45s = 1.", "2. Write 75a + 135v + 45s = 75(a + v) + 15v + 45(v + s) = 1/2 + 15v + 9/20, so 15v = 1/20 ⇒ v = 1/300.", "3. Then a = 1/150 − 1/300 = 1/300 and s = 1/100 − 1/300 = 1/150.", "4. Take total work = 300 units: Amal 1/day, Vimal 1/day, Sunil 2/day.", "5. In a 6-day cycle: Amal 6, Vimal 3 (days 2, 4, 6), Sunil 4 (days 3, 6) = 13 units.", "6. 23 cycles = 138 days give 299 units; on day 139 Amal does the last unit. Answer: 139 days."], "shortcut": "Group 75a + 135v + 45s as 75(a+v) + 45(v+s) + 15v to get v in one line.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-6.shtml"}, {"id": "2024-S2-Q07", "year": 2024, "slot": 2, "q_no": 7, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Successive selling – profit & loss", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "2IIM: 54.32% correct", "question": "Bina sold an article to Shyam for Rs 4860, incurring a loss of 19%. Shyam then sold it to Hari. Had Bina sold it to Shyam at the price Hari paid, she would have made a profit of 17%. How much profit (in Rs) did Shyam make?", "options": [], "answer": "2160", "answer_note": "", "concept": "Recover Bina's cost price from the loss, then Hari's price from the hypothetical profit.", "formulas": ["SP = CP × (1 − loss%)", "SP = CP × (1 + profit%)"], "solution": ["1. 0.81 × CP = 4860 ⇒ CP = 6000.", "2. Hari's purchase price = 1.17 × 6000 = 7020.", "3. Shyam's profit = 7020 − 4860 = Rs 2160."], "shortcut": "Profit = (17% + 19%) of Bina's CP = 0.36 × 6000 = 2160.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-7.shtml"}, {"id": "2024-S2-Q08", "year": 2024, "slot": 2, "q_no": 8, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Infinite GP – sum of series", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 8.75% correct", "question": "Find the sum of the infinite series (1/5)(1/5 − 1/7) + (1/5)²((1/5)² − (1/7)²) + (1/5)³((1/5)³ − (1/7)³) + …", "options": ["5/408", "7/816", "7/408", "5/816"], "answer": "5/408", "answer_note": "", "concept": "Expanding each term splits the series into the difference of two infinite geometric progressions.", "formulas": ["(1/5)ⁿ((1/5)ⁿ − (1/7)ⁿ) = (1/25)ⁿ − (1/35)ⁿ", "Sum of infinite GP = a/(1 − r), |r| < 1"], "solution": ["1. The nth term is (1/25)ⁿ − (1/35)ⁿ.", "2. Σ (1/25)ⁿ from n = 1 = (1/25)/(24/25) = 1/24.", "3. Σ (1/35)ⁿ from n = 1 = (1/35)/(34/35) = 1/34.", "4. Sum = 1/24 − 1/34 = (34 − 24)/816 = 10/816 = 5/408."], "shortcut": "Σ rⁿ from n=1 = r/(1−r) = 1/(1/r − 1): directly 1/24 − 1/34.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-8.shtml"}, {"id": "2024-S2-Q09", "year": 2024, "slot": 2, "q_no": 9, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithms – change of base", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 6.98% correct", "question": "Positive real numbers a, b, c satisfy a > 10 ≥ b ≥ c and [log₈(a + b)]/[log₂ c] + [log₂₇(a − b)]/[log₃ c] = 2/3. What is the greatest possible integer value of a?", "options": [], "answer": "14", "answer_note": "", "concept": "Converting log₈ and log₂₇ to base-2 and base-3 logs makes each fraction a base-c log, collapsing the equation to a² − b² = c².", "formulas": ["log_{p^k} x = (1/k) log_p x", "log_p x / log_p c = log_c x", "log_c X + log_c Y = log_c XY"], "solution": ["1. log₈(a + b) = (1/3)log₂(a + b), so the first term is (1/3)log_c(a + b).", "2. Similarly the second term is (1/3)log_c(a − b).", "3. The equation becomes (1/3)log_c(a² − b²) = 2/3, so a² − b² = c², i.e. a² = b² + c².", "4. With c ≤ b ≤ 10, a² ≤ 100 + 100 = 200, so a ≤ √200 ≈ 14.14.", "5. a = 14 is attainable (e.g. b = 10, c = √96 ≤ 10), so the greatest integer value of a is 14."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-9.shtml"}, {"id": "2024-S2-Q10", "year": 2024, "slot": 2, "q_no": 10, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – overlapping groups", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 11.74% correct", "question": "A company has 40 employees arranged in a fixed order. In 2022, the average bonus of the first 30 employees was Rs 40000, that of the last 30 employees was Rs 60000, and that of the first 10 and last 10 employees taken together was Rs 50000. In 2023, the average bonus of the first 10 employees rose by 100%, that of the last 10 rose by 200%, and the bonuses of the middle 20 were unchanged. Find the average bonus (in Rs) of all 40 employees in 2023.", "options": ["90000", "95000", "80000", "85000"], "answer": "95000", "answer_note": "", "concept": "Split the employees into three blocks (first 10, middle 20, last 10) and solve for each block's total from the three overlapping totals.", "formulas": ["Total = average × count"], "solution": ["1. Let block totals (in Rs lakh) be F (first 10), M (middle 20), L (last 10).", "2. F + M = 30 × 0.4 = 12, M + L = 30 × 0.6 = 18, F + L = 20 × 0.5 = 10.", "3. Adding: 2(F + M + L) = 40 ⇒ F + M + L = 20, so L = 8, F = 2, M = 10.", "4. 2023 total = 2F + M + 3L = 4 + 10 + 24 = 38 lakh.", "5. Average = 38,00,000 / 40 = Rs 95000."], "shortcut": "Increase in total = F + 2L = 2 + 16 = 18 lakh on 20 lakh, so average goes from 50000 to 95000.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-10.shtml"}, {"id": "2024-S2-Q11", "year": 2024, "slot": 2, "q_no": 11, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting routes – multiplication principle", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 3.38% correct", "question": "Four towns P, Q, R and S are linked by roads. There are 3 direct roads between P and Q, 4 between Q and S, and 4 between P and R, and no direct road between P and S. The numbers of direct roads between Q and R and between R and S are unknown. Going from P to S via Q only, via R only, or via Q then R, there are 62 ways in all. Going from Q to R directly, via P, or via S, there are 27 ways in all. How many direct roads are there between Q and R?", "options": [], "answer": "7", "answer_note": "", "concept": "Use the multiplication principle for each route type and the addition principle across route types to form equations in the unknown road counts.", "formulas": ["Ways along a route = product of road counts on each leg", "Total ways = sum over disjoint route types"], "solution": ["1. Let m = roads Q–R and n = roads R–S.", "2. P to S: P–Q–S = 3 × 4 = 12, P–R–S = 4n, P–Q–R–S = 3mn. So 12 + 4n + 3mn = 62 ⇒ 4n + 3mn = 50.", "3. Q to R: direct m, Q–P–R = 3 × 4 = 12, Q–S–R = 4n. So m + 12 + 4n = 27 ⇒ m + 4n = 15.", "4. Subtracting: 3mn − m = 35 ⇒ m(3n − 1) = 35.", "5. Try factor pairs with m + 4n = 15: m = 7, 3n − 1 = 5 ⇒ n = 2, and 7 + 8 = 15 ✓.", "6. Direct roads between Q and R = 7."], "shortcut": "From m + 4n = 15, m must be odd (n ≥ 1): test m = 7 (n = 2) in 4n + 3mn = 8 + 42 = 50 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-11.shtml"}, {"id": "2024-S2-Q12", "year": 2024, "slot": 2, "q_no": 12, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – integer constraints", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 7.03% correct", "question": "A fruit seller has mangoes, bananas and apples, with at least one of each. At the start of a day, 40% of all his fruits are mangoes. During the day he sells half of the mangoes, 96 bananas and 40% of the apples. At the end of the day he finds he has sold exactly 50% of all the fruits. What is the smallest possible total number of fruits he had at the start of the day?", "options": [], "answer": "340", "answer_note": "", "concept": "Set up the sold-fraction equation, express apples in terms of the total, then impose integrality and non-negativity to find the minimum total.", "formulas": ["Sold = 0.5 × mangoes + 96 + 0.4 × apples = 0.5 × total"], "solution": ["1. Let total = T, mangoes = 0.4T, apples = A, bananas = 0.6T − A.", "2. Sold: 0.2T + 96 + 0.4A = 0.5T ⇒ 0.4A = 0.3T − 96 ⇒ A = 0.75T − 240.", "3. Need A ≥ 1 ⇒ T > 320; bananas = 0.6T − A = 240 − 0.15T ≥ 96 ⇒ T ≤ 960.", "4. Integrality: 0.2T (half the mangoes) integer ⇒ T multiple of 5; 0.75T integer ⇒ T multiple of 4; 0.4A integer ⇒ A multiple of 5.", "5. So T is a multiple of 20 above 320; T = 340 gives A = 15 (6 sold ✓), mangoes 136 (68 sold), bananas 189.", "6. Smallest total = 340."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-12.shtml"}, {"id": "2024-S2-Q13", "year": 2024, "slot": 2, "q_no": 13, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Surds – square roots of a + b√c", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 16.39% correct", "question": "If √(x + 6√2) − √(x − 6√2) = 2√2, find x.", "options": [], "answer": "11", "answer_note": "", "concept": "Rationalise using the product (√P − √Q)(√P + √Q) = P − Q to get the sum of the roots, then add to isolate one root.", "formulas": ["(√P − √Q)(√P + √Q) = P − Q", "(a + b)² = a² + 2ab + b²"], "solution": ["1. Let P = x + 6√2, Q = x − 6√2, so P − Q = 12√2.", "2. √P + √Q = (P − Q)/(√P − √Q) = 12√2 / 2√2 = 6.", "3. Adding √P − √Q = 2√2: 2√P = 6 + 2√2 ⇒ √P = 3 + √2.", "4. P = (3 + √2)² = 11 + 6√2, so x = 11.", "5. Check: √(11 − 6√2) = 3 − √2, and (3 + √2) − (3 − √2) = 2√2 ✓."], "shortcut": "Guess x + 6√2 = (a + √b)² with 2a√b = 6√2: a = 3, b = 2 ⇒ x = 9 + 2 = 11.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-13.shtml"}, {"id": "2024-S2-Q14", "year": 2024, "slot": 2, "q_no": 14, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – inradius", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 35.71% correct", "question": "A triangle has vertices (1, 2), (7, 2) and (1, 10). Find the radius of its incircle.", "options": [], "answer": "2", "answer_note": "", "concept": "The triangle is right-angled; use r = Area/semi-perimeter or the right-triangle shortcut.", "formulas": ["r = Area / s", "For a right triangle: r = (a + b − c)/2"], "solution": ["1. Sides: from (1, 2) to (7, 2) is 6; from (1, 2) to (1, 10) is 8; the third side is √(36 + 64) = 10.", "2. The triangle is right-angled at (1, 2).", "3. Area = ½ × 6 × 8 = 24, semi-perimeter s = (6 + 8 + 10)/2 = 12.", "4. r = 24/12 = 2."], "shortcut": "Right triangle: r = (6 + 8 − 10)/2 = 2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2024-Question-Paper-Slot-2-Quant/quants-question-14.shtml"}, {"id": "2024-S2-Q15", "year": 2024, "slot": 2, "q_no": 15, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound vs simple interest", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 40.25% correct", "question": "A
