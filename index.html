tio 1 : 2 : 3. The winner got 2512 more votes than the candidate who came second. How many voters were registered?", "options": ["50240", "40192", "60288", "62800"], "answer": "62800", "answer_note": "", "concept": "Express every candidate's votes as a percentage of registered voters to see who wins and who comes second.", "formulas": ["Share in ratio a : b : c = part × a/(a + b + c)"], "solution": ["1. Let registered voters = 100k; votes cast = 80k.", "2. One candidate gets 30% of 80k = 24k; the rest 56k split 1 : 2 : 3 gives 28k/3, 56k/3 and 28k.", "3. Winner = 28k, runner-up = 24k (since 56k/3 ≈ 18.7k < 24k).", "4. 28k − 24k = 4k = 2512, so k = 628.", "5. Registered voters = 100k = 62800."], "shortcut": "The gap is 4% of registered voters, so the total is 2512 × 25 = 62800.", "source_url": "https://cracku.in/56-in-an-election-there-were-four-candidates-and-80-o-x-cat-2022-slot-2"}, {"id": "2022-S2-Q13", "year": 2022, "slot": 2, "q_no": 13, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recursive growth sequence", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A laboratory experiment begins with 100 particles on day 1. On each day n (n ≥ 2), one out of every n particles present creates one new particle. If the number of particles reaches 1000 on day m, find m.", "options": ["19", "16", "18", "17"], "answer": "19", "answer_note": "", "concept": "Compute the first few days to spot the pattern: the daily increase stays constant, so the total forms an arithmetic progression.", "formulas": ["Pₙ = Pₙ₋₁ + Pₙ₋₁/n", "AP: Tₘ = a + (m − 1)d"], "solution": ["1. Day 2: 100 + 100/2 = 150. Day 3: 150 + 150/3 = 200. Day 4: 200 + 200/4 = 250.", "2. Each day Pₙ = Pₙ₋₁ × (n + 1)/n, which telescopes to Pₙ = 100 × (n + 1)/2 = 50(n + 1).", "3. So the total rises by 50 each day, and Pₘ = 50(m + 1) = 1000 gives m + 1 = 20.", "4. m = 19."], "shortcut": "900 extra particles at 50 per day takes 18 days after day 1, so it is day 19.", "source_url": "https://cracku.in/57-on-day-one-there-are-100-particles-in-a-laboratory-x-cat-2022-slot-2"}, {"id": "2022-S2-Q14", "year": 2022, "slot": 2, "q_no": 14, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Forming numbers with distinct digits", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Using the digits 0, 1, 2, 3, 4 and 5, with no digit used more than once, how many integers greater than 2000 can be formed?", "options": ["1440", "1200", "1480", "1420"], "answer": "1440", "answer_note": "", "concept": "Count by number of digits: 4-digit numbers must start with 2–5 (and exceed 2000), while every valid 5- and 6-digit number exceeds 2000.", "formulas": ["Arrangements of r from n distinct objects = nPr"], "solution": ["1. 4-digit numbers: first digit from {2, 3, 4, 5} (4 ways), then 5 × 4 × 3 = 60 ways for the rest → 240. (2000 itself repeats 0, so every one of these exceeds 2000.)", "2. 5-digit numbers: first digit non-zero (5 ways), then 5 × 4 × 3 × 2 = 120 → 600.", "3. 6-digit numbers: first digit non-zero (5 ways), then 5! = 120 → 600.", "4. Total = 240 + 600 + 600 = 1440."], "shortcut": "", "source_url": "https://cracku.in/58-the-number-of-integers-greater-than-2000-that-can--x-cat-2022-slot-2"}, {"id": "2022-S2-Q15", "year": 2022, "slot": 2, "q_no": 15, "area": "Number System", "topic": "Number System", "subtopic": "Factorials – divisibility", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "n is a natural number such that (15000)! is divisible by (n!)!. What is the greatest possible value of n?", "options": ["4", "7", "6", "5"], "answer": "7", "answer_note": "", "concept": "For natural numbers, a! divides b! exactly when a ≤ b, so we need the largest n with n! ≤ 15000.", "formulas": ["a! | b! ⇔ a ≤ b"], "solution": ["1. (n!)! divides (15000)! iff n! ≤ 15000.", "2. 7! = 5040 ≤ 15000.", "3. 8! = 40320 > 15000.", "4. Largest n = 7."], "shortcut": "", "source_url": "https://cracku.in/59-for-some-natural-number-n-assume-that-15000-is-div-x-cat-2022-slot-2"}, {"id": "2022-S2-Q16", "year": 2022, "slot": 2, "q_no": 16, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – ratio of times", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Anu, Tanu and Manu take times in the ratio 5 : 8 : 10 to finish a piece of work individually. Working together for 8 hours a day, they complete it in 4 days. Suppose Anu and Tanu work together for the first 6 days, putting in 6 hours 40 minutes each day, and then Manu alone completes the rest. How many hours will Manu need?", "options": [], "answer": "6", "answer_note": "", "concept": "Use the time ratio to get individual times, then convert all work into hours of effort.", "formulas": ["Rate = 1/time", "Work = rate × time"], "solution": ["1. Let individual times be 5k, 8k, 10k hours. Combined rate = 1/(5k) + 1/(8k) + 1/(10k) = 17/(40k).", "2. Together they take 32 hours (4 days × 8 h), so 17 × 32/(40k) = 1 → k = 68/5; times are 68, 108.8 and 136 hours.", "3. Anu + Tanu work 6 × 20/3 = 40 hours: work done = 40(1/68 + 5/544) = 40 × 13/544 = 65/68.", "4. Remaining work = 3/68. Manu needs (3/68) × 136 = 6 hours."], "shortcut": "", "source_url": "https://cracku.in/60-working-alone-the-times-taken-by-anu-tanu-and-manu-x-cat-2022-slot-2"}, {"id": "2022-S2-Q17", "year": 2022, "slot": 2, "q_no": 17, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – repeated transfer", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two containers have equal capacity. The first is half full of sugar syrup and the second is half full of milk. First, half of what is in the first container is poured into the second. Next, half of the second container's contents is poured into the first. Finally, half of the first container's contents is poured into the second. What is the ratio of sugar syrup to milk in the second container now?", "options": ["4 : 5", "6 : 5", "5 : 4", "5 : 6"], "answer": "5 : 6", "answer_note": "", "concept": "Track the syrup and milk quantities in each container step by step, assuming each transfer carries the mixture in the same proportion as the container.", "formulas": ["Transferred fraction of a mixture carries each component in the same proportion"], "solution": ["1. Take capacity = 16 units: C1 = 8 syrup, C2 = 8 milk.", "2. Pour half of C1 (4 syrup) into C2: C1 = 4S; C2 = 4S + 8M.", "3. Pour half of C2 (2S + 4M) into C1: C1 = 6S + 4M; C2 = 2S + 4M.", "4. Pour half of C1 (3S + 2M) into C2: C2 = 5S + 6M.", "5. Syrup : milk in C2 = 5 : 6."], "shortcut": "", "source_url": "https://cracku.in/61-there-are-two-containers-of-the-same-volume-first--x-cat-2022-slot-2"}, {"id": "2022-S2-Q18", "year": 2022, "slot": 2, "q_no": 18, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Sum of AP partial sums", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For the arithmetic progression 3, 7, 11, …, let Aₙ be the sum of its first n terms. Find (1/25) × (A₁ + A₂ + … + A₂₅).", "options": ["455", "442", "415", "404"], "answer": "455", "answer_note": "", "concept": "Write Aₙ as a quadratic in n and sum it using the standard Σn and Σn² formulas.", "formulas": ["Sₙ = n/2 [2a + (n − 1)d]", "Σn = n(n + 1)/2", "Σn² = n(n + 1)(2n + 1)/6"], "solution": ["1. a = 3, d = 4, so Aₙ = n/2 (6 + 4n − 4) = n(2n + 1) = 2n² + n.", "2. Σ (n = 1 to 25) n² = 25 × 26 × 51/6 = 5525; Σ n = 325.", "3. Σ Aₙ = 2 × 5525 + 325 = 11375.", "4. Divide by 25: 11375/25 = 455."], "shortcut": "(1/25)ΣAₙ = 2 × 26 × 51/6 + 26/2 = 442 + 13 = 455.", "source_url": "https://cracku.in/62-consider-the-arithmetic-progression-3-7-11-and-let-x-cat-2022-slot-2"}, {"id": "2022-S2-Q19", "year": 2022, "slot": 2, "q_no": 19, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithmic inequality", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many distinct integers n satisfy the inequality (4 − log₂ n)/(3 − log₄ n) < 0?", "options": [], "answer": "47", "answer_note": "", "concept": "Convert both logarithms to the same base, then solve the rational inequality by sign analysis.", "formulas": ["log₄ n = (log₂ n)/2", "p/q < 0 ⇔ p and q have opposite signs"], "solution": ["1. Let t = log₂ n (n > 0). Then log₄ n = t/2, and the expression becomes (4 − t)/(3 − t/2) = 2(4 − t)/(6 − t).", "2. (4 − t)/(6 − t) < 0 holds exactly when 4 < t < 6.", "3. So 2⁴ < n < 2⁶, i.e. 16 < n < 64.", "4. Integers 17 to 63: 63 − 17 + 1 = 47."], "shortcut": "", "source_url": "https://cracku.in/63-the-number-of-distinct-integer-values-of-n-satisfy-x-cat-2022-slot-2"}, {"id": "2022-S2-Q20", "year": 2022, "slot": 2, "q_no": 20, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Max/min of a linear expression", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "a and b are non-negative real numbers with a + 2b = 6. What is the average of the largest and smallest possible values of a + b?", "options": ["3", "4", "3.5", "4.5"], "answer": "4.5", "answer_note": "", "concept": "Substitute the constraint so a + b becomes a linear function of one variable; its extremes occur at the ends of the allowed range.", "formulas": ["A linear function on an interval attains its max/min at the endpoints"], "solution": ["1. a = 6 − 2b ≥ 0 gives 0 ≤ b ≤ 3.", "2. a + b = 6 − b.", "3. Maximum = 6 (b = 0), minimum = 3 (b = 3).", "4. Average = (6 + 3)/2 = 4.5."], "shortcut": "", "source_url": "https://cracku.in/64-if-a-and-b-are-non-negative-real-numbers-such-that-x-cat-2022-slot-2"}, {"id": "2022-S2-Q21", "year": 2022, "slot": 2, "q_no": 21, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – max/min with constraints", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Five students, one of them Amit, take an exam where each score is an integer from 0 to 50 (inclusive). The five scores are all different, their average is 38, exactly three of the students scored above 32, and Amit's score is the lowest of the five. What is the difference between the highest and the lowest score Amit could possibly have?", "options": ["22", "21", "24", "20"], "answer": "20", "answer_note": "", "concept": "Total is fixed at 190; minimise Amit by maximising the others, and maximise Amit subject to him being below the fourth student, who must score at most 32.", "formulas": ["Sum = average × count"], "solution": ["1. Total of the five scores = 5 × 38 = 190. Exactly three are above 32, so the other two (Amit and one more, say X) are ≤ 32, with Amit < X.", "2. Minimum Amit: make the others as large as possible: 50 + 49 + 48 + 32 = 179, so Amit = 190 − 179 = 11.", "3. Maximum Amit: Amit < X ≤ 32 gives Amit ≤ 31. With Amit = 31, X = 32, the top three must sum to 127 (e.g. 41, 42, 44), which is possible.", "4. Difference = 31 − 11 = 20."], "shortcut": "", "source_url": "https://cracku.in/65-five-students-including-amit-appear-for-an-examina-x-cat-2022-slot-2"}, {"id": "2022-S2-Q22", "year": 2022, "slot": 2, "q_no": 22, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – area ratio & cosine rule", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "ABC is an equilateral triangle with side 3 cm. Point D lies on BC such that the area of triangle ADC is half the area of triangle ABD. Find the length of AD in cm.", "options": ["√8", "√6", "√7", "√5"], "answer": "√7", "answer_note": "", "concept": "Triangles with the same apex and bases on the same line have areas in the ratio of their bases; then apply the cosine rule.", "formulas": ["Area ratio = base ratio (same height)", "c² = a² + b² − 2ab cos C"], "solution": ["1. ADC and ABD share the height from A, so CD : BD = 1 : 2, giving CD = 1 and BD = 2.", "2. In triangle ADC: AC = 3, CD = 1, ∠C = 60°.", "3. AD² = 9 + 1 − 2 × 3 × 1 × cos 60° = 10 − 3 = 7.", "4. AD = √7 cm."], "shortcut": "With the foot of the altitude M at the midpoint of BC, AM² = 27/4 and DM = 1/2, so AD² = 27/4 + 1/4 = 7.", "source_url": "https://cracku.in/66-the-length-of-each-side-of-an-equilateral-triangle-x-cat-2022-slot-2"}, {"id": "2022-S3-Q01", "year": 2022, "slot": 3, "q_no": 1, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Discriminant – nature of roots", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "k is an integer for which the quadratic 2x² + kx + 5 = 0 has no real roots, while the quadratic x² + (k − 5)x + 1 = 0 has two different real roots. How many values can k take?", "options": ["7", "8", "9", "13"], "answer": "9", "answer_note": "", "concept": "Nature of roots of a quadratic is decided by the sign of its discriminant; combine the two resulting conditions on the integer k.", "formulas": ["ax² + bx + c = 0 has no real roots ⇔ b² − 4ac < 0", "two distinct real roots ⇔ b² − 4ac > 0"], "solution": ["1. No real roots for 2x² + kx + 5 = 0: k² − 40 < 0, so |k| ≤ 6 for integers, i.e. k ∈ {−6, …, 6} (13 values).", "2. Distinct real roots for x² + (k − 5)x + 1 = 0: (k − 5)² − 4 > 0, so |k − 5| > 2, i.e. k < 3 or k > 7.", "3. Intersect: k ∈ {−6, −5, …, 2}; k > 7 is impossible since k ≤ 6.", "4. Count: from −6 to 2 there are 9 integers."], "shortcut": "From 13 candidates (−6..6) drop 3, 4, 5, 6 (those with |k − 5| ≤ 2): 13 − 4 = 9.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-1.shtml"}, {"id": "2022-S3-Q02", "year": 2022, "slot": 3, "q_no": 2, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Minimum of rational function – AM-GM", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For real x with x < 3, find the least possible value of (x² − 6x + 10) / (3 − x).", "options": ["1/2", "−1/2", "2", "−2"], "answer": "2", "answer_note": "", "concept": "Rewrite the numerator around (3 − x) so the expression becomes t + 1/t with t > 0, then use AM ≥ GM.", "formulas": ["x² − 6x + 10 = (x − 3)² + 1", "t + 1/t ≥ 2 for t > 0, equality at t = 1"], "solution": ["1. Let t = 3 − x; since x < 3, t > 0.", "2. Numerator = (x − 3)² + 1 = t² + 1.", "3. Expression = (t² + 1)/t = t + 1/t.", "4. By AM ≥ GM, t + 1/t ≥ 2, with equality at t = 1 (x = 2).", "5. Minimum value = 2."], "shortcut": "Plug x = 2: (4 − 12 + 10)/1 = 2; the expression is positive for x < 3, so negative options are out.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-2.shtml"}, {"id": "2022-S3-Q03", "year": 2022, "slot": 3, "q_no": 3, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Work in rotating pairs", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Bob alone can complete a job in 40 days. Alex works twice as fast as Bob and three times as fast as Cole. They work in a repeating 3-day schedule: on day 1 Alex and Bob work, on day 2 Bob and Cole work, on day 3 Cole and Alex work, and then the cycle repeats. For how many days in total does Alex work until the job is done?", "options": [], "answer": "11", "answer_note": "", "concept": "Assign efficiencies as integers, find work per cycle, then run whole cycles and finish off with partial days.", "formulas": ["Total work = efficiency × time", "Work per cycle = sum of daily pair outputs"], "solution": ["1. Ratios: Alex : Bob = 2 : 1 and Alex : Cole = 3 : 1, so Alex = 6, Bob = 3, Cole = 2 units/day.", "2. Total work = Bob's rate × 40 = 3 × 40 = 120 units.", "3. Daily outputs in a cycle: (A+B) = 9, (B+C) = 5, (C+A) = 8; one 3-day cycle = 22 units.", "4. 5 cycles = 15 days = 110 units; 10 units remain.", "5. Day 16 (Alex + Bob) does 9 units → 119; day 17 (Bob + Cole) finishes the last unit.", "6. Alex works 2 days per cycle × 5 = 10, plus day 16 → 11 days."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-3.shtml"}, {"id": "2022-S3-Q04", "year": 2022, "slot": 3, "q_no": 4, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – back-and-forth transfer", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A glass has 500 cc of milk and a cup has 500 cc of water. 150 cc of milk is poured from the glass into the cup and mixed well. Then 150 cc of the mixture in the cup is poured back into the glass. What is the ratio of the water now in the glass to the milk now in the cup?", "options": ["3 : 10", "10 : 3", "1 : 1", "10 : 13"], "answer": "1 : 1", "answer_note": "", "concept": "After an exchange that leaves both containers with their original volumes, whatever water entered the glass must equal the milk that stayed in the cup.", "formulas": ["Quantity of a component moved = volume moved × its fraction in the mixture"], "solution": ["1. After step 1: cup has 150 cc milk + 500 cc water = 650 cc.", "2. 150 cc of cup mixture carries water = 150 × 500/650 = 1500/13 cc and milk = 150 × 150/650 = 450/13 cc.", "3. Water in glass = 1500/13 cc.", "4. Milk left in cup = 150 − 450/13 = 1500/13 cc.", "5. Ratio = 1 : 1."], "shortcut": "Both vessels end at 500 cc, so the water that left the cup must be replaced by an equal amount of milk: ratio is always 1 : 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-4.shtml"}, {"id": "2022-S3-Q05", "year": 2022, "slot": 3, "q_no": 5, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Weighted average – integer condition", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "In an exam, section A students average 32 marks and section B students average 60 marks. Section A has 10 fewer students than section B. If the overall average of both sections together is an integer, find the difference between the largest and smallest possible number of students in section A.", "options": [], "answer": "63", "answer_note": "", "concept": "Write the combined average as a function of n and force the fractional part to vanish, which reduces to a divisibility condition on n.", "formulas": ["Combined average = (n₁a₁ + n₂a₂)/(n₁ + n₂)"], "solution": ["1. Let A have n students, B has n + 10.", "2. Combined average = (32n + 60(n + 10))/(2n + 10) = (92n + 600)/(2n + 10) = (46n + 300)/(n + 5).", "3. (46n + 300)/(n + 5) = 46 + 70/(n + 5).", "4. So (n + 5) must divide 70, with n ≥ 1: n + 5 ∈ {7, 10, 14, 35, 70}, i.e. n ∈ {2, 5, 9, 30, 65}.", "5. Difference = 65 − 2 = 63."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-5.shtml"}, {"id": "2022-S3-Q06", "year": 2022, "slot": 3, "q_no": 6, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Piecewise function – composition", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let r be a real number and define f(x) = 2x − r when x ≥ r, and f(x) = r when x < r. The equality f(x) = f(f(x)) holds for all real x satisfying", "options": ["x ≤ r", "x ≥ r", "x > r", "x ≠ r"], "answer": "x ≤ r", "answer_note": "", "concept": "Evaluate the composition separately on each branch of the piecewise definition and check where the two sides agree.", "formulas": ["f(f(x)) depends on which branch f(x) lands in"], "solution": ["1. If x < r: f(x) = r, and f(r) = 2r − r = r, so f(f(x)) = r = f(x). Holds.", "2. If x = r: f(r) = r, so f(f(r)) = f(r) = r. Holds.", "3. If x > r: f(x) = 2x − r > r, so f(f(x)) = 2(2x − r) − r = 4x − 3r.", "4. Equality 4x − 3r = 2x − r gives x = r, contradicting x > r. Fails.", "5. Hence it holds exactly for x ≤ r."], "shortcut": "Test r = 0: f(x) = 2x for x ≥ 0, 0 otherwise; x = 1 fails (2 vs 4), x = −1 and 0 work → x ≤ r.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-6.shtml"}, {"id": "2022-S3-Q07", "year": 2022, "slot": 3, "q_no": 7, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – medians & centroid areas", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In triangle ABC the medians BD and CE meet at O. If the area of triangle ABC is 108 sq cm, find the area (in sq cm) of triangle EOD.", "options": [], "answer": "9", "answer_note": "", "concept": "E and D are midpoints, so ED ∥ BC and triangle EOD is similar to triangle COB with ratio 1 : 2; centroid area facts finish it.", "formulas": ["Centroid divides each median 2 : 1", "Triangle BOC = (1/3) area of ABC", "Midpoint segment ED ∥ BC and ED = BC/2"], "solution": ["1. O is the centroid, so area(BOC) = 108/3 = 36.", "2. ED joins midpoints of AC and AB, so ED ∥ BC and ED = BC/2.", "3. Triangles EOD and COB are similar (alternate angles) with ratio 1 : 2.", "4. Area(EOD) = 36 × (1/2)² = 9 sq cm."], "shortcut": "Area(EOD) is always 1/12 of the triangle: 108/12 = 9.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-7.shtml"}, {"id": "2022-S3-Q08", "year": 2022, "slot": 3, "q_no": 8, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Permutations with repetition – sum of numbers", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Find the arithmetic mean of all the distinct four-digit numbers that can be formed by rearranging the digits of 1421 (including 1421 itself).", "options": ["2442", "2222", "3333", "2592"], "answer": "2222", "answer_note": "", "concept": "By symmetry, each place value has the same average digit, equal to the average of the digits, so the mean is that average times 1111.", "formulas": ["Distinct arrangements = 4!/2! = 12", "Mean = (average digit) × 1111"], "solution": ["1. Digits 1, 1, 2, 4; distinct arrangements = 4!/2! = 12.", "2. In each place, the digit 1 appears 6 times, 2 appears 3 times, 4 appears 3 times.", "3. Average digit in each place = (6×1 + 3×2 + 3×4)/12 = 24/12 = 2.", "4. Mean = 2 × 1111 = 2222."], "shortcut": "Average digit = (1+1+2+4)/4 = 2 → 2222.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-8.shtml"}, {"id": "2022-S3-Q09", "year": 2022, "slot": 3, "q_no": 9, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest – split investment", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Nitu has ₹20000. She puts ₹8000 in bank A at 5.5% per annum simple interest and ₹5000 in bank B at 5.6% per annum simple interest. The remaining money goes into bank C at some rate of simple interest per annum. Her total yearly interest from the three banks equals 5% of ₹20000. What yearly interest would she have earned had she put all ₹20000 in bank C?", "options": ["₹900", "₹700", "₹1000", "₹800"], "answer": "₹800", "answer_note": "", "concept": "Find bank C's interest by subtracting the A and B interests from the total, deduce C's rate, and apply it to the whole capital.", "formulas": ["SI for 1 year = P × R/100"], "solution": ["1. Total yearly interest = 5% of 20000 = ₹1000.", "2. Bank A: 8000 × 5.5% = ₹440; bank B: 5000 × 5.6% = ₹280.", "3. Bank C (₹7000) earns 1000 − 720 = ₹280, so its rate is 280/7000 = 4%.", "4. All ₹20000 in C: 20000 × 4% = ₹800."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-9.shtml"}, {"id": "2022-S3-Q10", "year": 2022, "slot": 3, "q_no": 10, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative speed – meeting times", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two cars start together from two different places and move at constant speeds. Moving towards each other they meet in 1.5 hours; moving in the same direction (faster car behind) they meet in 10.5 hours. The slower car's speed is 60 km/h. How many km does the slower car travel before they meet when moving towards each other?", "options": ["150", "100", "90", "120"], "answer": "90", "answer_note": "", "concept": "The initial gap is covered at the sum of speeds head-on and at the difference of speeds in the same direction.", "formulas": ["Gap = (u + v) × t₁ = (u − v) × t₂"], "solution": ["1. Let faster speed = u. Gap = 1.5(u + 60) = 10.5(u − 60).", "2. u + 60 = 7(u − 60) ⇒ 6u = 480 ⇒ u = 80 km/h.", "3. Head-on, the slower car runs for 1.5 h.", "4. Distance = 60 × 1.5 = 90 km."], "shortcut": "The slower car simply travels 60 × 1.5 = 90 km; the faster speed is not even needed.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-10.shtml"}, {"id": "2022-S3-Q11", "year": 2022, "slot": 3, "q_no": 11, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equations", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "It is given that (√(7/5))^(3x − y) = 875/2401 and (4a/b)^(6x − y) = (2a/b)^(y − 6x) for every pair of non-zero real numbers a and b. Find x + y.", "options": [], "answer": "14", "answer_note": "", "concept": "Express both sides with a common base; an identity valid for all a, b forces the exponent to be zero.", "formulas": ["(p/q)^(−n) = (q/p)^n", "If c^m = 1 for many different c, then m = 0"], "solution": ["1. 875/2401 = (5³ × 7)/7⁴ = 5³/7³ = (7/5)^(−3).", "2. Left side = (7/5)^((3x − y)/2), so (3x − y)/2 = −3 ⇒ 3x − y = −6.", "3. Second equation: (4a/b)^(6x − y) × (2a/b)^(6x − y) = 1 ⇒ (8a²/b²)^(6x − y) = 1 for all non-zero a, b.", "4. Since 8a²/b² can be any positive number, 6x − y = 0 ⇒ y = 6x.", "5. 3x − 6x = −6 ⇒ x = 2, y = 12; x + y = 14."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-11.shtml"}, {"id": "2022-S3-Q12", "year": 2022, "slot": 3, "q_no": 12, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Escalator problems", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Walking on a moving escalator in its direction of motion at his usual speed, Moody completes the ride in 30 seconds. Walking at twice his usual speed, he completes it in 20 seconds. How many seconds would he take if he just stood on the escalator?", "options": [], "answer": "60", "answer_note": "", "concept": "The escalator length is fixed; effective speed = escalator speed + walking speed.", "formulas": ["Length = (e + w) × time"], "solution": ["1. Let escalator speed e, walking speed w, length L.", "2. L = 30(e + w) = 20(e + 2w).", "3. 30e + 30w = 20e + 40w ⇒ e = w.", "4. L = 30 × 2e = 60e, so standing still takes L/e = 60 seconds."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-12.shtml"}, {"id": "2022-S3-Q13", "year": 2022, "slot": 3, "q_no": 13, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – maximising with distinct integers", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Six different natural numbers are such that the average of the smallest two is 14 and the average of the largest two is 28. What is the greatest possible average of all six numbers?", "options": ["22.5", "23.5", "24", "23"], "answer": "22.5", "answer_note": "", "concept": "Sums of the extreme pairs are fixed; to maximise the total, push the middle two as high as possible, which needs the smaller of the top two to be as large as possible.", "formulas": ["Average = sum / count"], "solution": ["1. Smallest two sum to 28; largest two sum to 56.", "2. The middle numbers c < d must both be less than the 5th number e.", "3. With e + f = 56 and e < f, the largest e is 27 (f = 29).", "4. Then the best middle pair is 25, 26 (and the bottom pair, e.g. 13 and 15, stays below 25).", "5. Max total = 28 + 25 + 26 + 56 = 135; average = 135/6 = 22.5."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-13.shtml"}, {"id": "2022-S3-Q14", "year": 2022, "slot": 3, "q_no": 14, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Irrational roots – conjugates", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "3 + 2√2 is a root of ax² + bx + c = 0 and 4 + 2√3 is a root of ay² + my + n = 0, where a, b, c, m, n are integers. Find the value of b/m + (c − 2b)/n.", "options": ["3", "1", "4", "0"], "answer": "4", "answer_note": "", "concept": "For integer coefficients, irrational roots occur in conjugate pairs, so each quadratic is a multiple of the monic one built from the pair.", "formulas": ["Sum of roots = −b/a, product = c/a", "Conjugate root theorem for p + √q"], "solution": ["1. First equation roots: 3 ± 2√2; sum 6, product 9 − 8 = 1. So b = −6a, c = a.", "2. Second equation roots: 4 ± 2√3; sum 8, product 16 − 12 = 4. So m = −8a, n = 4a.", "3. b/m = (−6a)/(−8a) = 3/4.", "4. (c − 2b)/n = (a + 12a)/(4a) = 13/4.", "5. Sum = 3/4 + 13/4 = 4."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-14.shtml"}, {"id": "2022-S3-Q15", "year": 2022, "slot": 3, "q_no": 15, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Range – AM-GM with sign", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "If c = 16x/y + 49y/x for some non-zero real numbers x and y, which of the following values can c NOT take?", "options": ["−70", "60", "−50", "−60"], "answer": "−50", "answer_note": "", "concept": "With t = x/y, c = 16t + 49/t; AM-GM gives |c| ≥ 56, so values strictly between −56 and 56 are impossible.", "formulas": ["For t > 0: 16t + 49/t ≥ 2√(16 × 49) = 56", "For t < 0: 16t + 49/t ≤ −56"], "solution": ["1. Put t = x/y (any non-zero real): c = 16t + 49/t.", "2. For t > 0, AM ≥ GM gives c ≥ 2√784 = 56.", "3. For t < 0, by symmetry c ≤ −56.", "4. So c ∈ (−∞, −56] ∪ [56, ∞); all such values are attainable.", "5. −50 lies in (−56, 56), so c cannot be −50."], "shortcut": "Only one option has |value| < 56.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-15.shtml"}, {"id": "2022-S3-Q16", "year": 2022, "slot": 3, "q_no": 16, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Man-hours – work equivalence", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "N people working 7 hours a day for 10 days complete 35% of a project. Then 10 of them leave, and the rest complete the remaining work in 14 days working 10 hours a day. Find N.", "options": ["23", "140", "36", "150"], "answer": "140", "answer_note": "", "concept": "Work done is proportional to person-hours; equate person-hours per percent of work in both phases.", "formulas": ["Work ∝ people × hours/day × days"], "solution": ["1. Phase 1: 70N person-hours give 35% of the work.", "2. Phase 2: 140(N − 10) person-hours give 65%.", "3. Person-hours per 1% must be equal: 70N/35 = 140(N − 10)/65 ⇒ 130N = 140N − 1400.", "4. 10N = 1400 ⇒ N = 140."], "shortcut": "Check option 140: 9800 person-hours per 35% → 280 per %; 130 × 140 = 18200 = 280 × 65. ✓", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-16.shtml"}, {"id": "2022-S3-Q17", "year": 2022, "slot": 3, "q_no": 17, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – average of terms in a range", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The arithmetic progression 38, 55, 72, … continues indefinitely. Find the average of all its terms that are three-digit numbers.", "options": [], "answer": "548", "answer_note": "", "concept": "Terms of an AP within a range form an AP themselves, whose average is the average of its first and last terms.", "formulas": ["tₙ = a + (n − 1)d", "Average of an AP = (first + last)/2"], "solution": ["1. General term = 38 + 17k = 17(k + 2) + 4, i.e. numbers ≡ 4 (mod 17).", "2. First three-digit term: 106 (38 + 4×17).", "3. Last three-digit term: 990 (≤ 999; next is 1007).", "4. Average = (106 + 990)/2 = 548."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-17.shtml"}, {"id": "2022-S3-Q18", "year": 2022, "slot": 3, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – overlapping area", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Triangle ABC has AB = AC = 8 cm. The circle with BC as diameter passes through A, and another circle with centre A passes through B and C. Find the area (in sq cm) of the region common to both circles.", "options": ["16(π − 1)", "32(π − 1)", "32π", "16π"], "answer": "32(π − 1)", "answer_note": "", "concept": "Angle in a semicircle makes ∠A = 90°; the overlap is the half of the small circle on A's side of BC plus the segment of the big circle cut off by chord BC.", "formulas": ["Angle in a semicircle = 90°", "Segment area = (θ/360)πR² − (1/2)R² sin θ"], "solution": ["1. A lies on the circle with diameter BC ⇒ ∠BAC = 90°, so BC = 8√2 and the small circle's radius is 4√2.", "2. Big circle: centre A, radius 8; chord BC subtends 90° at A, and the small circle's centre is the midpoint of BC.", "3. On A's side of BC, the half of the small circle lies inside the big circle (its farthest point from A is at distance ≤ 8). On the other side, the big circle's minor segment on BC lies inside the small circle.", "4. Half of small circle = (1/2)π(4√2)² = 16π.", "5. Big-circle segment on chord BC = (1/4)π(8²) − (1/2)(8)(8) = 16π − 32.", "6. Overlap = 16π + 16π − 32 = 32(π − 1)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-18.shtml"}, {"id": "2022-S3-Q19", "year": 2022, "slot": 3, "q_no": 19, "area": "Number System", "topic": "Number System", "subtopic": "Remainders – LCM & CRT", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A school has fewer than 5000 students. Dividing them into equal teams of 9, of 10, of 12, or of 25 always leaves exactly 4 students out, while dividing them into teams of 11 leaves nobody out. What is the maximum number of teams of 12 that can be formed?", "options": [], "answer": "150", "answer_note": "", "concept": "A common remainder for several divisors means N − remainder is a multiple of their LCM; then impose divisibility by 11.", "formulas": ["N ≡ r (mod each dᵢ) ⇒ N = LCM(dᵢ)·k + r"], "solution": ["1. LCM(9, 10, 12, 25) = 900, so N = 900k + 4.", "2. Candidates below 5000: 904, 1804, 2704, 3604, 4504.", "3. 900k + 4 ≡ 9k + 4 ≡ 0 (mod 11) ⇒ 9k ≡ 7 ⇒ k ≡ 2 (mod 11), so k = 2, N = 1804.", "4. 1804 = 12 × 150 + 4, so 150 teams of 12."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-19.shtml"}, {"id": "2022-S3-Q20", "year": 2022, "slot": 3, "q_no": 20, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Integer solutions – maximisation", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A donation box takes only cheques of ₹100, ₹250 and ₹500. One day it held exactly 100 cheques worth ₹15250 in total. What is the largest possible number of ₹500 cheques?", "options": [], "answer": "12", "answer_note": "", "concept": "Eliminate one variable using the count equation, reduce to a linear Diophantine equation, and maximise under non-negativity.", "formulas": ["a + b + c = 100", "100a + 250b + 500c = 15250"], "solution": ["1. Let a, b, c be numbers of ₹100, ₹250, ₹500 cheques; divide the value equation by 50: 2a + 5b + 10c = 305.", "2. Substitute a = 100 − b − c: 200 + 3b + 8c = 305 ⇒ 3b + 8c = 105.", "3. 8c must make 105 − 8c divisible by 3 ⇒ c ≡ 0 (mod 3); also 8c ≤ 105 ⇒ c ≤ 13.", "4. Largest valid c = 12, giving b = 3, a = 85 (all non-negative).", "5. Maximum ₹500 cheques = 12."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-20.shtml"}, {"id": "2022-S3-Q21", "year": 2022, "slot": 3, "q_no": 21, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – 30-60-90 & relative motion", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Two ships head straight towards a port at constant speeds. At the start, the two ships and the port are the vertices of an equilateral triangle of side 24 km. When the slower ship has moved 8 km, the triangle formed by the two ships and the port is right-angled. When the faster ship reaches the port, how far (in km) is the other ship from the port?", "options": ["8", "12", "6", "4"], "answer": "12", "answer_note": "", "concept": "The angle at the port stays 60°; a right-angled triangle with a 60° angle is 30-60-90, which fixes the faster ship's position and hence the speed ratio.", "formulas": ["In a 30-60-90 triangle, the side adjacent to 60° = (1/2) hypotenuse"], "solution": ["1. Port angle stays 60°. Slower ship is now 24 − 8 = 16 km from the port; faster ship is d < 16 km away (it moved more).", "2. The right angle cannot be at the slower ship (that would need d = 32). So it is at the faster ship: d = 16 cos 60° = 8 km.", "3. In the same time the faster ship moved 16 km and the slower 8 km ⇒ speed ratio 2 : 1.", "4. When the faster ship covers 24 km, the slower covers 12 km.", "5. Distance of slower ship from port = 24 − 12 = 12 km."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-21.shtml"}, {"id": "2022-S3-Q22", "year": 2022, "slot": 3, "q_no": 22, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Quadrilateral – side-length inequality", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "All four sides of a quadrilateral have integer lengths (in cm). Three of the sides are 1 cm, 2 cm and 4 cm. How many different values are possible for the length of the fourth side?", "options": ["6", "4", "5", "3"], "answer": "5", "answer_note": "", "concept": "A quadrilateral exists iff each side is less than the sum of the other three (largest side < sum of the rest).", "formulas": ["Each side < sum of the other three sides"], "solution": ["1. Let the fourth side be d (a positive integer).", "2. If d is the largest: d < 1 + 2 + 4 = 7 ⇒ d ≤ 6.", "3. If 4 is the largest: 4 < 1 + 2 + d ⇒ d > 1 ⇒ d ≥ 2.", "4. So d ∈ {2, 3, 4, 5, 6}: 5 values."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-3-Quant/quants-question-22.shtml"}, {"id": "2023-S1-Q01", "year": 2023, "slot": 1, "q_no": 1, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log equations", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "x and y are positive real numbers with log base x of (x² + 12) equal to 4, and 3·(log base y of x) equal to 1. What is x + y?", "options": ["20", "11", "68", "10"], "answer": "10", "answer_note": "", "concept": "Convert each log statement into an exponential equation and solve the resulting polynomial.", "formulas": ["logₐ b = c ⇔ aᶜ = b", "logᵧ x = 1/3 ⇔ x = y^(1/3)"], "solution": ["1. log_x(x² + 12) = 4 means x⁴ = x² + 12.", "2. Put t = x²: t² − t − 12 = 0 → (t − 4)(t + 3) = 0, so t = 4 (t must be positive).", "3. Hence x = 2 (x > 0).", "4. 3·log_y x = 1 → log_y x = 1/3 → x = y^(1/3) → y = x³ = 8.", "5. x + y = 2 + 8 = 10."], "shortcut": "Try x = 2: 16 = 4 + 12 works immediately; then y = 2³.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-1.shtml"}, {"id": "2023-S1-Q02", "year": 2023, "slot": 1, "q_no": 2, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum of squares equals zero", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Real numbers x and y satisfy x² + (x − 2y − 1)² = −4y(x + y). Find x − 2y.", "options": ["0", "1", "2", "−1"], "answer": "1", "answer_note": "", "concept": "Move everything to one side to get a sum of two perfect squares equal to zero; each square must then vanish.", "formulas": ["a² + b² = 0 with a, b real ⇒ a = b = 0", "(x + 2y)² = x² + 4xy + 4y²"], "solution": ["1. Move the right side over: x² + 4xy + 4y² + (x − 2y − 1)² = 0.", "2. The first three terms make (x + 2y)², so (x + 2y)² + (x − 2y − 1)² = 0.", "3. Both squares are non-negative, so each must be zero.", "4. x − 2y − 1 = 0 gives x − 2y = 1."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-2.shtml"}, {"id": "2023-S1-Q03", "year": 2023, "slot": 1, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Surd equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "If √(5x + 9) + √(5x − 9) = 3(2 + √2), what is the value of √(10x + 9)?", "options": ["4√5", "2√7", "3√31", "3√7"], "answer": "3√7", "answer_note": "", "concept": "Use the product (√a + √b)(√a − √b) = a − b to find the difference of the roots, then solve for each root.", "formulas": ["(√a + √b)(√a − √b) = a − b"], "solution": ["1. Let u = √(5x + 9), v = √(5x − 9). Then u + v = 3(2 + √2) and u² − v² = 18.", "2. u − v = 18 / [3(2 + √2)] = 6/(2 + √2) = 6(2 − √2)/2 = 3(2 − √2).", "3. Adding: 2u = 12 → u = 6, so 5x + 9 = 36 and x = 27/5.", "4. 10x + 9 = 54 + 9 = 63, so √63 = 3√7."], "shortcut": "Notice 3(2 + √2) = 6 + 3√2 = √36 + √18, so 5x + 9 = 36 directly.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-3.shtml"}, {"id": "2023-S1-Q04", "year": 2023, "slot": 1, "q_no": 4, "area": "Number System", "topic": "Number System", "subtopic": "Divisibility – prime factorisation", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "n is the smallest positive integer for which 1134ⁿ is divisible by 168. m is the smallest positive integer for which 168ᵐ is divisible by 1134ⁿ. Find m + n.", "options": ["12", "9", "15", "24"], "answer": "15", "answer_note": "", "concept": "Compare prime exponents of both numbers; divisibility requires every prime exponent of the divisor to be covered.", "formulas": ["a | b ⇔ for every prime p, exponent of p in a ≤ exponent in b"], "solution": ["1. 168 = 2³ × 3 × 7 and 1134 = 2 × 3⁴ × 7.", "2. 1134ⁿ = 2ⁿ × 3⁴ⁿ × 7ⁿ must cover 2³: need n ≥ 3 (3 and 7 are already fine). So n = 3.", "3. 1134³ = 2³ × 3¹² × 7³.", "4. 168ᵐ = 2³ᵐ × 3ᵐ × 7ᵐ must cover 3¹²: need m ≥ 12 (powers of 2 and 7 then also suffice).", "5. m + n = 12 + 3 = 15."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-4.shtml"}, {"id": "2023-S1-Q05", "year": 2023, "slot": 1, "q_no": 5, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus equations – integer solutions", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many integer values of x satisfy 2|x|(x² + 1) = 5x²?", "options": [], "answer": "3", "answer_note": "", "concept": "Use x² = |x|² to turn the equation into a polynomial in |x|, then check which roots are integers.", "formulas": ["x² = |x|²"], "solution": ["1. Let t = |x| ≥ 0. Then 2t(t² + 1) = 5t².", "2. t = 0 is a solution, giving x = 0.", "3. For t > 0: 2t² − 5t + 2 = 0 → (2t − 1)(t − 2) = 0 → t = 1/2 or t = 2.", "4. Only t = 2 is an integer value, giving x = ±2.", "5. Integer solutions: x = −2, 0, 2, so the count is 3."], "shortcut": "Do not forget x = 0 when dividing by |x|.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-5.shtml"}, {"id": "2023-S1-Q06", "year": 2023, "slot": 1, "q_no": 6, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sum and product of roots", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The roots of 2x² − 6x + k = 0 are α and β, and they are distinct. The numbers (α + β) and αβ are the distinct roots of x² + px + p = 0. Find 8(k − p).", "options": [], "answer": "6", "answer_note": "", "concept": "Apply Vieta's relations twice: once to get α + β and αβ, then to tie them to the second equation.", "formulas": ["For ax² + bx + c = 0: sum = −b/a, product = c/a"], "solution": ["1. From the first equation: α + β = 3, αβ = k/2.", "2. In the second equation the roots are 3 and k/2, so 3 + k/2 = −p and 3·(k/2) = p.", "3. Substitute p = 3k/2 into the first: 3 + k/2 = −3k/2 → 2k = −3 → k = −3/2.", "4. p = 3k/2 = −9/4.", "5. 8(k − p) = 8(−3/2 + 9/4) = 8 × 3/4 = 6.", "6. Check: the roots 3 and −3/4 are distinct, and 36 − 8k > 0, so α ≠ β."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-6.shtml"}, {"id": "2023-S1-Q07", "year": 2023, "slot": 1, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Cubic with known root – real roots", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "−2 is one root of x³ + (2r + 1)x² + (4r − 1)x + 2 = 0. If the remaining two roots are real, what is the smallest non-negative integer value r can take?", "options": [], "answer": "2", "answer_note": "", "concept": "Factor out (x + 2) to leave a quadratic, then require its discriminant to be non-negative.", "formulas": ["Real roots of ax² + bx + c ⇔ b² − 4ac ≥ 0"], "solution": ["1. Divide by (x + 2): the cubic equals (x + 2)(x² + (2r − 1)x + 1). Expanding confirms the coefficients.", "2. The other two roots come from x² + (2r − 1)x + 1 = 0.", "3. Real roots need (2r − 1)² − 4 ≥ 0 → |2r − 1| ≥ 2.", "4. So r ≥ 3/2 or r ≤ −1/2.", "5. The smallest non-negative integer is r = 2."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-7.shtml"}, {"id": "2023-S1-Q08", "year": 2023, "slot": 1, "q_no": 8, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Average speed – palindromes", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Brishti drove for 8 hours and her speed never went above 110 km/h. At the start the odometer showed a palindrome x km; at the end it showed 26862 km, which is also a palindrome. What is the highest possible average speed (in km/h)?", "options": ["90", "100", "80", "110"], "answer": "100", "answer_note": "", "concept": "The distance is limited to 8 × 110 = 880 km; find the smallest palindrome within that range below 26862.", "formulas": ["Average speed = total distance ÷ total time"], "solution": ["1. Maximum distance = 8 × 110 = 880 km, so x ≥ 26862 − 880 = 25982.", "2. Five-digit palindromes ≥ 25982 have the form 2 6 _ 6 2 (25_52 is below 25982).", "3. The smallest is 26062.", "4. Distance = 26862 − 26062 = 800 km.", "5. Highest average speed = 800/8 = 100 km/h."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-8.shtml"}, {"id": "2023-S1-Q09", "year": 2023, "slot": 1, "q_no": 9, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Clocks – angle between hands", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The time is 8:48 am. After how many minutes, at the earliest, will the smaller angle between the hour and minute hands be 50% more than it is now?", "options": ["36/11", "24/11", "2", "4"], "answer": "24/11", "answer_note": "", "concept": "Find the current angle, then use the relative speed of the minute hand over the hour hand (5.5° per minute).", "formulas": ["Angle = |30H − 5.5M|", "Relative speed of the hands = 5.5°/min"], "solution": ["1. At 8:48: the hour hand is at 240 + 24 = 264°, the minute hand at 288°. The angle is 24°, with the minute hand ahead.", "2. The minute hand keeps gaining, so the angle grows at 5.5° per minute.", "3. Target angle = 1.5 × 24 = 36°, an increase of 12°.", "4. Time = 12/5.5 = 24/11 minutes."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-9.shtml"}, {"id": "2023-S1-Q10", "year": 2023, "slot": 1, "q_no": 10, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages with constraints", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "The average score of 4 girls and 6 boys together is 24. All girls have equal scores and all boys have equal scores. A girl's score is at least a boy's score and at most twice a boy's score. How many distinct integer values can the total score of 2 girls and 6 boys take?", "options": ["19", "21", "20", "22"], "answer": "21", "answer_note": "", "concept": "Write the required total as a linear function of one variable and find its range from the inequality constraints.", "formulas": ["Sum = average × count"], "solution": ["1. Let a girl score g and a boy score b: 4g + 6b = 240, so g = 60 − 1.5b.", "2. b ≤ g gives b ≤ 60 − 1.5b → b ≤ 24.", "3. g ≤ 2b gives 60 − 1.5b ≤ 2b → b ≥ 120/7.", "4. Required total T = 2g + 6b = 120 − 3b + 6b = 120 + 3b.", "5. With 120/7 ≤ b ≤ 24, T ranges over [171.43, 192].", "6. Integers from 172 to 192: 192 − 172 + 1 = 21 values."], "shortcut": "Marks need not be integers, only the total; so count integers in the continuous range of T.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-10.shtml"}, {"id": "2023-S1-Q11", "year": 2023, "slot": 1, "q_no": 11, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Replacement mixtures", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Some coffee is taken out of a jar of coffee and the same amount of cocoa powder is put in; this is mixture P. The same amount is then taken out of P and replaced again with cocoa powder, giving mixture Q. In Q, coffee and cocoa are in the ratio 16 : 9. What is the ratio of the cocoa in P to the cocoa in Q?", "options": ["4 : 9", "1 : 3", "5 : 9", "1 : 2"], "answer": "5 : 9", "answer_note": "", "concept": "In repeated replacement, the fraction of the original substance gets multiplied by the same factor (1 − f) each time.", "formulas": ["Remaining original fraction after n replacements = (1 − f)ⁿ"], "solution": ["1. Let f be the fraction of the jar replaced each time.", "2. Coffee in Q = (1 − f)² = 16/25, so 1 − f = 4/5 and f = 1/5.", "3. Cocoa in P = 1/5 of the jar = 5/25.", "4. Cocoa in Q = 9/25 of the jar.", "5. Ratio = 5/25 : 9/25 = 5 : 9."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-11.shtml"}, {"id": "2023-S1-Q12", "year": 2023, "slot": 1, "q_no": 12, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Successive percentage changes", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The salaries of Sita, Gita and Mita are in the ratio 5 : 6 : 7. In year 1 they get raises of 20%, 25% and 20%. In year 2 Sita gets a 40% raise and Mita gets a 25% raise, and after the year-2 raises Gita's salary equals the average of all three salaries. What percentage raise did Gita get in year 2?", "options": ["26%", "28%", "25%", "30%"], "answer": "26%", "answer_note": "", "concept": "Track each salary through successive percentage increases; if one value equals the mean of three, it equals the mean of the other two.", "formulas": ["New value = old × (1 + r/100)", "If G = (S + G + M)/3 then G = (S + M)/2"], "solution": ["1. Take salaries 5, 6, 7. After year 1: Sita 6, Gita 7.5, Mita 8.4.", "2. After year 2: Sita 6 × 1.4 = 8.4, Mita 8.4 × 1.25 = 10.5.", "3. Gita equals the mean of three, so she equals the mean of the other two: (8.4 + 10.5)/2 = 9.45.", "4. Gita's raise = (9.45 − 7.5)/7.5 = 1.95/7.5 = 26%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-12.shtml"}, {"id": "2023-S1-Q13", "year": 2023, "slot": 1, "q_no": 13, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Same selling price – profit/loss", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Gita sells items A and B at the same selling price, making 20% profit on A and a 10% loss on B. She then increases the selling price so that both items still sell at the same price, and B now gives a 10% profit. Approximately what is her profit percentage on A now?", "options": ["42%", "47%", "45%", "49%"], "answer": "47%", "answer_note": "", "concept": "Equal selling prices fix the ratio of cost prices; the new common price then gives the new profit on A.", "formulas": ["SP = CP × (1 ± r/100)"], "solution": ["1. 1.2 × CP_A = 0.9 × CP_B, so CP_A : CP_B = 3 : 4.", "2. Take CP_A = 3, CP_B = 4.", "3. New SP for a 10% profit on B = 4 × 1.1 = 4.4.", "4. Profit on A = (4.4 − 3)/3 = 46.67% ≈ 47%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-13.shtml"}, {"id": "2023-S1-Q14", "year": 2023, "slot": 1, "q_no": 14, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Meeting point – time after meeting", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Arvind leaves town A for town B and Surbhi leaves town B for town A at the same moment. After they cross each other, Arvind needs 6 more hours to reach B and Surbhi needs 24 more hours to reach A. If Arvind's speed is 54 km/h, what is the distance between A and B (in km)?", "options": [], "answer": "972", "answer_note": "", "concept": "If two people meet after t hours and then take t₁ and t₂ hours to finish, t² = t₁·t₂ and the speed ratio is √(t₂/t₁).", "formulas": ["t = √(t₁ t₂)", "S₁/S₂ = √(t₂/t₁)"], "solution": ["1. Time until meeting t = √(6 × 24) = 12 hours.", "2. Arvind travels for 12 + 6 = 18 hours in total to cover A to B.", "3. Distance = 54 × 18 = 972 km.", "4. Check: Surbhi's speed = 54 × √(6/24) = 27 km/h; she takes 36 h in all, and 27 × 36 = 972."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-14.shtml"}, {"id": "2023-S1-Q15", "year": 2023, "slot": 1, "q_no": 15, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – HP of rates", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "The amounts of work that Amal, Sunil and Kamal each finish in one day are in harmonic progression, in that order. Kamal needs twice as much time as Amal to do the same job. Amal works for 4 days and Sunil for 9 days, and then Kamal finishes the remaining work in 16 days. How many days would Sunil take to do the whole job alone?", "options": [], "answer": "27", "answer_note": "", "concept": "Rates in HP means their reciprocals (times) are in AP; use this to express all rates in terms of Amal's rate.", "formulas": ["a, b, c in HP ⇔ 1/a, 1/b, 1/c in AP", "Work = rate × time"], "solution": ["1. Let Amal's daily rate be a. Kamal takes twice as long, so Kamal's rate is a/2.", "2. Times 1/a, 1/s, 2/a are in AP, so 2/s = 1/a + 2/a = 3/a → s = 2a/3.", "3. Total work: 4a + 9(2a/3) + 16(a/2) = 4a + 6a + 8a = 18a = 1.", "4. a = 1/18, so Sunil's rate s = 2/54 = 1/27.", "5. Sunil alone needs 27 days."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-15.shtml"}, {"id": "2023-S1-Q16", "year": 2023, "slot": 1, "q_no": 16, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound vs simple interest", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Anil puts ₹22,000 in a scheme paying 4% per year compounded every six months, for 6 years. Sunil puts some money in the same scheme for 5 years, then takes out the whole amount and invests it for 1 year at 10% simple interest. Both end up with the same amount. How much did Sunil invest at the start (in ₹)?", "options": [], "answer": "20808", "answer_note": "", "concept": "Half-yearly compounding at 4% p.a. means 2% per half-year; equate the final amounts and cancel the common factors.", "formulas": ["A = P(1 + r/2)^(2n) for half-yearly compounding", "SI amount = P(1 + rt)"], "solution": ["1. Anil: 22000 × (1.02)¹² (12 half-years at 2%).", "2. Sunil: P × (1.02)¹⁰ × 1.10.", "3. Equate: P × 1.1 = 22000 × (1.02)².", "4. P = 20000 × 1.0404 = 20808."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-16.shtml"}, {"id": "2023-S1-Q17", "year": 2023, "slot": 1, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Circles – tangents and locus", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "C is the circle x² + y² + 4x − 6y − 3 = 0. L is the locus of points from which the two tangents to C meet at an angle of 60°. At which point does L meet the line x = 6?", "options": ["(6, 4)", "(6, 8)", "(6, 3)", "(6, 6)"], "answer": "(6, 3)", "answer_note": "", "concept": "From an external point, the tangents make half the angle with the line to the centre, so the point's distance from the centre is fixed: the locus is a concentric circle.", "formulas": ["Centre (−g, −f), r = √(g² + f² − c)", "d = r / sin(θ/2)"], "solution": ["1. Centre (−2, 3), radius √(4 + 9 + 3) = 4.", "2. With tangents at 60°, each tangent makes 30° with the line to the centre: sin 30° = r/d → d = 8.", "3. L is the circle (x + 2)² + (y − 3)² = 64.", "4. At x = 6: 64 + (y − 3)² = 64 → y = 3.", "5. The point is (6, 3)."], "shortcut": "x = 6 is exactly 8 units right of the centre, so the line touches L at the point level with the centre, y = 3.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-17.shtml"}, {"id": "2023-S1-Q18", "year": 2023, "slot": 1, "q_no": 18, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Cyclic quadrilateral – similar triangles", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "ABCD is a cyclic quadrilateral with AB : CD = 2 : 1 and BC : AD = 5 : 4. Its diagonals meet at E. Find AE : CE.", "options": ["1 : 2", "5 : 8", "8 : 5", "2 : 1"], "answer": "8 : 5", "answer_note": "", "concept": "The diagonals of a cyclic quadrilateral create two pairs of similar triangles (angles in the same segment).", "formulas": ["△AEB ~ △DEC and △AED ~ △BEC in a cyclic quadrilateral"], "solution": ["1. △AEB ~ △DEC: AE/DE = BE/CE = AB/DC = 2.", "2. △AED ~ △BEC: AE/BE = DE/CE = AD/BC = 4/5.", "3. AE/CE = (AE/BE) × (BE/CE) = (4/5) × 2 = 8/5.", "4. AE : CE = 8 : 5."], "shortcut": "AE/CE = (AB·AD)/(CB·CD) = (2 × 4)/(5 × 1) = 8/5.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-18.shtml"}, {"id": "2023-S1-Q19", "year": 2023, "slot": 1, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangle areas – common height", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In triangle ABC, right-angled at B, AB = 5 cm is the altitude and BC = 12 cm is the base. P and Q are points on BC such that the areas of △ABP, △ABQ and △ABC form an arithmetic progression, and the area of △ABC is 1.5 times the area of △ABP. Find PQ in cm.", "options": [], "answer": "2", "answer_note": "", "concept": "Triangles with the same height AB have areas proportional to their bases along BC.", "formulas": ["Area = ½ × base × height"], "solution": ["1. Area of △ABC = ½ × 5 × 12 = 30.", "2. Area of △ABP = 30/1.5 = 20 → ½ × 5 × BP = 20 → BP = 8.", "3. AP condition: area of △ABQ = (20 + 30)/2 = 25 → BQ = 10.", "4. PQ = BQ − BP = 10 − 8 = 2 cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-19.shtml"}, {"id": "2023-S1-Q20", "year": 2023, "slot": 1, "q_no": 20, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP condition with surds", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "x, y, z are distinct positive real numbers, and 1/(√y + √z) is the arithmetic mean of 1/(√x + √z) and 1/(√x + √y). Which of the following must be true?", "options": ["√x, √y, √z are in AP", "√x, √z, √y are in AP", "y, x, z are in AP", "x, y, z are in AP"], "answer": "y, x, z are in AP", "answer_note": "", "concept": "Rationalise each term so the denominators become differences of the variables; the condition then reduces to a simple AP relation.", "formulas": ["1/(√a + √b) = (√a − √b)/(a − b)", "b is the AM of a and c ⇔ 2b = a + c"], "solution": ["1. Write a = √x, b = √y, c = √z. Condition: 2/(b + c) = 1/(a + c) + 1/(a + b).", "2. Right side = (2a + b + c)/[(a + c)(a + b)].", "3. Cross-multiply: 2(a + b)(a + c) = (b + c)(2a + b + c).", "4. Left = 2a² + 2ab + 2ac + 2bc; right = 2ab + 2ac + b² + 2bc + c².", "5. This gives 2a² = b² + c², i.e. 2x = y + z.", "6. So y, x, z are in AP."], "shortcut": "Plug y = 1, z = 9, x = 5 (so 2x = y + z) and check numerically; it satisfies the condition.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-20.shtml"}, {"id": "2023-S1-Q21", "year": 2023, "slot": 1, "q_no": 21, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting numbers with distinct digits", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "How many natural numbers not exceeding 1000 have no digit repeated?", "options": ["585", "504", "648", "738"], "answer": "738", "answer_note": "", "concept": "Count separately by the number of digits, with the first digit non-zero.", "formulas": ["Number of arrangements of r distinct items from n = nPr"], "solution": ["1. 1-digit numbers: 9.", "2. 2-digit numbers: 9 × 9 = 81.", "3. 3-digit numbers: 9 × 9 × 8 = 648.", "4. 1000 repeats the digit 0, so it is excluded.", "5. Total = 9 + 81 + 648 = 738."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-21.shtml"}, {"id": "2023-S1-Q22", "year": 2023, "slot": 1, "q_no": 22, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recurrence relations", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A lab has 2 organisms on day 1. Each day after that, the count is 3 more than twice the previous day's count. What is the smallest n for which the count on day n is more than one million?", "options": [], "answer": "19", "answer_note": "", "concept": "Adding a constant turns the linear recurrence into a pure geometric progression.", "formulas": ["aₙ = 2aₙ₋₁ + 3 ⇒ (aₙ + 3) = 2(aₙ₋₁ + 3)", "2¹⁰ = 1024, 2²⁰ ≈ 1.05 × 10⁶"], "solution": ["1. Let bₙ = aₙ + 3. Then bₙ = 2bₙ₋₁ with b₁ = 5.", "2. So bₙ = 5 × 2ⁿ⁻¹ and aₙ = 5 × 2ⁿ⁻¹ − 3.", "3. Need 5 × 2ⁿ⁻¹ − 3 > 10⁶, i.e. 2ⁿ⁻¹ > about 200000.6.", "4. 2¹⁷ = 131072 is too small; 2¹⁸ = 262144 works.", "5. n − 1 = 18 → n = 19."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-1-Quant/quants-question-22.shtml"}, {"id": "2023-S2-Q01", "year": 2023, "slot": 2, "q_no": 1, "area": "Number System", "topic": "Number System", "subtopic": "Prime factorisation – exponents", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "a, b, m and n are natural numbers with a > 1 and b > 1, and aᵐ × bⁿ = 144¹⁴⁵. What is the greatest possible value of n − m?", "options": ["580", "290", "579", "289"], "answer": "579", "answer_note": "", "concept": "Write 144¹⁴⁵ in prime-power form and distribute the primes between a and b so that bⁿ uses the smallest possible base with the largest exponent.", "formulas": ["144 = 2⁴ × 3²", "(xʸ)ᶻ = xʸᶻ"], "solution": ["1. 144¹⁴⁵ = (2⁴ × 3²)¹⁴⁵ = 2⁵⁸⁰ × 3²⁹⁰.", "2. To make n − m as large as possible, take n as large as possible and m as small as possible (m = 1).", "3. n is largest when b is the smallest prime base, b = 2, giving n = 580 if all the 2s go into bⁿ.", "4. Then aᵐ = 3²⁹⁰ with m = 1, i.e. a = 3²⁹⁰ > 1, which is valid.", "5. Maximum n − m = 580 − 1 = 579."], "shortcut": "Answer is (largest exponent) − 1 = 580 − 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-1.shtml"}, {"id": "2023-S2-Q02", "year": 2023, "slot": 2, "q_no": 2, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the sum of all real x for which 2^(4x²) − 2^(2x² + x + 16) + 2^(2x + 30) = 0.", "options": ["3/2", "5/2", "1/2", "3"], "answer": "1/2", "answer_note": "", "concept": "The three terms form a perfect square A² − 2AB + B² once the exponents are split suitably, which forces A = B.", "formulas": ["A² − 2AB + B² = (A − B)²", "Sum of roots of ax² + bx + c = −b/a"], "solution": ["1. Let A = 2^(2x²) and B = 2^(x + 15).", "2. Then A² = 2^(4x²), B² = 2^(2x + 30) and 2AB = 2^(2x² + x + 16).", "3. The equation becomes (A − B)² = 0, so A = B.", "4. Equate exponents: 2x² = x + 15, i.e. 2x² − x − 15 = 0, with roots 3 and −5/2.", "5. Sum of values = 1/2."], "shortcut": "Spot the middle term's exponent as 1 + (2x²) + (x + 15) — the signature of 2AB.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-2.shtml"}, {"id": "2023-S2-Q03", "year": 2023, "slot": 2, "q_no": 3, "area": "Number System", "topic": "Number System", "subtopic": "Divisibility – linear combinations", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "m, n and k are natural numbers, and k divides both m + 2n and 3m + 4n. Then k is necessarily a common divisor of which pair?", "options": ["2m and 3n", "m and 2n", "2m and n", "m and n"], "answer": "m and 2n", "answer_note": "", "concept": "If k divides two numbers, it divides every integer linear combination of them.", "formulas": ["k | x and k | y ⇒ k | (px + qy) for integers p, q"], "solution": ["1. k divides (3m + 4n) − 2(m + 2n) = m.", "2. Since k | m and k | (m + 2n), k divides (m + 2n) − m = 2n.", "3. So k always divides m and 2n.", "4. Counter-check: m = 2, n = 1 gives m + 2n = 4 and 3m + 4n = 10, so k = 2 is allowed, yet 2 divides neither n nor 3n — this rules out options 1, 3 and 4."], "shortcut": "Eliminate n directly: 3m + 4n − 2(m + 2n) = m.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-3.shtml"}, {"id": "2023-S2-Q04", "year": 2023, "slot": 2, "q_no": 4, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Rational inequalities – sign analysis", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Non-zero real numbers x and y, with y ≠ 3, satisfy x/y < (x + 3)/(y − 3). Which of the following statements must then hold?", "options": ["If y > 10, then −x > y", "If x < 0, then −x < y", "If y < 0, then −x < y", "x/y < y/x"], "answer": "If y < 0, then −x < y", "answer_note": "", "concept": "Bring everything to one side and simplify to a single sign condition, then test each option against it.", "formulas": ["p/q > 0 ⇔ p and q have the same sign"], "solution": ["1. x/y − (x + 3)/(y − 3) < 0 ⇒ [x(y − 3) − y(x + 3)] / [y(y − 3)] < 0.", "2. Numerator = −3x − 3y = −3(x + y), so the condition is (x + y) / [y(y − 3)] > 0.", "3. If y < 0, then y(y − 3) > 0, so x + y > 0, i.e. −x < y. Option 3 always holds.", "4. If y > 10, y(y − 3) > 0 so x + y > 0, i.e. −x < y — option 1 is false.", "5. Option 2 fails for x = −2, y = 1 (condition holds since x + y < 0 and y(y − 3) < 0, but −x = 2 > y); option 4 fails for x = y = 4 (condition holds, but x/y = y/x = 1)."], "shortcut": "Reduce to (x + y)/[y(y − 3)] > 0 and read option 3 off immediately.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-4.shtml"}, {"id": "2023-S2-Q05", "year": 2023, "slot": 2, "q_no": 5, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Logarithm base change", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "For a positive real x, log_√3(x) + [log_x(25) ÷ log_x(0.008)] = 16/3. Find log₃(3x²).", "options": [], "answer": "7", "answer_note": "", "concept": "Convert the ratio of logs with the same base into a single log, and rewrite log base √3 in terms of base 3.", "formulas": ["log_a(b) ÷ log_a(c) = log_c(b)", "log_√3(x) = 2 log₃(x)", "0.008 = 5⁻³"], "solution": ["1. log_x 25 ÷ log_x 0.008 = log(5²)/log(5⁻³) = 2/(−3) = −2/3.", "2. So 2 log₃ x − 2/3 = 16/3, giving 2 log₃ x = 6 and log₃ x = 3 (x = 27).", "3. log₃(3x²) = 1 + 2 log₃ x = 1 + 6 = 7."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-5.shtml"}, {"id": "2023-S2-Q06", "year": 2023, "slot": 2, "q_no": 6, "area": "Number System", "topic": "Number System", "subtopic": "Number of factors", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "How many positive integers below 50 have exactly two factors besides 1 and the number itself?", "options": [], "answer": "15", "answer_note": "", "concept": "Exactly two factors other than 1 and N means N has exactly 4 divisors, so N = p³ or N = p × q for distinct primes p, q.", "formulas": ["Number of divisors of p^a × q^b = (a + 1)(b + 1)"], "solution": ["1. N must have 4 divisors: N = p³ or N = pq (p ≠ q primes).", "2. Cubes below 50: 8, 27 → 2 numbers.", "3. pq below 50 with p = 2: 6, 10, 14, 22, 26, 34, 38, 46 → 8.", "4. p = 3: 15, 21, 33, 39 → 4; p = 5: 35 → 1.", "5. Total = 2 + 8 + 4 + 1 = 15."], "shortcut": "Don't forget the p³ case (8 and 27).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-6.shtml"}, {"id": "2023-S2-Q07", "year": 2023, "slot": 2, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Discriminant & AM-GM minimum", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "k is the greatest integer for which (x − 1)² + 2kx + 11 = 0 has no real root. For positive real y, find the minimum value of k/(4y) + 9y.", "options": [], "answer": "6", "answer_note": "", "concept": "No real roots means a negative discriminant; the minimum of a sum like A/y + By for y > 0 comes from AM-GM.", "formulas": ["No real roots ⇔ D = b² − 4ac < 0", "For p, q > 0: p + q ≥ 2√(pq)"], "solution": ["1. Expand: x² + (2k − 2)x + 12 = 0.", "2. D < 0 ⇒ (2k − 2)² < 48 ⇒ (k − 1)² < 12 ⇒ k − 1 ≤ 3, so the greatest integer k = 4.", "3. Expression = 4/(4y) + 9y = 1/y + 9y.", "4. AM-GM: 1/y + 9y ≥ 2√9 = 6, equality at y = 1/3.", "5. Minimum value = 6."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-7.shtml"}, {"id": "2023-S2-Q08", "year": 2023, "slot": 2, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Weighted averages – salary ratio", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "One-fifth of a company's employees are in manufacturing, and they together draw one-sixth of the company's total salary bill. Find the ratio of the average salary of a manufacturing employee to that of a non-manufacturing employee.", "options": ["4 : 5", "5 : 6", "5 : 4", "6 : 5"], "answer": "4 : 5", "answer_note": "", "concept": "Average = total salary share ÷ headcount share; compare the two groups' averages.", "formulas": ["Average = Total ÷ Count"], "solution": ["1. Manufacturing: 1/6 of salary over 1/5 of staff ⇒ average ∝ (1/6)/(1/5) = 5/6.", "2. Others: 5/6 of salary over 4/5 of staff ⇒ average ∝ (5/6)/(4/5) = 25/24.", "3. Ratio = (5/6) : (25/24) = 20 : 25 = 4 : 5."], "shortcut": "Assume 5 employees and salary bill 6: 1 person gets 1, 4 people get 5 → 1 : 5/4 = 4 : 5.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-8.shtml"}, {"id": "2023-S2-Q09", "year": 2023, "slot": 2, "q_no": 9, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Successive transactions – profit %", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Minu buys sunglasses for Rs 1000 and sells them to Kanu at a 20% profit. Kanu later sells them back to Minu at a 20% loss. Minu then sells them to Tanu. Minu's overall profit from all her dealings is Rs 500. What profit percentage did Minu make on the sale to Tanu?", "options": ["35.42%", "31.25%", "52%", "26%"], "answer": "31.25%", "answer_note": "", "concept": "Track Minu's cash flows; the profit % on the last sale is measured on her buy-back cost price.", "formulas": ["Profit % = Profit ÷ Cost price × 100"], "solution": ["1. Minu sells to Kanu at 1200: profit 200.", "2. Kanu sells back at 20% loss on 1200: Minu pays 960.", "3. Total profit 500 ⇒ profit on final sale = 500 − 200 = 300, so she sells to Tanu at 1260.", "4. Profit % on that sale = 300/960 × 100 = 31.25%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-9.shtml"}, {"id": "2023-S2-Q10", "year": 2023, "slot": 2, "q_no": 10, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes & cisterns", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Pipes A and C fill a tank and pipe B empties it. B empties a full tank in one hour less than A takes to fill an empty one. With A, B and C all open, an empty tank fills in 2 hours. If B and C are opened together on an empty tank, and B is closed after 1 hour, C needs a further 1 hour 15 minutes to finish filling. Given that A fills the tank in under 5 hours, how many minutes does C alone take to fill the empty tank?", "options": ["90", "60", "120", "75"], "answer": "90", "answer_note": "", "concept": "Write rate equations for each scenario in terms of A's time and solve, using the 'under 5 hours' condition to pick the valid root.", "formulas": ["Rate = 1/time; net rate = sum of fill rates − drain rates"], "solution": ["1. Let A take a hours, B take (a − 1) hours, C take c hours.", "2. All three: 1/a − 1/(a − 1) + 1/c = 1/2.", "3. B and C for 1 hour, then C for 5/4 hour: (1/c − 1/(a − 1)) + 5/(4c) = 1 ⇒ 9/(4c) = 1 + 1/(a − 1) = a/(a − 1).", "4. So 1/c = 4a/(9(a − 1)). Substitute: 1/a − 1/(a − 1) + 4a/(9(a − 1)) = 1/2 ⇒ 9(a − 1) − 9a + 4a² = 4.5a(a − 1) ⇒ a² − 9a + 18 = 0 ⇒ a = 3 or 6.", "5. a < 5 ⇒ a = 3, so 1/c = 12/18 = 2/3 and c = 1.5 hours = 90 minutes.", "6. Check: B and C in 1 h fill 2/3 − 1/2 = 1/6; remaining 5/6 at 2/3 per hour takes 5/4 h. ✓"], "shortcut": "Test options: c = 90 min (rate 2/3) with A = 3, B = 2 gives 1/3 − 1/2 + 2/3 = 1/2. ✓", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-10.shtml"}, {"id": "2023-S2-Q11", "year": 2023, "slot": 2, "q_no": 11, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative speed – meeting point", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Ravi drives at 40 km/h. Vijay is 54 m behind Ravi, moving in the same direction. Ashok approaches from the opposite direction at 50 km/h and is 225 m away from Ravi. At what speed (km/h) must Vijay drive so that all three meet at the same moment?", "options": ["58.8", "64.4", "67.2", "61.6"], "answer": "61.6", "answer_note": "", "concept": "Find when Ravi and Ashok meet using relative speed; Vijay must reach that same point at that time.", "formulas": ["Time = Distance ÷ Relative speed", "Opposite directions: relative speed = sum"], "solution": ["1. Ravi and Ashok close the 225 m gap at 40 + 50 = 90 km/h = 25 m/s ⇒ time = 9 s.", "2. In 9 s Ravi travels 40 × 5/18 × 9 = 100 m.", "3. Vijay must cover 54 + 100 = 154 m in 9 s.", "4. Vijay's speed = 154/9 m/s = 154/9 × 18/5 = 61.6 km/h."], "shortcut": "Speeds scale with distances in equal time: Vijay/Ravi = 154/100 ⇒ 40 × 1.54 = 61.6.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-11.shtml"}, {"id": "2023-S2-Q12", "year": 2023, "slot": 2, "q_no": 12, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Compound interest – part repayment", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Anil takes a loan of Rs 2,00,000 at 8% per annum compounded half-yearly. He pays Rs 10,320 at the end of year 1 and clears the loan with one payment at the end of year 3. The total interest paid over the three years is closest to:", "options": ["45311", "51311", "33130", "40991"], "answer": "51311", "answer_note": "", "concept": "Compound the balance half-yearly at 4%, subtract the repayment at year 1, then compound the reduced balance for 4 more half-years.", "formulas": ["A = P(1 + r)ⁿ with r = 4% per half-year", "Interest = Total paid − Principal"], "solution": ["1. Half-yearly rate = 4%. After 1 year: 2,00,000 × 1.04² = 2,16,320.", "2. After paying 10,320, balance = 2,06,000.", "3. Two more years = 4 half-years: 2,06,000 × 1.04⁴ = 2,06,000 × 1.16985856 ≈ 2,40,990.86.", "4. Total paid = 10,320 + 2,40,990.86 = 2,51,310.86.", "5. Interest = 2,51,310.86 − 2,00,000 ≈ 51,311."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-12.shtml"}, {"id": "2023-S2-Q13", "year": 2023, "slot": 2, "q_no": 13, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Variation – optimising sum of squares", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A gem's price varies directly as the square of its weight. Sita's gem weighs 18 units; she splits it into four pieces whose weights are distinct positive integers. The gap between the largest and smallest possible total price of the four pieces is 288000. What is the price of the original gem?", "options": ["1296000", "1944000", "972000", "1620000"], "answer": "1296000", "answer_note": "", "concept": "Price = k × w²; sum of squares of a fixed-sum partition is largest when the parts are spread out and smallest when they are close together.", "formulas": ["Price = k × w²", "For fixed sum, Σw² is minimised when parts are nearly equal"], "solution": ["1. Max Σw²: weights 1, 2, 3, 12 ⇒ 1 + 4 + 9 + 144 = 158.", "2. Min Σw²: weights 3, 4, 5, 6 ⇒ 9 + 16 + 25 + 36 = 86.", "3. k(158 − 86) = 72k = 288000 ⇒ k = 4000.", "4. Original price = 4000 × 18² = 4000 × 324 = 12,96,000."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2023-Question-Paper-Slot-2-Quant/quants-question-13.shtml"}, {"id": "2023-S2-Q14", "year": 2023, "slot": 2, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – repeated replacement", "type": "TI
