2"], "answer": "√37 + √13", "answer_note": "", "concept": "Diagonals of a rhombus bisect each other at right angles; the area gives their product and Pythagoras gives the sum of their squares.", "formulas": ["Area = d₁d₂/2", "(d₁/2)² + (d₂/2)² = side²"], "solution": ["1. d₁d₂ = 24 and d₁² + d₂² = 4 × 25 = 100.", "2. (d₁ + d₂)² = 100 + 48 = 148 ⇒ d₁ + d₂ = 2√37.", "3. (d₁ − d₂)² = 100 − 48 = 52 ⇒ d₁ − d₂ = 2√13.", "4. Longer diagonal d₁ = (2√37 + 2√13)/2 = √37 + √13."], "shortcut": "The longer diagonal must exceed the side (5) and be less than 10; only √37 + √13 ≈ 9.69 fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-9.shtml"}, {"id": "2021-S2-Q10", "year": 2021, "slot": 2, "q_no": 10, "area": "Number System", "topic": "Number System", "subtopic": "Integer solutions with AP constraint", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.54% correct", "question": "Positive integers x, y, z form an arithmetic progression in that order, with y − x > 2 and xyz = 5(x + y + z). Find z − x.", "options": ["8", "10", "14", "12"], "answer": "14", "answer_note": "", "concept": "Writing the AP with common difference d reduces the condition to a factorisation problem in integers.", "formulas": ["x = y − d, z = y + d", "x + y + z = 3y"], "solution": ["1. Let common difference d = y − x > 2; then x + y + z = 3y.", "2. xyz = 15y ⇒ (y − d)(y + d) = 15 ⇒ y² − d² = 15.", "3. (y − d)(y + d) = 15 = 1 × 15 or 3 × 5. d > 2 rules out 3 × 5 (d = 1).", "4. y − d = 1, y + d = 15 ⇒ y = 8, d = 7; so x = 1, z = 15.", "5. z − x = 2d = 14."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-10.shtml"}, {"id": "2021-S2-Q11", "year": 2021, "slot": 2, "q_no": 11, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – area ratios", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.41% correct", "question": "In triangle ABC, point D lies on AB with AD : DB = 2 : 1, and point E lies on AC with AE : EC = 2 : 3. If triangle ADE has area 8 sq cm, what is the area of triangle ABC in sq cm?", "options": [], "answer": "30", "answer_note": "", "concept": "Triangles sharing an angle have areas in the ratio of the products of the sides enclosing that angle.", "formulas": ["Area(ADE)/Area(ABC) = (AD/AB) × (AE/AC)"], "solution": ["1. AD/AB = 2/3 and AE/AC = 2/5.", "2. Area(ADE)/Area(ABC) = (2/3)(2/5) = 4/15.", "3. Area(ABC) = 8 × 15/4 = 30 sq cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-11.shtml"}, {"id": "2021-S2-Q12", "year": 2021, "slot": 2, "q_no": 12, "area": "Number System", "topic": "Number System", "subtopic": "Digits", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.54% correct", "question": "For a four-digit number, the thousands, hundreds and tens digits add up to 14; the hundreds, tens and units digits add up to 15; and the tens digit exceeds the units digit by 4. What is the largest such number?", "options": [], "answer": "4195", "answer_note": "", "concept": "Translate digit conditions into equations, then maximise the leading digits in order.", "formulas": ["Number = 1000a + 100b + 10c + d"], "solution": ["1. Let digits be a, b, c, d: a + b + c = 14, b + c + d = 15, c = d + 4.", "2. Subtracting the first two: d − a = 1 ⇒ a = d − 1.", "3. From b + c + d = 15 with c = d + 4: b = 11 − 2d. Also c ≤ 9 ⇒ d ≤ 5.", "4. To maximise, maximise a = d − 1: take d = 5 ⇒ a = 4, c = 9, b = 1.", "5. Largest number = 4195 (check: 4+1+9 = 14, 1+9+5 = 15)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-12.shtml"}, {"id": "2021-S2-Q13", "year": 2021, "slot": 2, "q_no": 13, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Range of a rational function", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 14.16% correct", "question": "As x varies over all real numbers, what is the range of f(x) = (x² + 2x + 4)/(2x² + 4x + 9)?", "options": ["[3/7, 8/9)", "[4/9, 8/9]", "[3/7, 1/2)", "(3/7, 1/2)"], "answer": "[3/7, 1/2)", "answer_note": "", "concept": "Substituting the common square term turns f into a monotonic function of one variable over a known interval.", "formulas": ["x² + 2x + 4 = (x + 1)² + 3", "t/(2t + 1) = 1/2 − 1/(2(2t + 1))"], "solution": ["1. Let t = (x + 1)² + 3, so t ≥ 3; the denominator 2x² + 4x + 9 = 2t + 1.", "2. f = t/(2t + 1) = 1/2 − 1/(2(2t + 1)), which increases with t.", "3. At t = 3 (x = −1): f = 3/7, attained, so the lower end is closed.", "4. As t → ∞, f → 1/2 but never reaches it.", "5. Range = [3/7, 1/2)."], "shortcut": "f(−1) = 3/7 is attainable and f < 1/2 always (since 2 × numerator < denominator), so [3/7, 1/2).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-13.shtml"}, {"id": "2021-S2-Q14", "year": 2021, "slot": 2, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.43% correct", "question": "A footballer has 10 matches still to play. If he scores 1 goal in total across these 10 matches, his goals-per-match average over his whole career becomes 0.15; if he scores 2 goals across them, it becomes 0.2. How many matches has he already played?", "options": [], "answer": "10", "answer_note": "", "concept": "The extra goal changes the total by 1 while the number of matches is fixed, so the change in average pins down the match count.", "formulas": ["Average = total goals / total matches"], "solution": ["1. Let n = matches played so far and g = goals so far; total matches = n + 10.", "2. (g + 1)/(n + 10) = 0.15 and (g + 2)/(n + 10) = 0.2.", "3. Subtracting: 1/(n + 10) = 0.05 ⇒ n + 10 = 20.", "4. n = 10 (and g = 2)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-14.shtml"}, {"id": "2021-S2-Q15", "year": 2021, "slot": 2, "q_no": 15, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponents – counting values", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 10.73% correct", "question": "Consider all integers n for which 2.25 ≤ 2 + 2ⁿ⁺² ≤ 202. How many distinct integer values can 3 + 3ⁿ⁺¹ take?", "options": [], "answer": "7", "answer_note": "", "concept": "Find the allowed integer range of n from the inequality, then check which of those make the second expression an integer (negative exponents of 3 give fractions).", "formulas": ["aᵐ with m < 0 is a fraction for a > 1"], "solution": ["1. 0.25 ≤ 2ⁿ⁺² ≤ 200 ⇒ −2 ≤ n + 2 ≤ 7 (since 2⁷ = 128 ≤ 200 < 256).", "2. So n ∈ {−4, −3, ..., 5}: 10 integers.", "3. 3 + 3ⁿ⁺¹ is an integer only when n + 1 ≥ 0, i.e., n ≥ −1.", "4. n = −1, 0, 1, 2, 3, 4, 5 gives 7 distinct integer values (4, 6, 12, 30, 84, 246, 732)."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-15.shtml"}, {"id": "2021-S2-Q16", "year": 2021, "slot": 2, "q_no": 16, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.35% correct", "question": "For real x, the equation |3x − 20| + |3x − 40| = 20 is guaranteed to hold whenever:", "options": ["6 < x < 11", "7 < x < 12", "10 < x < 15", "9 < x < 14"], "answer": "7 < x < 12", "answer_note": "", "concept": "|a − p| + |a − q| equals |p − q| exactly when a lies between p and q.", "formulas": ["|u − p| + |u − q| = q − p ⇔ p ≤ u ≤ q (p < q)"], "solution": ["1. Let u = 3x; the equation is |u − 20| + |u − 40| = 20, the distance between 20 and 40.", "2. This holds exactly when 20 ≤ 3x ≤ 40, i.e., 20/3 ≤ x ≤ 40/3 (about 6.67 to 13.33).", "3. We need an option interval lying entirely inside [6.67, 13.33].", "4. 6 < x < 11 starts too low; 10 < x < 15 and 9 < x < 14 go too high; 7 < x < 12 fits."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-16.shtml"}, {"id": "2021-S2-Q17", "year": 2021, "slot": 2, "q_no": 17, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Trapezium and parallelogram areas", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 34.97% correct", "question": "ABCD is a trapezium with AB parallel to CD and AB shorter than CD. P is the midpoint of CD, and ABPD is a parallelogram. The area of parallelogram ABPD exceeds the area of triangle BPC by 10 sq cm. What is the area of the trapezium ABCD in sq cm?", "options": ["20", "25", "40", "30"], "answer": "30", "answer_note": "", "concept": "With a common height, areas of the parallelogram, triangle and trapezium are all simple multiples of (base × height).", "formulas": ["Parallelogram = base × height", "Triangle = ½ × base × height", "Trapezium = ½ × (sum of parallel sides) × height"], "solution": ["1. ABPD is a parallelogram ⇒ AB = DP; P is the midpoint ⇒ DP = PC = a, so CD = 2a and AB = a. Let height = h.", "2. Area(ABPD) = ah; Area(BPC) = ah/2.", "3. Difference = ah/2 = 10 ⇒ ah = 20.", "4. Area(ABCD) = ½(a + 2a)h = 3ah/2 = 30 sq cm."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-17.shtml"}, {"id": "2021-S2-Q18", "year": 2021, "slot": 2, "q_no": 18, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Successive percentage change", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 32.72% correct", "question": "Raj invests ₹10000. At the end of the first year he has made a loss, but his balance is still more than ₹5000. In the second year the balance increases by a percentage that is five times the first-year loss percentage. Over the two years his net gain is 35% of the initial amount. What was his loss percentage in the first year?", "options": ["15", "5", "10", "70"], "answer": "10", "answer_note": "", "concept": "Successive percentage changes multiply; the side condition removes one of the two quadratic roots.", "formulas": ["Final = P(1 − r)(1 + 5r)"], "solution": ["1. Let the first-year loss rate be r. Then (1 − r)(1 + 5r) = 1.35.", "2. 1 + 4r − 5r² = 1.35 ⇒ 5r² − 4r + 0.35 = 0 ⇒ 100r² − 80r + 7 = 0.", "3. (10r − 1)(10r − 7) = 0 ⇒ r = 0.1 or 0.7.", "4. r = 0.7 leaves ₹3000 < ₹5000, so reject it. Loss = 10%."], "shortcut": "Test options: 10% → 9000 × 1.5 = 13500 ✓; 70% also gives 13500 but leaves only 3000 after year 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-18.shtml"}, {"id": "2021-S2-Q19", "year": 2021, "slot": 2, "q_no": 19, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Roots with irrational conjugates", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 25.75% correct", "question": "The quadratic ax² − bx + c = 0, with a, b, c rational and a ≠ 0, has 2 + √3 as one root. If b = c³, find |a|.", "options": ["2", "3", "4", "1"], "answer": "2", "answer_note": "", "concept": "Irrational roots of a rational-coefficient quadratic occur in conjugate pairs; Vieta's relations then link a, b, c.", "formulas": ["Sum of roots of ax² − bx + c = 0 is b/a", "Product of roots is c/a"], "solution": ["1. The other root is 2 − √3.", "2. Sum = 4 = b/a ⇒ b = 4a; product = 1 = c/a ⇒ c = a.", "3. b = c³ ⇒ 4a = a³ ⇒ a² = 4 (a ≠ 0).", "4. |a| = 2."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-19.shtml"}, {"id": "2021-S2-Q20", "year": 2021, "slot": 2, "q_no": 20, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Alternating sums of a sequence", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 13.8% correct", "question": "A sequence of real numbers x₁, x₂, x₃, ... satisfies x₁ − x₂ + x₃ − ... + (−1)ⁿ⁺¹xₙ = n² + 2n for every natural number n. What is x₄₉ + x₅₀?", "options": ["2", "−2", "200", "−200"], "answer": "−2", "answer_note": "", "concept": "Differences of consecutive partial (alternating) sums isolate individual terms.", "formulas": ["Sₙ − Sₙ₋₁ = (−1)ⁿ⁺¹xₙ where Sₙ = n² + 2n", "Sₙ − Sₙ₋₁ = 2n + 1"], "solution": ["1. Sₙ − Sₙ₋₁ = (n² + 2n) − ((n − 1)² + 2(n − 1)) = 2n + 1.", "2. So (−1)ⁿ⁺¹xₙ = 2n + 1: xₙ = 2n + 1 for odd n, xₙ = −(2n + 1) for even n.", "3. x₄₉ = 99 and x₅₀ = −101.", "4. x₄₉ + x₅₀ = −2."], "shortcut": "Pattern: each odd term plus the next even term is (2n+1) − (2n+3) = −2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-20.shtml"}, {"id": "2021-S2-Q21", "year": 2021, "slot": 2, "q_no": 21, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Pipes and cisterns", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 35.01% correct", "question": "Pipe A fills an empty tank while pipe B empties it. If A is opened at 2 pm and B is opened at 3 pm, the tank becomes full at 10 pm. If instead A is opened at 2 pm and B at 4 pm, the tank becomes full at 6 pm. If B is never opened, how many minutes does A alone take to fill the tank?", "options": ["140", "120", "144", "264"], "answer": "144", "answer_note": "", "concept": "Express each scenario as (A's hours × A's rate) − (B's hours × B's rate) = 1 tank and solve the two linear equations.", "formulas": ["Net work = Σ rate × time"], "solution": ["1. Let A fill a and B empty b of the tank per hour.", "2. Case 1: A runs 8 h, B 7 h: 8a − 7b = 1.", "3. Case 2: A runs 4 h, B 2 h: 4a − 2b = 1 ⇒ b = 2a − 1/2.", "4. Substitute: 8a − 14a + 7/2 = 1 ⇒ 6a = 5/2 ⇒ a = 5/12 per hour.", "5. Time for A alone = 12/5 h = 144 minutes."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-21.shtml"}, {"id": "2021-S2-Q22", "year": 2021, "slot": 2, "q_no": 22, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Mixtures with profit target", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 38.51% correct", "question": "A trader buys three grades of tea costing ₹800, ₹500 and ₹300 per kg, in quantities in the ratio 2 : 3 : 5, and blends them. She sells one-sixth of the blend at ₹700 per kg. At what price per kg (in INR) must she sell the rest to earn a 50% profit overall?", "options": ["692", "688", "653", "675"], "answer": "688", "answer_note": "", "concept": "Find the weighted average cost of the blend, set the target average selling price, then solve for the unknown price on the remaining portion.", "formulas": ["Weighted average = Σ(qty × price)/Σqty", "Target SP = 1.5 × CP"], "solution": ["1. Cost per kg of blend = (2×800 + 3×500 + 5×300)/10 = 4600/10 = ₹460.", "2. Required average selling price = 1.5 × 460 = ₹690 per kg.", "3. Take 6 kg: total SP needed = 6 × 690 = 4140. 1 kg sells at 700.", "4. Remaining 5 kg must fetch 3440 ⇒ price = 3440/5 = ₹688."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2021-Question-Paper-Slot-2-Quant/quants-question-22.shtml"}, {"id": "2021-S3-Q01", "year": 2021, "slot": 3, "q_no": 1, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Word problem – price equations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.96% correct", "question": "A shopkeeper buys 64 shirts in all from a wholesaler, some large and some small. A small shirt costs INR 50 less than a large one. Her total spend was INR 5000 on large shirts and INR 1800 on small shirts. What is the price of one large shirt plus one small shirt, in INR?", "options": ["175", "150", "200", "225"], "answer": "200", "answer_note": "", "concept": "Form an equation from the counts (total spend ÷ unit price) and solve for the unit price; testing options is fastest.", "formulas": ["Number of items = Total spend ÷ Price per item"], "solution": ["1. Let a large shirt cost L, so a small one costs L − 50.", "2. Count condition: 5000/L + 1800/(L − 50) = 64.", "3. If the sum is S, then L = (S + 50)/2. Test S = 200: L = 125, small = 75.", "4. Check: 5000/125 + 1800/75 = 40 + 24 = 64 ✓.", "5. Sum of prices = 125 + 75 = 200."], "shortcut": "For each option, L = (S+50)/2 must divide 5000 and L−50 must divide 1800; only S = 200 (125, 75) works.", "source_url": "https://cracku.in/45-a-shop-owner-bought-a-total-of-64-shirts-from-a-wh-x-cat-2021-slot-3"}, {"id": "2021-S3-Q02", "year": 2021, "slot": 3, "q_no": 2, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – staggered start", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 32.6% correct", "question": "Rahul begins a job at 9 AM; Gautam joins him at 11 AM, and they finish together at 5 PM the same day. Had both begun at 9 AM, the job would have been done 30 minutes sooner. How many hours would Rahul need to do the whole job alone?", "options": ["11.5", "10", "12.5", "12"], "answer": "10", "answer_note": "", "concept": "Equate the total work done in the two scenarios using individual hourly rates.", "formulas": ["Work = Rate × Time"], "solution": ["1. Let Rahul's rate be r and Gautam's be g units/hour.", "2. Actual: Rahul works 8 h, Gautam 6 h → work = 8r + 6g.", "3. Alternative: both work 7.5 h → work = 7.5(r + g).", "4. 8r + 6g = 7.5r + 7.5g ⇒ 0.5r = 1.5g ⇒ r = 3g.", "5. Work = 8(3g) + 6g = 30g; Rahul alone takes 30g ÷ 3g = 10 hours."], "shortcut": "", "source_url": "https://cracku.in/46-one-day-rahul-started-a-work-at-9-am-and-gautam-jo-x-cat-2021-slot-3"}, {"id": "2021-S3-Q03", "year": 2021, "slot": 3, "q_no": 3, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages – win rate", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 56.39% correct", "question": "A team has won 30% of the 40 matches it has played so far in a tournament. If it wins 60% of its remaining matches, its overall win rate will be 50%. If instead it wins 90% of the remaining matches, how many matches in total will it win in the tournament?", "options": ["80", "78", "84", "86"], "answer": "84", "answer_note": "", "concept": "Use the 50% overall condition to find the number of remaining matches, then apply the new win rate.", "formulas": ["Overall win % = Total wins ÷ Total matches × 100"], "solution": ["1. Wins so far = 30% of 40 = 12.", "2. Let x matches remain: (12 + 0.6x)/(40 + x) = 1/2.", "3. 24 + 1.2x = 40 + x ⇒ 0.2x = 16 ⇒ x = 80.", "4. At 90%, wins in remaining = 72.", "5. Total wins = 12 + 72 = 84."], "shortcut": "Alligation: 30% and 60% average to 50% in ratio 1:2, so remaining = 2 × 40 = 80.", "source_url": "https://cracku.in/47-in-a-tournament-a-team-has-played-40-matches-so-fa-x-cat-2021-slot-3"}, {"id": "2021-S3-Q04", "year": 2021, "slot": 3, "q_no": 4, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus inequality – integer pairs", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 1.15% correct", "question": "How many distinct ordered pairs of integers (m, n) satisfy |1 + mn| < |m + n| < 5?", "options": [], "answer": "12", "answer_note": "", "concept": "Square both sides of |1 + mn| < |m + n| to get a factorable condition, then apply the bound |m + n| < 5.", "formulas": ["(m + n)² − (1 + mn)² = −(m² − 1)(n² − 1)", "|a| < |b| ⇔ a² < b²"], "solution": ["1. |1 + mn| < |m + n| ⇔ (m + n)² − (1 + mn)² > 0.", "2. Expand: m² + n² − 1 − m²n² = −(m² − 1)(n² − 1) > 0, so (m² − 1)(n² − 1) < 0.", "3. One factor must be negative: for integers, m² − 1 < 0 only when m = 0 (then need n² > 1, i.e. |n| ≥ 2), and similarly for n.", "4. Case m = 0: condition becomes |n| ≥ 2 and |n| < 5 ⇒ n ∈ {±2, ±3, ±4} → 6 pairs.", "5. Case n = 0 symmetrically gives 6 pairs (no overlap).", "6. Total = 12."], "shortcut": "Brute force over −5 ≤ m, n ≤ 5 confirms only pairs with one coordinate 0 and the other of size 2–4 work.", "source_url": "https://cracku.in/48-the-number-of-distinct-pairs-of-integers-mn-satisf-x-cat-2021-slot-3"}, {"id": "2021-S3-Q05", "year": 2021, "slot": 3, "q_no": 5, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Log identities – change of base", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 22.74% correct", "question": "For a real number a, (log₁₅ a + log₃₂ a) ÷ (log₁₅ a × log₃₂ a) = 4. In which range must a lie?", "options": ["2 < a < 3", "3 < a < 4", "4 < a < 5", "a > 5"], "answer": "4 < a < 5", "answer_note": "", "concept": "Split the fraction into reciprocals of logs, which flip base and argument, then combine.", "formulas": ["(x + y)/(xy) = 1/x + 1/y", "1/log_b a = log_a b", "log_a p + log_a q = log_a (pq)"], "solution": ["1. LHS = 1/log₃₂ a + 1/log₁₅ a.", "2. Reciprocals flip: = log_a 32 + log_a 15 = log_a 480.", "3. log_a 480 = 4 ⇒ a⁴ = 480.", "4. 4⁴ = 256 < 480 < 625 = 5⁴, so 4 < a < 5 (a ≈ 4.68)."], "shortcut": "", "source_url": "https://cracku.in/49-for-a-real-number-a-if-fraclog_15alog_32alog_15alo-x-cat-2021-slot-3"}, {"id": "2021-S3-Q06", "year": 2021, "slot": 3, "q_no": 6, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentage change – population", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 17.6% correct", "question": "From 1970 to 1980, a city's total population (men plus women) grew by 25%, with the male population growing 40% and the female population growing 20%. From 1980 to 1990 the female population grew by 25%, and in 1990 there were twice as many females as males. By what percentage did the total population grow from 1970 to 1990?", "options": ["68.25", "68.75", "68.50", "69.25"], "answer": "68.75", "answer_note": "", "concept": "Use the weighted-average growth to find the 1970 male:female ratio, then track each group to 1990.", "formulas": ["Weighted % change: (m·p₁ + f·p₂)/(m + f) = overall %"], "solution": ["1. Let 1970 males = m, females = f: 1.4m + 1.2f = 1.25(m + f) ⇒ 0.15m = 0.05f ⇒ f = 3m.", "2. Take m = 100, f = 300 (total 400).", "3. 1980 females = 360; 1990 females = 360 × 1.25 = 450.", "4. 1990 males = 450 ÷ 2 = 225; 1990 total = 675.", "5. Growth = (675 − 400)/400 = 68.75%."], "shortcut": "Alligation of 40% and 20% around 25% gives m:f = 5:15 = 1:3 directly.", "source_url": "https://cracku.in/50-the-total-of-male-and-female-populations-in-a-city-x-cat-2021-slot-3"}, {"id": "2021-S3-Q07", "year": 2021, "slot": 3, "q_no": 7, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "Recursive sequence – telescoping sum", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 10.44% correct", "question": "A sequence x₁, x₂, x₃, … satisfies x₍ₙ₊₁₎ = xₙ + n − 1 for every n ≥ 1, with x₁ = −1. Find x₁₀₀.", "options": ["4849", "4949", "4950", "4850"], "answer": "4850", "answer_note": "", "concept": "Sum the successive differences (telescoping) to express x₁₀₀ in terms of x₁.", "formulas": ["x₁₀₀ = x₁ + Σ (x₍ₙ₊₁₎ − xₙ) for n = 1 to 99", "0 + 1 + … + k = k(k + 1)/2"], "solution": ["1. x₍ₙ₊₁₎ − xₙ = n − 1.", "2. Adding for n = 1 to 99: x₁₀₀ − x₁ = 0 + 1 + 2 + … + 98.", "3. 0 + 1 + … + 98 = 98 × 99/2 = 4851.", "4. x₁₀₀ = −1 + 4851 = 4850."], "shortcut": "Check small terms: x₂ = −1, x₃ = 0, x₄ = 2 fit xₙ = −1 + (n − 1)(n − 2)/2; at n = 100 that's −1 + 99·98/2 = 4850.", "source_url": "https://cracku.in/51-consider-a-sequence-of-real-numbers-x_1x_2x_3-such-x-cat-2021-slot-3"}, {"id": "2021-S3-Q08", "year": 2021, "slot": 3, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – maximising one value", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 30.59% correct", "question": "25 students take an exam and their average score is 50. Five of them share the top score. The remaining 20 students all have different integer scores, the lowest of which is 30. What is the highest score the five toppers could have?", "options": [], "answer": "92", "answer_note": "", "concept": "To maximise the toppers' score with a fixed total, minimise the sum of the other 20 distinct scores.", "formulas": ["Total = Mean × Count", "Sum of consecutive integers a to b = (a + b)(b − a + 1)/2"], "solution": ["1. Total of all scores = 25 × 50 = 1250.", "2. The 20 others are distinct integers with minimum 30; smallest possible sum is 30 + 31 + … + 49 = 790.", "3. Toppers' total ≤ 1250 − 790 = 460, so each topper ≤ 460 ÷ 5 = 92.", "4. 92 exceeds 49, so the toppers are indeed above everyone else; maximum = 92."], "shortcut": "", "source_url": "https://cracku.in/52-the-arithmetic-mean-of-scores-of-25-students-in-an-x-cat-2021-slot-3"}, {"id": "2021-S3-Q09", "year": 2021, "slot": 3, "q_no": 9, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit with fixed and variable costs", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 15.83% correct", "question": "A hostel's monthly cost has a fixed component and a component that varies in proportion to the number of boarders. Each boarder pays INR 1600 a month. The profit per boarder is INR 200 when there are 50 boarders and INR 250 when there are 75 boarders. What is the hostel's total monthly profit, in INR, with 80 boarders?", "options": ["20200", "20500", "20800", "20000"], "answer": "20500", "answer_note": "", "concept": "Write cost = fixed + (variable per boarder × boarders) for both cases and solve the pair of linear equations.", "formulas": ["Profit = Revenue − (Fixed cost + Variable cost × n)"], "solution": ["1. Let fixed cost = F, variable cost per boarder = v.", "2. At 50 boarders: cost = 50 × (1600 − 200) = 70000 ⇒ F + 50v = 70000.", "3. At 75 boarders: cost = 75 × (1600 − 250) = 101250 ⇒ F + 75v = 101250.", "4. Subtract: 25v = 31250 ⇒ v = 1250, F = 7500.", "5. At 80: profit = 80 × 1600 − 7500 − 80 × 1250 = 128000 − 107500 = 20500."], "shortcut": "", "source_url": "https://cracku.in/53-one-part-of-a-hostels-monthly-expenses-is-fixed-an-x-cat-2021-slot-3"}, {"id": "2021-S3-Q10", "year": 2021, "slot": 3, "q_no": 10, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rectangle – minimum fencing cost (AM-GM)", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 30.55% correct", "question": "Fencing a rectangular plot costs INR 200 per foot on one side and INR 100 per foot on each of the other three sides. The plot has an area of 60000 sq. ft. What is the minimum possible total cost of fencing, in INR?", "options": ["120000", "90000", "100000", "160000"], "answer": "120000", "answer_note": "", "concept": "Express cost in the two side lengths and minimise it under a fixed product using AM ≥ GM.", "formulas": ["AM ≥ GM: p + q ≥ 2√(pq), equality when p = q"], "solution": ["1. Let the expensive side and its opposite be x ft, the other two sides y ft; xy = 60000.", "2. Cost = 200x + 100x + 100y + 100y = 300x + 200y.", "3. By AM-GM, 300x + 200y ≥ 2√(300x × 200y) = 2√(60000 × 60000) = 120000.", "4. Equality at 300x = 200y = 60000 ⇒ x = 200, y = 300 (area 60000 ✓).", "5. Minimum cost = 120000."], "shortcut": "", "source_url": "https://cracku.in/54-the-cost-of-fencing-a-rectangular-plot-is-200-per--x-cat-2021-slot-3"}, {"id": "2021-S3-Q11", "year": 2021, "slot": 3, "q_no": 11, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rhombus – diagonals", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 21.12% correct", "question": "A park in the shape of a rhombus has area 96 sq m, and 40 m of fencing is needed to go around it. Electric wire is to be laid along both of its diagonals at INR 125 per metre. What is the total cost of the wiring, in INR?", "options": [], "answer": "3500", "answer_note": "", "concept": "Use the area and side of a rhombus to get the product and sum of squares of the diagonals, then find their sum.", "formulas": ["Area = d₁d₂/2", "d₁² + d₂² = 4a² (diagonals bisect at right angles)", "(d₁ + d₂)² = d₁² + d₂² + 2d₁d₂"], "solution": ["1. Perimeter 40 ⇒ side a = 10 m.", "2. Area 96 ⇒ d₁d₂ = 192.", "3. d₁² + d₂² = 4 × 100 = 400.", "4. (d₁ + d₂)² = 400 + 384 = 784 ⇒ d₁ + d₂ = 28 m (diagonals 12 and 16).", "5. Cost = 28 × 125 = 3500."], "shortcut": "Half-diagonals 6 and 8 with side 10 form the 6-8-10 right triangle, giving area 4 × 24 = 96.", "source_url": "https://cracku.in/55-a-park-is-shaped-like-a-rhombus-and-has-area-96-sq-x-cat-2021-slot-3"}, {"id": "2021-S3-Q12", "year": 2021, "slot": 3, "q_no": 12, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Word problem leading to a quadratic", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 21.52% correct", "question": "A tea stall sells small, medium and large cups. The three original prices (in INR) multiply to 800, and small : medium price = 2 : 5. If the small and medium prices are each raised by INR 6 while the large price stays the same, the product of the three prices becomes 3200. Find the sum of the three original prices, in INR.", "options": [], "answer": "34", "answer_note": "", "concept": "Divide the two product conditions to eliminate the large-cup price, giving a quadratic in the ratio constant.", "formulas": ["Factorising ak² + bk + c = 0"], "solution": ["1. Let small = 2k, medium = 5k, large = L: 10k²L = 800.", "2. After increase: (2k + 6)(5k + 6)L = 3200.", "3. Divide: (2k + 6)(5k + 6) = 4 × 10k² = 40k².", "4. 10k² + 42k + 36 = 40k² ⇒ 5k² − 7k − 6 = 0 ⇒ (5k + 3)(k − 2) = 0 ⇒ k = 2.", "5. Prices: 4, 10, and L = 800/40 = 20; sum = 34."], "shortcut": "", "source_url": "https://cracku.in/56-a-tea-shop-offers-tea-in-cups-of-three-different-s-x-cat-2021-slot-3"}, {"id": "2021-S3-Q13", "year": 2021, "slot": 3, "q_no": 13, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Circular track – relative speed", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 6.48% correct", "question": "Mira and Amal set off together from the same point on a circular track. Walking in the same direction, Amal completes exactly 3 rounds more than Mira in 45 minutes. Walking in opposite directions, they meet for the first time exactly 3 minutes after starting. How many rounds does Mira complete in one hour?", "options": [], "answer": "8", "answer_note": "", "concept": "Measure speeds in rounds per minute; the difference comes from the same-direction case and the sum from the opposite-direction first meeting.", "formulas": ["Same direction: gain in rounds = (a − m) × t", "Opposite direction first meeting: (a + m) × t = 1 round"], "solution": ["1. Let speeds be a (Amal) and m (Mira) in rounds/min.", "2. Same direction: (a − m) × 45 = 3 ⇒ a − m = 1/15.", "3. Opposite: (a + m) × 3 = 1 ⇒ a + m = 1/3.", "4. m = (1/3 − 1/15)/2 = (4/15)/2 = 2/15 rounds/min.", "5. In 60 minutes Mira walks 60 × 2/15 = 8 rounds."], "shortcut": "Per hour: a − m = 4 rounds and a + m = 20 rounds ⇒ m = 8.", "source_url": "https://cracku.in/57-mira-and-amal-walk-along-a-circular-track-starting-x-cat-2021-slot-3"}, {"id": "2021-S3-Q14", "year": 2021, "slot": 3, "q_no": 14, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – alloys", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 18.71% correct", "question": "Some amount of a silver–copper alloy, when combined with 3 kg of pure silver, gives an alloy that is 90% silver by weight. The same amount of the original alloy, when combined instead with 2 kg of an alloy containing 90% silver, gives an alloy that is 84% silver by weight. What is the weight of the original alloy, in kg?", "options": ["3.5", "2.5", "3", "4"], "answer": "3", "answer_note": "", "concept": "Write a silver balance for each mixing scenario and solve for the alloy's weight and silver content.", "formulas": ["Silver in mix = Σ (weight × silver fraction)"], "solution": ["1. Let the original alloy weigh w kg with s kg silver.", "2. Case 1: s + 3 = 0.9(w + 3) ⇒ s = 0.9w − 0.3.", "3. Case 2: s + 1.8 = 0.84(w + 2) ⇒ s = 0.84w − 0.12.", "4. Equate: 0.06w = 0.18 ⇒ w = 3 kg (with s = 2.4 kg, i.e. 80% silver)."], "shortcut": "Test w = 3: s = 2.4 gives 5.4/6 = 90% and 4.2/5 = 84% ✓.", "source_url": "https://cracku.in/58-if-a-certain-weight-of-an-alloy-of-silver-and-copp-x-cat-2021-slot-3"}, {"id": "2021-S3-Q15", "year": 2021, "slot": 3, "q_no": 15, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – isosceles angle chasing", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "2IIM: 21.63% correct", "question": "In triangle ABC, ∠BCA = 50°. Point D lies on AB and point E on AC with AD = DE. Point F lies on BC with BD = DF. Find ∠FDE in degrees.", "options": ["72", "80", "100", "96"], "answer": "80", "answer_note": "", "concept": "The equal lengths create isosceles triangles ADE and BDF; angle-chase around point D on line AB.", "formulas": ["Base angles of an isosceles triangle are equal", "Angles on a straight line sum to 180°", "A + B + C = 180°"], "solution": ["1. In △ADE, AD = DE ⇒ ∠DEA = ∠DAE = A, so ∠ADE = 180° − 2A.", "2. In △BDF, BD = DF ⇒ ∠DFB = ∠DBF = B, so ∠BDF = 180° − 2B.", "3. A, D, B are collinear: ∠ADE + ∠EDF + ∠FDB = 180°.", "4. ∠FDE = 180° − (180° − 2A) − (180° − 2B) = 2(A + B) − 180°.", "5. A + B = 180° − 50° = 130° ⇒ ∠FDE = 260° − 180° = 80°."], "shortcut": "General result: ∠FDE = 2(A + B) − 180° = 180° − 2C = 180° − 100° = 80°.", "source_url": "https://cracku.in/59-if-a-triangle-abc-angle-bca500-d-and-e-are-points--x-cat-2021-slot-3"}, {"id": "2021-S3-Q16", "year": 2021, "slot": 3, "q_no": 16, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple vs compound interest", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 16.08% correct", "question": "Bank A pays 6% per annum compounded half-yearly. Banks B and C pay simple interest, with C's annual rate double B's. Raju puts a sum in Bank B for t years, and Rupa puts INR 10000 in Bank C for 2t years. The interest Raju earns equals what the same sum would have earned in Bank A in one year. How much interest, in INR, does Rupa earn?", "options": ["3436", "2436", "2346", "1436"], "answer": "2436", "answer_note": "", "concept": "Bank A's one-year effective rate fixes the product r·t for Bank B; Bank C's rate × time is four times that.", "formulas": ["CI effective annual rate (half-yearly) = (1 + R/200)² − 1", "SI = P × r × t"], "solution": ["1. Bank A for 1 year: (1.03)² − 1 = 0.0609, i.e. 6.09% of the principal.", "2. Raju (Bank B, rate r, t years): r × t = 0.0609.", "3. Rupa (Bank C, rate 2r, 2t years): rate × time = 4rt = 0.2436.", "4. Interest = 10000 × 0.2436 = 2436."], "shortcut": "", "source_url": "https://cracku.in/60-bank-a-offers-6-interest-rate-per-annum-compounded-x-cat-2021-slot-3"}, {"id": "2021-S3-Q17", "year": 2021, "slot": 3, "q_no": 17, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Composite function – minimum of quadratic", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "2IIM: 43.86% correct", "question": "Given f(x) = x² − 7x and g(x) = x + 3, find the minimum value of f(g(x)) − 3x.", "options": ["−20", "−12", "−15", "−16"], "answer": "−16", "answer_note": "", "concept": "Compose the functions to get a quadratic and find its vertex value.", "formulas": ["Minimum of ax² + bx + c (a > 0) is at x = −b/(2a), value c − b²/(4a)"], "solution": ["1. f(g(x)) = (x + 3)² − 7(x + 3) = x² − x − 12.", "2. f(g(x)) − 3x = x² − 4x − 12.", "3. Complete the square: (x − 2)² − 16.", "4. Minimum = −16 at x = 2."], "shortcut": "", "source_url": "https://cracku.in/61-if-fxx2-7x-and-gxx3-then-the-minimum-value-of-fgx--x-cat-2021-slot-3"}, {"id": "2021-S3-Q18", "year": 2021, "slot": 3, "q_no": 18, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Time & work – wage sharing", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "2IIM: 60.92% correct", "question": "Anil alone can paint a house in 12 days and Barun alone in 16 days. Anil, Barun and Chandu take the job together for INR 24000 and finish it in 6 days. If each is paid in proportion to the work he does, how much does Chandu get, in INR?", "options": [], "answer": "3000", "answer_note": "", "concept": "Payment is split by share of work done; find Chandu's share as the leftover after Anil and Barun.", "formulas": ["Fraction of work = Days worked ÷ Days needed alone"], "solution": ["1. In 6 days Anil does 6/12 = 1/2 of the job.", "2. Barun does 6/16 = 3/8 of the job.", "3. Chandu does 1 − 1/2 − 3/8 = 1/8.", "4. Chandu's pay = 24000 × 1/8 = 3000."], "shortcut": "", "source_url": "https://cracku.in/62-anil-can-paint-a-house-in-12-days-while-barun-can--x-cat-2021-slot-3"}, {"id": "2021-S3-Q19", "year": 2021, "slot": 3, "q_no": 19, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Indices – product of powers", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "2IIM: 21.52% correct", "question": "n is a positive integer with (10^(1/7)) × (10^(1/7))² × (10^(1/7))³ × … × (10^(1/7))ⁿ > 999. What is the smallest possible n?", "options": [], "answer": "6", "answer_note": "", "concept": "Combine the powers into a single power of 10 whose exponent is a triangular number over 7.", "formulas": ["aᵖ × a^q = a^(p+q)", "1 + 2 + … + n = n(n + 1)/2"], "solution": ["1. Product = 10^((1 + 2 + … + n)/7) = 10^(n(n + 1)/14).", "2. Since 999 is just below 10³, we need the exponent n(n + 1)/14 to be about 3 or more.", "3. n = 5: exponent 30/14 ≈ 2.14 ⇒ product ≈ 139 < 999.", "4. n = 6: exponent 42/14 = 3 ⇒ product = 1000 > 999.", "5. Smallest n = 6."], "shortcut": "", "source_url": "https://cracku.in/63-if-n-is-a-positive-integer-such-that-sqrt710sqrt71-x-cat-2021-slot-3"}, {"id": "2021-S3-Q20", "year": 2021, "slot": 3, "q_no": 20, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Counting with inclusion–exclusion", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "2IIM: 4.28% correct", "question": "Four-digit numbers are made using only the digits 1, 2 and 3 (repetition allowed), such that the digits 2 and 3 each appear at least once. How many such numbers are there?", "options": [], "answer": "50", "answer_note": "", "concept": "Count all strings over {1, 2, 3} and remove those missing 2 or missing 3 using inclusion–exclusion.", "formulas": ["|A ∪ B| = |A| + |B| − |A ∩ B|"], "solution": ["1. All four-digit numbers from {1, 2, 3}: 3⁴ = 81.", "2. Numbers with no 2 (digits from {1, 3}): 2⁴ = 16; with no 3: 16.", "3. Numbers with neither 2 nor 3 (all 1s): 1.", "4. Valid = 81 − 16 − 16 + 1 = 50."], "shortcut": "", "source_url": "https://cracku.in/64-a-four-digit-number-is-formed-by-using-only-the-di-x-cat-2021-slot-3"}, {"id": "2021-S3-Q21", "year": 2021, "slot": 3, "q_no": 21, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Parallelogram – cosine rule", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 9.46% correct", "question": "ABCD is a parallelogram with side AD = 10 cm and diagonal AC = 20 cm. If ∠ADC = 30°, find the area of ABCD in sq. cm.", "options": ["25(√5 + √15)/2", "25(√3 + √15)", "25(√3 + √15)/2", "25(√5 + √15)"], "answer": "25(√3 + √15)", "answer_note": "", "concept": "Use the cosine rule in triangle ACD to find side CD, then area = product of adjacent sides × sine of included angle.", "formulas": ["Cosine rule: c² = a² + b² − 2ab cos C", "Area of parallelogram = ab sin θ"], "solution": ["1. Let CD = x. In △ACD: AC² = AD² + CD² − 2·AD·CD·cos 30°.", "2. 400 = 100 + x² − 10√3·x ⇒ x² − 10√3x − 300 = 0.", "3. x = (10√3 + √(300 + 1200))/2 = (10√3 + 10√15)/2 = 5(√3 + √15) (positive root).", "4. Area = AD × CD × sin 30° = 10 × 5(√3 + √15) × 1/2 = 25(√3 + √15)."], "shortcut": "", "source_url": "https://cracku.in/65-let-abcd-be-a-parallelogram-the-lengths-of-the-sid-x-cat-2021-slot-3"}, {"id": "2021-S3-Q22", "year": 2021, "slot": 3, "q_no": 22, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus – simultaneous equations", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "2IIM: 11.05% correct", "question": "Given 3x + 2|y| + y = 7 and x + |x| + 3y = 1, find x + 2y.", "options": ["−4/3", "8/3", "0", "1"], "answer": "0", "answer_note": "", "concept": "Split by the signs of x and y, solve each linear system, and keep only the sign-consistent solution.", "formulas": ["|t| = t for t ≥ 0, |t| = −t for t < 0"], "solution": ["1. If x < 0: second equation gives 3y = 1, y = 1/3; first gives 3x + 1 = 7, x = 2 — contradicts x < 0.", "2. So x ≥ 0: second equation becomes 2x + 3y = 1.", "3. If y ≥ 0: first becomes 3x + 3y = 7; with 2x + 3y = 1 gives x = 6, y = −11/3 — contradicts y ≥ 0.", "4. So y < 0: first becomes 3x − y = 7; with 2x + 3y = 1 gives x = 2, y = −1 ✓.", "5. x + 2y = 2 − 2 = 0."], "shortcut": "", "source_url": "https://cracku.in/66-if-3x2mid-ymidy7-and-xmid-x-mid3y1-then-x2y-is-x-cat-2021-slot-3"}, {"id": "2022-S1-Q01", "year": 2022, "slot": 1, "q_no": 1, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Coordinate geometry – parallelogram vertex", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A, B, C, D are the vertices, taken in order, of a parallelogram ABCD. Given A = (1, 1), B = (3, 4) and C = (−2, 8), what are the coordinates of D?", "options": ["(−4, 5)", "(4, 5)", "(−3, 4)", "(0, 11)"], "answer": "(−4, 5)", "answer_note": "", "concept": "The diagonals of a parallelogram bisect each other, so the midpoints of AC and BD coincide.", "formulas": ["A + C = B + D (vector form of common midpoint)"], "solution": ["1. Since diagonals AC and BD share a midpoint, D = A + C − B.", "2. x-coordinate: 1 + (−2) − 3 = −4.", "3. y-coordinate: 1 + 8 − 4 = 5.", "4. D = (−4, 5)."], "shortcut": "D = A + C − B; just add and subtract coordinates.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-1.shtml"}, {"id": "2022-S1-Q02", "year": 2022, "slot": 1, "q_no": 2, "area": "Modern Math", "topic": "P&C and Probability", "subtopic": "Distribution of identical objects – even counts", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Twenty identical balloons are to be handed out to 4 children. Every child must receive at least one balloon, and every child must receive an even number of balloons. In how many ways can this be done?", "options": [], "answer": "84", "answer_note": "", "concept": "Convert the 'positive even' restriction into a standard positive-integer distribution by halving.", "formulas": ["Positive integer solutions of x₁+…+xₖ = n: C(n−1, k−1)"], "solution": ["1. Each child gets 2yᵢ balloons with yᵢ ≥ 1 (even and at least one means at least 2).", "2. 2(y₁+y₂+y₃+y₄) = 20, so y₁+y₂+y₃+y₄ = 10 with each yᵢ ≥ 1.", "3. Number of positive solutions = C(9, 3) = 84.", "4. Answer: 84."], "shortcut": "Halve everything: 10 into 4 positive parts = C(9,3).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-2.shtml"}, {"id": "2022-S1-Q03", "year": 2022, "slot": 1, "q_no": 3, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Mixtures – dilution", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A drink consists of lemon juice and sugar syrup in equal proportion. This drink is then combined with pure sugar syrup in the ratio 1 : 3 (drink : syrup). In the final mixture, what is the ratio of lemon juice to sugar syrup?", "options": ["1 : 6", "1 : 4", "1 : 5", "1 : 7"], "answer": "1 : 7", "answer_note": "", "concept": "Track the quantity of each component through the mixing step.", "formulas": ["Component amount = fraction × volume"], "solution": ["1. Take 1 unit of the drink: 0.5 lemon juice + 0.5 syrup.", "2. Add 3 units of pure syrup.", "3. Lemon juice = 0.5; syrup = 0.5 + 3 = 3.5.", "4. Ratio = 0.5 : 3.5 = 1 : 7."], "shortcut": "Use 2 L drink + 6 L syrup: lemon 1, syrup 7.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-3.shtml"}, {"id": "2022-S1-Q04", "year": 2022, "slot": 1, "q_no": 4, "area": "Number System", "topic": "Number System", "subtopic": "Integer equations – factorisation", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "x, y and z are natural numbers satisfying xy + yz = 19 and yz + xz = 51. What is the least possible value of xyz?", "options": [], "answer": "34", "answer_note": "", "concept": "Factor each equation and use the fact that 19 is prime to pin down y.", "formulas": ["y(x + z) = 19", "z(x + y) = 51 = 3 × 17"], "solution": ["1. y(x + z) = 19 with 19 prime and x + z ≥ 2, so y = 1 and x + z = 19.", "2. Second equation becomes z(x + 1) = 51.", "3. Substitute x = 19 − z: z(20 − z) = 51 ⇒ z² − 20z + 51 = 0 ⇒ z = 3 or 17.", "4. z = 3 gives x = 16, xyz = 48; z = 17 gives x = 2, xyz = 34.", "5. Minimum xyz = 34."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-4.shtml"}, {"id": "2022-S1-Q05", "year": 2022, "slot": 1, "q_no": 5, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Sign of a quadratic – discriminant", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "a, b, c are non-zero real numbers with b² < 4ac, and f(x) = ax² + bx + c. Let S be the set of all integers m for which f(m) < 0. Which of the following must be true about S?", "options": ["S is the set of all integers", "S is either empty or the set of all integers", "S is the empty set", "S is the set of all positive integers"], "answer": "S is either empty or the set of all integers", "answer_note": "", "concept": "A negative discriminant means the quadratic never crosses zero, so it keeps one sign for every real x.", "formulas": ["D = b² − 4ac < 0 ⇒ f(x) has the sign of a for all real x"], "solution": ["1. b² < 4ac means D < 0, so f(x) has no real roots.", "2. A continuous quadratic with no real roots never changes sign: f(x) > 0 for all x if a > 0, f(x) < 0 for all x if a < 0.", "3. If a > 0 (e.g. x² + 1), no integer gives f(m) < 0, so S is empty.", "4. If a < 0 (e.g. −x² − 1), every integer gives f(m) < 0, so S is all integers.", "5. Hence S is either empty or the set of all integers."], "shortcut": "Test x² + 1 and −x² − 1: both satisfy b² < 4ac and give the two extremes.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-5.shtml"}, {"id": "2022-S1-Q06", "year": 2022, "slot": 1, "q_no": 6, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Meeting point – time after crossing", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Two trains A and B leave stations X and Y respectively at the same moment and run towards each other at constant speeds. Train A arrives at Y 10 minutes after starting. Train B arrives at X 9 minutes after it crosses train A. How many minutes does train B take in total to go from Y to X?", "options": ["15", "12", "6", "10"], "answer": "15", "answer_note": "", "concept": "Meeting time t equals the product-type relation between total times; equivalently, after meeting, each train covers the other's pre-meeting distance.", "formulas": ["Meeting time t = Tₐ·T_b/(Tₐ + T_b)", "t_b(after meeting) = T_b − t"], "solution": ["1. Let B's total time be T minutes; A's total time is 10 minutes.", "2. They meet after t = 10T/(10 + T) minutes.", "3. B needs T − t = 9 after meeting: T − 10T/(10 + T) = 9 ⇒ T²/(10 + T) = 9.", "4. T² − 9T − 90 = 0 ⇒ (T − 15)(T + 6) = 0 ⇒ T = 15."], "shortcut": "Plug options: T = 15 gives meet at 6 min, then 15 − 6 = 9 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-6.shtml"}, {"id": "2022-S1-Q07", "year": 2022, "slot": 1, "q_no": 7, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – parity of new average", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Three integers have an average of 13. A natural number n is added to this group, and the average of the four numbers turns out to be an odd integer. What is the smallest possible value of n?", "options": ["3", "4", "5", "1"], "answer": "5", "answer_note": "", "concept": "New sum must be 4 times an odd integer.", "formulas": ["Sum = average × count"], "solution": ["1. Sum of the three integers = 3 × 13 = 39.", "2. New average = (39 + n)/4 must be an odd integer.", "3. n = 1 gives 40/4 = 10 (even), reject.", "4. Next multiple of 4 is 44: n = 5 gives 44/4 = 11 (odd).", "5. Minimum n = 5."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-7.shtml"}, {"id": "2022-S1-Q08", "year": 2022, "slot": 1, "q_no": 8, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratio – people in a queue", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Pinky is standing in a queue. The number of people in front of her and the number of people behind her are in the ratio 3 : 5. If fewer than 300 people are in the queue in total, what is the largest possible number of people in front of her?", "options": [], "answer": "111", "answer_note": "", "concept": "Total = ahead + behind + Pinky herself; the ratio fixes a common multiplier.", "formulas": ["Ahead = 3k, Behind = 5k, Total = 8k + 1"], "solution": ["1. Let ahead = 3k and behind = 5k.", "2. Total people = 3k + 5k + 1 = 8k + 1 < 300 ⇒ 8k < 299 ⇒ k ≤ 37.", "3. Maximum people ahead = 3 × 37 = 111."], "shortcut": "Don't forget to count Pinky.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-8.shtml"}, {"id": "2022-S1-Q09", "year": 2022, "slot": 1, "q_no": 9, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Marked price & discount – mixture", "type": "MCQ", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Ankita purchases 4 kg of cashews, 14 kg of peanuts and 6 kg of almonds. The cost of 7 kg of cashews, the cost of 30 kg of peanuts and the cost of 9 kg of almonds are all the same. She mixes everything and fixes a marked price per kg for the mixture such that selling all of it at that price would give a total profit of ₹1752. In fact she sells 4 kg at the marked price and the remaining 20 kg at 20% below the marked price, earning a total profit of ₹744. How much (in ₹) did she spend on almonds?", "options": ["1440", "1176", "1680", "2520"], "answer": "1680", "answer_note": "", "concept": "Use the two profit scenarios to find the marked price and total cost, then split cost using the equal-cost relation.", "formulas": ["Profit = Revenue − Cost", "Equal cost L: price/kg = L/7, L/30, L/9"], "solution": ["1. Let marked price be M per kg and total cost C. Plan: 24M − C = 1752.", "2. Actual revenue = 4M + 20(0.8M) = 20M, so 20M − C = 744.", "3. Subtract: 4M = 1008 ⇒ M = 252, so C = 24 × 252 − 1752 = 4296.", "4. Let common cost be L: C = 4(L/7) + 14(L/30) + 6(L/9) = L(60 + 49 + 70)/105 = 179L/105.", "5. L = 4296 × 105/179 = 2520.", "6. Almonds cost = 6 × 2520/9 = ₹1680."], "shortcut": "Almonds = (70/179) of total cost = 70 × 24 = 1680.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-9.shtml"}, {"id": "2022-S1-Q10", "year": 2022, "slot": 1, "q_no": 10, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus – infinitely many solutions", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "What is the greatest real value of a for which the equation |x + a| + |x − 1| = 2 has infinitely many solutions in x?", "options": ["−1", "0", "1", "2"], "answer": "1", "answer_note": "", "concept": "|x − p| + |x − q| attains its minimum |p − q| on the whole interval between p and q; infinitely many solutions need that minimum to equal 2.", "formulas": ["|x − p| + |x − q| ≥ |p − q|, equality for x between p and q"], "solution": ["1. |x + a| + |x − 1| = |x − (−a)| + |x − 1| has minimum |1 + a|, attained for every x between −a and 1.", "2. Outside that interval the sum is strictly monotonic, giving at most finitely many solutions.", "3. So we need |1 + a| = 2 (with a non-degenerate interval) ⇒ a = 1 or a = −3.", "4. Largest a = 1."], "shortcut": "Distance between points −a and 1 must equal 2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-10.shtml"}, {"id": "2022-S1-Q11", "year": 2022, "slot": 1, "q_no": 11, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Trapezium – area from perimeter", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "ABCD is a trapezium with AD parallel to BC and ∠BAD = 90°. BC = 3 cm, AD = 8 cm and the perimeter of ABCD is 36 cm. Find the area of ABCD in square cm.", "options": [], "answer": "66", "answer_note": "", "concept": "AB is perpendicular to both parallel sides, so it is the height; the slant side CD forms a right triangle with the height and the difference of the parallel sides.", "formulas": ["Area of trapezium = ½ × (sum of parallel sides) × height", "Pythagoras"], "solution": ["1. Let AB = h (the height). Then CD = 36 − 3 − 8 − h = 25 − h.", "2. Drop a perpendicular from C to AD: horizontal leg = 8 − 3 = 5, vertical leg = h.", "3. (25 − h)² = h² + 25 ⇒ 625 − 50h = 25 ⇒ h = 12.", "4. Area = ½ × (3 + 8) × 12 = 66 sq. cm."], "shortcut": "5-12-13 triple: h + CD = 25 with horizontal leg 5 ⇒ 12 and 13.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-11.shtml"}, {"id": "2022-S1-Q12", "year": 2022, "slot": 1, "q_no": 12, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Floor function – summation", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let [x] be the greatest integer less than or equal to x. If [1/5 + 1/25] + [1/5 + 2/25] + … + [1/5 + N/25] = 25, find N.", "options": [], "answer": "44", "answer_note": "", "concept": "Rewrite the general term as a single floor and count how many terms equal 0, 1, 2, …", "formulas": ["[1/5 + n/25] = [(n + 5)/25]"], "solution": ["1. Each term is [(n + 5)/25].", "2. For n = 1 to 19, n + 5 < 25, so each term is 0.", "3. For n = 20 to 44, 25 ≤ n + 5 < 50, so each term is 1; that is 25 terms.", "4. Sum reaches 25 exactly at n = 44 (n = 45 would add 2).", "5. N = 44."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-12.shtml"}, {"id": "2022-S1-Q13", "year": 2022, "slot": 1, "q_no": 13, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Ratios – compound ratio with categories", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "In a village, males and females are in the ratio 5 : 4. Literate males to literate females are in the ratio 2 : 3, and illiterate males to illiterate females are in the ratio 4 : 3. If there are 3600 literate males, how many females live in the village?", "options": [], "answer": "43200", "answer_note": "", "concept": "Fix the literate counts from the given number, introduce a variable for illiterates, and apply the overall male:female ratio.", "formulas": ["Male/Female = (literate + illiterate) totals"], "solution": ["1. Literate males = 3600 ⇒ literate females = 3600 × 3/2 = 5400.", "2. Let illiterate males = 4k and illiterate females = 3k.", "3. (3600 + 4k)/(5400 + 3k) = 5/4 ⇒ 14400 + 16k = 27000 + 15k ⇒ k = 12600.", "4. Females = 5400 + 3 × 12600 = 43200."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-13.shtml"}, {"id": "2022-S1-Q14", "year": 2022, "slot": 1, "q_no": 14, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Profit – partial sales & mixture", "type": "TITA", "difficulty": "Hard", "difficulty_basis": "Assessed", "question": "Amal buys 110 kg of syrup and 120 kg of juice; per kg, syrup is 20% cheaper than juice. He sells 10 kg of syrup at a profit of 10% and 20 kg of juice at a profit of 20%. He then mixes all the remaining syrup and juice and sells the mixture at ₹308.32 per kg. His overall profit on the whole deal is 64%. What is his cost price of syrup per kg (in ₹)?", "options": [], "answer": "160", "answer_note": "", "concept": "Express every cost and revenue in terms of the juice cost per kg and equate total revenue with 1.64 × total cost.", "formulas": ["Revenue = (1 + profit%) × Cost"], "solution": ["1. Let juice cost J per kg, so syrup costs 0.8J per kg.", "2. Total cost = 110(0.8J) + 120J = 208J.", "3. Revenue: syrup 10 × 0.8J × 1.1 = 8.8J; juice 20 × J × 1.2 = 24J; mixture (100 + 100) kg × 308.32 = 61664.", "4. 32.8J + 61664 = 1.64 × 208J = 341.12J ⇒ 308.32J = 61664 ⇒ J = 200.", "5. Syrup cost = 0.8 × 200 = ₹160 per kg."], "shortcut": "Notice 341.12 − 32.8 = 308.32, the mixture price, so J = 61664/308.32 = 200 directly.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-14.shtml"}, {"id": "2022-S1-Q15", "year": 2022, "slot": 1, "q_no": 15, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Symmetric equations – adding", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "a and b are natural numbers with a² + ab + a = 14 and b² + ab + b = 28. Find the value of 2a + b.", "options": ["7", "10", "9", "8"], "answer": "8", "answer_note": "", "concept": "Adding the equations produces a perfect quadratic in (a + b).", "formulas": ["(a + b)² + (a + b) = sum of the equations"], "solution": ["1. Add: a² + 2ab + b² + a + b = 42 ⇒ (a + b)² + (a + b) − 42 = 0.", "2. (a + b + 7)(a + b − 6) = 0 ⇒ a + b = 6 (natural numbers).", "3. First equation: a(a + b + 1) = 14 ⇒ 7a = 14 ⇒ a = 2, so b = 4.", "4. 2a + b = 4 + 4 = 8."], "shortcut": "a(a+b+1)=14 and b(a+b+1)=28 ⇒ b = 2a; a(3a+1)=14 ⇒ a = 2.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-15.shtml"}, {"id": "2022-S1-Q16", "year": 2022, "slot": 1, "q_no": 16, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest – equal interest split", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Alex divides his savings into two parts. The simple interest earned on the first part at 15% per annum over 4 years equals the simple interest earned on the second part at 12% per annum over 3 years. What percentage of his savings is in the first part?", "options": ["62.5%", "37.5%", "60%", "40%"], "answer": "37.5%", "answer_note": "", "concept": "Equal interest means principals are inversely proportional to rate × time.", "formulas": ["SI = P × R × T/100"], "solution": ["1. Let parts be x and y: x × 15 × 4 = y × 12 × 3 ⇒ 60x = 36y.", "2. x : y = 36 : 60 = 3 : 5.", "3. First part share = 3/8 = 37.5%."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-16.shtml"}, {"id": "2022-S1-Q17", "year": 2022, "slot": 1, "q_no": 17, "area": "Modern Math", "topic": "Set Theory / Venn Diagrams", "subtopic": "Three sets – max/min of triple overlap", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A class has 100 students. 73 of them like coffee, 80 like tea and 52 like lemonade; some students may like none of the three. What is the difference between the largest and smallest possible number of students who like all three drinks?", "options": ["48", "53", "47", "52"], "answer": "47", "answer_note": "", "concept": "Maximum triple overlap is bounded by the smallest set; minimum is found by packing memberships so that as many students as possible like exactly two.", "formulas": ["Sum of set sizes = (exactly 1) + 2(exactly 2) + 3(all three)", "Total students ≤ 100"], "solution": ["1. Maximum: all 52 lemonade-lovers can also like coffee and tea (52 ≤ 73, 80), so max = 52.", "2. Total memberships = 73 + 80 + 52 = 205.", "3. With x students liking all three and at most 100 − x others each liking at most 2: 3x + 2(100 − x) ≥ 205 ⇒ x ≥ 5.", "4. x = 5 is achievable (5 like all three, 95 like exactly two, nobody likes none).", "5. Difference = 52 − 5 = 47."], "shortcut": "Min triple = total memberships − 2 × 100 = 5.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-17.shtml"}, {"id": "2022-S1-Q18", "year": 2022, "slot": 1, "q_no": 18, "area": "Algebra", "topic": "Progressions & Series", "subtopic": "AP – nth term from Sₙ", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "The sum of the first n terms of an arithmetic progression is n + 2n² for every natural number n. If the nth term of this progression is divisible by 9, what is the smallest possible value of n?", "options": ["4", "8", "7", "9"], "answer": "7", "answer_note": "", "concept": "Get the nth term as Sₙ − Sₙ₋₁ and check divisibility.", "formulas": ["tₙ = Sₙ − Sₙ₋₁"], "solution": ["1. tₙ = (n + 2n²) − ((n − 1) + 2(n − 1)²) = 4n − 1.", "2. Need 9 | 4n − 1.", "3. Check n = 1, 2, …: 4n − 1 = 3, 7, 11, 15, 19, 23, 27 → first multiple of 9 at n = 7.", "4. Smallest n = 7."], "shortcut": "4n ≡ 1 (mod 9) ⇒ n ≡ 7 (mod 9).", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-18.shtml"}, {"id": "2022-S1-Q19", "year": 2022, "slot": 1, "q_no": 19, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Rectangle inscribed in a circle", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "A rectangle has all four vertices on a circle of radius R. If the rectangle's perimeter is P, what is its area?", "options": ["P²/2 − 2PR", "P²/8 − 2R²", "P²/16 − R²", "P²/8 − R²/2"], "answer": "P²/8 − 2R²", "answer_note": "", "concept": "The diagonal of an inscribed rectangle is a diameter; combine sum of sides and sum of squares of sides.", "formulas": ["l² + b² = (2R)²", "(l + b)² = l² + b² + 2lb"], "solution": ["1. l + b = P/2 and diagonal = 2R ⇒ l² + b² = 4R².", "2. 2lb = (l + b)² − (l² + b²) = P²/4 − 4R².", "3. Area lb = P²/8 − 2R²."], "shortcut": "Test a 3 × 4 rectangle: R = 2.5, P = 14, area 12 = 196/8 − 12.5 ✓.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-19.shtml"}, {"id": "2022-S1-Q20", "year": 2022, "slot": 1, "q_no": 20, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – new members join", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "When some new students join a class, the average weight of the class goes up by 600 g. The average weight of the newcomers is 3 kg more than the average weight of the students originally in the class. What is the ratio of the number of original students to the number of new students?", "options": ["1 : 2", "3 : 1", "1 : 4", "4 : 1"], "answer": "4 : 1", "answer_note": "", "concept": "The excess weight of the newcomers over the old average is shared across the whole enlarged class.", "formulas": ["Change in average = (excess of newcomers × m)/(n + m)"], "solution": ["1. Let there be n original and m new students, original average A.", "2. Newcomers bring a total excess of 3m kg over A.", "3. This excess spread over n + m students raises the average by 0.6 kg: 3m/(n + m) = 0.6.", "4. 3m = 0.6n + 0.6m ⇒ 2.4m = 0.6n ⇒ n : m = 4 : 1."], "shortcut": "Alligation: deviations 0.6 and 2.4 give n : m = 2.4 : 0.6 = 4 : 1.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-20.shtml"}, {"id": "2022-S1-Q21", "year": 2022, "slot": 1, "q_no": 21, "area": "Number System", "topic": "Number System", "subtopic": "Greatest common divisor of a family of numbers", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let A be the greatest positive integer that divides 3^k + 4^k + 5^k for every positive integer k, and let B be the greatest positive integer that divides 4^k + 3(4^k) + 4^(k+2) for every positive integer k. Find A + B.", "options": [], "answer": "82", "answer_note": "", "concept": "The largest divisor common to all members of a family equals the HCF of its members; small cases reveal it and a general argument confirms it.", "formulas": ["HCF of f(1), f(2), … gives the universal divisor"], "solution": ["1. For A: k = 1 gives 12, k = 2 gives 50; HCF(12, 50) = 2, so A ≤ 2.", "2. 3^k and 5^k are odd and 4^k is even, so the sum is always even ⇒ A = 2.", "3. For B: 4^k + 3·4^k + 16·4^k = 20·4^k.", "4. k = 1 gives 80, and 20·4^k = 80·4^(k−1) is always a multiple of 80 ⇒ B = 80.", "5. A + B = 82."], "shortcut": "", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-21.shtml"}, {"id": "2022-S1-Q22", "year": 2022, "slot": 1, "q_no": 22, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Modulus – maximum of sum of absolute values", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Let 0 ≤ a ≤ x ≤ 100 and f(x) = |x − a| + |x − 100| + |x − a − 50|. If the maximum value of f(x) over this range is 100, what is a?", "options": ["100", "25", "0", "50"], "answer": "50", "answer_note": "", "concept": "A sum of absolute values is convex in x, so its maximum on an interval occurs at an endpoint.", "formulas": ["Max of convex piecewise-linear function on [a, 100] is at x = a or x = 100"], "solution": ["1. f is convex, so max on [a, 100] is max(f(a), f(100)).", "2. f(a) = 0 + (100 − a) + 50 = 150 − a.", "3. f(100) = (100 − a) + 0 + |50 − a|.", "4. Try options: a = 50 gives f(50) = 100, f(100) = 50 + 0 = 50, max = 100 ✓.", "5. a = 0: max 150; a = 25: max 125; a = 100: f(100) = 0 + 0 + 50 = 50. Only a = 50 works."], "shortcut": "f(a) = 150 − a must not exceed 100 ⇒ a ≥ 50; a = 50 is the option that fits.", "source_url": "https://online.2iim.com/CAT-question-paper/CAT-2022-Question-Paper-Slot-1-Quant/quants-question-22.shtml"}, {"id": "2022-S2-Q01", "year": 2022, "slot": 2, "q_no": 1, "area": "Arithmetic", "topic": "Profit, Loss & Interest", "subtopic": "Simple interest – split investment", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Mr. Pinto puts one-fifth of his capital into a scheme paying 6% simple interest per annum, one-third into a scheme paying 10% simple interest per annum, and the remaining amount at 1% simple interest per annum. What is the least whole number of years after which the total interest earned will be at least equal to his capital?", "options": [], "answer": "20", "answer_note": "", "concept": "Simple interest grows linearly, so the blended yearly rate of the whole capital decides how many years it takes for interest to equal the principal.", "formulas": ["SI = P × R × T / 100", "Blended rate = Σ (fraction × rate)"], "solution": ["1. Take capital = 15 units (LCM of 5 and 3): 3 units at 6%, 5 units at 10%, the remaining 7 units at 1%.", "2. Interest per year = 3×0.06 + 5×0.10 + 7×0.01 = 0.18 + 0.50 + 0.07 = 0.75 units.", "3. Need 0.75 × T ≥ 15, so T ≥ 20.", "4. Minimum number of years = 20."], "shortcut": "Blended rate = 6/5 + 10/3 + 7/15 = 5% per year; doubling needs 100/5 = 20 years.", "source_url": "https://cracku.in/45-mr-pinto-invests-one-fifth-of-his-capital-at-6-one-x-cat-2022-slot-2"}, {"id": "2022-S2-Q02", "year": 2022, "slot": 2, "q_no": 2, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – change of one term", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A sequence a₁, a₂, …, a_N of N numbers is non-decreasing and its average is 300. If the first term a₁ is replaced by 6a₁, the average of the new sequence becomes 400. How many values can a₁ possibly take?", "options": [], "answer": "14", "answer_note": "", "concept": "Changing one term changes the total by a known amount, which links a₁ to N; the non-decreasing condition then bounds N.", "formulas": ["Sum = average × number of terms", "In a non-decreasing sequence every term ≥ a₁"], "solution": ["1. Original sum = 300N; new sum = 400N. The increase is 5a₁ = 100N, so a₁ = 20N.", "2. The other N − 1 terms add up to 300N − 20N = 280N.", "3. Each of them is at least a₁ = 20N, so 280N ≥ (N − 1)·20N, giving N − 1 ≤ 14, i.e. N ≤ 15.", "4. N must be at least 2 (for N = 1 the average would itself change from 300 to 1800, not 400).", "5. N = 2, 3, …, 15 gives 14 possible values of a₁ = 20N (40, 60, …, 300)."], "shortcut": "", "source_url": "https://cracku.in/46-the-average-of-a-non-decreasing-sequence-of-n-numb-x-cat-2022-slot-2"}, {"id": "2022-S2-Q03", "year": 2022, "slot": 2, "q_no": 3, "area": "Algebra", "topic": "Logarithms, Surds & Indices", "subtopic": "Exponential equation a^b = 1", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "Find the number of integer values of x that satisfy (x² − 10)^(x² − 3x − 10) = 1.", "options": [], "answer": "4", "answer_note": "", "concept": "An integer power equals 1 in exactly three ways: the exponent is 0 with a non-zero base, the base is 1, or the base is −1 with an even exponent.", "formulas": ["a⁰ = 1 for a ≠ 0", "1ⁿ = 1", "(−1)^(even) = 1"], "solution": ["1. Exponent zero: x² − 3x − 10 = (x − 5)(x + 2) = 0, so x = 5 or x = −2. Bases are 15 and −6, both non-zero — both valid.", "2. Base 1: x² − 10 = 1 gives x² = 11 — no integer solution.", "3. Base −1: x² − 10 = −1 gives x = ±3.", "4. x = 3: exponent = 9 − 9 − 10 = −10 (even) → valid. x = −3: exponent = 9 + 9 − 10 = 8 (even) → valid.", "5. Solutions: −3, −2, 3, 5 — a total of 4."], "shortcut": "", "source_url": "https://cracku.in/47-the-number-of-integer-solutions-of-the-equation-le-x-cat-2022-slot-2"}, {"id": "2022-S2-Q04", "year": 2022, "slot": 2, "q_no": 4, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Averages – savings target", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Manu's monthly income is ₹4000, and he wants his savings over the year to average ₹550 per month. For the first nine months his monthly expense is ₹3500; from the tenth month onwards it rises to ₹3700 per month. What should his monthly income be from the tenth month onwards so that he meets his yearly savings goal?", "options": ["4400", "4200", "4300", "4350"], "answer": "4400", "answer_note": "", "concept": "Convert the average target into a yearly total, subtract what is already saved, and spread the shortfall over the remaining months.", "formulas": ["Savings = Income − Expense", "Total = average × count"], "solution": ["1. Required savings in the year = 550 × 12 = ₹6600.", "2. Savings in months 1–9 = 9 × (4000 − 3500) = ₹4500.", "3. Savings still needed in months 10–12 = 6600 − 4500 = ₹2100, i.e. ₹700 per month.", "4. Monthly income needed = 3700 + 700 = ₹4400."], "shortcut": "", "source_url": "https://cracku.in/48-manu-earns-4000-per-month-and-wants-to-save-an-ave-x-cat-2022-slot-2"}, {"id": "2022-S2-Q05", "year": 2022, "slot": 2, "q_no": 5, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Triangles – altitudes & trigonometry", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "In triangle ABC, AD is the altitude from A to BC and BE is the altitude from B to AC. Given ∠BAC = 45° and ∠ABC = θ, find the value of AD/BE.", "options": ["√2 cos θ", "(sin θ + cos θ)/√2", "1", "√2 sin θ"], "answer": "√2 sin θ", "answer_note": "", "concept": "Express both altitudes in terms of the common side AB using the right triangles they form.", "formulas": ["In a right triangle, opposite side = hypotenuse × sin(angle)"], "solution": ["1. In right triangle ABE (right angle at E), BE = AB sin 45° = AB/√2.", "2. In right triangle ABD (right angle at D), AD = AB sin θ.", "3. AD/BE = AB sin θ ÷ (AB/√2) = √2 sin θ."], "shortcut": "Take θ = 90°: then D = B, AD = AB and BE = AB/√2, so the ratio is √2 — only √2 sin θ gives √2 at θ = 90°.", "source_url": "https://cracku.in/49-in-triangle-abc-altitudes-ad-and-be-are-drawn-to-t-x-cat-2022-slot-2"}, {"id": "2022-S2-Q06", "year": 2022, "slot": 2, "q_no": 6, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Quadratic with a repeated root", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "f(x) is a quadratic polynomial that is never negative for real x. It is known that f(2) = 0 and f(4) = 6. Find f(−2).", "options": ["12", "24", "6", "36"], "answer": "24", "answer_note": "", "concept": "A quadratic that is ≥ 0 everywhere and touches zero at a point must have that point as a double root.", "formulas": ["f(x) = a(x − α)² when α is a repeated root"], "solution": ["1. Since f(x) ≥ 0 for all x and f(2) = 0, x = 2 is a repeated root: f(x) = a(x − 2)² with a > 0.", "2. f(4) = a × 4 = 6, so a = 3/2.", "3. f(−2) = (3/2) × (−4)² = (3/2) × 16 = 24."], "shortcut": "f(−2)/f(4) = (−4)²/2² = 4, so f(−2) = 4 × 6 = 24.", "source_url": "https://cracku.in/50-let-fx-be-a-quadratic-polynomial-in-x-such-that-fx-x-cat-2022-slot-2"}, {"id": "2022-S2-Q07", "year": 2022, "slot": 2, "q_no": 7, "area": "Algebra", "topic": "Quadratic & Polynomial Equations", "subtopic": "Cubic – Vieta's relations", "type": "MCQ", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "r and c are real numbers such that both r and −r are roots of the cubic equation 5x³ + cx² − 10x + 9 = 0. Find c.", "options": ["−9/2", "9/2", "−4", "4"], "answer": "−9/2", "answer_note": "", "concept": "Use Vieta's relations with roots r, −r and an unknown third root p.", "formulas": ["For ax³ + bx² + cx + d = 0: sum of roots = −b/a, sum of pairwise products = c/a, product = −d/a"], "solution": ["1. Let the roots be r, −r, p.", "2. Sum of pairwise products: r(−r) + rp − rp = −r² = −10/5 = −2, so r² = 2.", "3. Product of roots: r(−r)p = −r²p = −9/5, so p = 9/10.", "4. Sum of roots: r − r + p = p = −c/5, so c = −5p = −9/2."], "shortcut": "", "source_url": "https://cracku.in/51-let-r-and-c-be-real-numbers-if-r-and-r-are-roots-o-x-cat-2022-slot-2"}, {"id": "2022-S2-Q08", "year": 2022, "slot": 2, "q_no": 8, "area": "Arithmetic", "topic": "Time, Speed, Distance & Work", "subtopic": "Relative motion at right angles", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two ships are at the same point in the middle of the ocean. From there, one sails due south and the other due west, each at a constant speed. After 2 hours the distance between them is 60 km. One ship is faster than the other by 6 km/h. What is the speed of the slower ship in km/h?", "options": ["20", "12", "18", "24"], "answer": "18", "answer_note": "", "concept": "The paths are perpendicular, so the gap between the ships is the hypotenuse of a right triangle formed by the distances covered.", "formulas": ["Distance = speed × time", "Pythagoras: d² = d₁² + d₂²"], "solution": ["1. Let speeds be x and x + 6 km/h; in 2 hours they cover 2x and 2x + 12 km.", "2. (2x)² + (2x + 12)² = 60², i.e. x² + (x + 6)² = 900.", "3. 2x² + 12x + 36 = 900 gives x² + 6x − 432 = 0 = (x + 24)(x − 18).", "4. x = 18 km/h (check: 36² + 48² = 60²)."], "shortcut": "In 2 hours the distances form a 3-4-5 triangle scaled by 12 (36, 48, 60), which differ by 12 km, i.e. 6 km/h — slower speed = 36/2 = 18.", "source_url": "https://cracku.in/52-two-ships-meet-mid-ocean-and-then-one-ship-goes-so-x-cat-2022-slot-2"}, {"id": "2022-S2-Q09", "year": 2022, "slot": 2, "q_no": 9, "area": "Algebra", "topic": "Functions & Graphs", "subtopic": "Functional equation – periodic function", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "For every integer x, the functions f and g satisfy f(x) + f(x − 1) − 1 = 0 and g(x) = x². Given that f(x² − x) = 5, find f(g(5)) + g(f(5)).", "options": [], "answer": "12", "answer_note": "", "concept": "f(x) + f(x − 1) = 1 forces f to alternate between two values; x² − x is always even, which fixes which value goes with even inputs.", "formulas": ["f(x) + f(x − 1) = 1 ⇒ f(x + 1) = f(x − 1) (period 2)"], "solution": ["1. From f(x) + f(x − 1) = 1 and f(x + 1) + f(x) = 1, f(x + 1) = f(x − 1): f repeats every 2 steps.", "2. x² − x = x(x − 1) is always even, so f(even) = 5.", "3. Then f(odd) = 1 − 5 = −4.", "4. f(g(5)) = f(25) = −4 (25 is odd).", "5. g(f(5)) = g(−4) = 16. Sum = −4 + 16 = 12."], "shortcut": "", "source_url": "https://cracku.in/53-suppose-for-all-integers-x-there-are-two-functions-x-cat-2022-slot-2"}, {"id": "2022-S2-Q10", "year": 2022, "slot": 2, "q_no": 10, "area": "Algebra", "topic": "Linear Equations & Inequalities", "subtopic": "Linear equations with integer constraints", "type": "TITA", "difficulty": "Medium", "difficulty_basis": "Assessed", "question": "A test has 75 questions. A correct answer earns 3 marks, a wrong answer costs 1 mark, and each question left unattempted earns 1 mark. Rayan's total score is 97, and the number of questions he left unattempted is greater than the number he attempted. What is the largest possible number of questions he answered correctly?", "options": [], "answer": "24", "answer_note": "", "concept": "Set up two linear equations in correct, wrong and unattempted counts, then use the inequality on unattempted questions to bound the correct count.", "formulas": ["x + y + z = 75", "3x − y + z = 97"], "solution": ["1. Let x = correct, y = wrong, z = unattempted: x + y + z = 75 and 3x − y + z = 97.", "2. Adding: 4x + 2z = 172, so 2x + z = 86.", "3. Unattempted > attempted means z > 75 − z, so z ≥ 38.", "4. Then 2x = 86 − z ≤ 48, so x ≤ 24.", "5. x = 24, z = 38, y = 13 works (24 + 13 + 38 = 75; 72 − 13 + 38 = 97). Maximum correct = 24."], "shortcut": "", "source_url": "https://cracku.in/54-in-an-examination-there-were-75-questions-3-marks--x-cat-2022-slot-2"}, {"id": "2022-S2-Q11", "year": 2022, "slot": 2, "q_no": 11, "area": "Geometry", "topic": "Geometry & Mensuration", "subtopic": "Regular polygons – interior angles", "type": "TITA", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "Two regular polygons A and B have numbers of sides in the ratio 1 : 2, and their interior angles are in the ratio 3 : 4. How many sides does B have?", "options": [], "answer": "10", "answer_note": "", "concept": "The interior angle of a regular n-gon is 180° − 360°/n; setting up the ratio gives a linear equation in n.", "formulas": ["Interior angle = 180(n − 2)/n"], "solution": ["1. Let A have n sides and B have 2n sides.", "2. Interior angles: 180(n − 2)/n and 180(2n − 2)/(2n) = 180(n − 1)/n.", "3. Ratio: (n − 2)/(n − 1) = 3/4, so 4n − 8 = 3n − 3, n = 5.", "4. B has 2n = 10 sides (angles 108° and 144°, ratio 3 : 4)."], "shortcut": "Pentagon (108°) and decagon (144°) — 108 : 144 = 3 : 4.", "source_url": "https://cracku.in/55-regular-polygons-a-and-b-have-number-of-sides-in-t-x-cat-2022-slot-2"}, {"id": "2022-S2-Q12", "year": 2022, "slot": 2, "q_no": 12, "area": "Arithmetic", "topic": "Averages, Ratio, % & Mixtures", "subtopic": "Percentages & ratios – elections", "type": "MCQ", "difficulty": "Easy", "difficulty_basis": "Assessed", "question": "An election had four candidates, and 80% of the registered voters voted. One candidate got 30% of the votes cast; the remaining votes went to the other three candidates in the ra
